<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service PO — Scout Buyer</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="buyer.css">
<script src="cart.js"></script>
<script src="spo-data.js"></script>
<script src="spo-map.js"></script>
<script src="invoice-pack.js"></script>
</head>
<body class="buyer">

<!-- ===== App Bar ===== -->
<div class="app-bar-wrap">
  <nav class="app-bar" id="app-bar"></nav>
  <script src="appbar.js"></script>
</div>






<section class="hero page-hero">
  <div class="hero-bg"></div>
  <div class="hero-inner" style="flex-direction:column;gap:0">
    <a class="back-link" href="spos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>Back to Service POs</a>
    <div class="hero-title-block">
      <div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
      <div><h1 id="hero-title">SPO<button class="hero-copy" onclick="copyNum()" title="Copy SPO number"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button></h1><p id="hero-sub"></p></div>
    </div>
  </div>
</section>

<main class="page">
  <div class="det-grid">
    <div class="det-main" id="det-main"></div>
    <div class="det-side" id="det-side"></div>
  </div>
</main>

<script>
  /* ---------- Theme ---------- */
  function applyTheme() {
    const dark = localStorage.getItem('scout-theme') === 'dark';
    document.body.classList.toggle('dark', dark);
    const b = document.getElementById('theme-btn');
    b.querySelector('.icon-sun').style.display = dark ? 'none' : '';
    b.querySelector('.icon-moon').style.display = dark ? '' : 'none';
  }
  function toggleTheme() { localStorage.setItem('scout-theme', document.body.classList.contains('dark') ? 'light' : 'dark'); applyTheme(); }
  applyTheme();

  /* ---------- Menus ---------- */
  function closeMenus() {
    document.querySelectorAll('.menu-panel').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.nav-chip').forEach(c => c.classList.remove('open'));
  }
  function toggleMenu(id) {
    const panel = document.getElementById('menu-' + id), chip = document.getElementById('nav-' + id);
    const wasOpen = panel.classList.contains('open');
    closeMenus(); document.getElementById('ctx-switch').classList.remove('open');
    if (!wasOpen) { panel.classList.add('open'); chip.classList.add('open'); }
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-anchor')) closeMenus();
    if (!e.target.closest('.ctx-switch')) document.getElementById('ctx-switch').classList.remove('open');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); document.getElementById('ctx-switch').classList.remove('open'); } });

  /* ---------- Context switcher ---------- */
  const PROPERTIES = [
    { id: 'all', name: 'All properties', desc: 'Combined dashboard for every accessible property', units: null },
    { id: 'magnolia', name: 'Magnolia Place Apartments', addr: '4201 Veterans Memorial Blvd', city: 'Metairie, LA 70006', units: 51 },
    { id: 'bayou', name: 'Bayou Crossing Apartments', addr: '3850 Airline Dr', city: 'Baton Rouge, LA 70805', units: 120 },
    { id: 'lonestar', name: 'Lone Star Flats', addr: '7200 Westheimer Rd', city: 'Houston, TX 77057', units: 78 },
    { id: 'central', name: 'Central Park View', addr: '1501 Canal St', city: 'New Orleans, LA 70112', units: 96 },
    { id: 'cypress', name: 'Cypress Lake Apartments', addr: '9100 Cypress Lake Dr', city: 'Lafayette, LA 70508', units: 64 },
    { id: 'beauchene', name: 'Beau Chene Villas', addr: '225 Beau Chene Blvd', city: 'Mandeville, LA 70471', units: 40 },
    { id: 'sherwood', name: 'Sherwood Acres', addr: '1250 Sherwood Forest Blvd', city: 'Baton Rouge, LA 70815', units: 88 },
    { id: 'cyprus', name: 'Cyprus Glenn', addr: '4800 Cyprus Glenn Way', city: 'Shreveport, LA 71105', units: 32 },
    { id: 'heights', name: 'Magnolia Heights Apartments', addr: '6301 Magnolia Heights Rd', city: 'Houston, TX 77004', units: 110 }
  ];
  let currentProp = 'all';
  const bIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>';
  const pinIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
  function renderCtxList() {
    document.getElementById('ctx-list').innerHTML = PROPERTIES.map(p => {
      const active = p.id === currentProp;
      const body = p.id === 'all'
        ? '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.desc + '</span>'
        : '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.addr + '</span><span class="opt-city">' + pinIcon + p.city + '</span>';
      const units = p.units ? '<span class="units-badge"><b>' + p.units + '</b><span>units</span></span>' : '';
      return '<button class="ctx-option' + (active ? ' active' : '') + '" onclick="selectProp(\'' + p.id + '\')"><span class="opt-tile">' + bIcon + '</span><span class="opt-body">' + body + '</span>' + units + '</button>';
    }).join('');
  }
  function selectProp(id) {
    currentProp = id;
    const p = PROPERTIES.find(x => x.id === id);
    document.getElementById('echo-name').textContent = p.name;
    document.getElementById('echo-name').title = p.id === 'all' ? '9 accessible properties' : p.units + ' units · ' + p.city;
    renderCtxList();
    document.getElementById('ctx-switch').classList.remove('open');
    renderPage();
  }
  function toggleCtx() {
    const el = document.getElementById('ctx-switch');
    const wasOpen = el.classList.contains('open');
    closeMenus();
    if (!wasOpen) el.classList.add('open');
  }
  renderCtxList();

  const money = SPO.money, r2 = SPO.r2;
  const SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  const IC = {
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
    wrench: SVG + '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
    pen: SVG + '<path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg>',
    shield: SVG + '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>',
    send: SVG + '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>',
    hand: SVG + '<path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></svg>',
    doc: SVG + '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>',
    map: SVG + '<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>',
    card: SVG + '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    flag: SVG + '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>',
    clock: SVG + '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
    warn: SVG + '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
    ban: SVG + '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>',
    copy: SVG + '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
    dl: SVG + '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>',
    cal: SVG + '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>',
    upload: SVG + '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>',
    refresh: SVG + '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>',
    split: SVG + '<path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/></svg>',
    swap: SVG + '<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>',
    search: SVG + '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>'
  };

  /* Fixed step labels — progress changes styling and captions, never the names (audit SPO-26).
     The vendor's reply is not a step (10/14/2026): vendors often never click, so a step for it would sit
     empty forever. It shows as a label under Sent instead — Accepted, Rejected or No response. */
  const STEPS = [
    ['Draft', 'you', IC.pen], ['Approval', 'approver', IC.shield], ['Sent', 'you', IC.send],
    ['Invoice', 'vendor', IC.doc], ['Mapping', 'you', IC.map], ['Accounting', 'acct', IC.card], ['Paid', 'acct', IC.flag]
  ];
  const PROG = { draft: [0, 0], rebid: [0, 0], approval: [1, 1], rejected: [3, 3], invoice: [3, 3], mapping: [4, 4], ready: [5, 5], accounting: [5, 5], paid: [7, -1] };
  const STEP_EV = ['created', 'approved', 'sent', 'invoiced', 'mapped', 'accounting', 'paid'];
  const respTag = s => { const r = SPO.resp(s); return r ? '<span class="ls-resp ' + r.kind + '" title="' + (r.kind === 'accepted' && r.by === 'buyer' ? 'Recorded by ' + s.ack.by : r.kind === 'none' ? 'The vendor hasn’t accepted or rejected the PO' : r.label) + '">' + (r.kind === 'accepted' ? IC.check : r.kind === 'rejected' ? IC.x : '') + r.short + '</span>' : ''; };

  let S, curId, actExpanded = false, actCollapsed = false, docsCollapsed = false, spoTab = 'spo', editAlloc = null;
  function pick() {
    const h = (location.hash || '').replace('#', '');
    const [id, sub] = h.split('/');
    curId = Number(id) || 858;
    S = SPO.get(curId) || SPO.get(858);
    curId = S.id;
    return sub || '';
  }
  const propOf = s => PROPERTIES.find(p => p.id === s.prop) || PROPERTIES[1];
  const ven = s => SPO.VEN[s.v];
  const pillHtml = s => { const st = SPO.STATES[s.state]; return '<span class="status-dot-item"><span class="status-dot ' + st.dot + '"></span><span class="status-dot-label">' + st.label + '</span></span>'; };
  const actorChip = a => a === 'you' ? '<span class="ls-actor you">YOU</span>' : a === 'acct' ? '<span class="ls-actor acct">ACCOUNTING</span>' : a === 'approver' ? '<span class="ls-actor">APPROVER</span>' : '<span class="ls-actor">VENDOR</span>';

  function stepper(s) {
    const [done, active] = PROG[s.state];
    const approvalSkipped = !s.ev.approvalReq, pp = SPO.progress(s);
    return '<div class="ls-stepper">' + STEPS.map(([label, actor, icon], i) => {
      let cls, cap = '', dot = icon, a = actor;
      if (s.state === 'rejected' && i === 3) { cls = 'halted'; dot = IC.x; cap = '<span class="ls-date">stopped</span>'; }
      else if (i === 1 && s.approval && s.approval.carried && i < done) { cls = 'done'; dot = IC.check; cap = '<span class="ls-date">from SPO-' + s.approval.carried + '</span>'; }
      else if (i === 1 && approvalSkipped && i < done) { cls = 'skipped'; dot = IC.check; cap = '<span class="ls-date">' + (s.series ? 'series approved' : 'not required') + '</span>'; }
      else if (i < done) { cls = 'done'; dot = IC.check; const d = s.ev[STEP_EV[i]]; cap = d ? '<span class="ls-date">' + SPO.fmtDate(d) + '</span>' : ''; }
      else if (i === active) {
        if (s.state === 'ready' && i === 5) a = 'you';
        cls = 'active' + (a === 'vendor' ? ' vend' : a === 'acct' ? ' acct' : '');
        cap = '<span class="ls-date">' + (a === 'you' || a === 'approver' ? 'your move' : 'in progress') + '</span>';
      } else cls = 'future';
      /* A Revised SPO (TKT-SPO-64) is never sent; once its invoice slice is mapped it only waits on approval */
      if (s.revised && i === 2) { cls = s.invoice || i < done ? 'skipped' : 'future'; dot = cls === 'skipped' ? IC.check : icon; cap = '<span class="ls-date">not sent</span>'; }
      else if (s.revised && s.state === 'approval' && (i === 3 || i === 4) && s.invoice && s.invoice.validated) { cls = 'done'; dot = IC.check; cap = '<span class="ls-date">' + SPO.fmtDate(s.ev[STEP_EV[i]]) + '</span>'; }
      else if (i === 2) cap += respTag(s);
      if (i === 3 && pp.partial) cap += '<span class="ls-date">' + pp.billed + ' of ' + pp.n + ' lines</span>';
      return '<div class="ls-step ' + cls + '"><div class="ls-dot">' + dot + '</div><div class="ls-label">' + label + '</div>' + actorChip(a) + cap + '</div>' +
        (i < STEPS.length - 1 ? '<div class="ls-conn' + (i < done ? ' done' : '') + '"></div>' : '');
    }).join('') + '</div>';
  }

  const allocChips = l => SPO.glStrip(l.alloc, S.prop);

  function taskStrip(s) {
    const st = (tone, ico, title, desc, actions) => {
      const icoStyle = tone === 'wait' ? ' style="background:var(--muted);color:var(--muted-foreground)"'
        : tone === 'done' ? ' style="background:var(--emerald-soft);color:var(--emerald)"'
        : tone === 'danger' ? ' style="background:var(--rose-soft);color:var(--rose)"'
        : tone === 'acct' ? ' style="background:var(--violet-soft);color:var(--violet)"' : '';
      return '<div class="task-strip"><span class="ts-icon"' + icoStyle + '>' + ico + '</span><div class="ts-body"><div class="ts-title">' + title + '</div><div class="ts-desc">' + desc + '</div></div>' + (actions || '') + '</div>';
    };
    const btn = (label, onclick, kind, ico) => '<button class="btn' + (kind ? ' ' + kind : '') + '" style="display:inline-flex;align-items:center;gap:8px;white-space:nowrap" onclick="' + onclick + '">' + (ico ? '<span style="display:inline-flex;width:15px;height:15px">' + ico + '</span>' : '') + label + '</button>';
    const v = ven(s), inv = s.invoice;
    switch (s.state) {
      case 'draft': return st('action', IC.pen, 'Finish your draft', 'Complete the line items and allocation, then submit it to ' + endDot(v.name), btn('Continue editing', "location.href='spo-new.html#" + s.id + "'", 'btn-primary', IC.pen));
      case 'approval': if (s.revised) return st('action', IC.shield, 'Revised SPO · awaiting approval', 'Created by ' + s.revised.by + ' from invoice ' + s.revised.from + ' for work no SPO covered. Not sent to the vendor. ' + (s.invoice && s.invoice.validated ? 'Its lines are mapped — invoice ' + s.revised.from + ' goes to Accounting once a manager approves it.' : 'Once approved, it joins invoice ' + s.revised.from + ' when that invoice is mapped.'), btn('Review in Approvals', "location.href='approval.html#SPO-" + s.id + "'", 'btn-primary', IC.shield));
        return st('action', IC.shield, 'Supervisor approval', (SPO.total(s) > SPO.APPROVAL_LIMIT ? 'Over ' + money(SPO.APPROVAL_LIMIT) : 'Over the GL budget') + ' — nothing goes to the vendor until a Supervisor approves it.', btn('Review in Approvals', "location.href='approval.html#SPO-" + s.id + "'", 'btn-primary', IC.shield));
      case 'rebid': { const o = SPO.get(s.rebidOf); return st('action', IC.swap, 'Rebid · choose a vendor and send', 'Same scope, lines and allocation as SPO-' + s.rebidOf + (o && o.cancel ? ', canceled because “' + o.cancel.reason + '”' : '') + '. ' + (o && o.ev.approved ? 'Its approval carries over unless the amount goes up.' : 'Pick a vendor to send it.'), btn('Choose vendor', 'openRebidSend()', 'btn-primary', IC.send)); }
      case 'rejected': return st('danger', IC.x, 'Vendor rejected · rebid with another vendor', s.reject && s.reject.by ? s.reject.by + ' recorded ' + v.name + '’s rejection on ' + SPO.fmtDate(s.ev.rejected) + '.' : v.name + ': “' + (s.reject ? s.reject.reason : '') + '”', (SPO.canEditResp(s) ? btn('Change their answer', 'openRecordResp()', '') : '') + btn('Cancel SPO', 'openCancel()', '') + btn('Rebid', 'openRebid()', 'btn-primary', IC.swap));
      case 'invoice': if (SPO.progress(s).partial && !s.disputed) { const p = SPO.progress(s), last = s.billed[s.billed.length - 1];
          return st('wait', IC.doc, 'Waiting on Vendor \u00B7 Next invoice', p.billed + ' of ' + p.n + ' lines invoiced on ' + s.billed.map(b => b.num).join(', ') + ' (' + (last.status === 'paid' ? 'paid ' + SPO.fmtDate(last.at.paid) : 'with Accounting') + '). Still to be invoiced: ' + p.openLines.map(i => s.lines[i].desc).join(' · ') + '.', btn('Close unbilled lines', 'openCloseLines()', '') + btn('Upload invoice', 'openUpload()', '', IC.upload)); }
        if (s.disputed) return st('wait', IC.doc, 'Waiting on Vendor \u00B7 Corrected invoice', 'You disputed ' + s.disputed.num + ': \u201C' + s.disputed.reason + '\u201D ' + v.name + ' is correcting and resubmitting it.', btn('Upload invoice', 'openUpload()', '', IC.upload));
        { const r = SPO.resp(s), ap = SPO.appt(s);
          if (ap && ap.status === 'countered') return st('action', IC.cal, v.name + ' proposed a new time', 'Was ' + SPO.fmtAppt(ap.prev) + '. Now ' + SPO.fmtAppt(ap) + '. Accept it, or propose another time.', btn('Propose another', "openTime('another')", '', IC.cal) + btn('Accept new time', 'acceptNewTime()', 'btn-primary', IC.check));
          if (r.kind === 'accepted') return st('wait', IC.doc, 'Waiting on Vendor \u00B7 Invoice', (r.by === 'buyer' ? s.ack.by + ' recorded ' + v.name + '’s acceptance on ' : v.name + ' accepted on ') + SPO.fmtDate(s.ev.accepted) + '. Their invoice will arrive by email — or upload it here if they sent it to you.', (SPO.canEditResp(s) ? btn('Change their answer', 'openRecordResp()', '') : '') + btn('Upload invoice', 'openUpload()', '', IC.upload));
          return st('wait', IC.doc, 'Waiting on Vendor \u00B7 Invoice', 'PO sent to ' + v.email + ' on ' + SPO.fmtDate(s.ev.sent) + ' · no response from the vendor yet. You don’t need one to continue — upload their invoice when it arrives.', btn('I spoke to the vendor', 'openRecordResp()', '', IC.check) + btn('Upload invoice', 'openUpload()', '', IC.upload)); }
      case 'mapping': if (inv.extractFailed) return st('action', IC.warn, 'Invoice ' + inv.num + ' needs attention', 'Scout AI couldn\u2019t read its line items \u2014 retry the extraction or enter the lines from the PDF.', btn('Open invoice', "location.hash='#" + s.id + "/invoice'", 'btn-primary', IC.map));
        if ((s.billed || []).length) return st('action', IC.map, 'Map invoice ' + inv.num + ' · the next invoice', money(SPO.invTotal(s)) + ' invoiced · ' + SPO.progress(s).billed + ' of ' + s.lines.length + ' lines are already billed on ' + s.billed.map(b => b.num).join(', ') + ' — map this one to the lines still open.', btn('Map invoice', "location.hash='#" + s.id + "/invoice'", 'btn-primary', IC.map));
        return st('action', IC.map, 'Map invoice ' + inv.num + ' to SPO lines', money(SPO.invTotal(s)) + ' invoiced against a ' + money(SPO.total(s)) + ' estimate — confirm each invoice line’s SPO line, GL and unit.', btn('Map invoice', "location.hash='#" + s.id + "/invoice'", 'btn-primary', IC.map));
      case 'ready': { const peers = SPO.invPeers(s), others = peers.filter(x => x.sp.id !== s.id), open = SPO.progress(s).open;
        const awaitRev = others.filter(x => x.sp.revised && x.sp.state === 'approval');
        if (awaitRev.length && !others.some(x => !x.sp.revised && x.sp.state !== 'ready')) return st('wait', IC.shield, 'Mapped · Revised SPO awaiting approval', 'Invoice ' + inv.num + ' goes to Accounting once a manager approves ' + awaitRev.map(x => '<a class="text-link" href="spo.html#' + x.sp.id + '">Revised SPO-' + x.sp.id + '</a> (' + money(SPO.total(x.sp)) + ')').join(', ') + '. The vendor isn’t emailed.');
        if (!SPO.invReady(s)) return st('wait', IC.map, 'Mapped · waiting on the rest of ' + inv.num, 'SPO-' + s.id + ' is mapped. The invoice goes to Accounting once ' + others.filter(x => x.sp.state !== 'ready').map(x => 'SPO-' + x.sp.id).join(', ') + ' ' + (others.length > 1 ? 'are' : 'is') + ' mapped too.');
        return st('action', IC.card, 'Send invoice ' + inv.num + ' to Accounting', 'Mapped and validated — ' + money(inv.shared ? inv.shared.total : SPO.invTotal(s)) + (others.length ? ', covering this SPO and ' + others.map(x => 'SPO-' + x.sp.id).join(', ') + ', which go together' : '') + '.' + (open ? ' ' + open + ' of ' + s.lines.length + ' lines aren’t invoiced yet, so SPO-' + s.id + ' then waits for the next invoice.' : ''), btn('Send invoice', "location.hash='#" + s.id + "/accounting'", 'btn-primary', IC.send)); }
      case 'accounting': { const sh = s.invoice && s.invoice.shared, nums = SPO.invoicesOf(s).map(r => r.num).join(', ');
        return st('acct', IC.card, 'Waiting on Accounting · Payment', 'Invoice' + (SPO.invoicesOf(s).length > 1 ? 's ' : ' ') + nums + ' sent on ' + SPO.fmtDate(s.ev.accounting) + ' with ' + (SPO.invoicesOf(s).length > 1 ? 'their' : 'its') + ' GL & unit allocation. Accounting releases ' + money(sh ? sh.total : SPO.billedTotal(s)) + ' to ' + (sh ? v.name + ' for SPO-' + sh.spos.join(', SPO-') + ' (this SPO’s lines ' + money(SPO.invSubtotal(s)) + ').' : endDot(v.name))); }
      case 'paid': return st('done', IC.flag, 'Paid', (s.invoice && s.invoice.shared ? 'Invoice ' + s.invoice.num + ' · ' + money(s.invoice.shared.total) + ' (this SPO’s lines ' + money(SPO.invSubtotal(s)) + ')' : money(SPO.billedTotal(s))) + ' released to ' + v.name + ' on ' + SPO.fmtDate(s.ev.paid) + '. Documents stay available for your records.');
    }
    return '';
  }

  /* A schedule-generated SPO names its series; the series controls live on the series page (audit SPO-50). */
  const REP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>';
  function seriesLink(s) {
    if (!s.series || !window.SCH) return '';
    const x = SCH.get(s.series); if (!x) return '';
    return '<div class="series-link">' + REP + '<span>Run ' + SPO.fmtDate(s.run) + ' of <b>' + x.name + '</b> · ' + SCH.cadenceText(x.cadence, false) + ' · ' + SCH.STATES[x.status].label + '</span><a class="text-link" href="schedule.html#' + x.id + '">View recurring SPO</a></div>';
  }
  /* Vendor names can end in a period ("Co.") — don't double it at the end of a sentence. */
  const endDot = t => /[.!?]$/.test(t) ? t : t + '.';
  const CANCELABLE = ['draft', 'rebid', 'approval', 'rejected', 'invoice'];

  function renderPage() {
    const sub = pick();
    const s = S, v = ven(s), prop = propOf(s);
    document.title = 'SPO-' + s.id + ' — Scout Buyer';
    document.getElementById('hero-title').innerHTML = 'SPO-' + s.id + '<button class="hero-copy" onclick="copyNum()" title="Copy SPO number">' + IC.copy + '</button>';
    document.getElementById('hero-sub').textContent = prop.name + ' · ' + (s.state === 'rebid' ? 'Needs a vendor' : v.name);

    let main = '';
    if (s.state === 'canceled') {
      main += '<div class="card"><div class="det-card-head"><h2>SPO Status</h2>' + pillHtml(s) + '</div>' +
        '<div class="callout neutral" style="margin-top:10px"><b>' + IC.ban.replace('<svg', '<svg style="width:16px;height:16px"') + 'Canceled on ' + SPO.fmtDate(s.ev.canceled) + ' by ' + s.cancel.by + '</b>“' + s.cancel.reason + '”' +
        (s.ev.sent ? '<div style="margin-top:6px">' + v.name + ' was notified. Nothing was invoiced or paid.</div>' : '<div style="margin-top:6px">It was never sent to a vendor.</div>') + '</div>' +
        seriesLink(s) + rebidLink(s) + '<div class="spo-manage"><span class="lbl">Manage this SPO</span>' + '<button class="btn" onclick="location.href=\'spo-new.html#clone-' + s.id + '\'" style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-flex;width:15px;height:15px">' + IC.copy + '</span>Clone SPO</button></div></div>';
    } else {
      main += '<div class="card"><div class="det-card-head"><h2>SPO Progress</h2>' + pillHtml(s) + '</div>' + stepper(s) + seriesLink(s) + rebidLink(s) +
        (s.revised ? '</div>' : '<div class="spo-manage"><span class="lbl">Manage this SPO</span>' +
        (!s.series && s.state !== 'rebid' ? '<button class="btn" onclick="location.href=\'spo-new.html#recurring-' + s.id + '\'" style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-flex;width:15px;height:15px">' + REP + '</span>Make recurring</button>' : '') +
        '<button class="btn" onclick="location.href=\'spo-new.html#clone-' + s.id + '\'" style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-flex;width:15px;height:15px">' + IC.copy + '</span>Clone SPO</button>' +
        (SPO.canRebid(s) && s.state !== 'rejected' ? '<button class="btn" onclick="openRebid()" style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-flex;width:15px;height:15px">' + IC.swap + '</span>Rebid</button>' : '') +
        (CANCELABLE.indexOf(s.state) >= 0 && s.state !== 'rejected' && !(s.billed || []).length ? '<button class="btn btn-outline-rose" onclick="openCancel()">Cancel SPO</button>' : '') + '</div></div>');
      main += taskStrip(s) + apptCard(s);
    }

    /* SPO | Invoices · n (TKT-SPO-63): the SPO's own record, or the invoices billed against it — each opens its invoice page */
    const recs = SPO.invoicesOf(s);
    if (sub === 'invoices') spoTab = 'invoices';
    if (recs.length) main += '<div class="mode-seg spo-tabs"><button class="' + (spoTab === 'spo' ? 'active' : '') + '" onclick="spoTab = \'spo\'; renderPage()">' + IC.wrench + '<span>SPO</span></button><button class="' + (spoTab === 'invoices' ? 'active' : '') + '" onclick="spoTab = \'invoices\'; renderPage()">' + IC.doc + '<span>Invoices · ' + recs.length + '</span></button></div>';
    if (recs.length && spoTab === 'invoices') main += invoiceCard(s);
    else {
      /* Scope: bullets when it lists several items; then where, who and when */
      const items = s.scope.split(/\n+/).map(x => x.replace(/^[-•]\s*/, '').trim()).filter(Boolean);
      main += '<div class="card"><div class="det-card-head hd"><h2>Scope of work</h2></div>' +
        (items.length > 1 ? '<ul class="spo-scope-list">' + items.map(x => '<li>' + x + '</li>').join('') + '</ul>' : '<p class="spo-scope" style="margin-top:8px">' + s.scope + '</p>') +
        '<dl class="scope-facts"><dt>Property</dt><dd>' + prop.name + '</dd><dt>Address</dt><dd>' + prop.addr + ', ' + prop.city + '</dd><dt>Requested by</dt><dd>' + s.by + ' on ' + SPO.fmtDate(s.ev.created) + '</dd><dt>Spend period</dt><dd><span class="tip-u" title="The budget month this SPO counts against. GL budget checks (approval, GL &amp; unit changes) use this month.">' + s.period + '</span></dd></dl></div>';

      const est = SPO.total(s), canEdit = allocEditable(s);
      const validated = recs.filter(r => r.validated);
      main += '<div class="card"><div class="det-card-head hd"><div><h2>Line items</h2><div class="sub">GL code and unit for every dollar</div></div>' +
        (editAlloc ? '' : canEdit ? '<button class="btn btn-sm" style="display:inline-flex;align-items:center;gap:7px" onclick="startAllocEdit()"><span style="display:inline-flex;width:14px;height:14px">' + IC.pen + '</span>Edit GL &amp; unit</button>' : '') + '</div>' +
        (editAlloc ? allocEditor(s) : s.lines.map((l, k) => '<div class="spo-line' + (l.closed ? ' closed' : '') + '"><span class="sl-desc">' + l.desc + lineTag(s, k) + '</span><span class="sl-qty">' + l.qty + ' × ' + money(l.price) + '</span><span class="sl-total">' + money(r2(l.qty * l.price)) + '</span>' + allocChips(l) + '</div>').join('')) +
        '<div class="det-totals">' +
        (s.ev.sent && !validated.length ? '<div class="tot-row"><span>Validated invoices</span><span>' + money(0) + '</span></div>' : '') +
        '<div class="tot-row grand"><span>SPO estimate</span><span>' + money(est) + '</span></div>' +
        (SPO.progress(s).closedAmt ? '<div class="tot-row"><span>Closed unbilled · released from the budget</span><span>−' + money(SPO.progress(s).closedAmt) + '</span></div>' : '') +
        (validated.length ? invoiceTotals(s) : '') + '</div></div>';
    }

    let side = '';
    if (s.state === 'rebid') side += '<div class="card"><div class="ven-card"><span class="ven-logo" style="border-style:dashed;background:none">?</span><div style="min-width:0"><div class="ven-eyebrow">Vendor · to choose</div><div class="ven-name" style="margin-bottom:2px">Needs a vendor</div><div style="font-size:13px;color:var(--muted-foreground)">Was ' + v.name + ' on SPO-' + s.rebidOf + '</div></div></div></div>';
    else side += '<div class="card"><div class="ven-card"><span class="ven-logo vt" style="--vh:' + SPO.vh(s.v) + '">' + SPO.ini(s.v) + '</span><div style="min-width:0"><div class="ven-eyebrow">Vendor · ' + v.trade + '</div><div class="ven-name" style="margin-bottom:2px">' + v.name + '</div>' +
      '<div style="font-size:13px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="PO recipient">' + v.email + '</div></div></div></div>';

    const sx = s.series && window.SCH ? SCH.get(s.series) : null;
    const approvalVal = sx ? (sx.ev.approved ? 'Series · ' + ((sx.approval && sx.approval.by) || 'Priya Nair') : 'Not required') : s.state === 'approval' ? 'Pending · Supervisor' : s.approval && s.approval.carried ? 'Carried from SPO-' + s.approval.carried + ' · ' + s.approval.by : s.ev.approved ? 'Approved by ' + ((s.approval && s.approval.by) || 'Priya Nair') : s.state === 'draft' ? (SPO.needsApproval(s) ? 'Required on submit' : 'Not required') : 'Not required';
    side += '<div class="card"><dl class="fact-rows wide">' +
      '<dt>Approval</dt><dd>' + approvalVal + '</dd>' + vendorRespRow(s) + '</dl>' +
      SPO.acctRefs([['SPO number', 'SPO-' + s.id, true], ['Vendor code', s.state === 'rebid' ? '—' : SPO.vendorCode(s.v), s.state !== 'rebid'], ['Location ID', SPO.locationId(s.prop), true]]) + '</div>';

    const docs = [];
    if (s.ev.sent) docs.push(['Purchase Order SPO-' + s.id, 'PO', '', s.ev.sent]);
    (s.billed || []).forEach(b => docs.push(['Invoice ' + b.num, 'Invoice', 'emerald', b.at.invoiced]));
    if (s.invoice && s.ev.invoiced) docs.push(['Invoice ' + s.invoice.num, 'Invoice', 'emerald', s.ev.invoiced]);
    if (s.ev.accounting) docs.push(['Payment packet', 'Sent to Accounting', 'violet', s.ev.accounting]);
    side += '<div class="card"><div class="det-card-head"><h2 class="h-count" style="font-size:16px">Documents' + (docs.length ? ' <span class="count-pill">' + docs.length + '</span>' : '') + '</h2>' + (docs.length ? '<button class="row-action act-toggle' + (docsCollapsed ? '' : ' open') + '" title="' + (docsCollapsed ? 'Show' : 'Hide') + ' documents" aria-expanded="' + !docsCollapsed + '" onclick="docsCollapsed = !docsCollapsed; renderPage()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>' : '') + '</div>' +
      (docsCollapsed && docs.length ? '' : docs.length ? docs.map(d => '<div class="doc-row' + (d[2] ? ' ' + d[2] : '') + '">' + IC.doc.replace('<svg', '<svg class="doc-ico"') + '<div style="flex:1;min-width:0"><div class="doc-name">' + d[0] + '</div><div class="doc-date">' + SPO.fmtDate(d[3]) + ' · ' + d[1] + '</div></div><button class="row-action" title="Download" onclick="showToast(\'Download started\', \'' + d[0] + '.pdf\')">' + IC.dl + '</button></div>').join('')
        : '<div style="font-size:13px;color:var(--muted-foreground)">The PO is generated when the SPO is sent to the vendor.</div>') + '</div>';

    const evs = s.log.map((e, i) => [e, i]).sort((a, b) => b[0].at.localeCompare(a[0].at) || b[1] - a[1]).map(x => x[0]); /* same minute → later entry first */
    const shown = actExpanded ? evs : evs.slice(0, 5);
    /* Activity (TKT-SPO-63): time and actor on every event; appointment times carry the property's time zone; collapsible */
    side += '<div class="card"><div class="det-card-head"><div><h2 style="font-size:16px">Activity</h2><div class="sub">SPO and invoice history</div></div><button class="row-action act-toggle' + (actCollapsed ? '' : ' open') + '" title="' + (actCollapsed ? 'Show' : 'Hide') + ' activity" aria-expanded="' + !actCollapsed + '" onclick="actCollapsed = !actCollapsed; renderPage()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button></div>' +
      (actCollapsed ? '' : '<div class="act-tl">' +
      shown.map(e => SPO.actRow(e, s)).join('') +
      (evs.length > shown.length ? '<button class="act-more" onclick="actExpanded = true; renderPage()">Show ' + (evs.length - shown.length) + ' more activities</button>' : '') + '</div>') + '</div>';

    document.getElementById('det-main').innerHTML = main;
    document.getElementById('det-side').innerHTML = side;

    if (sub === 'cancel' && CANCELABLE.indexOf(s.state) >= 0 && !(s.billed || []).length) setTimeout(openCancel, 120);
    if (sub === 'close-lines' && s.state === 'invoice' && SPO.progress(s).partial) setTimeout(openCloseLines, 120);
    if ((sub === 'vendor' || sub === 'rebid') && SPO.canRebid(s)) setTimeout(openRebid, 120);
    if (sub === 'send' && s.state === 'rebid') setTimeout(openRebidSend, 120);
    if (sub === 'propose' && s.state === 'invoice') setTimeout(() => openTime('change'), 120);
    if ((sub === 'respond' || sub === 'accept') && (SPO.canRespond(s) || SPO.canEditResp(s))) setTimeout(openRecordResp, 120);
    if (sub === 'invoice' && s.state === 'mapping') setTimeout(openInvoiceMap, 150);
    if (sub.indexOf('mapping-') === 0) setTimeout(() => openInvoiceMap(true, decodeURIComponent(sub.slice(8))), 150); /* read-only board, from the invoice page */
    if (sub === 'accounting' && s.state === 'ready') setTimeout(openAccounting, 150);
    if (sub === 'time') setTimeout(() => { const c = document.getElementById('appt-card'); if (c) { c.scrollIntoView({ block: 'center', behavior: 'smooth' }); c.classList.add('flash'); setTimeout(() => c.classList.remove('flash'), 1600); } }, 150);
  }

  /* Validated invoices against the estimate of the lines each one covers — with several invoices, summed. */
  /* ---------- Correct GL code and unit after sending (TKT-SPO-63) ----------
     Allowed until a line's invoice is validated (then it goes through the mapping board, so the packet Accounting got
     can't change underneath it). The budget check re-runs: a change that pushes a GL over its budget can't be saved
     here — pick another GL or have a Supervisor raise the budget. Logged in Activity; the vendor isn't emailed. */
  const lineLocked = (s, k) => { const x = SPO.lineState(s, k); return x.kind === 'billed' ? 'Billed on ' + x.num : x.kind === 'closed' ? 'Closed unbilled' : ''; };
  const allocEditable = s => ['invoice', 'mapping', 'ready'].indexOf(s.state) >= 0 && s.lines.some((l, k) => !lineLocked(s, k));
  function startAllocEdit() { editAlloc = S.lines.map(l => l.alloc.map(a => ({ gl: a.gl, unit: a.unit, amt: a.amt }))); renderPage(); }
  function cancelAllocEdit() { editAlloc = null; renderPage(); }
  function setAlloc(k, j, f, v) { editAlloc[k][j][f] = v; renderPage(); }
  function allocCheck(s) {
    const draft = Object.assign({}, s, { lines: s.lines.map((l, k) => Object.assign({}, l, { alloc: editAlloc[k] })) });
    const before = SPO.glOver(s), after = SPO.glOver(draft).filter(g => before.indexOf(g) < 0), bud = SPO.budget(s.prop, s.period, s.id);
    const mine = g => draft.lines.reduce((a, l) => a + l.alloc.filter(x => x.gl === g).reduce((b, x) => b + x.amt, 0), 0);
    return { over: after.map(g => ({ gl: g, by: r2(bud[g].spent + bud[g].committed + mine(g) - bud[g].budget) })), missing: editAlloc.some(al => al.some(a => !a.unit)),
      changed: s.lines.some((l, k) => l.alloc.some((a, j) => a.gl !== editAlloc[k][j].gl || a.unit !== editAlloc[k][j].unit)) };
  }
  function allocEditor(s) {
    const c = allocCheck(s), units = SPO.units(s.prop);
    const glSel = (k, j, v) => '<select class="ivt-map-sel" aria-label="GL code" onchange="setAlloc(' + k + ', ' + j + ', \'gl\', this.value)">' + SPO.GL.map(([g, n]) => '<option value="' + g + '"' + (g === v ? ' selected' : '') + '>' + g + ' · ' + n + '</option>').join('') + '</select>';
    const unitSel = (k, j, v) => '<select class="ivt-map-sel" aria-label="Unit" onchange="setAlloc(' + k + ', ' + j + ', \'unit\', this.value)"><option value=""' + (v ? '' : ' selected') + '>Select unit…</option><option value="COMMON"' + (v === 'COMMON' ? ' selected' : '') + '>Common area</option>' + units.map(u => '<option value="' + u.code + '"' + (u.code === v ? ' selected' : '') + '>Unit ' + u.code + ' · Bldg ' + u.bldg + '</option>').join('') + '</select>';
    return s.lines.map((l, k) => { const lock = lineLocked(s, k);
      return '<div class="spo-line' + (l.closed ? ' closed' : '') + '"><span class="sl-desc">' + l.desc + lineTag(s, k) + '</span><span class="sl-qty">' + l.qty + ' × ' + money(l.price) + '</span><span class="sl-total">' + money(r2(l.qty * l.price)) + '</span>' +
        (lock ? allocChips(l) + '<div class="alloc-lock">' + lock + ' — correct it on the mapping board.</div>'
          : '<div class="alloc-edit"><div class="alloc-edit-h">' + IC.doc + '<b>GL allocation</b><span>' + l.alloc.length + ' portion' + (l.alloc.length === 1 ? '' : 's') + '</span></div>' +
            editAlloc[k].map((a, j) => '<div class="alloc-edit-row"><span class="alloc-amt">' + money(a.amt) + '</span>' + glSel(k, j, a.gl) + unitSel(k, j, a.unit) + '</div>').join('') + '</div>') + '</div>'; }).join('') +
      '<div class="alloc-foot">' + (c.over.length ? '<div class="w-note warn" style="margin:0 auto 0 0">' + IC.warn + '<span>' + c.over.map(o => o.gl + ' ' + SPO.glName(o.gl) + ' would be ' + money(o.by) + ' over its ' + s.period + ' budget').join('; ') + '. Choose another GL, or ask a Supervisor to raise the budget.</span></div>'
        : c.missing ? '<div class="w-note warn" style="margin:0 auto 0 0">' + IC.warn + '<span>Every portion needs a unit.</span></div>' : '<span class="w-note" style="margin:0 auto 0 0">Changes are logged in Activity. The vendor isn’t notified.</span>') +
      '<button class="btn" onclick="cancelAllocEdit()">Cancel</button><button class="btn btn-primary"' + (c.changed && !c.over.length && !c.missing ? '' : ' disabled') + ' onclick="saveAllocEdit()">Save changes</button></div>';
  }
  function saveAllocEdit() {
    const s = S, c = allocCheck(s); if (!c.changed || c.over.length || c.missing) return;
    const notes = [];
    s.lines.forEach((l, k) => l.alloc.forEach((a, j) => { const n = editAlloc[k][j];
      if (a.gl !== n.gl) notes.push('Line ' + (k + 1) + ': GL ' + a.gl + ' → ' + n.gl);
      if (a.unit !== n.unit) notes.push('Line ' + (k + 1) + ': ' + SPO.unitLabel(a.unit) + ' → ' + SPO.unitLabel(n.unit));
      a.gl = n.gl; a.unit = n.unit; }));
    SPO.log(s, 'GL & unit corrected', notes.join(' · ') + ' · by Alicia Grant');
    SPO.save(s); editAlloc = null; renderPage();
    showToast('GL & unit corrected', notes.length + ' change' + (notes.length === 1 ? '' : 's') + ' saved to SPO-' + s.id + '.');
  }

  /* Validated invoices against the estimate of the lines each one covers — with several invoices, summed. Tax is
     invoice-level (10/21/2026): a shared invoice counts only this SPO's lines here, never a per-SPO tax share; a
     one-SPO invoice keeps its tax, since all of it belongs to this SPO. */
  function invoiceTotals(s) {
    const recs = SPO.invoicesOf(s).filter(r => r.validated), many = recs.length > 1, shared = recs.some(r => r.shared);
    let sub = 0, cov = 0, tax = 0, tot = 0;
    recs.forEach(r => { const st = SPO.invSubtotal({ invoice: r }); sub += st; cov += SPO.invCovers(r).reduce((a, k) => a + s.lines[k].qty * s.lines[k].price, 0);
      if (!r.shared) tax += (r.tax || 0) + (r.ship || 0); tot += r.shared ? st : SPO.invTotal({ invoice: r }); });
    sub = r2(sub); tax = r2(tax); tot = r2(tot); const vr = r2(sub - cov);
    return '<div class="tot-row"><span>' + (many ? 'Invoiced on ' + recs.map(r => r.num).join(', ') : 'Invoice ' + recs[0].num) + ' · subtotal</span><span>' + money(sub) + '</span></div>' +
      (vr ? '<div class="tot-row"><span>Variance accepted at mapping</span><span style="color:#b45309">' + (vr > 0 ? '+' : '−') + money(Math.abs(vr)) + '</span></div>' : '') +
      (tax ? '<div class="tot-row"><span>Sales tax</span><span>' + money(tax) + '</span></div>' : '') +
      '<div class="tot-row grand"><span>' + (shared ? 'Invoiced to this SPO' : many ? 'Invoiced total' : 'Invoice total') + '</span><span>' + money(tot) + '</span></div>' +
      (shared ? '<div class="tot-row"><span style="font-size:12px">Shared invoice · tax is on the invoice, not split by SPO</span><span></span></div>' : '');
  }

  /* Line tag: which invoice billed it, still open, or closed unbilled (partial invoicing, TKT-SPO-59). Shown once an
     invoice exists, so a fully billed one-invoice SPO reads the same as before plus its invoice number. */
  function lineTag(s, k) {
    if (!SPO.invoicesOf(s).length && !s.lines[k].closed) return '';
    const x = SPO.lineState(s, k);
    if (x.kind === 'billed') return '<span class="ln-tag billed">' + IC.check + x.num + '</span>';
    if (x.kind === 'mapping') return '<span class="ln-tag mapping">On ' + x.num + ' · to map</span>';
    if (x.kind === 'closed') return '<span class="ln-tag closed" title="“' + x.reason.replace(/"/g, '&quot;') + '” · ' + x.by + '">Closed unbilled</span>';
    return '<span class="ln-tag open">Not invoiced yet</span>';
  }
  /* One row per invoice: earlier ones (s.billed) with their own status, then the one in hand. */
  function invoiceCard(s) {
    const recs = SPO.invoicesOf(s), p = SPO.progress(s), many = recs.length > 1 || p.partial || p.closed > 0;
    const stOf = r => r !== s.invoice ? r.status : s.state;
    const chip = k => { const st = { mapping: ['dot-pending', 'Needs mapping'], ready: ['dot-pending', 'Validated · ready to send'], accounting: ['dot-violet', 'With Accounting'], paid: ['dot-approved', 'Paid'] }[k] || ['dot-approved', 'Mapped & validated'];
      return '<span class="status-dot-item"><span class="status-dot ' + st[0] + '"></span><span class="status-dot-label">' + st[1] + '</span></span>'; };
    const row = r => { const k = stOf(r), cov = SPO.invCovers(r), cur = r === s.invoice;
      return '<div class="doc-row emerald" style="margin-top:10px">' + IC.doc.replace('<svg', '<svg class="doc-ico"') + '<div style="flex:1;min-width:0"><div class="doc-name">' + r.num + ' · ' + r.file + '</div><div class="doc-date">Received ' + SPO.fmtDate(cur ? s.ev.invoiced : r.at.invoiced) + ' · ' + (many ? 'Line' + (cov.length === 1 ? ' ' : 's ') + cov.map(i => i + 1).join(', ') + ' · ' : 'PDF, ' + SPO.fileSize(SPO.invSize(r)) + ' · ' + r.lines.length + ' line' + (r.lines.length === 1 ? '' : 's') + ' · ') + (r.shared ? 'this SPO’s lines ' + money(SPO.invSubtotal({ invoice: r })) : money(SPO.invTotal({ invoice: r }))) + '</div></div>' +
        (many ? chip(k) : '') + (k === 'mapping' ? '<button class="btn btn-primary btn-sm" onclick="location.hash=\'#' + s.id + '/invoice\'">Map invoice</button>' : '') + '<a class="btn btn-sm" style="text-decoration:none;white-space:nowrap" href="invoice.html#' + encodeURIComponent(r.num) + '">Open invoice</a></div>'; };
    return '<div class="card"><div class="det-card-head hd"><div><h2>' + (many ? 'Invoices' : 'Invoice') + '</h2>' + (many ? '<div class="sub">' + p.billed + ' of ' + p.n + ' lines invoiced' + (p.closed ? ' · ' + p.closed + ' closed unbilled' : '') + (p.open ? ' · ' + p.open + ' still open' : '') + '</div>' : '') + '</div>' +
      (many ? (s.state === 'invoice' && p.open ? '<button class="btn btn-sm" style="display:inline-flex;align-items:center;gap:7px" onclick="openUpload()"><span style="display:inline-flex;width:14px;height:14px">' + IC.upload + '</span>Add invoice</button>' : '') : chip(stOf(s.invoice))) + '</div>' +
      recs.map(row).join('') + '</div>';
  }

  /* Close unbilled lines (TKT-SPO-59): the vendor won't bill them. Releases their budget; with nothing left open
     the SPO follows its invoices to With Accounting or Paid. */
  let closeSel = [];
  function openCloseLines() {
    const s = S, p = SPO.progress(s); closeSel = p.openLines.slice();
    modal('close-ov', '<div class="val-modal" style="width:520px"><div class="val-head"><h2>Close unbilled lines on SPO-' + s.id + '?</h2><p>For work ' + ven(s).name + ' won’t invoice — it wasn’t done, or was dropped. Closed lines stop waiting for an invoice and release their budget.</p></div>' +
      '<div class="val-body" style="padding:16px 24px"><div id="close-list">' + closeList() + '</div>' +
      '<label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:14px 0 8px">Why won’t these be billed? <span class="req-chip">Required</span></label>' +
      '<textarea class="claim-note" id="close-reason" maxlength="300" placeholder="e.g. The resident renewed, so the carpet in 0107 wasn’t replaced." oninput="closeOk()"></textarea></div>' +
      '<div class="val-foot"><span id="close-sum" style="font-size:13px;color:var(--muted-foreground);margin-right:auto"></span><button class="btn" onclick="closeModal(\'close-ov\')">Cancel</button><button class="btn btn-primary" id="close-go" disabled onclick="confirmCloseLines()">Close lines</button></div></div>');
    closeOk();
  }
  function closeList() {
    return SPO.progress(S).openLines.map(k => { const l = S.lines[k], on = closeSel.indexOf(k) >= 0;
      return '<label class="check-row" style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer"><input type="checkbox"' + (on ? ' checked' : '') + ' onchange="closeSel = this.checked ? closeSel.concat([' + k + ']) : closeSel.filter(x => x !== ' + k + '); closeOk()"><span style="flex:1">Line ' + (k + 1) + ' · ' + l.desc + '</span><b>' + money(r2(l.qty * l.price)) + '</b></label>'; }).join('');
  }
  function closeOk() {
    const r = (document.getElementById('close-reason') || {}).value || '', amt = r2(closeSel.reduce((a, k) => a + S.lines[k].qty * S.lines[k].price, 0));
    document.getElementById('close-go').disabled = !closeSel.length || !r.trim();
    document.getElementById('close-go').textContent = 'Close ' + closeSel.length + ' line' + (closeSel.length === 1 ? '' : 's');
    document.getElementById('close-sum').textContent = closeSel.length ? money(amt) + ' released from the budget' : 'Choose at least one line';
  }
  function confirmCloseLines() {
    const s = S, reason = document.getElementById('close-reason').value.trim(); if (!reason || !closeSel.length) return;
    SPO.closeLines(s, closeSel.slice().sort((a, b) => a - b), reason, 'Alicia Grant');
    SPO.save(s); closeModal('close-ov'); renderPage();
    showToast(closeSel.length + ' line' + (closeSel.length === 1 ? '' : 's') + ' closed unbilled', s.state === 'invoice' ? 'SPO-' + s.id + ' still waits for an invoice for its other lines.' : 'Nothing left to invoice — SPO-' + s.id + ' is ' + SPO.STATES[s.state].label + '.');
  }

  /* ---------- modals (val-modal pattern) ---------- */
  function modal(id, html) {
    let ov = document.getElementById(id);
    if (!ov) { ov = document.createElement('div'); ov.className = 'overlay center'; ov.id = id; ov.addEventListener('click', e => { if (e.target === ov) closeModal(id); }); document.body.appendChild(ov); }
    ov.innerHTML = html; ov.classList.add('open'); document.body.style.overflow = 'hidden';
    return ov;
  }
  function closeModal(id) {
    const ov = document.getElementById(id); if (ov) ov.classList.remove('open');
    document.body.style.overflow = '';
    const h = location.hash.split('/'); if (h.length > 1) history.replaceState(null, '', h[0]);
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.overlay.open').forEach(o => closeModal(o.id)); });

  /* Cancel offers two endings when the SPO can be rebid (10/16/2026): Cancel SPO, or Cancel and rebid — which
     parks a copy in the Rebid state, waiting for a vendor. Both need a reason. */
  let cancelMode = 'cancel';
  function openCancel() {
    const s = S, sentAlready = !!s.ev.sent, canR = SPO.canRebid(s); cancelMode = 'cancel';
    const opt = (k, ic, name, desc) => '<button class="opt-row' + (k === 'cancel' ? ' selected' : '') + '" id="cm-' + k + '" onclick="pickCancelMode(\'' + k + '\')"><span class="opt-ic">' + ic + '</span><span class="opt-body"><span class="opt-name">' + name + '</span><span class="opt-desc">' + desc + '</span></span><span class="opt-radio">' + IC.check + '</span></button>';
    modal('cancel-ov', '<div class="val-modal" style="width:520px"><div class="val-head"><h2>Cancel SPO-' + s.id + '?</h2><p>' + (sentAlready ? (s.state === 'rebid' ? 'It hasn’t gone to a vendor yet.' : ven(s).name + ' is notified and the PO is withdrawn.') : 'It hasn’t gone to a vendor yet.') + ' This can’t be undone.</p></div>' +
      '<div class="val-body" style="padding:14px 24px">' +
      (canR ? opt('cancel', IC.ban, 'Cancel SPO', 'Ends it. Nothing else happens.') + opt('rebid', IC.swap, 'Cancel and rebid', 'Ends it and creates a new SPO with the same scope and lines, waiting for you to pick a vendor.') : '') +
      '<label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:' + (canR ? '6px' : '0') + ' 0 8px">Reason <span class="req-chip">Required</span></label>' +
      '<textarea class="claim-note" id="cancel-reason" maxlength="500" placeholder="Why is this SPO being canceled?" oninput="document.getElementById(\'cancel-go\').disabled = !this.value.trim()"></textarea>' +
      '<div style="font-size:12px;color:var(--muted-foreground);margin-top:6px">' + (sentAlready && s.state !== 'rebid' ? 'Shared with the vendor and kept in the SPO’s activity.' : 'Kept in the SPO’s activity.') + '</div></div>' +
      '<div class="val-foot"><button class="btn" onclick="closeModal(\'cancel-ov\')">Keep SPO</button><button class="btn btn-danger" id="cancel-go" disabled onclick="confirmCancel()">Cancel SPO</button></div></div>');
    setTimeout(() => document.getElementById('cancel-reason').focus(), 50);
  }
  function pickCancelMode(k) {
    cancelMode = k;
    document.querySelectorAll('#cancel-ov .opt-row').forEach(b => b.classList.toggle('selected', b.id === 'cm-' + k));
    document.getElementById('cancel-go').textContent = k === 'rebid' ? 'Cancel and rebid' : 'Cancel SPO';
  }
  function confirmCancel() {
    const s = S, reason = document.getElementById('cancel-reason').value.trim();
    if (!reason) return;
    if (cancelMode === 'rebid' && SPO.canRebid(s)) {
      const n = doRebid(s, reason); closeModal('cancel-ov');
      showToast('SPO-' + s.id + ' canceled · rebid as SPO-' + n.id, 'It’s waiting for you to pick a vendor.');
      location.hash = '#' + n.id; return;
    }
    s.state = 'canceled'; s.cancel = { by: 'Alicia Grant', reason }; s.ev.canceled = SPO.now();
    SPO.log(s, 'Canceled', 'by Alicia Grant · “' + reason + '”', false, true);
    SPO.save(s); closeModal('cancel-ov'); renderPage();
    showToast('SPO-' + s.id + ' canceled', s.ev.sent && s.state !== 'rebid' ? ven(s).name + ' was notified.' : 'It was never sent to a vendor.');
  }

  /* ===================== Rebid (replaces Change Vendor, 10/16/2026) =====================
     Rebid cancels this SPO and creates a new one with the same scope, lines, allocation and proposed time,
     linked both ways. "Cancel and rebid" parks it (state rebid) for later; the Rebid button sends it now.
     An approval carries over when the amount doesn't go up. */
  const ME = 'Alicia Grant';
  function rebidLink(s) {
    if (s.revised) { const inv = SPO.list().some(x => SPO.invoicesOf(x).some(r => r.num === s.revised.from));
      return '<div class="series-link">' + IC.split + '<span>Revised SPO · from invoice <b>' + s.revised.from + '</b> · not sent to vendor</span>' + (inv ? '<a class="text-link" href="invoice.html#' + encodeURIComponent(s.revised.from) + '">View invoice</a>' : '') + '</div>'; }
    if (s.rebidOf) { const o = SPO.get(s.rebidOf); return '<div class="series-link">' + IC.swap + '<span>Rebid of <b>SPO-' + s.rebidOf + '</b>' + (o && o.ev.canceled ? ' · canceled ' + SPO.fmtDate(o.ev.canceled) : '') + (o ? ' · was ' + ven(o).name : '') + '</span><a class="text-link" href="spo.html#' + s.rebidOf + '">View SPO-' + s.rebidOf + '</a></div>'; }
    if (s.rebidAs) { const n = SPO.get(s.rebidAs); return '<div class="series-link">' + IC.swap + '<span>Rebid as <b>SPO-' + s.rebidAs + '</b>' + (n ? ' · ' + SPO.STATES[n.state].label + (n.state !== 'rebid' ? ' · ' + ven(n).name : '') : '') + '</span><a class="text-link" href="spo.html#' + s.rebidAs + '">View SPO-' + s.rebidAs + '</a></div>'; }
    return '';
  }
  function doRebid(s, reason) {
    const n = { id: SPO.nextId(), state: 'rebid', prop: s.prop, v: s.v, by: ME, period: s.period, scope: s.scope,
      lines: JSON.parse(JSON.stringify(s.lines)), rebidOf: s.id, ev: { created: SPO.now() } };
    if (s.appt && s.appt.start) { n.appt = { status: 'proposed', start: s.appt.start, by: 'buyer' }; if (s.appt.end) n.appt.end = s.appt.end; }
    n.log = [{ at: n.ev.created, t: 'Rebid of SPO-' + s.id, sub: 'by ' + ME + ' · “' + reason + '”', hi: false }];
    s.state = 'canceled'; s.cancel = { by: ME, reason, rebid: true }; s.ev.canceled = SPO.now(); s.rebidAs = n.id;
    SPO.log(s, 'Canceled for rebid', 'by ' + ME + ' · “' + reason + '” · rebid as SPO-' + n.id, false, true);
    SPO.save(s); SPO.save(n);
    return n;
  }
  function sendRebid(n, vk) {
    const o = SPO.get(n.rebidOf), v = SPO.VEN[vk];
    n.v = vk;
    const carried = !!(o && o.ev.approved && SPO.total(n) <= SPO.total(o) + 0.005);
    if (!carried && SPO.needsApproval(n)) {
      n.state = 'approval'; n.ev.approvalReq = SPO.now();
      SPO.log(n, 'Sent for approval', 'Rebid of SPO-' + n.rebidOf + ' · Supervisor sign-off before ' + v.name + ' sees it');
    } else {
      if (carried) { n.approval = { by: (o.approval && o.approval.by) || 'Priya Nair', carried: o.id }; n.ev.approved = o.ev.approved; SPO.log(n, 'Approval carried over', 'Approved on SPO-' + o.id + ' by ' + n.approval.by + ' · same lines, same amount', true); }
      n.state = 'invoice'; n.ev.sent = SPO.now();
      SPO.log(n, 'Sent to vendor', 'PO emailed to ' + v.email);
      if (n.appt && n.appt.start && n.appt.start.slice(0, 10) >= SPO.TODAY) { n.appt = Object.assign({}, n.appt, { status: 'proposed', by: 'buyer', at: SPO.now() }); SPO.log(n, 'Service time proposed', SPO.fmtAppt(n.appt) + ' · to ' + v.name); }
      else delete n.appt;
    }
    SPO.save(n);
    return n;
  }
  const venPicker = () => '<div class="search-wrap" style="max-width:none;margin:0 0 10px">' + IC.search.replace('<svg', '<svg class="search-icon"') +
    '<input class="search-field" id="ven-q" placeholder="Search ' + (Object.keys(SPO.VEN).length - 1).toLocaleString() + ' approved vendors by name, trade or email…" autocomplete="off" oninput="renderVenList()"></div><div class="ven-results" id="ven-results"></div>';
  /* The Rebid button: reason + new vendor, sent now. "Save for later" parks it instead. */
  function openRebid() {
    const s = S; if (!SPO.canRebid(s)) return; pickVen = null;
    const why = s.state === 'rejected' && s.reject && s.reject.reason ? s.reject.reason : '';
    modal('vendor-ov', '<div class="val-modal" style="width:580px"><div class="val-head"><h2>Rebid SPO-' + s.id + '</h2><p>Cancels SPO-' + s.id + (s.state === 'rejected' ? '' : ' — ' + ven(s).name + ' is told the PO is withdrawn —') + ' and sends a new SPO with the same scope, lines and allocation to the vendor you pick.</p></div>' +
      '<div class="val-body" style="padding:14px 24px 6px"><label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px">Reason <span class="req-chip">Required</span></label>' +
      '<textarea class="claim-note" id="rb-reason" maxlength="500" style="min-height:52px" placeholder="Why rebid? e.g. the vendor can’t meet the date">' + (why ? ven(s).name + ' rejected it: ' + why : '') + '</textarea>' +
      '<label style="display:block;font-size:13px;font-weight:600;margin:14px 0 8px">New vendor</label>' + venPicker() + '<div class="time-err" id="rb-err" hidden></div></div>' +
      '<div class="val-foot" style="justify-content:space-between"><button class="btn" style="border:none;background:none;color:var(--primary);padding-left:0" onclick="confirmRebid(false)">Save for later</button><span style="display:flex;gap:8px"><button class="btn" onclick="closeModal(\'vendor-ov\')">Cancel</button><button class="btn btn-primary" id="ven-go" disabled onclick="confirmRebid(true)">Send to vendor</button></span></div></div>');
    renderVenList();
    setTimeout(() => document.getElementById(why ? 'ven-q' : 'rb-reason').focus(), 50);
  }
  function confirmRebid(send) {
    const s = S, reason = document.getElementById('rb-reason').value.trim(), err = document.getElementById('rb-err');
    if (!reason) { err.hidden = false; err.textContent = 'Add a reason — it goes in both SPOs’ activity' + (s.state === 'rejected' ? '.' : ' and to ' + ven(s).name + '.'); return; }
    if (send && !pickVen) { err.hidden = false; err.textContent = 'Pick a vendor, or Save for later.'; return; }
    const n = doRebid(s, reason);
    if (send) sendRebid(n, pickVen);
    closeModal('vendor-ov');
    showToast('SPO-' + s.id + ' canceled · rebid as SPO-' + n.id, send ? (n.state === 'approval' ? 'Sent for approval first.' : 'Sent to ' + SPO.VEN[n.v].name + '.') : 'It’s waiting for you to pick a vendor.');
    location.hash = '#' + n.id;
  }
  /* A parked rebid: pick the vendor and send. */
  function openRebidSend() {
    const s = S; if (s.state !== 'rebid') return; pickVen = null;
    modal('vendor-ov', '<div class="val-modal" style="width:560px"><div class="val-head"><h2>Choose a vendor for SPO-' + s.id + '</h2><p>Rebid of SPO-' + s.rebidOf + ' (was ' + ven(s).name + '). The same scope, lines and allocation go to the vendor you pick.</p></div>' +
      '<div class="val-body" style="padding:14px 24px 6px">' + venPicker() + '</div>' +
      '<div class="val-foot"><button class="btn" onclick="closeModal(\'vendor-ov\')">Cancel</button><button class="btn btn-primary" id="ven-go" disabled onclick="confirmRebidSend()">Send to vendor</button></div></div>');
    renderVenList();
    setTimeout(() => document.getElementById('ven-q').focus(), 50);
  }
  function confirmRebidSend() {
    const s = S; if (!pickVen || s.state !== 'rebid') return;
    sendRebid(s, pickVen); closeModal('vendor-ov'); renderPage();
    showToast(s.state === 'approval' ? 'Sent for approval' : 'Sent to ' + ven(s).name, 'SPO-' + s.id + (s.state === 'approval' ? ' goes to the vendor once approved.' : ' is waiting on their invoice.'));
  }

  let pickVen = null;
  /* Vendor search (Rebid and Choose vendor) covers the whole approved-vendor directory — thousands in
     production. An empty search suggests same-trade vendors, ones you've used first; results are capped. */
  const VEN_CAP = 25;
  function renderVenList() {
    const s = S, trade = ven(s).trade, q = (document.getElementById('ven-q').value || '').trim().toLowerCase();
    const terms = q.split(/\s+/).filter(Boolean);
    const keys = Object.keys(SPO.VEN).filter(k => k !== s.v);
    const hit = k => { const o = SPO.VEN[k], hay = (o.name + ' ' + o.trade + ' ' + o.email).toLowerCase(); return terms.every(w => hay.includes(w)); };
    const rank = k => { const o = SPO.VEN[k]; return (o.trade === trade ? 0 : 2) + (o.dir ? 1 : 0); };
    const all = (terms.length ? keys.filter(hit) : keys.filter(k => SPO.VEN[k].trade === trade))
      .sort((a, b) => rank(a) - rank(b) || SPO.VEN[a].name.localeCompare(SPO.VEN[b].name));
    let list = all.slice(0, VEN_CAP);
    if (pickVen && list.indexOf(pickVen) < 0) list = [pickVen].concat(list.slice(0, VEN_CAP - 1));
    const head = terms.length ? (all.length ? all.length.toLocaleString() + ' match' + (all.length === 1 ? '' : 'es') + (all.length > VEN_CAP ? ' · showing ' + VEN_CAP + ', keep typing to narrow' : '') : '')
      : 'Suggested · ' + trade + (all.length > VEN_CAP ? ' · ' + VEN_CAP + ' of ' + all.length : '');
    document.getElementById('ven-results').innerHTML = (head ? '<div class="ven-head">' + head + '</div>' : '') +
      (list.length ? list.map(k => { const o = SPO.VEN[k]; return '<button class="opt-row' + (k === pickVen ? ' selected' : '') + '" id="vo-' + k + '" onclick="selectVen(\'' + k + '\')"><span class="opt-ic vt" style="font-size:11px;font-weight:700;--vh:' + SPO.vh(k) + '">' + SPO.ini(k) + '</span><span class="opt-body"><span class="opt-name">' + o.name + '</span><span class="opt-desc">' + o.trade + ' · ' + o.email + '</span></span>' + (!o.dir ? '<span class="pill p-neutral" style="font-size:11px">Used before</span>' : '') + '<span class="opt-radio">' + IC.check + '</span></button>'; }).join('')
        : '<div class="ven-empty">No approved vendor matches “' + q.replace(/</g, '&lt;') + '”. Try a trade, like “plumbing”.</div>');
  }
  function selectVen(k) {
    pickVen = k;
    document.querySelectorAll('#vendor-ov .opt-row').forEach(b => b.classList.toggle('selected', b.id === 'vo-' + k));
    const go = document.getElementById('ven-go'); go.disabled = false; go.textContent = 'Send to ' + SPO.VEN[k].name;
  }
  /* A response the vendor gave outside Scout (phone, email, in person). Always attributed to who recorded it. */
  function vendorRespRow(s) {
    const r = SPO.resp(s); if (!r) return '';
    const val = r.kind === 'rejected' ? '<span style="color:var(--rose)">Rejected' + (r.at ? ' · ' + SPO.fmtDate(r.at) : '') + '</span>' + (r.by === 'buyer' ? '<div class="fact-sub">Recorded by ' + s.reject.by + '</div>' : '')
      : r.kind === 'accepted' ? (r.by === 'buyer' ? 'Accepted ' + SPO.fmtDate(r.at) + '<div class="fact-sub">Recorded by ' + s.ack.by + '</div>' : 'Accepted by vendor ' + SPO.fmtDate(r.at))
      : '<span style="color:var(--muted-foreground)">No response</span>';
    return '<dt>Vendor response</dt><dd>' + val + '</dd>';
  }
  /* Record the vendor's answer when they gave it outside Scout. No response is always an option and is
     the default (preselected); Save enables only when the pick changes the current answer. */
  let respPick = null;
  function openRecordResp() {
    const s = S, editing = SPO.canEditResp(s); if (!editing && !SPO.canRespond(s)) return;

    M.lines.forEach(l => {
      if (l.res === 'remove') { l.status = 'removed'; SPO.log(s, 'Invoice line removed', '“' + l.desc + '” · ' + money(l.amt) + ' · ' + l.resReason, false, true); }
      else if (l.res === 'add') { s.lines.push({ desc: l.desc, qty: 1, price: l.amt, alloc: [{ gl: l.resGl, unit: l.resUnit, amt: l.amt }] }); l.maps = [{ line: s.lines.length - 1, amt: l.amt }]; SPO.log(s, 'Line added to SPO', l.desc + ' · ' + money(l.amt) + ' · ' + l.resGl + ' ' + SPO.glName(l.resGl)); }
      else if (l.res === 'extra') { l.extra = { gl: l.resGl, unit: l.resUnit }; SPO.log(s, 'Extra charge accepted', l.desc + ' · ' + money(l.amt) + ' · ' + l.resGl + ' ' + SPO.glName(l.resGl)); }
    });
    M.lines.forEach(l => (l.maps || []).forEach(m => { delete m.sug; }));
    const rest = restLines();
    /* Revised SPO lines (TKT-SPO-64) leave this SPO's slice; the Revised SPO gets its own slice of the same invoice */
    const revLines = M.lines.filter(l => l.res === 'revised'), wasShared = M.shared;
    M.lines = M.lines.filter(l => l.res !== 'revised');
    s.invoice = Object.assign(M, { validated: true, extractFailed: false }); delete s.mapDraft;
    const revTotal = wasShared ? wasShared.total : r2(SPO.invTotal(s) + revLines.reduce((a, l) => a + l.amt, 0));
    if (rest.length && restMode === 'close') SPO.closeLines(s, rest, restReason.trim(), 'Alicia Grant');
    const covEst = r2(SPO.invCovers(s.invoice).reduce((a, k) => a + s.lines[k].qty * s.lines[k].price, 0) + s.invoice.lines.filter(l => l.extra && l.status !== 'removed').reduce((a, l) => a + l.amt, 0));
    const d = r2(SPO.invSubtotal(s) - covEst);
    s.state = 'ready'; s.ev.mapped = SPO.now();
    const pv = SPO.progress(s);
    SPO.log(s, 'Invoice mapped & validated', s.invoice.num + ' · ' + M.lines.length + ' line' + (M.lines.length === 1 ? '' : 's') + (pv.open ? ' · ' + pv.open + ' SPO line' + (pv.open === 1 ? '' : 's') + ' expected on another invoice' : '') + (Math.abs(d) >= 0.005 ? ' · ' + (d > 0 ? '+' : '−') + money(Math.abs(d)) + ' variance accepted' : ' · on estimate'), true);
    SPO.save(s);
    /* the store hands out copies: attach after saving, then re-read this SPO with its shared invoice */
    const revIds = SPO.attachRevised(wasShared ? wasShared.spos.filter(id => !SPO.get(id) || !SPO.get(id).revised) : [s.id], s.invoice.num, revLines, revTotal);
    if (revIds.length) S = SPO.get(s.id);
    closeMapTk(); renderPage();
    if (revIds.length) { showToast('Invoice ' + s.invoice.num + ' validated', 'Revised SPO-' + revIds.join(', SPO-') + ' is awaiting approval — Send unlocks once a manager approves it.'); return; }
    showToast('Invoice ' + s.invoice.num + ' validated', 'SPO-' + s.id + ' is ready for Accounting.' + (pv.open ? ' ' + pv.open + ' line' + (pv.open === 1 ? '' : 's') + ' wait for the next invoice.' : ''));
  }

  function openInvDispute(prefill) {
    modal('dispute-ov', '<div class="val-modal" style="width:500px"><div class="val-head"><h2>Dispute invoice ' + M.num + '?</h2><p>' + ven(S).name + ' is asked to correct and resubmit. SPO-' + S.id + ' goes back to waiting for an invoice.</p></div>' +
      '<div class="val-body" style="padding:16px 24px"><label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px">What needs correcting <span class="req-chip">Required</span></label>' +
      '<textarea class="claim-note" id="disp-reason" maxlength="500" placeholder="e.g. Unit 104 is billed at $230; the SPO estimate is $200." oninput="document.getElementById(\'disp-go\').disabled = !this.value.trim()"></textarea>' +
      '<div style="font-size:12px;color:var(--muted-foreground);margin-top:6px">Shared with the vendor and kept in the SPO’s activity.</div></div>' +
      '<div class="val-foot"><button class="btn" onclick="closeModal(\'dispute-ov\')">Keep reviewing</button><button class="btn btn-danger" id="disp-go" disabled onclick="confirmInvDispute()">Dispute invoice</button></div></div>');
    document.getElementById('dispute-ov').style.zIndex = '500';
    if (prefill) { const t = document.getElementById('disp-reason'); t.value = prefill; document.getElementById('disp-go').disabled = false; }
  }
  function confirmInvDispute() {
    const s = S, reason = document.getElementById('disp-reason').value.trim(); if (!reason) return;
    s.disputed = { num: s.invoice.num, reason }; delete s.invoice; delete s.mapDraft; s.state = 'invoice';
    SPO.log(s, 'Invoice disputed', s.disputed.num + ' · “' + reason + '”', false, true);
    SPO.save(s); closeModal('dispute-ov'); closeMapTk(); renderPage();
    showToast('Invoice disputed', ven(s).name + ' was asked to correct and resubmit.');
  }

  /* ===================== Send to Accounting (payment packet) ===================== */
  let packTab = 'gl';
  function openAccounting() { packTab = 'gl'; renderPack(); }
  function renderPack() { modal('pack-ov', PACK.packModal(S, packTab, propOf(S), IC, 'packTab', 'renderPack')); }
  function sendToAccounting() {
    if (!SPO.invReady(S)) return;
    const r = SPO.sendInvoice(S, 'Alicia Grant');
    closeModal('pack-ov'); renderPage();
    showToast('Invoice ' + r.num + ' sent to Accounting', money(r.total) + (r.spos.length > 1 ? ' · ' + r.spos.map(id => 'SPO-' + id).join(', ') + ' are with Accounting' : '') + (r.waits.length ? ' · SPO-' + r.waits.join(', SPO-') + ' now waits for the next invoice' : '') + '.');
  }

  function copyNum() { copyRef('SPO-' + S.id); }
  function copyRef(v) { try { navigator.clipboard.writeText(v).catch(() => {}); } catch (e) { /* no clipboard: the toast still confirms */ } showToast('Copied', v); }
  let toastTimer;
  function showToast(title, desc) { let el = document.getElementById('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.style.cssText = 'position:fixed;bottom:24px;left:24px;z-index:600;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:14px 18px;max-width:360px;font-size:13px;transition:opacity .2s'; document.body.appendChild(el); } el.innerHTML = '<b style="display:block;font-size:14px">' + title + '</b><span style="color:var(--muted-foreground)">' + desc + '</span>'; el.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.opacity = 0, 3000); }

  window.addEventListener('hashchange', () => { actExpanded = false; editAlloc = null; spoTab = 'spo'; renderPage(); });
  renderPage();
</script>
</body>
