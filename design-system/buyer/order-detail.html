  const invN = () => O.invNum || '001042731';
  function invAmounts() {
    const sub = itemTotal();
    const tax = Math.round(sub * 0.105 * 100) / 100;
    const grand = Math.round((sub + tax + O.ship[1]) * 100) / 100;
    return { sub, tax, grand, ship: O.ship[1] };
  }
  function pdfRows() { return O.items.filter(i => !i.canceled && (i.rec || 0) > 0); }
  function billedAmounts() {
    const a = invAmounts();
    if (!O.invBilledWrong) return a;
    const extra = Math.round(O.items.reduce((x, i) => x + (i.canceled ? i.qty * i.price : 0), 0) * 100) / 100;
    const sub = Math.round((a.sub + extra) * 100) / 100;
    const tax = Math.round(sub * (O.taxRate || 0.105) * 100) / 100;
    return { sub, tax, grand: Math.round((sub + tax + a.ship) * 100) / 100, ship: a.ship };
  }
  function pdfHead(docLabel) {
    return 'SCOUT DEMO VENDOR\n1502 DAVE DIXON DR\nNEW ORLEANS LA 70112\n' + docLabel + '\n---------Sold to----------    ------Comments------    ---------Ship to---------\nBAYOU CROSSING APARTMENTS                             BAYOU CROSSING APARTMENTS\n3850 AIRLINE DR               SCOUT ORDER #' + num + '        3850 AIRLINE DR\nBATON ROUGE LA                2 BUSINESS DAY SHIP     BATON ROUGE LA\n70805                                                 70805\n';
  }
  function invPdfText() {
    const a = billedAmounts();
    const rows = pdfRows().concat(O.invBilledWrong ? O.items.filter(i => i.canceled).map(i => ({ ...i, rec: i.qty })) : []);
    return pdfHead('Ref #:' + invN() + ' Trc:I Chrg          INVOICE           08/28/26  Page: 1') +
      '\n                    A/N:7278  St#:F\nPO#:PO-' + num + '-189   Clr:JVL   Slp:361   Trms:NET PROX 10TH\n        Ship Date:08/28/26 11:50                      Pay Type:C\n Ord Shp C B/O Mfg Sku     Des                 List    Unit     Ext Amt\n' + rows.map(r => '  1   1 I   0 LWI ' + r.sku + '  ' + r.name.toUpperCase().slice(0, 22) + '  ' + (Math.round(r.price * 1.333 * 100) / 100).toFixed(2) + '  ' + r.price.toFixed(2) + '    ' + (r.rec * r.price).toFixed(2)).join('\n') + '\n\n                          Tax       Sub-Total:      ' + a.sub.toFixed(2) + '\n                          ' + a.tax.toFixed(2) + '\n                                    Shipping:       ' + a.ship.toFixed(2) + '\nRecv\'d by:          Total Shipped: ' + rows.reduce((x, r) => x + r.rec, 0) + '   Grand Total:    ' + a.grand.toFixed(2) + '\n\n     *** DEMO INVOICE - NOT A REAL TRANSACTION ***\n     SALES TAX APPLIED AT 10.5% ON MERCHANDISE SUBTOTAL';
  }
  function poPdfText() {
    const rows = O.items.filter(i => !i.canceled);
    return pdfHead('Ref #:PO-' + num + '-189                 PURCHASE ORDER    ' + O.placed.split(',').slice(0, 1).join('') + '  Page: 1') +
      '\nTerms: NET PROX 10TH        Ship Via: BEST WAY\n Qty  Sku       Description                              Unit      Ext Amt\n' + rows.map(r => '  ' + r.qty + '   ' + r.sku + '   ' + r.name.toUpperCase().slice(0, 38) + '   ' + r.price.toFixed(2) + '   ' + (r.qty * r.price).toFixed(2)).join('\n') + '\n\n                                    Merchandise:    ' + itemTotal().toFixed(2) + '\n                                    Shipping:       ' + O.ship[1].toFixed(2) + '\n\nAuthorized by: ALICIA GRANT \u00B7 DEMO INC.\n\n     *** DEMO PURCHASE ORDER - NOT A REAL TRANSACTION ***';
  }
  function rogPdfText() {
    const rows = pdfRows();
    return pdfHead('Ref #:ROG-' + num + '                   RECEIPT OF GOODS  08/28/26  Page: 1') +
      '\nDelivery validated by: ALICIA GRANT \u00B7 DEMO INC.\n Qty Received  Sku       Description\n' + rows.map(r => '     ' + r.rec + '         ' + r.sku + '   ' + r.name.toUpperCase().slice(0, 40)).join('\n') + '\n\nAll listed quantities were physically received and validated.\nGenerated automatically from the delivery validation.\n\n     *** DEMO RECEIPT OF GOODS - NOT A REAL TRANSACTION ***';
  }
  function openInvReview() {
    invChecks = {};
    let tk = document.getElementById('inv-tk');
    if (!tk) { tk = document.createElement('div'); tk.id = 'inv-tk'; tk.className = 'inv-tk'; document.body.appendChild(tk); }
    renderInvTk();
    tk.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeInvTk() { const tk = document.getElementById('inv-tk'); if (tk) tk.classList.remove('open'); document.body.style.overflow = ''; }
  function invTkToggle(k) { invChecks[k] = !invChecks[k]; renderInvTk(); }
  let invMapOpen = false;
  function invMapToggle() { invMapOpen = !invMapOpen; renderInvTk(); }
  function renderInvTk() {
    const tk = document.getElementById('inv-tk'); if (!tk) return;
    const a = invAmounts();
    const b = billedAmounts();
    const rows = O.items.filter(i => !i.canceled && (i.rec || 0) > 0);
    const billedExtra = O.invBilledWrong ? O.items.filter(i => i.canceled) : [];
    const reqKeys = rows.map((r, x) => 'q' + x).concat(billedExtra.map((r, x) => 'x' + x)).concat(['sub', 'tax', 'grand']);
    const done = reqKeys.filter(k => invChecks[k]).length;
    const allOk = done === reqKeys.length;
    const chk = (k) => '<span class="chk' + (invChecks[k] ? ' on' : '') + '" onclick="invTkToggle(\'' + k + '\')">' + (invChecks[k] ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' : '') + '</span>';
    const pdfText = invPdfText();
    const skuRows = rows.map((r, x) => '<div class="ivt-row"><span>' + chk('q' + x) + '</span><span class="ivt-item"><span class="thumb" style="width:38px;height:38px">' + glyph + '</span><span class="ivt-name">' + r.name + '</span></span><span class="ivt-sku">' + r.sku + '</span><span class="ivt-c">' + r.rec + '</span><span class="ivt-c ivt-ai">' + r.rec + '</span></div>').join('') +
      billedExtra.map((r, x) => '<div class="ivt-row"><span>' + chk('x' + x) + '</span><span class="ivt-item"><span class="thumb" style="width:38px;height:38px">' + glyph + '</span><span><span class="ivt-name">' + r.name + '</span><span class="ivt-warn">Canceled after your claim \u2014 the invoice still bills it.</span></span></span><span class="ivt-sku">' + r.sku + '</span><span class="ivt-c">\u2014</span><span class="ivt-c ivt-ai">' + r.qty + '</span></div>').join('');
    const amtRow = (k, label, ours, theirs, noChk) => {
      const varAmt = (noChk || theirs === null) ? null : Math.round((theirs - ours) * 100) / 100;
      const mismatch = varAmt !== null && Math.abs(varAmt) >= 0.01;
      return '<div class="ivt-row amt"><span>' + (noChk ? '' : chk(k)) + '</span><span><span class="ivt-amt-l">' + label + '</span>' +
        (mismatch ? '<span class="ivt-warn">The extracted amount doesn\u2019t match your records \u2014 confirm only if you reviewed the PDF and accept the difference; otherwise dispute.</span>' : '') + '</span>' +
        '<span class="ivt-c">' + money(ours) + '</span><span class="ivt-c ivt-ai">' + (theirs === null ? '\u2014' : money(theirs)) + '</span><span class="ivt-c"' + (mismatch ? ' style="color:#be185d;font-weight:600"' : '') + '>' + (varAmt === null ? '\u2014' : money(Math.abs(varAmt))) + '</span></div>';
    };
    const mapRows = rows.map(r => '<div class="ivt-map-row"><div><div class="ivt-map-inv">' + r.name.toUpperCase().slice(0, 34) + '</div><div class="ivt-map-sub">' + r.sku + ' · Qty ' + r.rec + ' · Unit ' + money(r.price) + '</div></div><span class="ivt-map-arr">\u2192</span><div><div class="ivt-map-lbl">ROG item</div><select class="ivt-map-sel"><option>' + r.name + '</option></select></div></div>').join('');
    tk.innerHTML =
      '<div class="ivt-head"><span class="ivt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m9 15 2 2 4-4"/></svg></span><div style="flex:1;min-width:0"><h2>Review invoice ' + invN() + '</h2><p>Scout AI extracted invoice number: ' + invN() + '. Compare the PDF with the final Receipt of Goods and Scout AI extracted values.</p></div><button class="row-action" style="width:34px;height:34px" title="Close" onclick="closeInvTk()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>' +
      '<div class="ivt-body">' +
      '<div class="ivt-pdf"><div class="ivt-pdf-bar"><span>scout-demo-invoice-' + num + '.pdf</span><span style="margin-left:auto">1 / 1 · 77%</span></div><div class="ivt-page"><pre>' + pdfText + '</pre></div></div>' +
      '<div class="ivt-side"><div class="ivt-scroll">' +
      '<h3>SKUs and quantities</h3><p class="ivt-sub">ROG quantities include resolved returns and write-offs.</p>' +
      '<div class="ivt-table"><div class="ivt-row hd"><span>Confirm</span><span>Item</span><span class="ivt-sku">SKU</span><span class="ivt-c">ROG Qty</span><span class="ivt-c ivt-ai">Invoice Qty<em>Extracted by Scout AI</em></span></div>' + skuRows + '</div>' +
      '<button class="act-more" style="padding:8px 0 0;font-size:12px" onclick="closeInvTk(); openClaim()">Something wrong with the goods themselves? Report a problem \u2014 an open claim holds the invoice.</button>' +
      '<h3 style="margin-top:22px">Invoice amounts</h3><p class="ivt-sub">Shipping, subtotal, sales tax, and total from the invoice.</p>' +
      '<div class="ivt-table"><div class="ivt-row hd amt"><span>Confirm</span><span class="ivt-amt-l">Amount</span><span class="ivt-c">Order/ROG</span><span class="ivt-c ivt-ai">Invoice<em>Extracted by Scout AI</em></span><span class="ivt-c">Variance</span></div>' +
      amtRow('sub', 'Subtotal', a.sub, b.sub) +
      amtRow('tax', 'Sales tax', a.tax, b.tax) +
      amtRow('grand', 'Grand total', a.grand, b.grand) +
      amtRow('', 'Shipping (included in total)', a.ship, null, true) + '</div>' +
      '<div class="ivt-map"><button class="ivt-map-head" onclick="invMapToggle()"><span><b>Map the line items myself</b><span class="ivt-map-sub" style="display:block">Match invoice lines to the received order items</span></span><span class="ivt-map-chip">' + rows.length + '/' + rows.length + '</span><svg style="width:15px;height:15px;transform:rotate(' + (invMapOpen ? 180 : 0) + 'deg)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>' +
      (invMapOpen ? '<div class="ivt-map-body"><p class="ivt-sub" style="margin:0 0 12px">Exact SKU matches are selected automatically. Review or change each match before previewing.</p>' + mapRows + '<div style="display:flex;align-items:center;margin-top:12px"><span class="ivt-sub" style="margin:0">All line items are mapped.</span><button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="showToast(\'Mapping preview\', \'Every invoice line maps to a received item\')">Preview mapping</button></div></div>' : '') + '</div>' +
      '</div>' +
      '<div class="ivt-foot"><span class="ivt-sub" style="margin:0">' + (allOk ? 'Every Scout AI extracted value has been reviewed.' : done + ' of ' + reqKeys.length + ' required values confirmed.') + '</span><button class="btn btn-danger" style="margin-left:auto" onclick="openDispute()">Dispute Invoice</button><button class="btn btn-primary"' + (allOk ? '' : ' disabled') + ' onclick="validateInvoice()">Validate Invoice</button></div>' +
      '</div></div>';
  }
  let payTab = 'inv';
  const PAY_DOCS = { po: ['Purchase Order', () => 'PO-' + num + '-189', poPdfText], inv: ['Invoice', () => '#' + invN(), invPdfText], rog: ['Receipt of Goods', () => 'ROG-' + num, rogPdfText] };
  function openPayConfirm() {
    payTab = 'inv';
    let ov = document.getElementById('pay-ov');
    if (!ov) { ov = document.createElement('div'); ov.id = 'pay-ov'; ov.className = 'overlay center'; document.body.appendChild(ov); ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); }); }
    renderPayModal();
    ov.classList.add('open');
  }
  function payTabSet(t) { payTab = t; renderPayModal(); }
  function payDownload(all) {
    if (all) showToast('Payment packet downloaded', 'Purchase Order, Invoice, and Receipt of Goods \u00B7 3 PDFs for accounting');
    else showToast(PAY_DOCS[payTab][0] + ' downloaded', PAY_DOCS[payTab][1]() + '.pdf \u00B7 ready to send to accounting');
  }
  function renderPayModal() {
    const ov = document.getElementById('pay-ov');
    const d = PAY_DOCS[payTab];
    ov.innerHTML = '<div class="val-modal" style="width:720px;max-width:calc(100vw - 40px)"><div class="val-head"><h2>Confirm Payment \u00B7 Order #' + num + '</h2><p>Review the payment packet \u2014 preview and download the documents your accounting team needs, then confirm once ' + money(grand()) + ' has been released.</p></div>' +
      '<div class="val-body" style="padding:16px 22px">' +
      '<div class="tab-bar" style="margin-bottom:12px">' + Object.keys(PAY_DOCS).map(k => '<button class="tab-item' + (k === payTab ? ' active' : '') + '" onclick="payTabSet(\'' + k + '\')">' + PAY_DOCS[k][0] + '</button>').join('') + '</div>' +
      '<div class="pay-doc"><pre>' + d[2]() + '</pre></div>' +
      '<div style="display:flex;gap:10px;margin-top:12px;align-items:center"><span style="font-size:12.5px;color:var(--muted-foreground)">' + d[0] + ' \u00B7 ' + d[1]() + ' \u00B7 PDF</span>' +
      '<button class="btn btn-sm" style="margin-left:auto;display:inline-flex;align-items:center;gap:7px" onclick="payDownload(false)"><svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>Download PDF</button>' +
      '<button class="btn btn-sm" style="display:inline-flex;align-items:center;gap:7px" onclick="payDownload(true)"><svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>Download all (3)</button></div>' +
      '</div>' +
      '<div class="val-foot"><span style="font-size:13px;color:var(--muted-foreground);margin-right:auto">' + money(grand()) + ' \u00B7 Invoice #' + invN() + '</span><button class="btn" onclick="document.getElementById(\'pay-ov\').classList.remove(\'open\')">Cancel</button><button class="btn btn-primary" onclick="confirmPayment()">Confirm Payment</button></div></div>';
  }
  function confirmPayment() {
    document.getElementById('pay-ov').classList.remove('open');
    O.prog = { done: 7, active: 7, dates: (O.prog.dates || []).slice(0, 6).concat(['Aug 28']) };
    O.activity.unshift({ t: 'Payment confirmed by Alicia Grant', sub: money(grand()) + ' sent for Invoice #' + invN(), when: 'Just now', hi: true });
    renderPage();
    showToast('Payment confirmed', money(grand()) + ' \u2014 the vendor captures the payment and closes out the order');
  }
  function openDispute() {
    let ov = document.getElementById('dispute-ov');
    if (!ov) { ov = document.createElement('div'); ov.id = 'dispute-ov'; ov.className = 'overlay center'; ov.style.zIndex = '500'; document.body.appendChild(ov); ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); }); }
    ov.innerHTML = '<div class="val-modal" style="width:520px"><div class="val-head"><h2>Dispute this invoice?</h2><p>The vendor will be asked to correct and resubmit the invoice. The order will not be changed, and invoice validation will stay blocked until the replacement is reviewed.</p></div>' +
      '<div class="val-body" style="padding:14px 22px"><label style="display:block;font-size:12.5px;font-weight:600;margin-bottom:6px">What should the vendor correct? <span style="font-weight:400;color:var(--muted-foreground)">(optional \u2014 sent with the dispute)</span></label><textarea id="dispute-note" class="claim-note" style="margin-top:0" placeholder="e.g. The invoice still bills the canceled LEVOLOR shade \u2014 1 unit should come off."></textarea></div>' +
      '<div class="val-foot"><button class="btn" onclick="document.getElementById(\'dispute-ov\').classList.remove(\'open\')">Cancel</button><button class="btn btn-danger" onclick="confirmDispute()">Dispute and request correction</button></div></div>';
    ov.classList.add('open');
  }
  function confirmDispute() {
    document.getElementById('dispute-ov').classList.remove('open');
    closeInvTk();
    O.docs = O.docs.filter(d => d[0].indexOf('Invoice') !== 0);
    O.invDisputed = true;
    O.prog = { done: 4, active: 4, dates: (O.prog.dates || []).slice(0, 4) };
    const dnEl = document.getElementById('dispute-note');
    const dn = dnEl ? dnEl.value.trim() : '';
    if (dn) O.disputeNote = dn;
    O.activity.unshift({ t: 'Invoice disputed by Alicia Grant', sub: '#' + invN() + ' · vendor asked to correct and resubmit' + (dn ? ' — \u201C' + dn + '\u201D' : ''), when: 'Just now', hi: true });
    renderPage();
    showToast('Invoice disputed', '#' + invN() + ' sent back to the vendor · validation stays blocked until the replacement is reviewed');
  }
  function validateInvoice() {
    if (O.invBilledWrong) O.invAccepted = billedAmounts();
    const a = O.invAccepted || invAmounts();
    closeInvTk();
    O.prog = { done: 6, active: 6, dates: (O.prog.dates || []).slice(0, 5).concat(['Aug 28']) };
    O.activity.unshift({ t: 'Invoice validated by Alicia Grant', sub: '#' + invN() + ' · ' + money(a.grand) + ' on the books' + (O.invAccepted ? ' · ' + money(invVar()) + ' variance accepted' : ''), when: 'Just now', hi: true });
    renderPage();
    showToast('Invoice validated', '#' + invN() + ' · ' + money(a.grand) + ' \u2014 payment processing begins');
  }
  function copyNum() { try { navigator.clipboard.writeText('Order #' + num); } catch (e) {} showToast('Copied', 'Order #' + num + ' copied to the clipboard'); }

  let toastTimer;
  function showToast(title, desc) { let el = document.getElementById('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.style.cssText = 'position:fixed;bottom:24px;left:24px;z-index:300;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:14px 18px;max-width:360px;font-size:13px;transition:opacity .2s'; document.body.appendChild(el); } el.innerHTML = '<b style="display:block;font-size:14px">' + title + '</b><span style="color:var(--muted-foreground)">' + desc + '</span>'; el.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.opacity = 0, 3000); }

  renderPage();
  if (autoValidate) setTimeout(openValidation, 150);
  if (autoInvoice) setTimeout(openInvReview, 150);
</script>
</body>
</html>
