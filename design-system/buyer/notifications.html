<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — Scout Buyer</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="buyer.css">
<script src="cart.js"></script>
<script src="spo-data.js"></script>
</head>
<body class="buyer">

<!-- ===== App Bar ===== -->
<div class="app-bar-wrap">
  <nav class="app-bar" id="app-bar"></nav>
  <script src="appbar.js"></script>
</div>






<section class="hero page-hero">
  <div class="hero-bg"></div>
  <div class="hero-inner" style="flex-direction:column;gap:0">
    <div class="hero-title-block">
      <div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></div>
      <div><h1>Notifications</h1><p id="nt-sub">Loading…</p></div>
    </div>
  </div>
</section>

<main class="page">
  <div class="kpi-grid nt-kpis" id="stat-cards"></div>
  <div class="nt-toolbar" id="nt-toolbar"></div>
  <div id="nt-settings"></div>
  <div id="nt-zone"></div>
</main>

<script>
  /* ---------- Theme ---------- */
  function applyTheme() {
    const dark = localStorage.getItem('scout-theme') === 'dark';
    document.body.classList.toggle('dark', dark);
    const b = document.getElementById('theme-btn');
    b.querySelector('.icon-sun').style.display = dark ? 'none' : '';
    b.querySelector('.icon-moon').style.display = dark ? '' : 'none';
  }
  function toggleTheme() { localStorage.setItem('scout-theme', document.body.classList.contains('dark') ? 'light' : 'dark'); applyTheme(); }
  applyTheme();

  /* ---------- Menus ---------- */
  function closeMenus() {
    document.querySelectorAll('.menu-panel').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.nav-chip').forEach(c => c.classList.remove('open'));
  }
  function toggleMenu(id) {
    const panel = document.getElementById('menu-' + id), chip = document.getElementById('nav-' + id);
    const wasOpen = panel.classList.contains('open');
    closeMenus(); document.getElementById('ctx-switch').classList.remove('open');
    if (!wasOpen) { panel.classList.add('open'); chip.classList.add('open'); }
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-anchor')) closeMenus();
    if (!e.target.closest('.ctx-switch')) document.getElementById('ctx-switch').classList.remove('open');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); document.getElementById('ctx-switch').classList.remove('open'); } });

  /* ---------- Context switcher ---------- */
  const PROPERTIES = [
    { id: 'all', name: 'All properties', desc: 'Combined dashboard for every accessible property', units: null },
    { id: 'magnolia', name: 'Magnolia Place Apartments', addr: '4201 Veterans Memorial Blvd', city: 'Metairie, LA 70006', units: 51 },
    { id: 'bayou', name: 'Bayou Crossing Apartments', addr: '3850 Airline Dr', city: 'Baton Rouge, LA 70805', units: 120 },
    { id: 'lonestar', name: 'Lone Star Flats', addr: '7200 Westheimer Rd', city: 'Houston, TX 77057', units: 78 },
    { id: 'central', name: 'Central Park View', addr: '1501 Canal St', city: 'New Orleans, LA 70112', units: 96 },
    { id: 'cypress', name: 'Cypress Lake Apartments', addr: '9100 Cypress Lake Dr', city: 'Lafayette, LA 70508', units: 64 },
    { id: 'beauchene', name: 'Beau Chene Villas', addr: '225 Beau Chene Blvd', city: 'Mandeville, LA 70471', units: 40 },
    { id: 'sherwood', name: 'Sherwood Acres', addr: '1250 Sherwood Forest Blvd', city: 'Baton Rouge, LA 70815', units: 88 },
    { id: 'cyprus', name: 'Cyprus Glenn', addr: '4800 Cyprus Glenn Way', city: 'Shreveport, LA 71105', units: 32 },
    { id: 'heights', name: 'Magnolia Heights Apartments', addr: '6301 Magnolia Heights Rd', city: 'Houston, TX 77004', units: 110 }
  ];
  let currentProp = 'all';
  const bIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>';
  const pinIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
  function renderCtxList() {
    document.getElementById('ctx-list').innerHTML = PROPERTIES.map(p => {
      const active = p.id === currentProp;
      const body = p.id === 'all'
        ? '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.desc + '</span>'
        : '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.addr + '</span><span class="opt-city">' + pinIcon + p.city + '</span>';
      const units = p.units ? '<span class="units-badge"><b>' + p.units + '</b><span>units</span></span>' : '';
      return '<button class="ctx-option' + (active ? ' active' : '') + '" onclick="selectProp(\'' + p.id + '\')"><span class="opt-tile">' + bIcon + '</span><span class="opt-body">' + body + '</span>' + units + '</button>';
    }).join('');
  }
  function selectProp(id) {
    currentProp = id;
    const p = PROPERTIES.find(x => x.id === id);
    document.getElementById('echo-name').textContent = p.name;
    document.getElementById('echo-name').title = p.id === 'all' ? '9 accessible properties' : p.units + ' units · ' + p.city;
    renderCtxList();
    document.getElementById('ctx-switch').classList.remove('open');
    page = 1; renderPage();
  }
  function toggleCtx() {
    const el = document.getElementById('ctx-switch');
    const wasOpen = el.classList.contains('open');
    closeMenus();
    if (!wasOpen) el.classList.add('open');
  }
  renderCtxList();

  let ntTab = 'action', typeF = 'all', unreadOnly = false, page = 1;
  function renderPage() {
    if (!window.NOTIF) { setTimeout(renderPage, 60); return; }
    const settings = location.hash === '#settings';
    const list = NOTIF.scoped(NOTIF.all(), currentProp), act = list.filter(n => n.isAction), unread = act.filter(n => !n.read).length;
    document.getElementById('nt-sub').textContent = (unread ? unread + ' action item' + (unread === 1 ? '' : 's') + ' unread' : 'Nothing unread needs you') + ' · ' + (currentProp === 'all' ? 'all properties' : PROPERTIES.find(p => p.id === currentProp).name);
    const card = (k, cls, title, n, desc) => '<div class="stat-card-colored ' + cls + (ntTab === k ? ' active' : '') + '" onclick="ntTab = \'' + k + '\'; renderPage()"><span class="stat-card-title">' + title + '</span><div class="stat-card-count">' + n + '</div><div class="stat-card-desc">' + desc + '</div></div>';
    document.getElementById('stat-cards').innerHTML =
      card('action', 'stat-amber', 'Needs Action', act.length, 'Open tasks · clear when done') +
      card('unread', 'stat-sky', 'Unread', list.filter(n => !n.read).length, 'Across all types') +
      card('all', 'stat-gray', 'All Notifications', list.length, 'Everything in your feed');
    let shown = ntTab === 'action' ? act : ntTab === 'unread' ? list.filter(n => !n.read) : list;
    if (typeF !== 'all') shown = shown.filter(n => n.type === typeF);
    if (unreadOnly) shown = shown.filter(n => !n.read);
    const seg = '<div class="mode-seg">' + [['all', 'All types']].concat(Object.keys(NOTIF.TYPES).map(k => [k, NOTIF.TYPES[k].label])).map(([k, l]) => '<button class="' + (typeF === k ? 'active' : '') + '" onclick="typeF = \'' + k + '\'; renderPage()"><span>' + l + '</span></button>').join('') + '</div>';
    document.getElementById('nt-toolbar').innerHTML = seg +
      '<label class="nt-toggle"><input type="checkbox"' + (unreadOnly ? ' checked' : '') + ' onchange="unreadOnly = this.checked; renderPage()"> Unread only</label>' +
      '<button class="btn btn-sm" style="margin-left:auto" onclick="NOTIF.markRead(NOTIF.ids())">Mark all read</button>' +
      '<button class="btn btn-sm" style="display:inline-flex;align-items:center;gap:6px" onclick="location.hash = location.hash === \'#settings\' ? \'\' : \'#settings\'"><span style="display:inline-flex;width:14px;height:14px">' + NOTIF.ICON.gear + '</span>Settings</button>';
    document.getElementById('nt-settings').innerHTML = settings ? settingsHtml() : '';
    document.getElementById('nt-zone').innerHTML = '<div class="card"><div class="nt-pagelist">' + NOTIF.listHtml(shown, { page: true, empty: ntTab === 'action' ? 'Nothing needs you right now. Action items clear themselves when the task is done.' : 'No notifications match these filters.' }) + '</div></div>';
  }
  function settingsHtml() {
    const prefs = NOTIF.loadPrefs();
    return '<div class="card nt-settings"><div class="det-card-head hd"><div><h2>Notification settings</h2><div class="sub">Choose what shows in your feed and counts toward the bell</div></div></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">' + Object.keys(NOTIF.TYPES).map(k => '<label class="opt-row" style="cursor:pointer"><span class="opt-ic">' + NOTIF.ICON[k] + '</span><span class="opt-body"><span class="opt-name">' + NOTIF.TYPES[k].label + '</span><span class="opt-desc">' + ({ spo: 'Vendor accepted or rejected, cancellations', invoice: 'Invoices to map or validate, payments', approval: 'Requests waiting on you and decisions', schedule: 'Runs drafted or sent, series approvals', order: 'Orders confirmed and delivered' })[k] + '</span></span><span class="switch-wrap"><input type="checkbox"' + (prefs[k] === false ? '' : ' checked') + ' onchange="setPref(\'' + k + '\', this.checked)"> In-app</span></label>').join('') + '</div>' +
      '<div class="opt-row" style="margin-top:8px;opacity:.7"><span class="opt-ic">@</span><span class="opt-body"><span class="opt-name">Email</span><span class="opt-desc">Daily digest of action items — coming soon</span></span><span class="nt-tag">Coming soon</span></div>' +
      '<div class="w-note" style="margin-top:10px"><span>Turning a type off hides it from the feed and the bell count. Action items still appear on their pages.</span></div></div>';
  }
  function setPref(k, on) { const p = NOTIF.loadPrefs(); p[k] = on; NOTIF.savePrefs(p); NOTIF.changed(); }
  document.addEventListener('notif-change', renderPage);
  window.addEventListener('hashchange', renderPage);
  renderPage();
</script>
</body>
</html>
