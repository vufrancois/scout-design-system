<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedules — Scout Buyer</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="buyer.css">
<script src="cart.js"></script>
<script src="spo-data.js"></script>
</head>
<body class="buyer">

<!-- ===== App Bar ===== -->
<div class="app-bar-wrap">
  <nav class="app-bar" id="app-bar"></nav>
  <script src="appbar.js"></script>
</div>






<section class="hero page-hero">
  <div class="hero-bg"></div>
  <div class="hero-inner" style="flex-direction:column;gap:0">
    <div class="hero-title-block">
      <div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></div>
      <div><h1>Schedules</h1><p>Recurring service POs — each run creates an ordinary SPO you track in Service POs</p></div>
    </div>
  </div>
</section>

<main class="page">
  <div class="kpi-grid" id="stat-cards"></div>
  <div class="tab-row">
    <div class="tab-bar" id="tab-bar"></div>
    <a class="btn btn-primary" href="spo-new.html#recurring" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none"><svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New Schedule</a>
  </div>
  <div class="toolbar" style="margin-top:16px">
    <div class="toolbar-group"><span style="font-size:13px;color:var(--muted-foreground)" id="sch-note"></span></div>
    <div class="toolbar-group">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="search-field" id="sch-search" placeholder="Search schedule, vendor, property…" oninput="renderPage()">
      </div>
    </div>
  </div>
  <div id="tbl-zone"></div>
</main>

<script>
  /* ---------- Theme ---------- */
  function applyTheme() {
    const dark = localStorage.getItem('scout-theme') === 'dark';
    document.body.classList.toggle('dark', dark);
    const b = document.getElementById('theme-btn');
    b.querySelector('.icon-sun').style.display = dark ? 'none' : '';
    b.querySelector('.icon-moon').style.display = dark ? '' : 'none';
  }
  function toggleTheme() { localStorage.setItem('scout-theme', document.body.classList.contains('dark') ? 'light' : 'dark'); applyTheme(); }
  applyTheme();

  /* ---------- Menus ---------- */
  function closeMenus() {
    document.querySelectorAll('.menu-panel').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.nav-chip').forEach(c => c.classList.remove('open'));
  }
  function toggleMenu(id) {
    const panel = document.getElementById('menu-' + id), chip = document.getElementById('nav-' + id);
    const wasOpen = panel.classList.contains('open');
    closeMenus(); document.getElementById('ctx-switch').classList.remove('open');
    if (!wasOpen) { panel.classList.add('open'); chip.classList.add('open'); }
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-anchor')) closeMenus();
    if (!e.target.closest('.ctx-switch')) document.getElementById('ctx-switch').classList.remove('open');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); document.getElementById('ctx-switch').classList.remove('open'); } });

  /* ---------- Context switcher ---------- */
  const PROPERTIES = [
    { id: 'all', name: 'All properties', desc: 'Combined dashboard for every accessible property', units: null },
    { id: 'magnolia', name: 'Magnolia Place Apartments', addr: '4201 Veterans Memorial Blvd', city: 'Metairie, LA 70006', units: 51 },
    { id: 'bayou', name: 'Bayou Crossing Apartments', addr: '3850 Airline Dr', city: 'Baton Rouge, LA 70805', units: 120 },
    { id: 'lonestar', name: 'Lone Star Flats', addr: '7200 Westheimer Rd', city: 'Houston, TX 77057', units: 78 },
    { id: 'central', name: 'Central Park View', addr: '1501 Canal St', city: 'New Orleans, LA 70112', units: 96 },
    { id: 'cypress', name: 'Cypress Lake Apartments', addr: '9100 Cypress Lake Dr', city: 'Lafayette, LA 70508', units: 64 },
    { id: 'beauchene', name: 'Beau Chene Villas', addr: '225 Beau Chene Blvd', city: 'Mandeville, LA 70471', units: 40 },
    { id: 'sherwood', name: 'Sherwood Acres', addr: '1250 Sherwood Forest Blvd', city: 'Baton Rouge, LA 70815', units: 88 },
    { id: 'cyprus', name: 'Cyprus Glenn', addr: '4800 Cyprus Glenn Way', city: 'Shreveport, LA 71105', units: 32 },
    { id: 'heights', name: 'Magnolia Heights Apartments', addr: '6301 Magnolia Heights Rd', city: 'Houston, TX 77004', units: 110 }
  ];
  let currentProp = 'all';
  const bIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>';
  const pinIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
  function renderCtxList() {
    document.getElementById('ctx-list').innerHTML = PROPERTIES.map(p => {
      const active = p.id === currentProp;
      const body = p.id === 'all'
        ? '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.desc + '</span>'
        : '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.addr + '</span><span class="opt-city">' + pinIcon + p.city + '</span>';
      const units = p.units ? '<span class="units-badge"><b>' + p.units + '</b><span>units</span></span>' : '';
      return '<button class="ctx-option' + (active ? ' active' : '') + '" onclick="selectProp(\'' + p.id + '\')"><span class="opt-tile">' + bIcon + '</span><span class="opt-body">' + body + '</span>' + units + '</button>';
    }).join('');
  }
  function selectProp(id) {
    currentProp = id;
    const p = PROPERTIES.find(x => x.id === id);
    document.getElementById('echo-name').textContent = p.name;
    document.getElementById('echo-name').title = p.id === 'all' ? '9 accessible properties' : p.units + ' units · ' + p.city;
    renderCtxList();
    document.getElementById('ctx-switch').classList.remove('open');
    page = 1; renderPage();
  }
  function toggleCtx() {
    const el = document.getElementById('ctx-switch');
    const wasOpen = el.classList.contains('open');
    closeMenus();
    if (!wasOpen) el.classList.add('open');
  }
  renderCtxList();

  const money = SPO.money, fmtD = SPO.fmtDate;
  const SV = '<svg class="stat-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  const IC = {
    rep: SV + '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
    play: SV + '<circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>',
    pen: SV + '<path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg>',
    pause: SV + '<circle cx="12" cy="12" r="10"/><line x1="10" x2="10" y1="15" y2="9"/><line x1="14" x2="14" y1="15" y2="9"/></svg>',
    archive: SV + '<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>',
    check: SV + '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>',
    ban: SV + '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg>'
  };
  const TABS = [
    { id: 'running', label: 'Running', icon: IC.rep, states: ['approval', 'revision', 'active', 'paused'] },
    { id: 'ended', label: 'Ended', icon: IC.archive, states: ['ended'] }
  ];
  let cardFilter = 'all', page = 1, sortK = 'next', sortDir = 1;
  const openRows = new Set();
  const tab = () => { const t = (location.hash || '#running').replace('#', ''); return TABS.some(x => x.id === t) ? t : 'running'; };
  window.addEventListener('hashchange', () => { cardFilter = 'all'; openRows.clear(); renderPage(); window.scrollTo(0, 0); });
  const propName = id => (PROPERTIES.find(x => x.id === id) || {}).name || id;

  function scoped(states) {
    const q = (document.getElementById('sch-search').value || '').trim().toLowerCase();
    return SCH.list().filter(x => states.indexOf(x.status) >= 0 && (currentProp === 'all' || x.prop === currentProp) &&
      (!q || (x.id + ' ' + x.name + ' ' + SPO.VEN[x.v].name + ' ' + propName(x.prop) + ' ' + x.scope).toLowerCase().includes(q)));
  }
  const groupOf = x => x.status === 'approval' || x.status === 'revision' ? 'you' : x.status === 'ended' ? (x.endInfo && x.endInfo.by === 'Scout' ? 'completed' : 'stopped') : x.status;

  function statCards(t, rows) {
    const card = (key, cls, icon, title, n, desc) => '<div class="stat-card-colored ' + cls + (cardFilter === key ? ' active' : '') + '" onclick="setCard(\'' + key + '\')"><span class="stat-card-title">' + icon + title + '</span><div class="stat-card-count">' + n + '</div><div class="stat-card-desc">' + desc + '</div></div>';
    const g = k => rows.filter(x => groupOf(x) === k).length;
    document.getElementById('stat-cards').innerHTML = t === 'running'
      ? card('all', 'stat-gray', IC.rep, 'Total Running', rows.length, 'Not ended') +
        card('active', 'stat-emerald', IC.play, 'Active', g('active'), 'Generating SPOs on schedule') +
        card('you', 'stat-amber', IC.pen, 'Your Move', g('you'), 'Approve or revise the series') +
        card('paused', 'stat-sky', IC.pause, 'Paused', g('paused'), 'On hold · no SPOs generated')
      : card('all', 'stat-gray', IC.archive, 'Total Ended', rows.length, 'No further runs') +
        card('completed', 'stat-emerald', IC.check, 'Completed', g('completed'), 'Ran to its end rule') +
        card('stopped', 'stat-rose', IC.ban, 'Stopped Early', g('stopped'), 'Ended by a person');
  }
  function setCard(k) { cardFilter = cardFilter === k && k !== 'all' ? 'all' : k; renderPage(); }

  const pill = x => { const st = SCH.STATES[x.status]; return '<span class="status-dot-item"><span class="status-dot ' + st.dot + '"></span><span class="status-dot-label">' + st.label + '</span></span>'; };
  const ACTION = {
    approval: x => ['Review', 'approval.html#' + x.id],
    revision: x => ['Edit', 'spo-new.html#edit-' + x.id]
  };
  function setSort(k) { if (sortK === k) sortDir = -sortDir; else { sortK = k; sortDir = k === 'next' || k === 'name' || k === 'vendor' ? 1 : -1; } renderPage(); }
  const sortIc = k => sortK !== k ? '<svg class="sort-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>'
    : '<svg class="sort-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (sortDir > 0 ? '<path d="m7 9 5-5 5 5"/>' : '<path d="m7 15 5 5 5-5"/>') + '</svg>';
  const th = (k, label) => '<th class="sortable' + (sortK === k ? ' sorted' : '') + '" onclick="setSort(\'' + k + '\')">' + label + sortIc(k) + '</th>';
  const nextOf = x => x.status === 'ended' ? (x.ev.ended || '').slice(0, 10) : SCH.nextRun(x) || '9999';

  function renderPage() {
    const t = tab(), T = TABS.find(x => x.id === t);
    document.getElementById('tab-bar').innerHTML = TABS.map(tb => '<button class="tab-item' + (tb.id === t ? ' active' : '') + '" onclick="location.hash=\'#' + tb.id + '\'">' + tb.icon.replace('stat-card-icon', '') + tb.label + '<span class="tab-count">' + scoped(tb.states).length + '</span></button>').join('');
    const rows = scoped(T.states);
    statCards(t, rows);
    const act = scoped(['active']);
    document.getElementById('sch-note').innerHTML = t === 'running' ? act.length + ' active · <b style="color:var(--foreground)">' + money(act.reduce((a, x) => a + SCH.annual(x), 0)) + '</b> committed over the next 12 months' : 'Ended schedules keep their history and the SPOs they generated';
    let list = cardFilter === 'all' ? rows : rows.filter(x => groupOf(x) === cardFilter);
    const val = x => sortK === 'name' ? x.name : sortK === 'vendor' ? SPO.VEN[x.v].name : sortK === 'run' ? SCH.perRun(x) : sortK === 'status' ? SCH.STATES[x.status].rank : nextOf(x);
    list = list.slice().sort((a, b) => { const va = val(a), vb = val(b); const d = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb)); return d * sortDir; });

    const cols = th('name', 'Schedule') + th('vendor', 'Vendor') + '<th>Cadence</th>' + th('next', t === 'ended' ? 'Ended' : 'Next run') + th('run', 'Per run') + th('status', 'Status');
    const body = list.map(x => {
      const v = SPO.VEN[x.v], isOpen = openRows.has(x.id), a = ACTION[x.status];
      const nx = x.status === 'ended' ? fmtD(x.ev.ended) : x.status === 'paused' ? '<span style="color:var(--muted-foreground)">Paused</span>' : SCH.nextRun(x) ? fmtD(SCH.nextRun(x)) : '—';
      const action = a ? '<a class="btn btn-primary btn-sm" style="text-decoration:none;white-space:nowrap" href="' + a(x)[1] + '">' + a(x)[0] + '</a>' : rowMenu(x);
      const main = '<tr class="data-row"><td><button class="expander' + (isOpen ? ' open' : '') + '" onclick="toggleRow(\'' + x.id + '\')" title="Runs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></td>' +
        '<td><a class="table-link" style="font-weight:700" href="schedule.html#' + x.id + '">' + x.name + '</a><div style="font-size:12px;color:var(--muted-foreground);margin-top:2px;max-width:220px;overflow:hidden;text-overflow:ellipsis" title="' + propName(x.prop) + '">' + x.id + ' · ' + propName(x.prop) + '</div></td>' +
        '<td><span class="cell-entity"><span class="v-avatar" style="width:28px;height:28px;border-radius:7px;font-size:10px">' + x.v + '</span><span class="nm" title="' + v.name + '">' + v.name + '</span></span></td>' +
        '<td style="white-space:nowrap">' + SCH.cadenceShort(x.cadence) + '<div style="font-size:12px;color:var(--muted-foreground);margin-top:2px">' + (x.mode === 'auto' ? 'Auto-send' : 'Draft only') + ' · ' + SCH.fmtTime(x.cadence.time) + '</div></td>' +
        '<td style="white-space:nowrap">' + nx + '</td>' +
        '<td class="num" style="font-weight:600">' + money(SCH.perRun(x)) + '</td>' +
        '<td>' + pill(x) + '</td><td>' + action + '</td></tr>';
      return main + (isOpen ? expRow(x) : '');
    }).join('');
    document.getElementById('tbl-zone').innerHTML = '<div class="tbl-wrap" style="margin-top:4px"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th style="width:36px"></th>' + cols + '<th style="width:1%"></th></tr></thead><tbody>' +
      (body || '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--muted-foreground)">' + (t === 'running' ? 'No running schedules here. Make any SPO recurring from its page, or start a New Schedule.' : 'No ended schedules for this property.') + '</td></tr>') + '</tbody></table></div></div>';
  }

  function expRow(x) {
    const up = x.status === 'active' || x.status === 'approval' || x.status === 'revision' ? SCH.upcoming(x, 3, true) : [];
    const inst = SCH.instances(x.id).slice(0, 3);
    const upHtml = up.length ? up.map(r => '<div class="run-row' + (r.skipped ? ' skipped' : '') + '"><span class="rd"><b>' + r.date.slice(8) + '</b><span>' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+r.date.slice(5, 7) - 1] + '</span></span><div class="rb"><div>' + fmtD(r.date) + '</div><div class="m">' + (r.skipped ? 'Skipped' : x.mode === 'auto' ? 'PO sent automatically' : 'Drafted for you to send') + '</div></div></div>').join('')
      : '<div class="run-more" style="border:none;padding:0">' + (x.status === 'paused' ? 'Paused — no runs until it’s resumed.' : 'No further runs.') + '</div>';
    const instHtml = inst.length ? inst.map(s => { const st = SPO.STATES[s.state]; return '<div class="run-row"><span class="rd"><b>' + s.run.slice(8) + '</b><span>' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+s.run.slice(5, 7) - 1] + '</span></span><div class="rb"><div><a class="table-link" href="spo.html#' + s.id + '">SPO-' + s.id + '</a></div><div class="m">' + money(SPO.total(s)) + '</div></div><span class="status-dot-item"><span class="status-dot ' + st.dot + '"></span><span class="status-dot-label">' + st.label + '</span></span></div>'; }).join('')
      : '<div class="run-more" style="border:none;padding:0">' + (x.prior ? x.prior + ' earlier SPOs (before this demo window)' : 'None yet — the first run creates the first SPO.') + '</div>';
    return '<tr class="items-block"><td colspan="8"><div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:0 20px">' +
      '<div><div class="items-label" style="padding:0">Upcoming runs</div>' + upHtml + '</div><div><div class="items-label" style="padding:0">Recent SPOs</div>' + instHtml + '</div></div></td></tr>';
  }
  function toggleRow(id) { if (openRows.has(id)) openRows.delete(id); else openRows.add(id); renderPage(); }

  function rowMenu(x) {
    return '<div class="row-menu-wrap"><button class="icon-btn" style="width:32px;height:32px" onclick="toggleMenuRow(event, \'' + x.id + '\')" title="More actions"><svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>' +
      '<div class="row-menu" id="rm-' + x.id + '" style="display:none"><button onclick="location.href=\'schedule.html#' + x.id + '\'">' + IC.eye + 'View schedule</button>' +
      (x.status !== 'ended' ? '<button onclick="location.href=\'spo-new.html#edit-' + x.id + '\'">' + IC.edit + 'Edit schedule</button>' : '') + '</div></div>';
  }
  function toggleMenuRow(e, id) {
    e.stopPropagation();
    const m = document.getElementById('rm-' + id), open = m.style.display === 'block';
    document.querySelectorAll('.row-menu').forEach(x => x.style.display = 'none');
    m.style.display = open ? 'none' : 'block';
  }
  document.addEventListener('click', e => { if (!e.target.isConnected) return; if (!e.target.closest('.row-menu-wrap')) document.querySelectorAll('.row-menu').forEach(x => x.style.display = 'none'); });
  renderPage();
</script>
</body>
</html>
