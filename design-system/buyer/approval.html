  /* Service POs that needed approval come from the shared SPO store, so the queue and the SPO always agree. */
  function spoReq(s) {
    const over = SPO.glOver(s), lim = SPO.total(s) > SPO.APPROVAL_LIMIT;
    const items = s.lines.map(l => item(l.desc, l.alloc.map(a => a.gl + ' ' + SPO.glName(a.gl) + ' \u00B7 ' + SPO.unitLabel(a.unit)).join(' + '), l.qty, l.price));

    const status = s.state === 'approval' ? 'pending' : s.ev.approved ? 'approved' : s.state === 'canceled' ? 'rejected' : 'revision';
    const hist = [{ t: 'Submitted for approval', actor: 'Buyer', rev: 0, amt: SPO.total(s), when: SPO.fmtDT(s.ev.approvalReq), items: snap }];
    if (s.ev.approved) hist.push({ t: 'Approved', actor: 'Supervisor', rev: 0, amt: SPO.total(s), when: SPO.fmtDT(s.ev.approved), items: snap });
    return { spo: s.id, v: s.v, buyer: s.by, prop: s.prop, status, level: 'Supervisor', date: SPO.fmtDate(s.ev.approvalReq), items, shipping: null,

      comment: s.cancel ? s.cancel.reason : null, history: hist };
  }
  SPO.list().filter(s => s.ev.approvalReq).forEach(s => { REQS['SPO-' + s.id] = spoReq(s); });
  /* A recurring schedule is approved once for the series: the request is its 12-month commitment. */
  function schReq(x) {
    const n = x.approvedRuns || SCH.yearRuns(x) || 1;
    const items = x.lines.map(l => item(l.desc + ' · ' + n + ' runs', l.alloc.map(a => a.gl + ' ' + SPO.glName(a.gl) + ' \u00B7 ' + SPO.unitLabel(a.unit)).join(' + '), l.qty * n, l.price));

    box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>',
    store: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M2 7h20"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>'
  };

  function statusPill(st) { const p = STATUS[st]; return '<span class="status-dot-item"><span class="status-dot ' + p[0] + '"></span><span class="status-dot-label">' + p[1] + '</span></span>'; }

  function stepper(st) {
    const d = R.stepDates || [];
    let steps;
    if (st === 'approved') steps = [
      { l: 'Requested', s: 'done', i: IC.check, dt: d[0] || R.date },
      { l: 'Under Review', s: 'done', i: IC.check, dt: d[1] || R.date },
      { l: 'Approved', s: 'done', i: IC.check, dt: d[2] || R.date },
      { l: R.spo ? 'Sent to Vendor' : R.sch ? 'Schedule Active' : 'Order Created', s: 'done', i: IC.check, dt: d[3] || R.date }];
    else if (st === 'rejected') steps = [
      { l: 'Requested', s: 'done', i: IC.check, dt: R.date },
      { l: 'Under Review', s: 'done', i: IC.check, dt: R.date },
      { l: 'Rejected', s: 'rejected', i: IC.cross, dt: R.date },
      { l: R.spo ? 'Sent to Vendor' : R.sch ? 'Schedule Active' : 'Order Created', s: 'future', i: IC.cart }];
    else if (st === 'revision') steps = [
      { l: 'Requested', s: 'done', i: IC.check, dt: R.date },
      { l: 'Buyer revision', s: 'active sky', i: IC.refresh },
      { l: 'Approved', s: 'future', i: IC.thumb },
      { l: R.spo ? 'Sent to Vendor' : R.sch ? 'Schedule Active' : 'Order Created', s: 'future', i: IC.cart }];
    else steps = [
      { l: 'Requested', s: 'done', i: IC.check, dt: R.date },
      { l: 'Under Review', s: 'active', i: IC.eye, dt: 'your move' },
      { l: 'Approved', s: 'future', i: IC.thumb },
      { l: R.spo ? 'Sent to Vendor' : R.sch ? 'Schedule Active' : 'Order Created', s: 'future', i: IC.cart }];
    return '<div class="ap-stepper">' + steps.map((sp, i) => {
      const conn = i < steps.length - 1
        ? '<div class="ap-conn' + (steps[i + 1].s === 'rejected' || sp.s === 'rejected' && false ? ' rose' : (sp.s === 'done' && steps[i + 1].s.startsWith('done')) ? ' done' : sp.s === 'done' && steps[i + 1].s !== 'future' ? ' done' : '') + '"></div>' : '';
      return '<div class="ap-step ' + sp.s + '"><div class="ap-dot">' + sp.i + '</div><div class="ap-label">' + sp.l + '</div>' + (sp.dt ? '<div class="ap-date">' + sp.dt + '</div>' : '') + '</div>' + conn;
    }).join('') + '</div>';
  }

  function itemLine(i) {
    const nm = i.unavailable
      ? '<span class="strike">' + i.name + '</span> <span class="avail-pill">No longer available</span>'
      : i.name;
    const meta = i.unavailable
      ? '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span style="font-weight:700">' + money(i.qty * i.price) + '</span><span class="item-meta-pill">Requested ' + i.qty + ' · Available Not tracked</span><span class="avail-pill">Unavailable</span></div>'
      : '<span class="qty">' + i.qty + ' × ' + money(i.price) + '</span><span class="line-total">' + money(i.qty * i.price) + '</span>';
    return '<div class="item-line"><span class="thumb">' + glyph + '</span><span class="item-nm">' + nm + '<span class="item-sku">Qty ' + i.qty + ' · ' + i.sku + '</span></span>' + meta + '</div>';
  }

  function renderPage() {
    document.getElementById('hero-sub').textContent = (R.spo ? 'Service PO ' : R.sch ? 'Schedule ' : '#') + curId + ' · ' + R.buyer + ' · ' + money(R.amount);
    const st = R.status;
    let main = '';

    main += '<div class="card"><div class="det-card-head"><h2>Approval Progress</h2>' + statusPill(st) + '</div>' + stepper(st) + '</div>';

    if (st === 'pending') {
      main += '<div class="card decision-card"><div class="det-card-head"><h2>Your decision</h2><span style="display:flex;gap:8px">' + (R.spo ? '<span class="pill p-neutral">Service PO</span>' : R.sch ? '<span class="pill p-neutral">Recurring schedule</span>' : '') + '<span class="pill p-neutral">' + R.level + ' approval</span></span></div>' +
        '<div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px">Comment to the buyer <span class="req-chip">Required for revision or rejection</span></div>' +
        '<textarea class="dec-comment" id="dec-comment" placeholder="Explain what should change, or why this is being rejected…" oninput="decGate()"></textarea>' +
        '<div class="decision-actions">' +
        '<button class="btn btn-primary" onclick="decide(\'approved\')">Approve</button>' +
        '<button class="btn btn-outline-sky" id="dec-rev" disabled data-tip="Add a comment first" onclick="decide(\'revision\')">Request revision</button>' +
        '<button class="btn btn-outline-rose" id="dec-rej" disabled data-tip="Add a comment first" onclick="decide(\'rejected\')">Reject</button>' +
        '<span id="dec-hint" style="font-size:12.5px;color:var(--muted-foreground);align-self:center">Approving needs no comment.</span>' +
        '</div></div>';
    }

    main += '<div class="card"><div class="det-card-head"><div><h2>' + (R.spo ? 'Service PO lines' : R.sch ? 'Schedule · next 12 months' : 'Order details') + '</h2>' + (R.spo ? '<div class="sub">GL code and unit for every dollar</div>' : R.sch ? '<div class="sub">Approving covers every run that matches these lines</div>' : '<div class="sub" id="inv-checked">Checked just now</div>') + '</div>' +
      (R.sch ? '<a class="btn" style="height:36px;font-size:13px;text-decoration:none;display:inline-flex;align-items:center" href="schedule.html#' + R.sch + '">View schedule</a>' : R.spo ? '<a class="btn" style="height:36px;font-size:13px;text-decoration:none;display:inline-flex;align-items:center" href="spo.html#' + R.spo + '">View SPO</a>' : '<button class="btn" style="height:36px;font-size:13px;display:inline-flex;align-items:center;gap:8px" onclick="refreshInv()"><svg style="width:15px;height:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>Refresh inventory</button>') + '</div>' +
      (R.legacy ? '<div class="callout violet" style="margin:10px 0"><b>' + IC.warn + 'Legacy approval · Recreate cart required</b>This approval was created before live inventory classification was added. Request a revision so the buyer can clear all items from the cart, add the same items again, and resubmit it for approval.</div>' : '') +
      (R.unavailable ? '<div class="callout rose" style="margin:10px 0"><b>A product in this request is no longer available</b>The vendor no longer lists the product(s) marked below, so this request can no longer be approved. Please reject it and ask the buyer to place a new order with available items.</div>' : '') +
      (() => { const vv = vends();
        if (vv.length === 1) return R.items.map(itemLine).join('');
        return vv.map(v => { const vi = R.items.filter(i => (i.v || R.v) === v);
          const vt = Math.round(vi.reduce((a, i) => a + i.qty * i.price, 0) * 100) / 100;
          return '<div style="display:flex;align-items:center;gap:10px;margin:14px 0 4px"><span class="v-avatar" style="width:28px;height:28px;border-radius:7px;font-size:10px">' + v + '</span><span style="font-size:13.5px;font-weight:700">' + VEN[v] + '</span><span style="margin-left:auto;font-size:12.5px;color:var(--muted-foreground)">' + vi.length + (vi.length === 1 ? ' item · ' : ' items · ') + money(vt) + '</span></div>' + vi.map(itemLine).join('');
        }).join(''); })() +
      (() => { const sub = Math.round(R.items.reduce((a, i) => a + i.qty * i.price, 0) * 100) / 100;
        if (R.spo) return '<div class="det-totals"><div class="tot-row grand"><span>SPO estimate</span><span>' + money(R.amount) + '</span></div></div>';
        if (R.sch) { const sx = SCH.get(R.sch); return '<div class="det-totals"><div class="tot-row"><span>' + SCH.cadenceText(sx.cadence) + ' · per run</span><span>' + money(SCH.perRun(sx)) + '</span></div><div class="tot-row"><span>Runs in the next 12 months</span><span>' + R.runs + '</span></div><div class="tot-row grand"><span>12-month commitment</span><span>' + money(R.amount) + '</span></div></div>'; }
        return '<div class="det-totals">' +
        '<div class="tot-row"><span>Items subtotal</span><span>' + money(sub) + '</span></div>' +
        '<div class="tot-row"><span>Shipping · ' + R.shipping[0] + '</span><span>' + money(R.shipping[1]) + '</span></div>' +
        '<div class="tot-row grand"><span>Request total</span><span>' + money(R.amount) + '</span></div></div>'; })() + '</div>';

    main += '<div class="card"><div class="det-card-head"><h2>Approval history</h2></div>' +
      '<p style="font-size:13px;color:var(--muted-foreground);margin-bottom:4px">Every request, response and decision is retained on this approval.</p>' +
      R.history.map((ev, i) => {
        const prev = R.history[i - 1];
        const changed = !prev || prev.amt !== ev.amt || JSON.stringify(prev.items) !== JSON.stringify(ev.items);
        return '<div class="tl-event"><div class="tl-head"><div><div class="tl-title">' + ev.t + '</div><div class="tl-actor">' + ev.actor + ' · Revision ' + ev.rev + '</div></div>' +
        '<div class="tl-right"><b>' + money(ev.amt) + '</b>' + ev.when + '</div></div>' +
        (ev.comment ? '<div class="tl-comment">' + ev.comment + '</div>' : '') +
        (changed ? ev.items.map(it => '<div class="tl-item"><span>' + it[0] + '</span><span>' + money(it[1]) + '</span></div>').join('') : '') +
        '</div>'; }).join('') + '</div>';


    let side = '';
    const vv = vends();
    side += '<div class="card">' + vv.map((v, i) => '<div class="ven-card"' + (i ? ' style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)"' : '') + '><span class="ven-logo">' + v + '</span><div><div class="ven-eyebrow">' + (vv.length > 1 ? 'Vendor ' + (i + 1) + ' of ' + vv.length : 'Vendor') + '</div><div class="ven-name"><a href="products.html" style="color:inherit;text-decoration:none">' + VEN[v] + '</a></div></div></div>').join('') +
      (vv.length > 1 ? '<p style="font-size:12.5px;color:var(--muted-foreground);margin:12px 0 0">One request covers the whole checkout &mdash; approving creates one order per vendor.</p>' : '') + '</div>';

    const prop = PROPERTIES.find(x => x.id === R.prop);
    side += '<div class="card"><dl class="fact-rows wide">' +
      '<dt>Reason</dt><dd>' + (R.reasonTxt || 'Amount threshold') + '</dd>' +
      '<dt>Property</dt><dd>' + prop.name + '</dd>' +
      '<dt>Approvers</dt><dd>' + R.eligible.map(e => '<span class="lvl-pill">' + e + '</span>').join('') + '</dd>' +
      (R.decidedBy ? '<dt>Decided by</dt><dd>' + R.decidedBy + '</dd>' : '') + '</dl>' +
      (R.status === 'revision' && R.comment ? '<div class="callout amber" style="margin-top:14px"><b>Note to buyer</b>' + R.comment + '</div>' : '') +
      (R.status === 'rejected' && R.comment ? '<div class="callout rose" style="margin-top:14px"><b>Rejection reason</b>' + R.comment + '</div>' : '') + '</div>';

    if (R.sch && R.status === 'approved') {
      const sx = SCH.get(R.sch);
      side += '<div class="card"><div class="det-card-head"><h2 style="display:inline-flex;align-items:center;gap:8px;font-size:16px"><span style="color:var(--emerald);display:inline-flex;width:18px;height:18px">' + IC.box + '</span>Schedule active</h2></div>' +
        '<p style="font-size:13px;color:var(--muted-foreground)">Approved once for the series. ' + (SCH.nextRun(sx) ? 'Next run ' + SPO.fmtDate(SCH.nextRun(sx)) + ' · ' : '') + (sx.mode === 'auto' ? 'POs are emailed automatically.' : 'Each run is drafted for the buyer to send.') + '</p>' +
        '<div class="order-row"><div class="onum">' + sx.id + '</div><a class="toolbar-btn" style="text-decoration:none" href="schedule.html#' + sx.id + '">View schedule</a></div></div>';
    } else if (R.spo && R.status === 'approved') {
      const sp = SPO.get(R.spo), v = SPO.VEN[sp.v];
      side += '<div class="card"><div class="det-card-head"><h2 style="display:inline-flex;align-items:center;gap:8px;font-size:16px"><span style="color:var(--emerald);display:inline-flex;width:18px;height:18px">' + IC.box + '</span>Sent to vendor</h2></div>' +
        '<p style="font-size:13px;color:var(--muted-foreground)">Approving emailed the PO to ' + v.email + '. ' + v.name + ' accepts or rejects it next.</p>' +
        '<div class="order-row"><div class="onum">SPO-' + sp.id + '</div><a class="toolbar-btn" style="text-decoration:none" href="spo.html#' + sp.id + '">View SPO <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></a></div></div>';
    } else if (R.status === 'approved' && (R.orders || R.order)) {
      const orders = R.orders || [Object.assign([R.order[0], R.order[1]], { v: R.v })];
      side += '<div class="card"><div class="det-card-head"><h2 style="display:inline-flex;align-items:center;gap:8px;font-size:16px"><span style="color:var(--emerald);display:inline-flex;width:18px;height:18px">' + IC.box + '</span>Orders placed</h2></div>' +
        '<p style="font-size:13px;color:var(--muted-foreground)">' + (orders.length > 1 ? 'One order per vendor, created when this request was approved.' : 'Created when this request was approved.') + '</p>' +
        orders.map(o => '<div class="order-row"><div class="onum">Order ' + o[0] + (orders.length > 1 ? '<span style="display:block;font-size:11.5px;font-weight:500;color:var(--muted-foreground)">' + VEN[o.v] + ' · ' + money(o[1]) + '</span>' : '') + '</div>' +
        '<a class="toolbar-btn" style="text-decoration:none" href="#">View order <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></a></div>').join('') + '</div>';
    }

    document.getElementById('det-main').innerHTML = main;
    document.getElementById('det-side').innerHTML = side;
  }

  function decGate() {
    const has = !!(document.getElementById('dec-comment').value || '').trim();
    const rev = document.getElementById('dec-rev'), rej = document.getElementById('dec-rej');
    if (rev) { rev.disabled = !has; rej.disabled = !has; }
    const hint = document.getElementById('dec-hint');
    if (hint) hint.textContent = has ? 'Your comment goes to the buyer with the decision.' : 'Approving needs no comment.';
    document.getElementById('dec-comment').style.borderColor = '';
  }
  function decide(next) {
    const c = (document.getElementById('dec-comment').value || '').trim();
    if ((next === 'revision' || next === 'rejected') && !c) {
      const box = document.getElementById('dec-comment');
      box.style.borderColor = 'var(--rose)'; box.focus(); return;
    }
    const now = '8/24/2026, 10:15:00 AM';
    if (next === 'approved') {
      R.status = 'approved'; R.decidedBy = 'You (Supervisor)';
      R.orders = vends().map((v, i) => { const vt = Math.round((R.items.filter(x => (x.v || R.v) === v).reduce((a, x) => a + x.qty * x.price, 0) + (i === 0 ? (R.shipping ? R.shipping[1] : 0) : 0)) * 100) / 100; return Object.assign(['#' + (498 + i), vt], { v }); });
      R.history.push({ t: 'Approved', actor: 'Supervisor', rev: 0, amt: R.amount, when: now, comment: c || null, items: R.history[0].items });
    } else if (next === 'revision') {
      R.status = 'revision'; R.decidedBy = 'You (Supervisor)'; R.comment = c;
      R.history.push({ t: 'Revision requested', actor: 'Supervisor', rev: 1, amt: R.amount, when: now, comment: c, items: R.history[0].items });
    } else {
      R.status = 'rejected'; R.decidedBy = 'You (Supervisor)'; R.comment = c;
      R.history.push({ t: 'Rejected', actor: 'Supervisor', rev: 0, amt: R.amount, when: now, comment: c, items: R.history[0].items });
    }
    R.history.forEach(ev => { if (ev.comment === null) delete ev.comment; });
    if (R.spo) syncSpo(next, c);
    if (R.sch) syncSch(next, c);
    renderPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* An approval decision on a schedule moves the series itself: approve once, then its runs need no approval. */
  function syncSch(next, c) {
    const x = SCH.get(R.sch);
    if (next === 'approved') {
      x.status = 'active'; x.ev.approved = SPO.now(); x.approval = { by: 'Alicia Grant' }; x.approvedRuns = R.runs;
      SCH.log(x, 'Series approved', 'by Alicia Grant (Supervisor)' + (c ? ' · “' + c + '”' : '') + ' · runs need no further approval', true);
    } else if (next === 'revision') {
      x.status = 'revision'; x.revision = { comment: c }; SCH.log(x, 'Revision requested', 'by Alicia Grant (Supervisor) · “' + c + '”');
    } else {
      x.status = 'ended'; x.rejected = true; x.ev.ended = SPO.now(); x.endInfo = { by: 'Alicia Grant (Supervisor)', reason: 'Rejected in approval: “' + c + '”' };
      SCH.log(x, 'Rejected in approval', 'by Alicia Grant (Supervisor) · “' + c + '”', false, true);
    }
    SCH.save(x);
  }
  /* An approval decision on a Service PO moves the SPO itself. */
  function syncSpo(next, c) {
    const s = SPO.get(R.spo), v = SPO.VEN[s.v];
    if (next === 'approved') {
      s.state = 'sent'; s.ev.approved = SPO.now(); s.ev.sent = SPO.now(); s.approval = { by: 'Alicia Grant', reason: R.reasonTxt };
      SPO.log(s, 'Approved', 'by Alicia Grant (Supervisor)' + (c ? ' \u00B7 \u201C' + c + '\u201D' : ''), true);
      SPO.log(s, 'Sent to vendor', 'PO emailed to ' + v.email);
    } else if (next === 'revision') {
      s.state = 'draft'; SPO.log(s, 'Revision requested', 'by Alicia Grant (Supervisor) \u00B7 \u201C' + c + '\u201D');
    } else {
      s.state = 'canceled'; s.ev.canceled = SPO.now(); s.cancel = { by: 'Alicia Grant (Supervisor)', reason: c };
      SPO.log(s, 'Rejected in approval', 'by Alicia Grant (Supervisor) \u00B7 \u201C' + c + '\u201D', false, true);
    }
    SPO.save(s);
  }
  function refreshInv() {
    const el = document.getElementById('inv-checked');
    el.textContent = 'Checked 0 seconds ago';
    setTimeout(() => el.textContent = 'Checked just now', 1200);
  }

  renderPage();
</script>
</body>
</html>
