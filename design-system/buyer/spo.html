<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service PO — Scout Buyer</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="buyer.css">
<script src="cart.js"></script>
<script src="spo-data.js"></script>
<script src="spo-map.js"></script>
</head>
<body class="buyer">

<!-- ===== App Bar ===== -->
<div class="app-bar-wrap">
  <nav class="app-bar" id="app-bar"></nav>
  <script src="appbar.js"></script>
</div>






<section class="hero page-hero">
  <div class="hero-bg"></div>
  <div class="hero-inner" style="flex-direction:column;gap:0">
    <a class="back-link" href="spos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>Back to Service POs</a>
    <div class="hero-title-block">
      <div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
      <div><h1 id="hero-title">SPO<button class="hero-copy" onclick="copyNum()" title="Copy SPO number"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button></h1><p id="hero-sub"></p></div>
    </div>
  </div>
</section>

<main class="page">
  <div class="det-grid">
    <div class="det-main" id="det-main"></div>
    <div class="det-side" id="det-side"></div>
  </div>
</main>

<script>
  /* ---------- Theme ---------- */
  function applyTheme() {
    const dark = localStorage.getItem('scout-theme') === 'dark';
    document.body.classList.toggle('dark', dark);
    const b = document.getElementById('theme-btn');
    b.querySelector('.icon-sun').style.display = dark ? 'none' : '';
    b.querySelector('.icon-moon').style.display = dark ? '' : 'none';
  }
  function toggleTheme() { localStorage.setItem('scout-theme', document.body.classList.contains('dark') ? 'light' : 'dark'); applyTheme(); }
  applyTheme();

  /* ---------- Menus ---------- */
  function closeMenus() {
    document.querySelectorAll('.menu-panel').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.nav-chip').forEach(c => c.classList.remove('open'));
  }
  function toggleMenu(id) {
    const panel = document.getElementById('menu-' + id), chip = document.getElementById('nav-' + id);
    const wasOpen = panel.classList.contains('open');
    closeMenus(); document.getElementById('ctx-switch').classList.remove('open');
    if (!wasOpen) { panel.classList.add('open'); chip.classList.add('open'); }
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-anchor')) closeMenus();
    if (!e.target.closest('.ctx-switch')) document.getElementById('ctx-switch').classList.remove('open');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); document.getElementById('ctx-switch').classList.remove('open'); } });

  /* ---------- Context switcher ---------- */
  const PROPERTIES = [
    { id: 'all', name: 'All properties', desc: 'Combined dashboard for every accessible property', units: null },
    { id: 'magnolia', name: 'Magnolia Place Apartments', addr: '4201 Veterans Memorial Blvd', city: 'Metairie, LA 70006', units: 51 },
    { id: 'bayou', name: 'Bayou Crossing Apartments', addr: '3850 Airline Dr', city: 'Baton Rouge, LA 70805', units: 120 },
    { id: 'lonestar', name: 'Lone Star Flats', addr: '7200 Westheimer Rd', city: 'Houston, TX 77057', units: 78 },
    { id: 'central', name: 'Central Park View', addr: '1501 Canal St', city: 'New Orleans, LA 70112', units: 96 },
    { id: 'cypress', name: 'Cypress Lake Apartments', addr: '9100 Cypress Lake Dr', city: 'Lafayette, LA 70508', units: 64 },
    { id: 'beauchene', name: 'Beau Chene Villas', addr: '225 Beau Chene Blvd', city: 'Mandeville, LA 70471', units: 40 },
    { id: 'sherwood', name: 'Sherwood Acres', addr: '1250 Sherwood Forest Blvd', city: 'Baton Rouge, LA 70815', units: 88 },
    { id: 'cyprus', name: 'Cyprus Glenn', addr: '4800 Cyprus Glenn Way', city: 'Shreveport, LA 71105', units: 32 },
    { id: 'heights', name: 'Magnolia Heights Apartments', addr: '6301 Magnolia Heights Rd', city: 'Houston, TX 77004', units: 110 }
  ];
  let currentProp = 'all';
  const bIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>';
  const pinIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
  function renderCtxList() {
    document.getElementById('ctx-list').innerHTML = PROPERTIES.map(p => {
      const active = p.id === currentProp;
      const body = p.id === 'all'
        ? '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.desc + '</span>'
        : '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.addr + '</span><span class="opt-city">' + pinIcon + p.city + '</span>';
      const units = p.units ? '<span class="units-badge"><b>' + p.units + '</b><span>units</span></span>' : '';
      return '<button class="ctx-option' + (active ? ' active' : '') + '" onclick="selectProp(\'' + p.id + '\')"><span class="opt-tile">' + bIcon + '</span><span class="opt-body">' + body + '</span>' + units + '</button>';
    }).join('');
  }
  function selectProp(id) {
    currentProp = id;
    const p = PROPERTIES.find(x => x.id === id);
    document.getElementById('echo-name').textContent = p.name;
    document.getElementById('echo-name').title = p.id === 'all' ? '9 accessible properties' : p.units + ' units · ' + p.city;
    renderCtxList();
    document.getElementById('ctx-switch').classList.remove('open');
    renderPage();
  }
  function toggleCtx() {
    const el = document.getElementById('ctx-switch');
    const wasOpen = el.classList.contains('open');
    closeMenus();
    if (!wasOpen) el.classList.add('open');
  }
  renderCtxList();

  const money = SPO.money, r2 = SPO.r2;
  const SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  const IC = {
    pen: SVG + '<path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg>',
    shield: SVG + '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>',
    send: SVG + '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>',
    hand: SVG + '<path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></svg>',
    doc: SVG + '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>',
    map: SVG + '<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>',
    card: SVG + '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    flag: SVG + '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>',
    clock: SVG + '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
    warn: SVG + '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
    ban: SVG + '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>',
    copy: SVG + '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
    dl: SVG + '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>',
    upload: SVG + '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>',
    refresh: SVG + '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>',
    split: SVG + '<path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/></svg>',
    swap: SVG + '<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>'
  };

  /* Fixed step labels — progress changes styling and captions, never the names (audit SPO-26). */
  const STEPS = [
    ['Draft', 'you', IC.pen], ['Approval', 'approver', IC.shield], ['Sent', 'you', IC.send], ['Vendor Response', 'vendor', IC.hand],
    ['Invoice', 'vendor', IC.doc], ['Mapping', 'you', IC.map], ['Accounting', 'acct', IC.card], ['Paid', 'acct', IC.flag]
  ];
  const PROG = { draft: [0, 0], approval: [1, 1], sent: [3, 3], rejected: [3, 3], invoice: [4, 4], mapping: [5, 5], ready: [6, 6], accounting: [6, 6], paid: [8, -1] };
  const STEP_EV = ['created', 'approved', 'sent', 'accepted', 'invoiced', 'mapped', 'accounting', 'paid'];

  let S, curId, actExpanded = false;
  function pick() {
    const h = (location.hash || '').replace('#', '');
    const [id, sub] = h.split('/');
    curId = Number(id) || 858;
    S = SPO.get(curId) || SPO.get(858);
    curId = S.id;
    return sub || '';
  }
  const propOf = s => PROPERTIES.find(p => p.id === s.prop) || PROPERTIES[1];
  const ven = s => SPO.VEN[s.v];
  const pillHtml = s => { const st = SPO.STATES[s.state]; return '<span class="status-dot-item"><span class="status-dot ' + st.dot + '"></span><span class="status-dot-label">' + st.label + '</span></span>'; };
  const actorChip = a => a === 'you' ? '<span class="ls-actor you">YOU</span>' : a === 'acct' ? '<span class="ls-actor acct">ACCOUNTING</span>' : a === 'approver' ? '<span class="ls-actor">APPROVER</span>' : '<span class="ls-actor">VENDOR</span>';

  function stepper(s) {
    const [done, active] = PROG[s.state];
    const approvalSkipped = !s.ev.approvalReq;
    return '<div class="ls-stepper">' + STEPS.map(([label, actor, icon], i) => {
      let cls, cap = '', dot = icon, a = actor;
      if (s.state === 'rejected' && i === 3) { cls = 'halted'; dot = IC.x; cap = '<span class="ls-date">rejected</span>'; }
      else if (i === 1 && approvalSkipped && i < done) { cls = 'skipped'; dot = IC.check; cap = '<span class="ls-date">' + (s.series ? 'series approved' : 'not required') + '</span>'; }
      else if (i < done) { cls = 'done'; dot = IC.check; const d = s.ev[STEP_EV[i]]; cap = d ? '<span class="ls-date">' + SPO.fmtDate(d) + '</span>' : ''; }
      else if (i === active) {
        if (s.state === 'ready' && i === 6) a = 'you';
        cls = 'active' + (a === 'vendor' ? ' vend' : a === 'acct' ? ' acct' : '');
        cap = '<span class="ls-date">' + (a === 'you' || a === 'approver' ? 'your move' : 'in progress') + '</span>';
      } else cls = 'future';
      return '<div class="ls-step ' + cls + '"><div class="ls-dot">' + dot + '</div><div class="ls-label">' + label + '</div>' + actorChip(a) + cap + '</div>' +
        (i < 7 ? '<div class="ls-conn' + (i < done ? ' done' : '') + '"></div>' : '');
    }).join('') + '</div>';
  }

  function allocChips(l) {
    return '<div class="alloc-row">' + l.alloc.map(a => '<span class="alloc-chip"><span class="code">' + a.gl + '</span>' + SPO.glName(a.gl) + '<span class="sep"></span><a class="unit-link" href="unit-history.html#' + S.prop + '/' + a.unit + '" title="Unit history">' + SPO.unitLabel(a.unit) + '</a>' + (l.alloc.length > 1 ? '<span class="sep"></span><span class="amt">' + money(a.amt) + '</span>' : '') + '</span>').join('') + '</div>';
  }

  function taskStrip(s) {
    const st = (tone, ico, title, desc, actions) => {
      const icoStyle = tone === 'wait' ? ' style="background:var(--muted);color:var(--muted-foreground)"'
        : tone === 'done' ? ' style="background:var(--emerald-soft);color:var(--emerald)"'
        : tone === 'danger' ? ' style="background:var(--rose-soft);color:var(--rose)"'
        : tone === 'acct' ? ' style="background:var(--violet-soft);color:var(--violet)"' : '';
      return '<div class="task-strip"><span class="ts-icon"' + icoStyle + '>' + ico + '</span><div class="ts-body"><div class="ts-title">' + title + '</div><div class="ts-desc">' + desc + '</div></div>' + (actions || '') + '</div>';
    };
    const btn = (label, onclick, kind, ico) => '<button class="btn' + (kind ? ' ' + kind : '') + '" style="display:inline-flex;align-items:center;gap:8px;white-space:nowrap" onclick="' + onclick + '">' + (ico ? '<span style="display:inline-flex;width:15px;height:15px">' + ico + '</span>' : '') + label + '</button>';
    const v = ven(s), inv = s.invoice;
    switch (s.state) {
      case 'draft': return st('action', IC.pen, 'Finish your draft', 'Complete the line items and allocation, then submit it to ' + endDot(v.name), btn('Continue editing', "location.href='spo-new.html#" + s.id + "'", 'btn-primary', IC.pen));
      case 'approval': return st('action', IC.shield, 'Supervisor approval', (SPO.total(s) > SPO.APPROVAL_LIMIT ? 'Over ' + money(SPO.APPROVAL_LIMIT) : 'Over the GL budget') + ' — nothing goes to the vendor until a Supervisor approves it.', btn('Review in Approvals', "location.href='approval.html#SPO-" + s.id + "'", 'btn-primary', IC.shield));
      case 'sent': return st('wait', IC.hand, 'Waiting on Vendor · Response', 'The PO went to ' + v.email + ' — the vendor accepts or rejects it before any work is scheduled.', btn('Resend PO', 'resendPO()', '', IC.send));
      case 'rejected': return st('danger', IC.x, 'Vendor rejected · choose another vendor', v.name + ': “' + (s.reject ? s.reject.reason : '') + '”', btn('Cancel SPO', 'openCancel()', '') + btn('Change Vendor', 'openChangeVendor()', 'btn-primary', IC.swap));
      case 'invoice': if (s.disputed) return st('wait', IC.doc, 'Waiting on Vendor \u00B7 Corrected invoice', 'You disputed ' + s.disputed.num + ': \u201C' + s.disputed.reason + '\u201D ' + v.name + ' is correcting and resubmitting it.', btn('Upload invoice', 'openUpload()', '', IC.upload));
        return st('wait', IC.doc, 'Waiting on Vendor \u00B7 Invoice', v.name + ' accepted on ' + SPO.fmtDate(s.ev.accepted) + '. Their invoice will arrive by email — or upload it here if they sent it to you.', btn('Upload invoice', 'openUpload()', '', IC.upload));
      case 'mapping': if (inv.extractFailed) return st('action', IC.warn, 'Invoice ' + inv.num + ' needs attention', 'Scout AI couldn\u2019t read its line items \u2014 retry the extraction or enter the lines from the PDF.', btn('Open invoice', "location.hash='#" + s.id + "/invoice'", 'btn-primary', IC.map));
        return st('action', IC.map, 'Map invoice ' + inv.num + ' to SPO lines', money(SPO.invTotal(s)) + ' invoiced against a ' + money(SPO.total(s)) + ' estimate — confirm each invoice line’s SPO line, GL and unit.', btn('Map invoice', "location.hash='#" + s.id + "/invoice'", 'btn-primary', IC.map));
      case 'ready': return st('action', IC.card, 'Send to Accounting', 'Invoice ' + inv.num + ' is mapped and validated — send the payment packet to Accounting.', btn('Send to Accounting', "location.hash='#" + s.id + "/accounting'", 'btn-primary', IC.send));
      case 'accounting': return st('acct', IC.card, 'Waiting on Accounting · Payment', 'Sent on ' + SPO.fmtDate(s.ev.accounting) + ' with the PO, invoice and GL allocation. Accounting releases ' + money(SPO.invTotal(s)) + ' to ' + endDot(v.name));
      case 'paid': return st('done', IC.flag, 'Paid', money(SPO.invTotal(s)) + ' released to ' + v.name + ' on ' + SPO.fmtDate(s.ev.paid) + '. Documents stay available for your records.');
    }
    return '';
  }

  /* A schedule-generated SPO names its series; the series controls live on the series page (audit SPO-50). */
  const REP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>';
  function seriesLink(s) {
    if (!s.series || !window.SCH) return '';
    const x = SCH.get(s.series); if (!x) return '';
    return '<div class="series-link">' + REP + '<span>Run ' + SPO.fmtDate(s.run) + ' of <b>' + x.name + '</b> · ' + SCH.cadenceText(x.cadence, false) + ' · ' + SCH.STATES[x.status].label + '</span><a class="text-link" href="schedule.html#' + x.id + '">View schedule</a></div>';
  }
  /* Vendor names can end in a period ("Co.") — don't double it at the end of a sentence. */
  const endDot = t => /[.!?]$/.test(t) ? t : t + '.';
  const CANCELABLE = ['draft', 'approval', 'sent', 'rejected', 'invoice'];

  function renderPage() {
    const sub = pick();
    const s = S, v = ven(s), prop = propOf(s);
    document.title = 'SPO-' + s.id + ' — Scout Buyer';
    document.getElementById('hero-title').innerHTML = 'SPO-' + s.id + '<button class="hero-copy" onclick="copyNum()" title="Copy SPO number">' + IC.copy + '</button>';
    document.getElementById('hero-sub').textContent = prop.name + ' · ' + v.name;

    let main = '';
    if (s.state === 'canceled') {
      main += '<div class="card"><div class="det-card-head"><h2>SPO Status</h2>' + pillHtml(s) + '</div>' +
        '<div class="callout neutral" style="margin-top:10px"><b>' + IC.ban.replace('<svg', '<svg style="width:16px;height:16px"') + 'Canceled on ' + SPO.fmtDate(s.ev.canceled) + ' by ' + s.cancel.by + '</b>“' + s.cancel.reason + '”' +
        (s.ev.sent ? '<div style="margin-top:6px">' + v.name + ' was notified. Nothing was invoiced or paid.</div>' : '<div style="margin-top:6px">It was never sent to a vendor.</div>') + '</div>' +
        seriesLink(s) + '<div class="spo-manage"><span class="lbl">Manage this SPO</span>' + '<button class="btn" onclick="location.href=\'spo-new.html#clone-' + s.id + '\'" style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-flex;width:15px;height:15px">' + IC.copy + '</span>Clone SPO</button></div></div>';
    } else {
      main += '<div class="card"><div class="det-card-head"><h2>SPO Progress</h2>' + pillHtml(s) + '</div>' + stepper(s) + seriesLink(s) +
        '<div class="spo-manage"><span class="lbl">Manage this SPO</span>' +
        (!s.series ? '<button class="btn" onclick="location.href=\'spo-new.html#recurring-' + s.id + '\'" style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-flex;width:15px;height:15px">' + REP + '</span>Make recurring</button>' : '') +
        '<button class="btn" onclick="location.href=\'spo-new.html#clone-' + s.id + '\'" style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-flex;width:15px;height:15px">' + IC.copy + '</span>Clone SPO</button>' +
        (CANCELABLE.indexOf(s.state) >= 0 && s.state !== 'rejected' ? '<button class="btn btn-outline-rose" onclick="openCancel()">Cancel SPO</button>' : '') + '</div></div>';
      main += taskStrip(s);
    }

    main += '<div class="card"><div class="det-card-head hd"><h2>Scope of work</h2></div><p class="spo-scope" style="margin-top:8px">' + s.scope + '</p></div>';

    const est = SPO.total(s);
    main += '<div class="card"><div class="det-card-head hd"><div><h2>Line items</h2><div class="sub">GL code and unit for every dollar</div></div></div>' +
      s.lines.map(l => '<div class="spo-line"><span class="sl-desc">' + l.desc + '</span><span class="sl-qty">' + l.qty + ' × ' + money(l.price) + '</span><span class="sl-total">' + money(r2(l.qty * l.price)) + '</span>' + allocChips(l) + '</div>').join('') +
      '<div class="det-totals"><div class="tot-row grand"><span>SPO estimate</span><span>' + money(est) + '</span></div>' +
      (s.invoice && (s.invoice.validated || ['ready', 'accounting', 'paid'].indexOf(s.state) >= 0) ? invoiceTotals(s) : '') + '</div></div>';

    if (s.invoice) main += invoiceCard(s);

    let side = '';
    side += '<div class="card"><div class="ven-card"><span class="ven-logo">' + s.v + '</span><div style="min-width:0"><div class="ven-eyebrow">Vendor · ' + v.trade + '</div><div class="ven-name" style="margin-bottom:2px">' + v.name + '</div>' +
      '<div style="font-size:13px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="PO recipient">' + v.email + '</div></div></div></div>';

    const sx = s.series && window.SCH ? SCH.get(s.series) : null;
    const approvalVal = sx ? (sx.ev.approved ? 'Series · ' + ((sx.approval && sx.approval.by) || 'Priya Nair') : 'Not required') : s.state === 'approval' ? 'Pending · Supervisor' : s.ev.approved ? 'Approved by ' + ((s.approval && s.approval.by) || 'Priya Nair') : s.state === 'draft' ? (SPO.needsApproval(s) ? 'Required on submit' : 'Not required') : 'Not required';
    side += '<div class="card"><dl class="fact-rows wide">' +
      '<dt>Property</dt><dd>' + prop.name + '</dd>' +
      '<dt>Requested by</dt><dd>' + s.by + '</dd>' +
      '<dt>Created</dt><dd>' + SPO.fmtDate(s.ev.created) + '</dd>' +
      '<dt>Spend period</dt><dd>' + s.period + '</dd>' +
      '<dt>Approval</dt><dd>' + approvalVal + '</dd></dl></div>';

    const docs = [];
    if (s.ev.sent) docs.push(['Purchase Order SPO-' + s.id, 'PO', '', s.ev.sent]);
    if (s.invoice && s.ev.invoiced) docs.push(['Invoice ' + s.invoice.num, 'Invoice', 'emerald', s.ev.invoiced]);
    if (s.ev.accounting) docs.push(['Payment packet', 'Sent to Accounting', 'violet', s.ev.accounting]);
    side += '<div class="card"><div class="det-card-head"><h2 style="font-size:16px">Documents</h2></div>' +
      (docs.length ? docs.map(d => '<div class="doc-row' + (d[2] ? ' ' + d[2] : '') + '">' + IC.doc.replace('<svg', '<svg class="doc-ico"') + '<div style="flex:1;min-width:0"><div class="doc-name">' + d[0] + '</div><div class="doc-date">' + SPO.fmtDate(d[3]) + ' · ' + d[1] + '</div></div><button class="row-action" title="Download" onclick="showToast(\'Download started\', \'' + d[0] + '.pdf\')">' + IC.dl + '</button></div>').join('')
        : '<div style="font-size:13px;color:var(--muted-foreground)">The PO is generated when the SPO is sent to the vendor.</div>') + '</div>';

    const evs = s.log.slice().sort((a, b) => b.at.localeCompare(a.at));
    const shown = actExpanded ? evs : evs.slice(0, 5);
    side += '<div class="card"><div class="det-card-head"><h2 style="font-size:16px">Activity</h2></div><div class="act-tl">' +
      shown.map(e => '<div class="act-ev' + (e.hi ? ' hi' : '') + (e.bad ? ' bad' : '') + '"><span class="adot"></span><div class="abody"><div class="at">' + e.t + '</div>' + (e.sub ? '<div class="asub">' + e.sub + '</div>' : '') + '</div><span class="awhen">' + SPO.fmtDate(e.at) + '</span></div>').join('') +
      (evs.length > shown.length ? '<button class="act-more" onclick="actExpanded = true; renderPage()">Show ' + (evs.length - shown.length) + ' more activities</button>' : '') + '</div></div>';

    document.getElementById('det-main').innerHTML = main;
    document.getElementById('det-side').innerHTML = side;

    if (sub === 'cancel' && CANCELABLE.indexOf(s.state) >= 0) setTimeout(openCancel, 120);
    if (sub === 'vendor' && s.state === 'rejected') setTimeout(openChangeVendor, 120);
    if (sub === 'invoice' && s.state === 'mapping') setTimeout(openInvoiceMap, 150);
    if (sub === 'accounting' && s.state === 'ready') setTimeout(openAccounting, 150);
  }

  function invoiceTotals(s) {
    const inv = s.invoice, sub = SPO.invSubtotal(s), vr = r2(sub - SPO.total(s));
    return '<div class="tot-row"><span>Invoice ' + inv.num + ' · subtotal</span><span>' + money(sub) + '</span></div>' +
      (vr ? '<div class="tot-row"><span>Variance accepted at mapping</span><span style="color:#b45309">' + (vr > 0 ? '+' : '−') + money(Math.abs(vr)) + '</span></div>' : '') +
      (inv.tax ? '<div class="tot-row"><span>Sales tax</span><span>' + money(inv.tax) + '</span></div>' : '') +
      '<div class="tot-row grand"><span>Invoice total</span><span>' + money(SPO.invTotal(s)) + '</span></div>';
  }

  function invoiceCard(s) {
    const inv = s.invoice, mapped = s.state !== 'mapping';
    return '<div class="card"><div class="det-card-head hd"><h2>Invoice</h2>' +
      '<span class="status-dot-item"><span class="status-dot ' + (mapped ? 'dot-approved' : 'dot-pending') + '"></span><span class="status-dot-label">' + (mapped ? 'Mapped & validated' : 'Needs mapping') + '</span></span></div>' +
      '<div class="doc-row emerald" style="margin-top:10px">' + IC.doc.replace('<svg', '<svg class="doc-ico"') + '<div style="flex:1;min-width:0"><div class="doc-name">' + inv.num + ' · ' + inv.file + '</div><div class="doc-date">Received ' + SPO.fmtDate(s.ev.invoiced) + ' · PDF, ' + SPO.fileSize(SPO.invSize(inv)) + ' · ' + inv.lines.length + ' line' + (inv.lines.length === 1 ? '' : 's') + ' · ' + money(SPO.invTotal(s)) + '</div></div>' +
      (mapped ? '<button class="btn btn-sm" onclick="openInvoiceMap(true)">View mapping</button>' : '<button class="btn btn-primary btn-sm" onclick="location.hash=\'#' + s.id + '/invoice\'">Map invoice</button>') + '</div></div>';
  }

  /* ---------- modals (val-modal pattern) ---------- */
  function modal(id, html) {
    let ov = document.getElementById(id);
    if (!ov) { ov = document.createElement('div'); ov.className = 'overlay center'; ov.id = id; ov.addEventListener('click', e => { if (e.target === ov) closeModal(id); }); document.body.appendChild(ov); }
    ov.innerHTML = html; ov.classList.add('open'); document.body.style.overflow = 'hidden';
    return ov;
  }
  function closeModal(id) {
    const ov = document.getElementById(id); if (ov) ov.classList.remove('open');
    document.body.style.overflow = '';
    const h = location.hash.split('/'); if (h.length > 1) history.replaceState(null, '', h[0]);
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.overlay.open').forEach(o => closeModal(o.id)); });

  function openCancel() {
    const s = S, sentAlready = !!s.ev.sent;
    modal('cancel-ov', '<div class="val-modal" style="width:500px"><div class="val-head"><h2>Cancel SPO-' + s.id + '?</h2><p>' + (sentAlready ? ven(s).name + ' is notified and the PO is withdrawn.' : 'It hasn’t gone to a vendor yet.') + ' This can’t be undone.</p></div>' +
      '<div class="val-body" style="padding:16px 24px"><label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px">Reason <span class="req-chip">Required</span></label>' +
      '<textarea class="claim-note" id="cancel-reason" maxlength="500" placeholder="Why is this SPO being canceled?" oninput="document.getElementById(\'cancel-go\').disabled = !this.value.trim()"></textarea>' +
      '<div style="font-size:12px;color:var(--muted-foreground);margin-top:6px">' + (sentAlready ? 'Shared with the vendor and kept in the SPO’s activity.' : 'Kept in the SPO’s activity.') + '</div></div>' +
      '<div class="val-foot"><button class="btn" onclick="closeModal(\'cancel-ov\')">Keep SPO</button><button class="btn btn-danger" id="cancel-go" disabled onclick="confirmCancel()">Cancel SPO</button></div></div>');
    setTimeout(() => document.getElementById('cancel-reason').focus(), 50);
  }
  function confirmCancel() {
    const s = S, reason = document.getElementById('cancel-reason').value.trim();
    if (!reason) return;
    s.state = 'canceled'; s.cancel = { by: 'Alicia Grant', reason }; s.ev.canceled = SPO.now();
    SPO.log(s, 'Canceled', 'by Alicia Grant · “' + reason + '”', false, true);
    SPO.save(s); closeModal('cancel-ov'); renderPage();
    showToast('SPO-' + s.id + ' canceled', s.ev.sent ? ven(s).name + ' was notified.' : 'It was never sent to a vendor.');
  }

  let pickVen = null;
  function openChangeVendor() {
    const s = S; pickVen = null;
    const trade = ven(s).trade;
    const opts = Object.keys(SPO.VEN).filter(k => k !== s.v).sort((a, b) => (SPO.VEN[b].trade === trade) - (SPO.VEN[a].trade === trade) || SPO.VEN[a].name.localeCompare(SPO.VEN[b].name));
    modal('vendor-ov', '<div class="val-modal" style="width:540px"><div class="val-head"><h2>Choose another vendor</h2><p>' + ven(s).name + ' rejected SPO-' + s.id + '. The same scope, lines and allocation go to the vendor you pick.</p></div>' +
      '<div class="val-body" style="padding:12px 24px;display:flex;flex-direction:column;gap:8px">' +
      opts.map(k => { const o = SPO.VEN[k]; return '<button class="opt-row" id="vo-' + k + '" onclick="selectVen(\'' + k + '\')"><span class="opt-ic" style="font-size:11px;font-weight:700">' + k + '</span><span class="opt-body"><span class="opt-name">' + o.name + '</span><span class="opt-desc">' + o.trade + ' · ' + o.email + '</span></span>' + (o.trade === trade ? '<span class="pill p-neutral" style="font-size:11px">Same trade</span>' : '') + '<span class="opt-radio">' + IC.check + '</span></button>'; }).join('') + '</div>' +
      '<div class="val-foot"><button class="btn" onclick="closeModal(\'vendor-ov\')">Cancel</button><button class="btn btn-primary" id="ven-go" disabled onclick="confirmVendor()">Send to vendor</button></div></div>');
  }
  function selectVen(k) {
    pickVen = k;
    document.querySelectorAll('#vendor-ov .opt-row').forEach(b => b.classList.toggle('selected', b.id === 'vo-' + k));
    const go = document.getElementById('ven-go'); go.disabled = false; go.textContent = 'Send to ' + SPO.VEN[k].name;
  }
  function confirmVendor() {
    const s = S; if (!pickVen) return;
    const old = ven(s).name;
    s.v = pickVen; s.state = 'sent'; s.prevReject = s.reject; delete s.reject; s.ev.sent = SPO.now(); delete s.ev.rejected;
    SPO.log(s, 'Vendor changed', old + ' rejected · reassigned to ' + ven(s).name);
    SPO.log(s, 'Sent to vendor', 'PO emailed to ' + ven(s).email);
    SPO.save(s); closeModal('vendor-ov'); renderPage();
    showToast('Sent to ' + ven(s).name, 'SPO-' + s.id + ' is waiting on their response.');
  }
  function resendPO() { SPO.log(S, 'PO resent', 'to ' + ven(S).email); SPO.save(S); renderPage(); showToast('PO resent', ven(S).email); }

  /* ===================== Invoice intake (upload) ===================== */
  function openUpload() {
    const s = S;
    modal('upload-ov', '<div class="val-modal" style="width:520px"><div class="val-head"><h2>Upload invoice for SPO-' + s.id + '</h2><p>Scout AI reads the PDF and proposes a match for every line. You confirm each one before anything goes to Accounting.</p></div>' +
      '<div class="val-body" style="padding:16px 24px">' + (otherWaiting(s).length ? '<div class="callout sky" style="margin-bottom:12px"><b>One invoice for several SPOs?</b>' + ven(s).name + ' has ' + otherWaiting(s).length + ' other SPO' + (otherWaiting(s).length === 1 ? '' : 's') + ' waiting on an invoice at ' + propOf(s).name + ' (' + otherWaiting(s).map(x => 'SPO-' + x.id).join(', ') + '). If this invoice covers them, <a class="text-link" href="spo-invoice.html#with-' + s.id + '">map them together</a>.</div>' : '') + '<button class="file-drop" id="up-drop" onclick="pickUpload()">' +
      '<div class="file-drop-icon">' + IC.upload + '</div><div class="file-drop-title">Choose the vendor’s invoice</div><div class="file-drop-sub">PDF · up to 20 MB</div></button></div>' +
      '<div class="val-foot"><button class="btn" onclick="closeModal(\'upload-ov\')">Cancel</button><button class="btn btn-primary" id="up-go" disabled onclick="runUpload()">Upload &amp; map</button></div></div>');
  }
  let upName = null, upSize = null;
  function pickUpload() {
    upName = 'INV-' + (40000 + S.id * 7 % 9000) + '.pdf'; upSize = 2662 + (S.id * 9173) % 240000;
    const d = document.getElementById('up-drop');
    d.classList.add('selected');
    d.innerHTML = '<div class="file-drop-icon">' + IC.doc + '</div><div class="file-drop-title">' + upName + '</div><div class="file-drop-sub">From ' + ven(S).name + ' · PDF, 1 page · ' + SPO.fileSize(upSize) + '</div>';
    document.getElementById('up-go').disabled = false;
  }
  function runUpload() {
    const s = S, num = upName.replace('.pdf', '');
    s.invoice = { num, date: SPO.TODAY, file: upName, size: upSize, tax: 0, ship: 0,
      lines: s.lines.map((l, i) => ({ desc: l.desc, amt: r2(l.qty * l.price), maps: [{ line: i, amt: r2(l.qty * l.price) }], conf: 'high' })) };
    s.state = 'mapping'; s.ev.invoiced = SPO.now(); delete s.disputed;
    SPO.log(s, 'Invoice received', num + ' · ' + money(SPO.invTotal(s)) + ' · uploaded by Alicia Grant');
    SPO.save(s); closeModal('upload-ov');
    location.hash = '#' + s.id + '/invoice';
  }

  /* ===================== Invoice mapping — Line Connector board (shared with standalone intake, spo-map.js) ===================== */
  let M = null, MC = null, mapRO = false, retrying = false, mapView = 'lines', attest = false;
  const clone = o => JSON.parse(JSON.stringify(o));
  function openInvoiceMap(readOnly) {
    mapRO = !!readOnly || S.state !== 'mapping'; retrying = false; mapView = 'lines'; attest = false;
    M = CX.prepare(clone(!mapRO && S.mapDraft ? S.mapDraft : S.invoice), S.id, mapRO);
    MC = CX.use({ spos: [S], inv: M, ro: mapRO, edit: false, onChange: renderMapTk });
    let tk = document.getElementById('map-tk');
    if (!tk) { tk = document.createElement('div'); tk.id = 'map-tk'; tk.className = 'inv-tk'; document.body.appendChild(tk); }
    renderMapTk(); tk.classList.add('open'); document.body.style.overflow = 'hidden';
  }
  function closeMapTk() {
    const tk = document.getElementById('map-tk'); if (tk) tk.classList.remove('open');
    document.body.style.overflow = '';
    const h = location.hash.split('/'); if (h.length > 1) history.replaceState(null, '', h[0]);
  }
  function otherWaiting(s) { return SPO.list().filter(x => x.id !== s.id && x.v === s.v && x.prop === s.prop && x.state === 'invoice'); }

  function pdfLines(s, inv) {
    const W = 62, pad = (a, b) => a + ' '.repeat(Math.max(2, W - a.length - b.length)) + b;
    const v = ven(s), p = propOf(s);
    const out = [v.name.toUpperCase(), v.email, '', pad('INVOICE', inv.num), pad('Date', SPO.fmtDate(inv.date)), pad('PO reference', 'SPO-' + s.id), '', 'BILL TO', p.name, p.addr + ', ' + p.city, '', '-'.repeat(W)];
    inv.lines.forEach(l => out.push(pad((l.desc || '').slice(0, 44), money(l.amt || 0))));
    out.push('-'.repeat(W), pad('Subtotal', money(inv.lines.reduce((a, l) => a + (l.amt || 0), 0))));
    if (inv.tax) out.push(pad('Sales tax', money(inv.tax)));
    out.push(pad(inv.shared ? 'THIS SPO’S SHARE' : 'TOTAL DUE', money(r2(inv.lines.reduce((a, l) => a + (l.amt || 0), 0) + (inv.tax || 0) + (inv.ship || 0)))));
    if (inv.shared) out.push('', 'Shared invoice · ' + inv.shared.idx + ' of ' + inv.shared.spos.length + ' SPOs (' + inv.shared.spos.map(id => 'SPO-' + id).join(', ') + ')', pad('Invoice total', money(inv.shared.total)));
    out.push('', 'Terms: Net 30 · Remit to ' + v.name);
    return out.join('\n');
  }

  function renderMapTk() {
    const tk = document.getElementById('map-tk'); if (!tk) return;
    const s = S;
    const head = '<div class="ivt-head"><span class="ivt-ico">' + IC.map + '</span><div style="flex:1;min-width:0"><h2>' + (mapRO ? 'Invoice ' + M.num + ' mapping' : 'Map invoice ' + M.num + ' to SPO-' + s.id) + '</h2><p>' + ven(s).name + ' · ' + propOf(s).name + (mapRO ? ' · mapped and validated' : ' · Scout AI suggests a match for every line; GL code and unit come from the SPO line.') + '</p></div><button class="row-action" style="width:34px;height:34px" title="Close" onclick="closeMapTk()">' + IC.x + '</button></div>';
    let body, foot;
    if (M.extractFailed && !mapRO) {
      body = (retrying
        ? '<div style="text-align:center;padding:60px 0;color:var(--muted-foreground)"><span style="display:inline-flex;width:28px;height:28px;color:var(--sky)">' + IC.refresh + '</span><div style="margin-top:10px;font-weight:600;color:var(--foreground)">Reading ' + M.file + '…</div><div style="font-size:12.5px">Scout AI is extracting the line items again.</div></div>'
        : '<div class="callout amber" style="max-width:760px"><b>Scout AI couldn’t read the line items</b>' + M.file + ' looks like a scanned image, so no lines were extracted. That’s an extraction failure — not an invoice with no lines.</div>' +
          '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn btn-primary" style="display:inline-flex;align-items:center;gap:8px" onclick="mRetry()"><span style="display:inline-flex;width:15px;height:15px">' + IC.refresh + '</span>Retry extraction</button><button class="btn" onclick="mManual()">Enter lines from the PDF</button></div>' +
          '<div class="cx-pdfview" style="margin-top:20px"><pre>' + pdfLines(s, M) + '</pre></div>');
      foot = '<span class="ivt-sub" style="margin:0">No invoice lines yet.</span><button class="btn" style="margin-left:auto" onclick="closeMapTk()">Close</button>';
    } else {
      const all = CX.allResolved(), n = M.lines.length, done = CX.doneCount();
      const seg = '<div class="cx-viewbar"><div class="mode-seg"><button class="' + (mapView === 'lines' ? 'active' : '') + '" onclick="mapView = \'lines\'; renderMapTk()">' + IC.map + '<span>Line items</span></button><button class="' + (mapView === 'pdf' ? 'active' : '') + '" onclick="mapView = \'pdf\'; renderMapTk()">' + IC.doc + '<span>PDF</span></button></div><span class="ivt-sub" style="margin:0">' + M.file + ' · ' + SPO.fileSize(SPO.invSize(M)) + ' · ' + money(SPO.invTotal({ invoice: M })) + '</span></div>';
      body = seg + (mapView === 'pdf' ? '<div class="cx-pdfview"><pre>' + pdfLines(s, M) + '</pre></div>'
        : CX.board() + '<h3 style="margin:26px 0 4px;font-size:15px">Totals</h3><p class="ivt-sub">Lines compare to the SPO estimate; tax and shipping are invoice-level.</p>' + CX.totals() +
          (mapRO ? '' : '<div class="cx-attest' + (all ? '' : ' off') + '"><b>' + done + ' of ' + n + ' invoice items connected</b><label><input type="checkbox"' + (attest && all ? ' checked' : '') + (all ? '' : ' disabled') + ' onchange="attest = this.checked; renderMapTk()"> I checked the work and matched every invoice item.</label><span>' + (all ? 'Validating sends nothing yet — it makes SPO-' + s.id + ' ready for Accounting.' : 'Match or resolve each item, then check the box.') + '</span></div>'));
      foot = mapRO
        ? '<span class="ivt-sub" style="margin:0">Validated ' + SPO.fmtDate(s.ev.mapped) + ' by Alicia Grant</span><button class="btn" style="margin-left:auto" onclick="closeMapTk()">Close</button>'
        : '<span class="ivt-sub" style="margin:0">' + done + ' of ' + n + ' invoice items connected · progress saves automatically</span><button class="btn btn-danger" style="margin-left:auto" onclick="openInvDispute()">Dispute invoice</button><button class="btn btn-primary"' + (all && attest ? '' : ' disabled') + ' onclick="validateMapping()">Validate mapping</button>';
    }
    tk.innerHTML = head + '<div class="ivt-body cx-mode">' + body + '</div><div class="ivt-foot">' + foot + '</div>';
    if (!M.extractFailed && mapView === 'lines') { CX.mount(); requestAnimationFrame(() => CX.draw()); }
    /* Autosave: work in progress survives closing the takeover — no Save draft button (audit SPO-31/37) */
    if (!mapRO) { s.mapDraft = clone(M); SPO.save(s); }
  }
  function mRetry() {
    retrying = true; renderMapTk();
    setTimeout(() => { retrying = false; M.extractFailed = false; S.invoice.extractFailed = false; CX.prepare(M, S.id, false); SPO.log(S, 'Invoice re-read', 'Scout AI extracted ' + M.lines.length + ' line' + (M.lines.length === 1 ? '' : 's')); SPO.save(S); renderMapTk(); }, 1400);
  }
  function mManual() { M.extractFailed = false; M.lines = [{ desc: '', amt: 0, maps: [], manual: true }]; MC.edit = true; renderMapTk(); }

  function validateMapping() {
    const s = S, notes = [];
    M.lines.forEach(l => {
      if (l.res === 'remove') { l.status = 'removed'; SPO.log(s, 'Invoice line removed', '“' + l.desc + '” · ' + money(l.amt) + ' · ' + l.resReason, false, true); }
      else if (l.res === 'add') { s.lines.push({ desc: l.desc, qty: 1, price: l.amt, alloc: [{ gl: l.resGl, unit: l.resUnit, amt: l.amt }] }); l.maps = [{ line: s.lines.length - 1, amt: l.amt }]; SPO.log(s, 'Line added to SPO', l.desc + ' · ' + money(l.amt) + ' · ' + l.resGl + ' ' + SPO.glName(l.resGl)); }
      else if (l.res === 'extra') { l.extra = { gl: l.resGl, unit: l.resUnit }; SPO.log(s, 'Extra charge accepted', l.desc + ' · ' + money(l.amt) + ' · ' + l.resGl + ' ' + SPO.glName(l.resGl)); }
    });
    M.lines.forEach(l => (l.maps || []).forEach(m => { delete m.sug; }));
    s.invoice = Object.assign(M, { validated: true, extractFailed: false }); delete s.mapDraft;
    const d = r2(SPO.invSubtotal(s) - SPO.total(s));
    s.state = 'ready'; s.ev.mapped = SPO.now();
    SPO.log(s, 'Invoice mapped & validated', M.lines.length + ' line' + (M.lines.length === 1 ? '' : 's') + (Math.abs(d) >= 0.005 ? ' · ' + (d > 0 ? '+' : '−') + money(Math.abs(d)) + ' variance accepted' : ' · on estimate'), true);
    SPO.save(s); closeMapTk(); renderPage();
    showToast('Invoice ' + s.invoice.num + ' validated', 'SPO-' + s.id + ' is ready for Accounting.');
  }

  function openInvDispute() {
    modal('dispute-ov', '<div class="val-modal" style="width:500px"><div class="val-head"><h2>Dispute invoice ' + M.num + '?</h2><p>' + ven(S).name + ' is asked to correct and resubmit. SPO-' + S.id + ' goes back to waiting for an invoice.</p></div>' +
      '<div class="val-body" style="padding:16px 24px"><label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px">What needs correcting <span class="req-chip">Required</span></label>' +
      '<textarea class="claim-note" id="disp-reason" maxlength="500" placeholder="e.g. Unit 104 is billed at $230; the SPO estimate is $200." oninput="document.getElementById(\'disp-go\').disabled = !this.value.trim()"></textarea>' +
      '<div style="font-size:12px;color:var(--muted-foreground);margin-top:6px">Shared with the vendor and kept in the SPO’s activity.</div></div>' +
      '<div class="val-foot"><button class="btn" onclick="closeModal(\'dispute-ov\')">Keep reviewing</button><button class="btn btn-danger" id="disp-go" disabled onclick="confirmInvDispute()">Dispute invoice</button></div></div>');
    document.getElementById('dispute-ov').style.zIndex = '500';
  }
  function confirmInvDispute() {
    const s = S, reason = document.getElementById('disp-reason').value.trim(); if (!reason) return;
    s.disputed = { num: s.invoice.num, reason }; delete s.invoice; delete s.mapDraft; s.state = 'invoice';
    SPO.log(s, 'Invoice disputed', s.disputed.num + ' · “' + reason + '”', false, true);
    SPO.save(s); closeModal('dispute-ov'); closeMapTk(); renderPage();
    showToast('Invoice disputed', ven(s).name + ' was asked to correct and resubmit.');
  }

  /* ===================== Send to Accounting (payment packet) ===================== */
  let packTab = 'gl';
  function glAllocation(s) {
    const rows = {};
    const add = (gl, unit, amt) => { const k = gl + '|' + unit; rows[k] = r2((rows[k] || 0) + amt); };
    s.invoice.lines.forEach(l => {
      if (l.status === 'removed') return;
      if (l.extra) { add(l.extra.gl, l.extra.unit, l.amt); return; }
      (l.maps || []).forEach(m => {
        const sl = s.lines[m.line], tot = sl.alloc.reduce((a, x) => a + x.amt, 0) || 1;
        /* Pro-rate in cents; the last split takes the remainder so the packet sums to the invoice exactly */
        let left = m.amt;
        sl.alloc.forEach((a, j) => { const amt = j === sl.alloc.length - 1 ? r2(left) : r2(m.amt * a.amt / tot); left = r2(left - amt); add(a.gl, a.unit, amt); });
      });
    });
    return Object.keys(rows).sort().map(k => { const [gl, unit] = k.split('|'); return { gl, unit, amt: rows[k] }; });
  }
  function packDoc(s, t) {
    const W = 62, pad = (a, b) => a + ' '.repeat(Math.max(2, W - a.length - b.length)) + b, p = propOf(s), v = ven(s);
    if (t === 'inv') return pdfLines(s, s.invoice);
    if (t === 'po') {
      const out = ['PURCHASE ORDER  SPO-' + s.id, pad('Issued', SPO.fmtDate(s.ev.sent)), '', 'VENDOR', v.name, v.email, '', 'SERVICE LOCATION', p.name, p.addr + ', ' + p.city, '', 'SCOPE', s.scope, '', '-'.repeat(W)];
      s.lines.forEach(l => { out.push(pad(l.desc.slice(0, 44), money(r2(l.qty * l.price)))); l.alloc.forEach(a => out.push('   ' + a.gl + ' ' + SPO.glName(a.gl) + ' · ' + SPO.unitLabel(a.unit))); });
      out.push('-'.repeat(W), pad('SPO ESTIMATE', money(SPO.total(s))));
      return out.join('\n');
    }
    const rows = glAllocation(s), out = ['GL ALLOCATION  SPO-' + s.id + ' · ' + s.invoice.num, p.name + ' · spend period ' + s.period, '', '-'.repeat(W)];
    rows.forEach(r => out.push(pad(r.gl + ' ' + SPO.glName(r.gl) + ' · ' + SPO.unitLabel(r.unit), money(r.amt))));
    out.push('-'.repeat(W), pad('Allocated (lines)', money(r2(rows.reduce((a, r) => a + r.amt, 0)))));
    if (s.invoice.tax) out.push(pad('Sales tax (invoice-level)', money(s.invoice.tax)));
    out.push(pad('PAYABLE TOTAL', money(SPO.invTotal(s))));
    return out.join('\n');
  }
  function openAccounting() { packTab = 'gl'; renderPack(); }
  function renderPack() {
    const s = S, tabs = { po: 'Purchase Order', inv: 'Invoice ' + s.invoice.num, gl: 'GL allocation' };
    modal('pack-ov', '<div class="val-modal" style="width:720px;max-width:calc(100vw - 40px)"><div class="val-head"><h2>Send SPO-' + s.id + ' to Accounting</h2><p>The payment packet Accounting needs to release ' + money(SPO.invTotal(s)) + ' to ' + ven(s).name + '.</p></div>' +
      '<div class="val-body" style="padding:16px 22px"><div class="tab-bar" style="margin-bottom:12px">' + Object.keys(tabs).map(k => '<button class="tab-item' + (k === packTab ? ' active' : '') + '" onclick="packTab = \'' + k + '\'; renderPack()">' + tabs[k] + '</button>').join('') + '</div>' +
      '<div class="pay-doc"><pre>' + packDoc(s, packTab) + '</pre></div>' +
      '<div style="display:flex;gap:10px;margin-top:12px;align-items:center"><span style="font-size:12.5px;color:var(--muted-foreground)">' + tabs[packTab] + ' · PDF</span><button class="btn btn-sm" style="margin-left:auto;display:inline-flex;align-items:center;gap:7px" onclick="showToast(\'Payment packet downloaded\', \'PO, invoice and GL allocation · 3 PDFs\')"><span style="display:inline-flex;width:14px;height:14px">' + IC.dl + '</span>Download all (3)</button></div></div>' +
      '<div class="val-foot"><span style="font-size:13px;color:var(--muted-foreground);margin-right:auto">' + money(SPO.invTotal(s)) + ' · ' + s.invoice.num + '</span><button class="btn" onclick="closeModal(\'pack-ov\')">Cancel</button><button class="btn btn-primary" style="display:inline-flex;align-items:center;gap:8px" onclick="sendToAccounting()"><span style="display:inline-flex;width:15px;height:15px">' + IC.send + '</span>Send to Accounting</button></div></div>');
  }
  function sendToAccounting() {
    const s = S; s.state = 'accounting'; s.ev.accounting = SPO.now();
    SPO.log(s, 'Sent to Accounting', 'Packet: PO, invoice ' + s.invoice.num + ', GL allocation · ' + money(SPO.invTotal(s)));
    SPO.save(s); closeModal('pack-ov'); renderPage();
    showToast('Sent to Accounting', money(SPO.invTotal(s)) + ' for ' + ven(s).name + ' — SPO-' + s.id + ' is with Accounting.');
  }

  function copyNum() { showToast('Copied', 'SPO-' + S.id); }
  let toastTimer;
  function showToast(title, desc) { let el = document.getElementById('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.style.cssText = 'position:fixed;bottom:24px;left:24px;z-index:600;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:14px 18px;max-width:360px;font-size:13px;transition:opacity .2s'; document.body.appendChild(el); } el.innerHTML = '<b style="display:block;font-size:14px">' + title + '</b><span style="color:var(--muted-foreground)">' + desc + '</span>'; el.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.opacity = 0, 3000); }

  window.addEventListener('hashchange', () => { actExpanded = false; renderPage(); });
  renderPage();
</script>
</body>
</html>
