<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit History — Scout Buyer</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="buyer.css">
<script src="cart.js"></script>
<script src="spo-data.js"></script>
</head>
<body class="buyer">

<!-- ===== App Bar ===== -->
<div class="app-bar-wrap">
  <nav class="app-bar" id="app-bar"></nav>
  <script src="appbar.js"></script>
</div>






<section class="hero page-hero">
  <div class="hero-bg"></div>
  <div class="hero-inner" style="flex-direction:column;gap:0">
    <div class="hero-title-block">
      <div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4h3a2 2 0 0 1 2 2v14"/><path d="M2 20h3"/><path d="M13 20h9"/><path d="M10 12v.01"/><path d="M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.561Z"/></svg></div>
      <div><h1>Unit History</h1><p id="hero-sub">Service POs and orders charged to each unit</p></div>
    </div>
  </div>
</section>

<main class="page">
  <div class="uh-zone" id="uh-zone"></div>
</main>

<script>
  /* ---------- Theme ---------- */
  function applyTheme() {
    const dark = localStorage.getItem('scout-theme') === 'dark';
    document.body.classList.toggle('dark', dark);
    const b = document.getElementById('theme-btn');
    b.querySelector('.icon-sun').style.display = dark ? 'none' : '';
    b.querySelector('.icon-moon').style.display = dark ? '' : 'none';
  }
  function toggleTheme() { localStorage.setItem('scout-theme', document.body.classList.contains('dark') ? 'light' : 'dark'); applyTheme(); }
  applyTheme();

  /* ---------- Menus ---------- */
  function closeMenus() {
    document.querySelectorAll('.menu-panel').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.nav-chip').forEach(c => c.classList.remove('open'));
  }
  function toggleMenu(id) {
    const panel = document.getElementById('menu-' + id), chip = document.getElementById('nav-' + id);
    const wasOpen = panel.classList.contains('open');
    closeMenus(); document.getElementById('ctx-switch').classList.remove('open');
    if (!wasOpen) { panel.classList.add('open'); chip.classList.add('open'); }
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-anchor')) closeMenus();
    if (!e.target.closest('.ctx-switch')) document.getElementById('ctx-switch').classList.remove('open');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); document.getElementById('ctx-switch').classList.remove('open'); } });

  /* ---------- Context switcher ---------- */
  const PROPERTIES = [
    { id: 'all', name: 'All properties', desc: 'Combined dashboard for every accessible property', units: null },
    { id: 'magnolia', name: 'Magnolia Place Apartments', addr: '4201 Veterans Memorial Blvd', city: 'Metairie, LA 70006', units: 51 },
    { id: 'bayou', name: 'Bayou Crossing Apartments', addr: '3850 Airline Dr', city: 'Baton Rouge, LA 70805', units: 120 },
    { id: 'lonestar', name: 'Lone Star Flats', addr: '7200 Westheimer Rd', city: 'Houston, TX 77057', units: 78 },
    { id: 'central', name: 'Central Park View', addr: '1501 Canal St', city: 'New Orleans, LA 70112', units: 96 },
    { id: 'cypress', name: 'Cypress Lake Apartments', addr: '9100 Cypress Lake Dr', city: 'Lafayette, LA 70508', units: 64 },
    { id: 'beauchene', name: 'Beau Chene Villas', addr: '225 Beau Chene Blvd', city: 'Mandeville, LA 70471', units: 40 },
    { id: 'sherwood', name: 'Sherwood Acres', addr: '1250 Sherwood Forest Blvd', city: 'Baton Rouge, LA 70815', units: 88 },
    { id: 'cyprus', name: 'Cyprus Glenn', addr: '4800 Cyprus Glenn Way', city: 'Shreveport, LA 71105', units: 32 },
    { id: 'heights', name: 'Magnolia Heights Apartments', addr: '6301 Magnolia Heights Rd', city: 'Houston, TX 77004', units: 110 }
  ];
  let currentProp = 'all';
  const bIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>';
  const pinIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
  function renderCtxList() {
    document.getElementById('ctx-list').innerHTML = PROPERTIES.map(p => {
      const active = p.id === currentProp;
      const body = p.id === 'all'
        ? '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.desc + '</span>'
        : '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.addr + '</span><span class="opt-city">' + pinIcon + p.city + '</span>';
      const units = p.units ? '<span class="units-badge"><b>' + p.units + '</b><span>units</span></span>' : '';
      return '<button class="ctx-option' + (active ? ' active' : '') + '" onclick="selectProp(\'' + p.id + '\')"><span class="opt-tile">' + bIcon + '</span><span class="opt-body">' + body + '</span>' + units + '</button>';
    }).join('');
  }
  function selectProp(id) {
    currentProp = id;
    const p = PROPERTIES.find(x => x.id === id);
    document.getElementById('echo-name').textContent = p.name;
    document.getElementById('echo-name').title = p.id === 'all' ? '9 accessible properties' : p.units + ' units · ' + p.city;
    renderCtxList();
    document.getElementById('ctx-switch').classList.remove('open');
    page = 1; renderPage();
  }
  function toggleCtx() {
    const el = document.getElementById('ctx-switch');
    const wasOpen = el.classList.contains('open');
    closeMenus();
    if (!wasOpen) el.classList.add('open');
  }
  renderCtxList();

  const money = SPO.money, fmtD = SPO.fmtDate, r2 = SPO.r2;
  const SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  const IC = {
    wrench: SVG + '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
    box: SVG + '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>',
    door: SVG + '<path d="M13 4h3a2 2 0 0 1 2 2v14"/><path d="M2 20h3"/><path d="M13 20h9"/><path d="M10 12v.01"/><path d="M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.561Z"/></svg>',
    rep: SVG + '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
    bldg: SVG + '<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>',
    search: SVG + '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
    chart: SVG + '<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 16h8"/><path d="M7 11h12"/><path d="M7 6h3"/></svg>'
  };
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const PER = 10;
  let P = null, U = null, page = 1, typeF = 'all', q = '', bF = '', planF = '';
  let range = 'year', cFrom = '2026-06-01', cTo = SPO.TODAY, lastCtx = currentProp;
  const propOf = id => PROPERTIES.find(x => x.id === id);

  /* ---------- range: spend periods are calendar months ---------- */
  const monthStart = (y, m) => new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 10);
  const monthEnd = (y, m) => new Date(Date.UTC(y, m + 1, 0)).toISOString().slice(0, 10);
  function rangeDates() {
    const y = +SPO.TODAY.slice(0, 4), m = +SPO.TODAY.slice(5, 7) - 1;
    if (range === 'period') return [monthStart(y, m), monthEnd(y, m), 'Current spend period · ' + MON[m] + ' ' + y];
    if (range === 'last3') return [monthStart(y, m - 2), monthEnd(y, m), 'Last 3 spend periods'];
    if (range === 'year') return [monthStart(y, m - 11), monthEnd(y, m), 'Last 12 spend periods'];
    return [cFrom <= cTo ? cFrom : cTo, cFrom <= cTo ? cTo : cFrom, 'Custom range'];
  }

  /* ---------- the unit ledger: SPO allocations + product order lines ---------- */
  const NOT_COUNTED = ['draft', 'approval', 'rejected', 'canceled'];
  function ledger(prop) {
    const out = [];
    SPO.list().filter(s => s.prop === prop).forEach(s => s.lines.forEach(l => l.alloc.forEach(a => {
      const lt = r2(l.qty * l.price);
      out.push({ unit: a.unit, date: s.ev.created.slice(0, 10), type: 'spo', ref: 'SPO-' + s.id, href: 'spo.html#' + s.id, what: l.desc, gl: a.gl, amt: a.amt,
        of: (l.alloc.length > 1 || a.amt !== lt) ? lt : null, status: SPO.STATES[s.state].label, dot: SPO.STATES[s.state].dot, counted: NOT_COUNTED.indexOf(s.state) < 0, series: s.series || null });
    })));
    SPO.ORDER_LINES.filter(o => o.prop === prop).forEach(o => out.push({ unit: o.unit, date: o.date, type: 'order', ref: 'Order #' + o.order, href: 'order-detail.html#' + o.order,
      what: o.item, sku: o.sku, qty: o.qty, gl: o.gl, amt: r2(o.qty * o.price), of: null, status: o.status, dot: o.dot, counted: o.status !== 'Canceled' }));
    return out.sort((a, b) => b.date.localeCompare(a.date));
  }

  /* ---------- search: codes, "bldg 2 unit 16", and an explanation when a number isn't a unit (SPO-48) ---------- */
  function matchUnits(units) {
    const t = q.trim().toLowerCase();
    let list = units.filter(u => (!bF || u.bldg === bF) && (!planF || u.plan === planF));
    if (!t) return list;
    const bu = t.match(/b(?:ui)?l?d?g?\.?\s*0*(\d{1,2})\D+(?:u(?:nit)?|apt)?\.?\s*0*(\d{1,2})/);
    if (bu) { const code = bu[1].padStart(2, '0') + bu[2].padStart(2, '0'); return list.filter(u => u.code === code); }
    const digits = t.replace(/\D/g, '');
    return list.filter(u => u.code.includes(t) || (digits && u.code === digits.padStart(4, '0')));
  }

  function renderPage() {
    const [hp, hu] = (location.hash || '').replace('#', '').split('/');
    if (currentProp !== lastCtx) { lastCtx = currentProp; if (currentProp !== 'all' && hp !== currentProp) { location.hash = '#' + currentProp; return; } }
    P = hp && hp !== 'all' && propOf(hp) ? hp : currentProp !== 'all' ? currentProp : null;
    U = P && hu ? hu : null;
    const zone = document.getElementById('uh-zone');
    document.getElementById('hero-sub').textContent = P ? propOf(P).name + ' · service POs and orders charged to each unit' : 'Service POs and orders charged to each unit';
    if (!P) { zone.innerHTML = gate(); return; }
    const L = ledger(P);
    zone.innerHTML = '<div class="uh-grid"><div class="card uh-picker">' + pickerHead() + '<div class="unit-list" id="unit-list"></div><div class="uh-count" id="uh-count"></div></div><div class="uh-detail" id="uh-detail">' + detail(L) + '</div></div>';
    renderList(L);
  }

  /* Units are a property's own scheme — pick one property first. */
  function gate() {
    return '<div class="card" style="max-width:640px;margin:0 auto"><div class="det-card-head hd"><div><h2 style="display:inline-flex;align-items:center;gap:10px"><span class="icon-tile sm tile-sky">' + IC.bldg + '</span>Choose a property</h2><div class="sub">Unit codes are specific to each property — pick one to see its units.</div></div></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">' + PROPERTIES.filter(p => p.id !== 'all').map(p => '<button class="opt-row" onclick="location.hash=\'#' + p.id + '\'"><span class="opt-ic">' + IC.bldg + '</span><span class="opt-body"><span class="opt-name">' + p.name + '</span><span class="opt-desc">' + p.units + ' units · ' + p.city + '</span></span></button>').join('') + '</div></div>';
  }

  function pickerHead() {
    const units = SPO.units(P), bldgs = [...new Set(units.map(u => u.bldg))], plans = [...new Set(units.map(u => u.plan))].sort();
    return '<div class="uh-pk-head"><div style="display:flex;align-items:baseline;justify-content:space-between"><h2 style="font-size:16px;font-weight:700">Units</h2><span style="font-size:12px;color:var(--muted-foreground)">' + propOf(P).name + '</span></div>' +
      '<div class="search-wrap">' + IC.search.replace('<svg', '<svg class="search-icon"') + '<input class="search-field" id="uh-q" placeholder="Unit code, or bldg 2 unit 16" value="' + q.replace(/"/g, '&quot;') + '" oninput="q = this.value; renderList()"></div>' +
      '<div class="uh-filters"><select onchange="bF = this.value; renderList()"><option value="">All buildings</option>' + bldgs.map(b => '<option value="' + b + '"' + (bF === b ? ' selected' : '') + '>Building ' + b + '</option>').join('') + '</select>' +
      '<select onchange="planF = this.value; renderList()"><option value="">All floor plans</option>' + plans.map(pl => '<option value="' + pl + '"' + (planF === pl ? ' selected' : '') + '>' + pl + '</option>').join('') + '</select></div></div>';
  }

  function spendByUnit(L) {
    const [a, b] = rangeDates(), m = {};
    L.filter(e => e.counted && e.date >= a && e.date <= b).forEach(e => { m[e.unit] = r2((m[e.unit] || 0) + e.amt); });
    return m;
  }
  function renderList(L) {
    L = L || ledger(P);
    const units = SPO.units(P), sp = spendByUnit(L), hits = matchUnits(units), t = q.trim();
    const row = (code, title, meta, cls) => '<button class="unit-row' + (cls || '') + (U === code ? ' active' : '') + '" onclick="location.hash=\'#' + P + '/' + code + '\'"><span><span class="uc">' + title + '</span><span class="um">' + meta + '</span></span><span class="us' + (sp[code] ? '' : ' zero') + '">' + (sp[code] ? money(sp[code]) : '—') + '</span></button>';
    const showCommon = !bF && !planF && (!t || 'common area'.includes(t.toLowerCase()));
    let html = showCommon ? row('COMMON', 'Common area', 'Shared spaces · property-wide', ' common') : '';
    html += hits.map(u => row(u.code, u.code, 'Bldg ' + u.bldg + ' · ' + u.plan)).join('');
    if (!hits.length && t) {
      const digits = /\d/.test(t);
      html += '<div class="uh-nomatch"><b>No unit “' + t.replace(/</g, '&lt;') + '” at ' + propOf(P).name + '</b>' + (digits ? 'Units here use building + unit codes, ' + units[0].code + '–' + units[units.length - 1].code + ' (0216 = Building 02, unit 16). Resident apartment numbers don’t map to these codes — check the building and unit.' : 'Search by unit code (e.g. 0216) or “bldg 2 unit 16”.') + '</div>';
    }
    const listEl = document.getElementById('unit-list'); listEl.innerHTML = html;
    const act = listEl.querySelector('.unit-row.active'); if (act) listEl.scrollTop = Math.max(0, act.offsetTop - listEl.offsetTop - 60);
    document.getElementById('uh-count').textContent = hits.length + ' of ' + units.length + ' units' + (bF || planF || t ? ' · filtered' : '') + ' · spend for ' + rangeDates()[2].toLowerCase();
  }

  function rangeBar() {
    const [a, b] = rangeDates(), opt = (k, l) => '<button class="' + (range === k ? 'active' : '') + '" onclick="setRange(\'' + k + '\')">' + l + '</button>';
    return '<div class="uh-range"><div class="mode-seg">' + opt('period', 'This period') + opt('last3', 'Last 3') + opt('year', '12 months') + opt('custom', 'Custom') + '</div>' +
      (range === 'custom' ? '<input type="date" value="' + cFrom + '" onchange="cFrom = this.value; renderPage()"><span style="color:var(--muted-foreground)">–</span><input type="date" value="' + cTo + '" onchange="cTo = this.value; renderPage()">' : '') +
      '<span class="uh-dates">' + fmtD(a) + ' – ' + fmtD(b) + '</span></div>';
  }
  function setRange(k) { range = k; page = 1; renderPage(); }

  function detail(L) {
    const [a, b] = rangeDates();
    if (!U) {
      const sp = spendByUnit(L), top = Object.keys(sp).filter(k => k !== 'COMMON').sort((x, y) => sp[y] - sp[x]).slice(0, 6);
      return '<div class="card"><div class="det-card-head hd"><div><h2>Most activity</h2><div class="sub">Units with the most spend · ' + rangeDates()[2].toLowerCase() + '</div></div></div><div style="margin-top:10px">' + rangeBar() + '</div>' +
        (top.length ? '<div style="margin-top:8px">' + top.map(k => { const u = SPO.units(P).find(x => x.code === k) || { bldg: k.slice(0, 2), plan: '' }; const n = L.filter(e => e.unit === k && e.date >= a && e.date <= b).length;
          return '<button class="unit-row" onclick="location.hash=\'#' + P + '/' + k + '\'" style="border-bottom:1px solid var(--border);border-radius:0"><span><span class="uc">' + k + '</span><span class="um">Bldg ' + u.bldg + ' · ' + u.plan + ' · ' + n + ' line' + (n === 1 ? '' : 's') + '</span></span><span class="us">' + money(sp[k]) + '</span></button>'; }).join('') + '</div>'
          : '<div class="empty-state" style="padding:36px 12px;text-align:center;color:var(--muted-foreground);font-size:14px">No unit spend in this range.</div>') +
        '<div class="w-note" style="margin-top:14px"><span style="display:inline-flex;width:14px;height:14px">' + IC.door + '</span><span>Select a unit to see its service POs, orders and upcoming work.</span></div></div>';
    }
    const prop = propOf(P), u = U === 'COMMON' ? null : SPO.units(P).find(x => x.code === U);
    if (U !== 'COMMON' && !u) return '<div class="card"><div class="uh-nomatch" style="margin:0"><b>Unit ' + U + ' isn’t at ' + prop.name + '</b>Pick a unit from the list.</div></div>';
    const all = L.filter(e => e.unit === U), inR = all.filter(e => e.date >= a && e.date <= b), counted = inR.filter(e => e.counted);
    const spend = r2(counted.reduce((s, e) => s + e.amt, 0));
    const nSpo = new Set(inR.filter(e => e.type === 'spo').map(e => e.ref)).size, nOrd = new Set(inR.filter(e => e.type === 'order').map(e => e.ref)).size;
    const last = all.length ? all[0].date : null;

    let h = '<div class="card"><div class="det-card-head"><div><h2 style="display:inline-flex;align-items:center;gap:10px"><span class="icon-tile sm tile-sky">' + IC.door + '</span>' + (u ? 'Unit ' + u.code : 'Common area') + '</h2>' +
      '<div class="sub">' + (u ? 'Building ' + u.bldg + ' · Unit ' + u.code.slice(2) + ' · Floor plan ' + u.plan : 'Shared spaces — clubhouse, laundry, grounds, building systems') + ' · ' + prop.name + '</div></div></div>' +
      '<div style="margin-top:12px">' + rangeBar() + '</div>' +
      '<div class="stat-strip"><div><div class="k">Spend in range</div><div class="v">' + money(spend) + '</div></div><div><div class="k">Service POs</div><div class="v">' + nSpo + '</div></div><div><div class="k">Orders</div><div class="v">' + nOrd + '</div></div><div><div class="k">Last activity</div><div class="v">' + (last ? fmtD(last) : '—') + '</div></div></div></div>';

    // spend by GL
    const byGl = {}; counted.forEach(e => { byGl[e.gl] = r2((byGl[e.gl] || 0) + e.amt); });
    const gls = Object.keys(byGl).sort((x, y) => byGl[y] - byGl[x]), max = Math.max.apply(null, gls.map(g => byGl[g]).concat([1]));
    if (gls.length) h += '<div class="card"><div class="det-card-head hd"><div><h2>Spend by GL</h2><div class="sub">Counted spend in range · drafts, pending approvals and canceled SPOs excluded</div></div></div><div class="hbars uh-hbars" style="margin-top:12px">' +
      gls.map((g, i) => '<div class="hbar" title="' + g + ' ' + SPO.glName(g) + ': ' + money(byGl[g]) + '"><span class="hbar-label"><span class="hbar-dot cat-' + (i % 4 + 1) + '"></span>' + g + ' ' + SPO.glName(g) + '</span><span class="hbar-track"><span class="hbar-fill cat-' + (i % 4 + 1) + '" style="width:' + (byGl[g] / max * 100).toFixed(1) + '%"></span></span><span class="hbar-value">' + money(byGl[g]) + '</span></div>').join('') +
      '</div><div class="hbar-total"><span>' + gls.length + ' GL code' + (gls.length === 1 ? '' : 's') + '</span><b>' + money(spend) + '</b></div></div>';

    // upcoming: schedules that charge this unit
    const sch = SCH.list().filter(x => x.prop === P && ['active', 'paused', 'approval'].indexOf(x.status) >= 0 && x.lines.some(l => l.alloc.some(al => al.unit === U)));
    if (sch.length) h += '<div class="card"><div class="det-card-head hd"><div><h2>Upcoming on this ' + (u ? 'unit' : 'area') + '</h2><div class="sub">Recurring schedules that charge it</div></div></div>' +
      sch.map(x => { const nx = SCH.nextRun(x), amt = r2(x.lines.reduce((s, l) => s + l.alloc.filter(al => al.unit === U).reduce((t, al) => t + al.amt, 0), 0));
        return '<div class="run-row' + (x.status === 'active' ? ' next' : '') + '">' + (nx && x.status === 'active' ? '<span class="rd"><b>' + nx.slice(8) + '</b><span>' + MON[+nx.slice(5, 7) - 1] + '</span></span>' : '<span class="rd" style="display:inline-flex;align-items:center;justify-content:center;height:38px;color:var(--muted-foreground)"><span style="display:inline-flex;width:16px;height:16px">' + IC.rep + '</span></span>') +
          '<div class="rb"><div><a class="table-link" href="schedule.html#' + x.id + '">' + x.name + '</a> · ' + money(amt) + ' per run</div><div class="m">' + SCH.cadenceText(x.cadence) + ' · ' + (x.status === 'active' ? 'next run ' + fmtD(nx) : SCH.STATES[x.status].label) + '</div></div>' +
          '<span class="status-dot-item"><span class="status-dot ' + SCH.STATES[x.status].dot + '"></span><span class="status-dot-label">' + SCH.STATES[x.status].label + '</span></span></div>'; }).join('') + '</div>';

    // activity table
    const rows = inR.filter(e => typeF === 'all' || e.type === typeF), pages = Math.max(1, Math.ceil(rows.length / PER));
    if (page > pages) page = pages;
    const cnt = k => inR.filter(e => k === 'all' || e.type === k).length;
    const tab = (k, l, ico) => '<button class="tab-item' + (typeF === k ? ' active' : '') + '" onclick="typeF = \'' + k + '\'; page = 1; renderPage()">' + (ico || '') + l + '<span class="tab-count">' + cnt(k) + '</span></button>';
    h += '<div class="card"><div class="det-card-head hd" style="flex-wrap:wrap;gap:12px"><div><h2>Activity on this ' + (u ? 'unit' : 'area') + '</h2><div class="sub">Every service PO line and order line charged to it · newest first</div></div>' +
      '<div class="tab-bar" style="margin:0">' + tab('all', 'All') + tab('spo', 'Service POs', IC.wrench) + tab('order', 'Orders', IC.box) + '</div></div>' +
      (rows.length ? '<div class="tbl-wrap" style="margin-top:14px;box-shadow:none"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Date</th><th>Type</th><th>Reference</th><th>What · GL</th><th style="text-align:right">Unit’s share</th><th>Status</th></tr></thead><tbody>' +
        rows.slice((page - 1) * PER, page * PER).map(e => '<tr class="data-row' + (e.counted ? '' : ' not-counted') + '"><td style="white-space:nowrap">' + fmtD(e.date) + '</td>' +
          '<td><span class="type-chip' + (e.type === 'spo' ? ' spo' : '') + '">' + (e.type === 'spo' ? IC.wrench + 'Service PO' : IC.box + 'Order') + '</span></td>' +
          '<td style="white-space:nowrap"><a class="table-link" href="' + e.href + '">' + e.ref + '</a>' + (e.series ? '<a class="rec-mark" href="schedule.html#' + e.series + '" data-tip="From schedule ' + e.series + '">' + IC.rep + '</a>' : '') + '</td>' +
          '<td style="white-space:normal;min-width:200px">' + e.what + '<span class="share-of"><b style="font-family:\'JetBrains Mono\',ui-monospace,monospace;font-weight:600;color:var(--foreground)">' + e.gl + '</b> ' + SPO.glName(e.gl) + (e.qty ? ' · ' + e.qty + ' × ' + money(e.amt / e.qty) + ' · SKU ' + e.sku : '') + '</span></td>' +
          '<td class="num" style="font-weight:600;text-align:right">' + money(e.amt) + (e.of ? '<span class="share-of">of ' + money(e.of) + '</span>' : '') + (e.counted ? '' : '<span class="share-of">not counted</span>') + '</td>' +
          '<td><span class="status-dot-item"><span class="status-dot ' + (e.dot === 'neutral' ? '' : e.dot) + '"' + (e.dot === 'neutral' ? ' style="background:var(--muted-foreground)"' : '') + '></span><span class="status-dot-label">' + e.status + '</span></span></td></tr>').join('') +
        '</tbody></table></div>' + (rows.length > PER ? '<div class="pager"><span>Showing ' + ((page - 1) * PER + 1) + '–' + Math.min(page * PER, rows.length) + ' of ' + rows.length + ' lines</span><span class="pg-btns"><button class="btn btn-sm"' + (page <= 1 ? ' disabled' : '') + ' onclick="page--; renderPage()">Previous</button><button class="btn btn-sm"' + (page >= pages ? ' disabled' : '') + ' onclick="page++; renderPage()">Next</button></span></div>' : '') + '</div>'
        : '<div style="padding:36px 12px;text-align:center;color:var(--muted-foreground);font-size:14px">Nothing charged to this ' + (u ? 'unit' : 'area') + ' ' + rangeDates()[2].toLowerCase().replace('current spend period', 'this spend period').replace('custom range', 'in this range') + '.' + (all.length ? ' <button class="w-linkbtn" onclick="setRange(\'year\')">Show the last 12 months</button>' : '') + '</div>') + '</div>';
    return h;
  }

  window.addEventListener('hashchange', () => { page = 1; typeF = 'all'; renderPage(); window.scrollTo(0, 0); });
  renderPage();
</script>
</body>
</html>
