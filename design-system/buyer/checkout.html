<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Scout Buyer</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="buyer.css">
<script src="cart.js"></script>
</head>
<body class="buyer">

<!-- ===== App Bar ===== -->
<div class="app-bar-wrap">
  <nav class="app-bar" id="app-bar"></nav>
  <script src="appbar.js"></script>
</div>








<section class="hero page-hero" id="hero-band">
  <div class="hero-bg"></div>
  <div class="hero-inner" style="flex-direction:column;gap:0">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:20px;width:100%">
      <div class="hero-title-block">
        <div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg></div>
        <div><h1>Checkout</h1><p id="hero-sub"></p></div>
      </div>
      <a class="back-link" href="cart.html" id="back-cart" style="margin:8px 0 0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>Back to Cart</a>
    </div>
    <div class="chk-steps" id="chk-steps"></div>
  </div>
</section>

<main class="page">
  <div class="det-grid" id="chk-grid">
    <div class="det-main" id="chk-main"></div>
    <div class="det-side sticky" id="chk-side"></div>
  </div>
</main>

<script>
  /* ---------- Theme ---------- */
  function applyTheme() {
    const dark = localStorage.getItem('scout-theme') === 'dark';
    document.body.classList.toggle('dark', dark);
    const b = document.getElementById('theme-btn');
    b.querySelector('.icon-sun').style.display = dark ? 'none' : '';
    b.querySelector('.icon-moon').style.display = dark ? '' : 'none';
  }
  function toggleTheme() { localStorage.setItem('scout-theme', document.body.classList.contains('dark') ? 'light' : 'dark'); applyTheme(); }
  applyTheme();

  /* ---------- Menus ---------- */
  function closeMenus() {
    document.querySelectorAll('.menu-panel').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.nav-chip').forEach(c => c.classList.remove('open'));
  }
  function toggleMenu(id) {
    const panel = document.getElementById('menu-' + id), chip = document.getElementById('nav-' + id);
    const wasOpen = panel.classList.contains('open');
    closeMenus(); document.getElementById('ctx-switch').classList.remove('open');
    if (!wasOpen) { panel.classList.add('open'); chip.classList.add('open'); }
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-anchor')) closeMenus();
    if (!e.target.closest('.ctx-switch')) document.getElementById('ctx-switch').classList.remove('open');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); document.getElementById('ctx-switch').classList.remove('open'); } });

  /* ---------- Context switcher ---------- */
  const PROPERTIES = [
    { id: 'all', name: 'All properties', desc: 'Combined dashboard for every accessible property', units: null },
    { id: 'magnolia', name: 'Magnolia Place Apartments', addr: '4201 Veterans Memorial Blvd', city: 'Metairie, LA 70006', units: 51 },
    { id: 'bayou', name: 'Bayou Crossing Apartments', addr: '3850 Airline Dr', city: 'Baton Rouge, LA 70805', units: 120 },
    { id: 'lonestar', name: 'Lone Star Flats', addr: '7200 Westheimer Rd', city: 'Houston, TX 77057', units: 78 },
    { id: 'central', name: 'Central Park View', addr: '1501 Canal St', city: 'New Orleans, LA 70112', units: 96 },
    { id: 'cypress', name: 'Cypress Lake Apartments', addr: '9100 Cypress Lake Dr', city: 'Lafayette, LA 70508', units: 64 },
    { id: 'beauchene', name: 'Beau Chene Villas', addr: '225 Beau Chene Blvd', city: 'Mandeville, LA 70471', units: 40 },
    { id: 'sherwood', name: 'Sherwood Acres', addr: '1250 Sherwood Forest Blvd', city: 'Baton Rouge, LA 70815', units: 88 },
    { id: 'cyprus', name: 'Cyprus Glenn', addr: '4800 Cyprus Glenn Way', city: 'Shreveport, LA 71105', units: 32 },
    { id: 'heights', name: 'Magnolia Heights Apartments', addr: '6301 Magnolia Heights Rd', city: 'Houston, TX 77004', units: 110 }
  ];
  let currentProp = 'all';
  const bIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>';
  const pinIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
  function renderCtxList() {
    document.getElementById('ctx-list').innerHTML = PROPERTIES.map(p => {
      const active = p.id === currentProp;
      const body = p.id === 'all'
        ? '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.desc + '</span>'
        : '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.addr + '</span><span class="opt-city">' + pinIcon + p.city + '</span>';
      const units = p.units ? '<span class="units-badge"><b>' + p.units + '</b><span>units</span></span>' : '';
      return '<button class="ctx-option' + (active ? ' active' : '') + '" onclick="selectProp(\'' + p.id + '\')"><span class="opt-tile">' + bIcon + '</span><span class="opt-body">' + body + '</span>' + units + '</button>';
    }).join('');
  }
  function selectProp(id) {
    currentProp = id;
    const p = PROPERTIES.find(x => x.id === id);
    document.getElementById('echo-name').textContent = p.name;
    document.getElementById('echo-name').title = p.id === 'all' ? '9 accessible properties' : p.units + ' units · ' + p.city;
    renderCtxList();
    document.getElementById('ctx-switch').classList.remove('open');
    renderPage();
  }
  function toggleCtx() {
    const el = document.getElementById('ctx-switch');
    const wasOpen = el.classList.contains('open');
    closeMenus();
    if (!wasOpen) el.classList.add('open');
  }
  renderCtxList();




  const money = v => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const VEN = { SD: 'Scout Demo Vendor', ID: 'Ideal DEV', CH: 'API Test - Chadwell', GB: 'Gorman Bros', AW: 'The Appliance Warehouse - LCR', SA: "Stanton's Appliance" };
  const glyph = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M4 8h16"/><circle cx="8" cy="5" r="0.6"/><circle cx="11" cy="5" r="0.6"/><path d="M8 12h8"/><path d="M8 16h8"/></svg>';
  const IC = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    truck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35a1 1 0 0 0-.78-.38H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>',
    card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
    bld: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>',
    box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>',
    bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a4 4 0 0 1-8 0"/><path d="M3.103 6.034h17.794"/><path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"/></svg>'
  };
  const SHIP = [
    { id: 'son', name: 'Overnight', price: 15.99, eta: 'Arrives Tue, Aug 25' },
    { id: 'sex', name: 'Expedited', price: 25.00, eta: 'Arrives Tue, Aug 25 by 12 PM' },
    { id: 's2', name: '2 Business Days', price: 11.99, eta: 'Arrives Wed, Aug 26' },
    { id: 's35', name: '3 - 5 Business Days', price: 7.99, eta: 'Arrives Thu, Aug 27 – Mon, Aug 31' },
    { id: 'pick', name: 'In-Store Pickup', price: 0, eta: 'Ready today · 8 mi away', free: true }
  ];
  const state = { ship: {}, pay: {} };
  const openItems = new Set();
  let lastStep = null;
  const plural = n => n + (n === 1 ? ' item' : ' items');
  function toggleItems(v) { openItems.has(v) ? openItems.delete(v) : openItems.add(v); renderPage(); }
  const propId = () => currentProp === 'all' ? 'magnolia' : currentProp;
  const step = () => (location.hash || '#address').replace('#', '');
  window.addEventListener('hashchange', renderPage);

  function vendorsOf(items) { return [...new Set(items.map(i => i.vendor))]; }
  function shipTotal(vendors) { return vendors.reduce((a, v) => a + (state.ship[v] ? SHIP.find(s => s.id === state.ship[v]).price : 0), 0); }
  function allShipped(vendors) { return vendors.every(v => state.ship[v]); }
  function allReady(vendors) { return vendors.every(v => state.ship[v] && state.pay[v]); }

  function stepBand(cur) {
    const steps = [['address', 'Address', 'Delivery location'], ['shipping', 'Shipping & Payment', 'Per-vendor options'], ['review', 'Review & Place Order', 'Confirm details']];
    const idx = { address: 0, shipping: 1, review: 2, placed: 3 }[cur];
    document.getElementById('chk-steps').innerHTML = steps.map(([id, t, d], i) => {
      const cls = i < idx ? 'done' : i === idx ? 'active' : '';
      const n = i < idx ? IC.check : (i + 1);
      return '<div class="chk-step ' + cls + '"' + (i < idx ? ' onclick="location.hash=\'#' + id + '\'"' : '') + '><span class="n">' + n + '</span><span><span class="t">' + t + '</span><br><span class="d">' + d + '</span></span></div>' + (i < 2 ? '<div class="chk-conn' + (i < idx ? ' done' : '') + '"></div>' : '');
    }).join('');
  }

  function optRow(sel, onclick, icon, name, priceHtml, extra) {
    return '<button class="opt-row' + (sel ? ' selected' : '') + (extra && extra.disabled ? ' disabled' : '') + (onclick ? '' : ' readonly') + '"' + (onclick && !(extra && extra.disabled) ? ' onclick="' + onclick + '"' : '') + '>' +
      (icon ? '<span class="opt-ic">' + icon + '</span>' : '') + '<span class="opt-body"><span class="opt-name">' + name + (extra && extra.chip ? '<span class="soon-chip">' + extra.chip + '</span>' : '') + '</span>' + (extra && extra.desc ? '<span class="opt-desc">' + extra.desc + '</span>' : '') + '</span>' +
      '<span class="opt-price' + (extra && extra.free ? ' free' : '') + '">' + priceHtml + '</span><span class="opt-radio">' + IC.check + '</span></button>';
  }

  function buyerDetailsCard(prop) {
    return '<div class="card"><div class="det-card-head"><h2 style="font-size:16px">Buyer details</h2></div>' +
      '<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:10px"><span class="v-avatar">AG</span><div><div style="font-size:14px;font-weight:600">Alicia Grant</div><div style="font-size:12px;color:var(--muted-foreground)">alicia.grant@demoinc.com</div></div></div>' +
      '<div class="deliver-card" style="padding:0"><span class="icon-tile tile-sky" style="width:40px;height:40px">' + IC.bld + '</span><div><div class="ven-eyebrow">Delivering to</div><div class="ven-name" style="margin-bottom:2px">' + prop.name + '</div><div style="font-size:13px;color:var(--muted-foreground)">' + prop.addr + ', ' + prop.city + '</div></div></div></div>';
  }
  const secureBar = '<div class="secure-bar">' + IC.lock + 'Secure Checkout</div>';

  function renderPage() {
    if (currentProp === 'all') { selectProp(localStorage.getItem('scout-checkout-prop') || 'magnolia'); return; }
    const cur = step();
    const items = CART.itemsFor(currentProp);
    if (cur === 'review' && lastStep !== 'review') vendorsOf(items).forEach(v => openItems.add(v));
    lastStep = cur;
    const prop = PROPERTIES.find(x => x.id === currentProp);
    const vendors = vendorsOf(items);
    const sub = CART.subtotalFor(currentProp);
    const main = document.getElementById('chk-main'), side = document.getElementById('chk-side');
    document.getElementById('hero-sub').textContent = '1 Fulfillment location · ' + prop.name;

    if (cur === 'placed') {
      let rc = null;
      try { rc = JSON.parse(localStorage.getItem('scout-last-order')); } catch (e) {}
      const rprop = PROPERTIES.find(x => x.id === (rc ? rc.prop : currentProp)) || prop;
      document.getElementById('hero-band').style.display = '';
      document.getElementById('chk-steps').style.display = 'none';
      document.getElementById('back-cart').style.display = 'none';
      document.querySelector('.hero-title-block').style.display = 'none';
      const grid = document.getElementById('chk-grid');
      grid.style.gridTemplateColumns = '1fr';
      grid.style.marginTop = '-36px';
      side.innerHTML = '';
      main.innerHTML = '<div class="confirm-wrap" style="padding-top:0"><div class="confirm-ic" style="width:72px;height:72px"><svg style="width:34px;height:34px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg></div>' +
        '<h1 style="margin-bottom:0">Order placed successfully</h1>' +
        '<div class="confirm-sub">' + rprop.name + ' · Confirmation sent to alicia.grant@demoinc.com</div>' +
        (rc ? '<div class="card next-card" style="margin-bottom:16px"><div class="det-card-head"><h2 style="font-size:16px;display:inline-flex;align-items:center;gap:8px"><span style="color:var(--emerald);display:inline-flex;width:17px;height:17px">' + IC.box + '</span>' + (rc.orders.length === 1 ? 'Order placed' : rc.orders.length + ' orders placed') + '</h2></div>' +
        rc.orders.map(o => '<div class="rcpt-row"><span class="mono">#' + o.num + '</span><span class="rcpt-body"><span class="rcpt-name">' + o.name + '</span><span class="rcpt-sub" style="display:block">' + o.count + (o.count === 1 ? ' item' : ' items') + ' · ' + o.ship + '</span></span><span class="rcpt-total">' + money(o.total) + '</span></div>').join('') +
        '<div class="rcpt-grand"><span>Total</span><span>' + money(rc.grand) + '</span></div></div>' : '') +
        (rc && rc.over ? '<div class="callout amber" style="text-align:left;margin-bottom:16px"><b>Sent for approval</b>This order exceeds the property\'s budget, so it needs a Supervisor\'s sign-off before it\'s released to the vendor. <a class="table-link" href="approvals.html" style="font-size:13px">View approvals</a></div>' : '') +
        '<div class="card next-card"><div class="det-card-head"><h2 style="font-size:16px">What happens next?</h2></div>' +
        '<div class="next-step"><span class="nn">1</span><div><b>Order confirmation</b><span>You\'ll receive an email confirming your order details.</span></div></div>' +
        '<div class="next-step"><span class="nn">2</span><div><b>Processing &amp; shipping</b><span>Each vendor or fulfillment location processes its order separately.</span></div></div>' +
        '<div class="next-step"><span class="nn">3</span><div><b>Track it from Orders</b><span>Follow delivery and validate receipt from Order Tracking.</span></div></div></div>' +
        '<div class="confirm-actions"><a class="btn btn-primary" style="display:inline-flex;align-items:center;gap:8px" href="orders.html"><span style="display:inline-flex;width:16px;height:16px">' + IC.box + '</span>Track your orders</a>' +
        '<a class="btn" style="display:inline-flex;align-items:center;gap:8px" href="marketplace.html"><span style="display:inline-flex;width:16px;height:16px">' + IC.bag + '</span>Continue Shopping</a></div></div>';
      return;
    }
    document.getElementById('hero-band').style.display = '';
    document.getElementById('back-cart').style.display = '';
    document.getElementById('chk-steps').style.display = '';
    document.querySelector('.hero-title-block').style.display = '';
    document.getElementById('chk-grid').style.gridTemplateColumns = '';
    document.getElementById('chk-grid').style.marginTop = '';
    if (!items.length) { location.href = 'cart.html'; return; }
    stepBand(cur);

    if (cur === 'address') {
      main.innerHTML = '<div class="card"><div class="det-card-head hd"><h2 style="display:inline-flex;align-items:center;gap:10px"><span class="icon-tile sm tile-sky">' + IC.pin + '</span>Delivery Address</h2></div>' +
        '<div class="chk-box"><span class="icon-tile tile-sky">' + IC.bld + '</span><div><div style="font-size:14px;font-weight:700">' + prop.name + '</div><div style="font-size:13px;color:var(--muted-foreground);margin-top:2px">' + prop.addr + ', ' + prop.city + '</div></div></div>' + '</div>' +
        '<div class="card"><div class="det-card-head hd"><h2 style="display:inline-flex;align-items:center;gap:10px"><span class="icon-tile sm tile-sky">' + IC.user + '</span>Contact</h2></div>' +
        '<div class="chk-box" style="align-items:center"><span class="v-avatar">AG</span><div><div style="font-size:14px;font-weight:600">Alicia Grant</div><div style="font-size:12px;color:var(--muted-foreground)">alicia.grant@demoinc.com</div></div></div>' +
        '<button class="btn btn-primary btn-block" style="margin-top:16px" onclick="location.hash = \'#shipping\'">Proceed</button></div>';
      side.innerHTML = '<div class="card"><div class="det-card-head"><h2>Order Summary</h2></div>' +
        (vendors.length > 1 ? vendors.map(v => '<div class="sum-vendor"><span class="ven-logo" style="width:30px;height:30px;font-size:10px">' + v + '</span>' + VEN[v] + '<span class="sv-total">' + money(items.filter(i => i.vendor === v).reduce((a, i) => a + i.qty * i.price, 0)) + '</span></div>').join('') : '') +
        '<div class="sum-row"><span class="muted">Subtotal (' + plural(CART.countFor(currentProp)) + ')</span><span>' + money(sub) + '</span></div>' +
        '<div class="sum-row"><span class="muted">Shipping</span><span class="hint">Calculated after address</span></div>' +
        '<div class="sum-row"><span class="muted">Tax</span><span class="hint">Handled by vendor</span></div></div>' + secureBar;
      return;
    }

    // shipping + review share the vendor card
    const review = cur === 'review';
    main.innerHTML = vendors.map(v => {
      const vi = items.filter(i => i.vendor === v);
      const vt = vi.reduce((a, i) => a + i.qty * i.price, 0);
      const shipSel = state.ship[v];
      const paySel = state.pay[v] || null;
      const chip = (done, n, label) => '<span class="vp' + (done ? ' done' : '') + '"><span class="pdot">' + (done ? IC.check : n) + '</span>' + label + '</span>';
      const prog = review ? '<a class="table-link" onclick="location.hash=\'#shipping\'">Edit</a>' : '<div class="vprog">' + chip(!!shipSel, 1, 'Shipping') + '<span class="vp-sep"></span>' + chip(!!paySel, 2, 'Payment') + '<span class="vp-sep"></span>' + chip(!!shipSel && !!paySel, 3, 'Ready') + '</div>';
      const itemsOpen = openItems.has(v);
      return '<div class="card" data-v="' + v + '"><div class="vg-head" style="border-bottom:none;padding-bottom:8px"><div class="vg-id"><span class="ven-logo">' + v + '</span><div><div class="vg-name">' + VEN[v] + '</div>' +
        '<button class="gl-toggle' + (itemsOpen ? ' open' : '') + '" style="margin-top:2px" onclick="toggleItems(\'' + v + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' + (n => n + (n === 1 ? ' item' : ' items'))(vi.reduce((a, i) => a + i.qty, 0)) + ' · ' + money(vt) + '</button></div></div>' + prog + '</div>' +
        (itemsOpen ? vi.map(i => '<div class="cart-item" style="padding:12px 0"><div class="ci-row" style="grid-template-columns:48px 1fr auto;align-items:center"><span class="ci-thumb" style="width:48px;height:48px">' + glyph + '</span><div><div class="ci-name" style="font-size:13px">' + i.name + '</div><div class="ci-unit" style="font-size:12px">' + money(i.price) + ' × ' + i.qty + '</div></div><span class="ci-line" style="font-size:14px">' + money(i.qty * i.price) + '</span></div></div>').join('') : '') +
        '<div class="opt-group-title">' + IC.truck + 'Shipping & Pickup' + (shipSel && !review ? '<span class="ok">' + IC.check + '</span>' : '') + '</div>' +
        SHIP.filter(s => !review || shipSel === s.id).map(s => optRow(shipSel === s.id, review ? '' : 'pickShip(\'' + v + '\',\'' + s.id + '\')', null, s.name, s.free ? 'Free' : money(s.price), { desc: s.eta, free: s.free })).join('') +
        '<div class="opt-group-title">' + IC.card + 'Payment Method' + (paySel && !review ? '<span class="ok">' + IC.check + '</span>' : '') + '</div>' +
        optRow(paySel === 'po', review ? '' : 'pickPay(\'' + v + '\',\'po\')', IC.doc, 'Purchase Orders', '', { desc: 'Traditional purchase order workflow' }) +
        (review ? '' : optRow(false, '', IC.card, 'Direct Checkout', '', { desc: 'Accept card payments directly via Stripe Connect', chip: 'Coming Soon', disabled: true })) +
        '<div class="det-totals"><div class="tot-row"><span>Subtotal</span><span>' + money(vt) + '</span></div>' +
        '<div class="tot-row"><span>Shipping' + (shipSel ? ' · ' + SHIP.find(s => s.id === shipSel).name : '') + '</span><span>' + (shipSel ? money(SHIP.find(s => s.id === shipSel).price) : '—') + '</span></div>' +
        '<div class="tot-row grand"><span>Vendor Total</span><span>' + money(vt + (shipSel ? SHIP.find(s => s.id === shipSel).price : 0)) + '</span></div></div></div>';
    }).join('');

    const shipCost = vendors.reduce((a, v) => a + (state.ship[v] ? SHIP.find(s => s.id === state.ship[v]).price : 0), 0);
    const ready = allReady(vendors);
    if (!review) {
      side.innerHTML = '<div class="card"><div class="det-card-head"><h2>Order Total</h2></div>' +
        (vendors.length > 1 ? vendors.map(v => '<div class="sum-vendor"><span class="ven-logo" style="width:30px;height:30px;font-size:10px">' + v + '</span>' + VEN[v] + '<span class="sv-total">' + money(items.filter(i => i.vendor === v).reduce((a, i) => a + i.qty * i.price, 0)) + '</span></div>').join('') : '') +
        '<div class="sum-row"><span class="muted">Subtotal (' + plural(CART.countFor(currentProp)) + ')</span><span>' + money(sub) + '</span></div>' +
        '<div class="sum-row"><span class="muted">Shipping</span>' + (allShipped(vendors) ? '<span>' + money(shipCost) + '</span>' : '<span class="hint">Select a shipping option</span>') + '</div>' +
        '<div class="sum-row"><span class="muted">Tax</span><span class="hint">Handled by vendor</span></div>' +
        '<div class="sum-grand"><span>Order Total</span><span class="amt">' + money(sub + shipCost) + '</span></div>' +
        '<button class="btn btn-primary btn-block" style="margin-top:14px"' + (ready ? ' onclick="location.hash=\'#review\'"' : ' disabled') + '>Continue to Review</button></div>' +
        buyerDetailsCard(prop) + secureBar;
    } else {
      const total = sub + shipCost;
      side.innerHTML = '<div class="card"><div class="det-card-head"><h2>Review Order</h2></div>' +
        '<div class="coupon-row"><input placeholder="Enter coupon code"><button class="btn" style="height:40px">Apply</button></div>' +
        (vendors.length > 1 ? vendors.map(v =>
          '<div class="sum-vendor"><span class="ven-logo" style="width:30px;height:30px;font-size:10px">' + v + '</span>' + VEN[v] + '<span style="color:var(--emerald);display:inline-flex;width:15px;height:15px;margin-left:6px;flex-shrink:0">' + IC.check + '</span><span class="sv-total">' + money(items.filter(i => i.vendor === v).reduce((a, i) => a + i.qty * i.price, 0)) + '</span></div>').join('') : '') +
        '<div class="sum-row"><span class="muted">Subtotal</span><span>' + money(sub) + '</span></div>' +
        '<div class="sum-row"><span class="muted">Shipping</span><span>' + money(shipCost) + '</span></div>' +
        '<div class="sum-row"><span class="muted">Tax</span><span class="hint">Handled by vendor</span></div>' +
        '<div class="sum-grand"><span>Total</span><span class="amt">' + money(total) + '</span></div>' +
        '<button class="btn btn-primary btn-block" style="margin-top:14px" onclick="placeOrder()">Place ' + vendors.length + ' Order' + (vendors.length > 1 ? 's' : '') + ' – ' + money(total) + '</button></div>' +
        buyerDetailsCard(prop) + secureBar;
    }
  }

  function pickShip(v, id) { state.ship[v] = id; renderPage(); advanceFrom(v); }
  function pickPay(v, id) { state.pay[v] = id; renderPage(); advanceFrom(v); }
  function advanceFrom(v) {
    if (!(state.ship[v] && state.pay[v])) return;
    const next = [...document.querySelectorAll('#chk-main .card[data-v]')].find(c => { const cv = c.dataset.v; return !(state.ship[cv] && state.pay[cv]); });
    if (next) setTimeout(() => next.scrollIntoView({ behavior: 'smooth', block: 'start' }), 120);
  }
  const BUDGET = 2500;
  function placeOrder() {
    const items = CART.itemsFor(currentProp);
    const vendors = vendorsOf(items);
    let seq = parseInt(localStorage.getItem('scout-order-seq') || '412', 10);
    const orders = vendors.map(v => {
      const vi = items.filter(i => i.vendor === v);
      const ship = SHIP.find(x => x.id === state.ship[v]);
      const total = vi.reduce((a, i) => a + i.qty * i.price, 0) + ship.price;
      return { num: seq++, v, name: VEN[v], count: vi.reduce((a, i) => a + i.qty, 0), ship: ship.name, total: Math.round(total * 100) / 100 };
    });
    localStorage.setItem('scout-order-seq', String(seq));
    const receipt = { orders, grand: Math.round(orders.reduce((a, o) => a + o.total, 0) * 100) / 100, prop: currentProp, over: orders.reduce((a, o) => a + o.total, 0) > BUDGET };
    localStorage.setItem('scout-last-order', JSON.stringify(receipt));
    CART.clear(currentProp); CART.syncBadge(); location.hash = '#placed';
  }

  renderPage();
</script>
</body>
</html>
