<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart — Scout Buyer</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="buyer.css">
<script src="cart.js"></script>
</head>
<body class="buyer">

<!-- ===== App Bar ===== -->
<div class="app-bar-wrap">
  <nav class="app-bar" id="app-bar"></nav>
  <script src="appbar.js"></script>
</div>







<section class="hero page-hero">
  <div class="hero-bg"></div>
  <div class="hero-inner" style="flex-direction:column;gap:0">
    <div class="hero-title-block">
      <div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></div>
      <div><h1>Shopping Cart</h1><p id="hero-sub"></p></div>
    </div>
  </div>
</section>

<main class="page">
  <div class="det-grid" id="cart-grid">
    <div class="det-main" id="cart-main"></div>
    <div class="det-side" id="cart-side"></div>
  </div>
</main>

<script>
  /* ---------- Theme ---------- */
  function applyTheme() {
    const dark = localStorage.getItem('scout-theme') === 'dark';
    document.body.classList.toggle('dark', dark);
    const b = document.getElementById('theme-btn');
    b.querySelector('.icon-sun').style.display = dark ? 'none' : '';
    b.querySelector('.icon-moon').style.display = dark ? '' : 'none';
  }
  function toggleTheme() { localStorage.setItem('scout-theme', document.body.classList.contains('dark') ? 'light' : 'dark'); applyTheme(); }
  applyTheme();

  /* ---------- Menus ---------- */
  function closeMenus() {
    document.querySelectorAll('.menu-panel').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.nav-chip').forEach(c => c.classList.remove('open'));
  }
  function toggleMenu(id) {
    const panel = document.getElementById('menu-' + id), chip = document.getElementById('nav-' + id);
    const wasOpen = panel.classList.contains('open');
    closeMenus(); document.getElementById('ctx-switch').classList.remove('open');
    if (!wasOpen) { panel.classList.add('open'); chip.classList.add('open'); }
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-anchor')) closeMenus();
    if (!e.target.closest('.ctx-switch')) document.getElementById('ctx-switch').classList.remove('open');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); document.getElementById('ctx-switch').classList.remove('open'); } });

  /* ---------- Context switcher ---------- */
  const PROPERTIES = [
    { id: 'all', name: 'All properties', desc: 'Combined dashboard for every accessible property', units: null },
    { id: 'magnolia', name: 'Magnolia Place Apartments', addr: '4201 Veterans Memorial Blvd', city: 'Metairie, LA 70006', units: 51 },
    { id: 'bayou', name: 'Bayou Crossing Apartments', addr: '3850 Airline Dr', city: 'Baton Rouge, LA 70805', units: 120 },
    { id: 'lonestar', name: 'Lone Star Flats', addr: '7200 Westheimer Rd', city: 'Houston, TX 77057', units: 78 },
    { id: 'central', name: 'Central Park View', addr: '1501 Canal St', city: 'New Orleans, LA 70112', units: 96 },
    { id: 'cypress', name: 'Cypress Lake Apartments', addr: '9100 Cypress Lake Dr', city: 'Lafayette, LA 70508', units: 64 },
    { id: 'beauchene', name: 'Beau Chene Villas', addr: '225 Beau Chene Blvd', city: 'Mandeville, LA 70471', units: 40 },
    { id: 'sherwood', name: 'Sherwood Acres', addr: '1250 Sherwood Forest Blvd', city: 'Baton Rouge, LA 70815', units: 88 },
    { id: 'cyprus', name: 'Cyprus Glenn', addr: '4800 Cyprus Glenn Way', city: 'Shreveport, LA 71105', units: 32 },
    { id: 'heights', name: 'Magnolia Heights Apartments', addr: '6301 Magnolia Heights Rd', city: 'Houston, TX 77004', units: 110 }
  ];
  let currentProp = 'all';
  const bIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>';
  const pinIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
  function renderCtxList() {
    document.getElementById('ctx-list').innerHTML = PROPERTIES.map(p => {
      const active = p.id === currentProp;
      const body = p.id === 'all'
        ? '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.desc + '</span>'
        : '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.addr + '</span><span class="opt-city">' + pinIcon + p.city + '</span>';
      const units = p.units ? '<span class="units-badge"><b>' + p.units + '</b><span>units</span></span>' : '';
      return '<button class="ctx-option' + (active ? ' active' : '') + '" onclick="selectProp(\'' + p.id + '\')"><span class="opt-tile">' + bIcon + '</span><span class="opt-body">' + body + '</span>' + units + '</button>';
    }).join('');
  }
  function selectProp(id) {
    currentProp = id;
    const p = PROPERTIES.find(x => x.id === id);
    document.getElementById('echo-name').textContent = p.name;
    document.getElementById('echo-name').title = p.id === 'all' ? '9 accessible properties' : p.units + ' units · ' + p.city;
    renderCtxList();
    document.getElementById('ctx-switch').classList.remove('open');
    renderPage();
  }
  function toggleCtx() {
    const el = document.getElementById('ctx-switch');
    const wasOpen = el.classList.contains('open');
    closeMenus();
    if (!wasOpen) el.classList.add('open');
  }
  renderCtxList();




  const money = v => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const VEN = { SD: 'Scout Demo Vendor', ID: 'Ideal DEV', CH: 'API Test - Chadwell', GB: 'Gorman Bros', AW: 'The Appliance Warehouse - LCR', SA: "Stanton's Appliance" };
  const GL_CODES = [['5200', 'R & M - APPLIANCES'], ['5210', 'rm_appliance_parts'], ['6100', 'R & M - GARAGE REPAIRS'], ['6101', 'rm_hvac_filters'], ['6102', 'rm_hvac_parts'], ['6103', 'rm_hvac_refrigerant'], ['6104', 'rm_hvac_coil_cleaning'], ['6105', 'R & M - GLASS'], ['6106', 'rm_hvac_thermostats'], ['8100', 'RR - PLUMBING'], ['8200', 'RR - ELECTRICAL']];
  const UNITS = [
    ['A101', 'Building A · 1 Bedroom 1 Bath', '1BR/1BA'], ['A102', 'Building A · 1 Bedroom 1 Bath', '1BR/1BA'],
    ['A103', 'Building A · 2 Bedroom 1 Bath', '2BR/1BA'], ['A104', 'Building A · 2 Bedroom 1 Bath', '2BR/1BA'],
    ['A105', 'Building A · 2 Bedroom 2 Bath', '2BR/2BA'], ['A106', 'Building A · 2 Bedroom 2 Bath', '2BR/2BA'],
    ['B120', 'Building B · 2 Bedroom 2 Bath', '2BR/2BA'], ['B121', 'Building B · 3 Bedroom 2 Bath', '3BR/2BA'],
    ['B122', 'Building B · 3 Bedroom 2 Bath', '3BR/2BA'], ['B123', 'Building B · 3 Bedroom 2 Bath', '3BR/2BA'],
    ['B124', 'Building B · 3 Bedroom 2 Bath', '3BR/2BA'], ['B125', 'Building B · 3 Bedroom 2 Bath', '3BR/2BA'],
    ['CA', 'Common Area', 'Shared spaces'], ['LRA', 'Laundry Room A', 'Building A'], ['LRB', 'Laundry Room B', 'Building B']
  ];
  const combo = { open: null, q: '' };
  function comboHtml(key, placeholder, opts, selected) {
    const isOpen = combo.open === key;
    const q = isOpen ? combo.q.toLowerCase() : '';
    const list = opts.filter(o => !q || (o[0] + ' ' + o[1] + ' ' + (o[2] || '')).toLowerCase().includes(q));
    return '<div class="combo' + (isOpen ? ' open' : '') + '" data-key="' + key + '">' +
      '<button class="combo-trigger" onclick="comboToggle(\'' + key + '\')">' + (selected ? selected : '<span class="ph">' + placeholder + '</span>') +
      '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg></button>' +
      '<div class="combo-pop"><div class="combo-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="combo-in-' + key + '" placeholder="Search…" value="' + combo.q.replace(/"/g, '&quot;') + '" oninput="comboFilter(\'' + key + '\', this.value)"></div>' +
      '<div class="combo-list">' + (list.length ? list.map(o => {
        const label = (o[0] ? '<span class="code">' + o[0] + '</span>' : '') + '<span>' + o[1] + (o[2] ? '<span class="sub">' + o[2] + '</span>' : '') + '</span>';
        const val = (o[0] ? o[0] + ' · ' : '') + o[1];
        return '<button class="combo-opt' + (selected === val ? ' selected' : '') + '" onclick="comboPick(\'' + key + '\', \'' + val.replace(/'/g, "\\'") + '\')">' + label + '</button>';
      }).join('') : '<div class="combo-empty">No matches</div>') + '</div></div></div>';
  }
  function comboToggle(key) { combo.open = combo.open === key ? null : key; combo.q = ''; renderPage(); if (combo.open) { const el = document.getElementById('combo-in-' + key); if (el) el.focus(); } }
  function comboFilter(key, v) { combo.q = v; const scroll = {}; renderPage(); const el = document.getElementById('combo-in-' + key); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  function comboPick(key, val) {
    const [kind, id] = key.split('~');
    CART.setMeta(currentProp, id, kind === 'gl' ? { gl: val } : { unit: val });
    combo.open = null; combo.q = '';
    renderPage();
  }
  document.addEventListener('click', e => { if (combo.open && e.target.isConnected && !e.target.closest('.combo')) { combo.open = null; combo.q = ''; renderPage(); } });
  const glyph = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M4 8h16"/><circle cx="8" cy="5" r="0.6"/><circle cx="11" cy="5" r="0.6"/><path d="M8 12h8"/><path d="M8 16h8"/></svg>';
  const openGL = new Set();
  const propId = () => currentProp === 'all' ? 'magnolia' : currentProp;

  function renderPage() {
    if (currentProp === 'all') { selectProp('magnolia'); return; }
    const items = CART.itemsFor(currentProp);
    const prop = PROPERTIES.find(x => x.id === currentProp);
    const main = document.getElementById('cart-main'), side = document.getElementById('cart-side');
    const vendors = [...new Set(items.map(i => i.vendor))];
    document.getElementById('hero-sub').textContent = items.length
      ? CART.countFor(currentProp) + (CART.countFor(currentProp) === 1 ? ' item' : ' items') + ' from ' + vendors.length + (vendors.length === 1 ? ' Vendor' : ' Vendors')
      : 'Nothing here yet';

    if (!items.length) {
      main.innerHTML = '<div class="empty-state">' +
        '<div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></div>' +
        '<div class="empty-state-title">Your cart is empty</div>' +
        '<div class="empty-state-desc">Products you add for ' + prop.name + ' will show up here, grouped by vendor.</div>' +
        '<a class="btn btn-primary" href="marketplace.html">Browse the Marketplace</a></div>';
      side.innerHTML = '';
      document.getElementById('cart-grid').style.gridTemplateColumns = '1fr';
      return;
    }
    document.getElementById('cart-grid').style.gridTemplateColumns = '';

    main.innerHTML = vendors.map(v => {
      const vi = items.filter(i => i.vendor === v);
      const vt = vi.reduce((a, i) => a + i.qty * i.price, 0);
      return '<div class="card"><div class="vg-head"><div class="vg-id"><span class="ven-logo">' + v + '</span><div><div class="vg-name">' + VEN[v] + '</div><div class="vg-sub">' + vi.reduce((a, i) => a + i.qty, 0) + (vi.reduce((a, i) => a + i.qty, 0) === 1 ? ' item' : ' items') + '</div></div></div><span style="display:flex;align-items:center;gap:10px"><button class="btn" style="height:34px;font-size:13px;display:inline-flex;align-items:center;gap:7px"><svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>Request Quote</button><span class="vg-total">' + money(vt) + '</span></span></div>' +
        vi.map(i => {
          const gl = openGL.has(i.id);
          return '<div class="cart-item"><div class="ci-row"><span class="ci-thumb">' + glyph + '</span>' +
          '<div><div class="ci-name">' + i.name + '</div><div class="ci-unit">' + money(i.price) + ' / each</div>' +
          '<div class="ci-controls"><span class="stepper"><button onclick="chgQty(\'' + i.id + '\',-1)"' + (i.qty <= 1 ? ' disabled' : '') + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button><input value="' + i.qty + '" onchange="setQtyIn(\'' + i.id + '\', this.value)"><button onclick="chgQty(\'' + i.id + '\',1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></span></div>' +
          '<button class="gl-toggle' + (gl ? ' open' : '') + '" onclick="toggleGL(\'' + i.id + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>GL Code &amp; Unit</button>' +
          '<div class="gl-panel' + (gl ? ' open' : '') + '" style="overflow:visible"><div class="gl-field"><label>GL Code</label>' + comboHtml('gl~' + i.id, 'Select GL Code…', GL_CODES, i.gl || '') + '</div><div class="gl-field"><label>Unit (optional)</label>' + comboHtml('unit~' + i.id, 'Select Unit…', UNITS, i.unit || '') + '</div></div></div>' +
          '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px"><button class="icon-btn ci-remove" title="Remove" onclick="removeItem(\'' + i.id + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button><span class="ci-line">' + money(i.qty * i.price) + '</span></div>' +
          '</div></div>';
        }).join('') +
        '</div>';
    }).join('');

    const sub = CART.subtotalFor(currentProp);
    side.innerHTML = '<div class="card"><div class="det-card-head"><h2>Order Summary</h2></div>' +
      (vendors.length > 1 ? vendors.map(v => '<div class="sum-vendor"><span class="ven-logo" style="width:30px;height:30px;font-size:10px">' + v + '</span>' + VEN[v] + '<span class="sv-total">' + money(items.filter(i => i.vendor === v).reduce((a, i) => a + i.qty * i.price, 0)) + '</span></div>').join('') : '') +
      '<div class="sum-row"><span class="muted">Subtotal (' + (n => n + (n === 1 ? ' item' : ' items'))(CART.countFor(currentProp)) + ')</span><span>' + money(sub) + '</span></div>' +
      '<div class="sum-row"><span class="muted">Shipping</span><span class="hint">Calculated at checkout</span></div>' +
      '<div class="sum-grand"><span>Estimated Total</span><span class="amt">' + money(sub) + '</span></div>' +
      '<a class="btn btn-primary btn-block" style="margin-top:14px" href="checkout.html" onclick="localStorage.setItem(&quot;scout-checkout-prop&quot;, currentProp)">Proceed to Checkout</a></div>' +
      '<div class="card deliver-card"><span class="icon-tile tile-sky" style="width:40px;height:40px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg></span><div><div class="ven-eyebrow">Delivering to</div><div class="ven-name" style="margin-bottom:2px">' + prop.name + '</div><div style="font-size:13px;color:var(--muted-foreground)">' + prop.addr + ', ' + prop.city + '</div></div></div>' +
      '<div class="secure-bar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Secure Checkout</div>';
  }

  function chgQty(id, d) { const it = CART.itemsFor(currentProp).find(i => i.id === id); if (it) CART.setQty(currentProp, id, it.qty + d); renderPage(); }
  function setQtyIn(id, v) { CART.setQty(currentProp, id, parseInt(v, 10) || 1); renderPage(); }
  function removeItem(id) { CART.remove(currentProp, id); renderPage(); }
  function toggleGL(id) { openGL.has(id) ? openGL.delete(id) : openGL.add(id); renderPage(); }

  renderPage();
</script>
</body>
</html>
