<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service POs — Scout Buyer</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="buyer.css">
<script src="cart.js"></script>
<script src="spo-data.js"></script>
</head>
<body class="buyer">

<!-- ===== App Bar ===== -->
<div class="app-bar-wrap">
  <nav class="app-bar" id="app-bar"></nav>
  <script src="appbar.js"></script>
</div>






<section class="hero page-hero">
  <div class="hero-bg"></div>
  <div class="hero-inner" style="flex-direction:column;gap:0">
    <div class="hero-title-block">
      <div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
      <div><h1>Service POs</h1><p>Request services from vendors, map their invoices, and send them to Accounting</p></div>
    </div>
  </div>
</section>

<main class="page">
  <div class="kpi-grid" id="stat-cards"></div>
  <div class="tab-row">
    <div class="tab-bar" id="tab-bar"></div>
    <span style="display:flex;gap:10px;align-items:center"><a class="btn" href="spo-invoice.html#new" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none"><svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 12v6"/><path d="M9 15h6"/></svg>Add invoice</a><a class="btn" href="schedules.html" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none"><svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>Schedules</a>
    <a class="btn btn-primary" href="spo-new.html#new" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none"><svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New Service PO</a></span>
  </div>
  <div class="toolbar" id="tbar" style="margin-top:16px">
    <div class="toolbar-group">
      <span class="filter-chip" id="chip-vendor" style="display:none"><span class="filter-chip-attr">Vendor</span><span class="filter-chip-value" id="chip-vendor-value"></span><button class="filter-chip-remove" onclick="setVendor(null)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span>
      <span class="filter-chip" id="chip-prop" style="display:none"><span class="filter-chip-attr">Property</span><span class="filter-chip-value" id="chip-prop-value"></span><button class="filter-chip-remove" onclick="setPropF(null)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span>
      <span class="filter-chip" id="chip-date" style="display:none"><span class="filter-chip-attr">Created</span><span class="filter-chip-value" id="chip-date-value"></span><button class="filter-chip-remove" onclick="setDateFilter(null)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span>
      <div class="filter-menu-wrap">
        <button class="toolbar-btn toolbar-btn-dashed" onclick="toggleFilterMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-11"/><path d="M7 12H3"/><path d="M21 20h-3"/><path d="M15 20H3"/><circle cx="14" cy="4" r="2"/><circle cx="7" cy="12" r="2"/><circle cx="18" cy="20" r="2"/></svg>
          Add filter
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="filter-menu" id="filter-menu" style="display:none"></div>
      </div>
      <div class="filter-menu-wrap">
        <button class="toolbar-btn" onclick="toggleDateMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
          Date range
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="filter-menu" id="date-menu" style="display:none">
          <div class="dropdown-item" onclick="setDateFilter(30, 'Last 30 days')">Last 30 days</div>
          <div class="dropdown-item" onclick="setDateFilter(90, 'Last 90 days')">Last 90 days</div>
          <div class="dropdown-item" onclick="setDateFilter(365, 'Last 12 months')">Last 12 months</div>
        </div>
      </div>
      <button class="toolbar-btn toolbar-btn-ghost" id="filter-clear" style="display:none" onclick="clearFilters()">Clear all</button>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="search-field" id="spo-search" placeholder="Search SPO, vendor, scope, or unit…" oninput="page = 1; renderPage()">
    </div>
  </div>
  <div id="intake-drafts"></div>
  <div id="tbl-zone"></div>
</main>

<script>
  /* ---------- Theme ---------- */
  function applyTheme() {
    const dark = localStorage.getItem('scout-theme') === 'dark';
    document.body.classList.toggle('dark', dark);
    const b = document.getElementById('theme-btn');
    b.querySelector('.icon-sun').style.display = dark ? 'none' : '';
    b.querySelector('.icon-moon').style.display = dark ? '' : 'none';
  }
  function toggleTheme() { localStorage.setItem('scout-theme', document.body.classList.contains('dark') ? 'light' : 'dark'); applyTheme(); }
  applyTheme();

  /* ---------- Menus ---------- */
  function closeMenus() {
    document.querySelectorAll('.menu-panel').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.nav-chip').forEach(c => c.classList.remove('open'));
  }
  function toggleMenu(id) {
    const panel = document.getElementById('menu-' + id), chip = document.getElementById('nav-' + id);
    const wasOpen = panel.classList.contains('open');
    closeMenus(); document.getElementById('ctx-switch').classList.remove('open');
    if (!wasOpen) { panel.classList.add('open'); chip.classList.add('open'); }
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-anchor')) closeMenus();
    if (!e.target.closest('.ctx-switch')) document.getElementById('ctx-switch').classList.remove('open');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); document.getElementById('ctx-switch').classList.remove('open'); } });

  /* ---------- Context switcher ---------- */
  const PROPERTIES = [
    { id: 'all', name: 'All properties', desc: 'Combined dashboard for every accessible property', units: null },
    { id: 'magnolia', name: 'Magnolia Place Apartments', addr: '4201 Veterans Memorial Blvd', city: 'Metairie, LA 70006', units: 51 },
    { id: 'bayou', name: 'Bayou Crossing Apartments', addr: '3850 Airline Dr', city: 'Baton Rouge, LA 70805', units: 120 },
    { id: 'lonestar', name: 'Lone Star Flats', addr: '7200 Westheimer Rd', city: 'Houston, TX 77057', units: 78 },
    { id: 'central', name: 'Central Park View', addr: '1501 Canal St', city: 'New Orleans, LA 70112', units: 96 },
    { id: 'cypress', name: 'Cypress Lake Apartments', addr: '9100 Cypress Lake Dr', city: 'Lafayette, LA 70508', units: 64 },
    { id: 'beauchene', name: 'Beau Chene Villas', addr: '225 Beau Chene Blvd', city: 'Mandeville, LA 70471', units: 40 },
    { id: 'sherwood', name: 'Sherwood Acres', addr: '1250 Sherwood Forest Blvd', city: 'Baton Rouge, LA 70815', units: 88 },
    { id: 'cyprus', name: 'Cyprus Glenn', addr: '4800 Cyprus Glenn Way', city: 'Shreveport, LA 71105', units: 32 },
    { id: 'heights', name: 'Magnolia Heights Apartments', addr: '6301 Magnolia Heights Rd', city: 'Houston, TX 77004', units: 110 }
  ];
  let currentProp = 'all';
  const bIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>';
  const pinIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
  function renderCtxList() {
    document.getElementById('ctx-list').innerHTML = PROPERTIES.map(p => {
      const active = p.id === currentProp;
      const body = p.id === 'all'
        ? '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.desc + '</span>'
        : '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.addr + '</span><span class="opt-city">' + pinIcon + p.city + '</span>';
      const units = p.units ? '<span class="units-badge"><b>' + p.units + '</b><span>units</span></span>' : '';
      return '<button class="ctx-option' + (active ? ' active' : '') + '" onclick="selectProp(\'' + p.id + '\')"><span class="opt-tile">' + bIcon + '</span><span class="opt-body">' + body + '</span>' + units + '</button>';
    }).join('');
  }
  function selectProp(id) {
    currentProp = id;
    const p = PROPERTIES.find(x => x.id === id);
    document.getElementById('echo-name').textContent = p.name;
    document.getElementById('echo-name').title = p.id === 'all' ? '9 accessible properties' : p.units + ' units · ' + p.city;
    renderCtxList();
    document.getElementById('ctx-switch').classList.remove('open');
    page = 1; renderPage();
  }
  function toggleCtx() {
    const el = document.getElementById('ctx-switch');
    const wasOpen = el.classList.contains('open');
    closeMenus();
    if (!wasOpen) el.classList.add('open');
  }
  renderCtxList();

  const money = SPO.money, fmtD = SPO.fmtDate;
  const SV = '<svg class="stat-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  const IC = {
    wrench: SV + '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
    pen: SV + '<path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg>',
    send: SV + '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>',
    x: SV + '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>',
    doc: SV + '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>',
    card: SV + '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>',
    check: SV + '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>',
    archive: SV + '<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>',
    ban: SV + '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>'
  };
  const TABS = [
    { id: 'open', label: 'Open', icon: IC.wrench, states: ['draft', 'approval', 'sent', 'rejected', 'invoice'] },
    { id: 'invoices', label: 'Invoices', icon: IC.doc, states: ['mapping', 'ready', 'accounting'] },
    { id: 'closed', label: 'Closed', icon: IC.archive, states: ['paid', 'canceled'] }
  ];
  const vInit = v => v;
  let cardFilter = 'all', vendorF = null, propF = null, dateDays = null, page = 1, sortK = 'date', sortDir = -1;
  const PER = 10;
  const openRows = new Set();
  const tab = () => { const t = (location.hash || '#open').replace('#', ''); return TABS.some(x => x.id === t) ? t : 'open'; };
  window.addEventListener('hashchange', () => { cardFilter = 'all'; page = 1; openRows.clear(); renderPage(); window.scrollTo(0, 0); });
  const propName = id => (PROPERTIES.find(x => x.id === id) || {}).name || id;

  function scoped(states) {
    const q = (document.getElementById('spo-search').value || '').trim().toLowerCase();
    let min = null;
    if (dateDays) { const d = new Date(SPO.TODAY); d.setDate(d.getDate() - dateDays); min = d.toISOString().slice(0, 10); }
    return SPO.list().filter(s => states.indexOf(s.state) >= 0 &&
      (currentProp === 'all' || s.prop === currentProp) &&
      (!propF || s.prop === propF) &&
      (!vendorF || s.v === vendorF) &&
      (!min || s.ev.created.slice(0, 10) >= min) &&
      (!q || ('spo-' + s.id + ' ' + (s.series ? s.series + ' ' + ((SCH.get(s.series) || {}).name || '') + ' recurring ' : '') + SPO.VEN[s.v].name + ' ' + propName(s.prop) + ' ' + s.scope + ' ' +
        s.lines.map(l => l.desc + ' ' + l.alloc.map(a => a.unit + ' ' + a.gl + ' ' + SPO.glName(a.gl)).join(' ')).join(' ')).toLowerCase().includes(q)));
  }

  function statCards(t, rows) {
    const el = document.getElementById('stat-cards');
    const card = (key, cls, icon, title, n, desc) => '<div class="stat-card-colored ' + cls + (cardFilter === key ? ' active' : '') + '" onclick="setCard(\'' + key + '\')"><span class="stat-card-title">' + icon + title + '</span><div class="stat-card-count">' + n + '</div><div class="stat-card-desc">' + desc + '</div></div>';
    const g = k => rows.filter(s => SPO.STATES[s.state].group === k).length;
    el.style.gridTemplateColumns = '';
    if (t === 'open') {
      el.className = 'kpi-grid';
      el.innerHTML = card('all', 'stat-gray', IC.wrench, 'Total Open', rows.length, 'Not yet invoiced') +
        card('you', 'stat-amber', IC.pen, 'Your Move', g('you'), 'Drafts & approvals') +
        card('vendor', 'stat-sky', IC.send, 'With Vendor', g('vendor'), 'Response or invoice pending') +
        card('rejected', 'stat-rose', IC.x, 'Vendor Rejected', g('rejected'), 'Choose another vendor');
    } else if (t === 'invoices') {
      el.className = 'kpi-grid'; el.style.gridTemplateColumns = 'repeat(3, 1fr)';
      el.innerHTML = card('all', 'stat-gray', IC.doc, 'Total Invoices', rows.length, 'Invoice received') +
        card('you', 'stat-amber', IC.pen, 'Your Move', g('you'), 'Map invoice or send to Accounting') +
        card('accounting', 'stat-violet', IC.card, 'With Accounting', g('accounting'), 'Awaiting payment');
    } else {
      el.className = 'kpi-grid'; el.style.gridTemplateColumns = 'repeat(3, 1fr)';
      el.innerHTML = card('all', 'stat-gray', IC.archive, 'Total Closed', rows.length, 'Paid or canceled') +
        card('paid', 'stat-emerald', IC.check, 'Paid', g('paid'), 'Released by Accounting') +
        card('canceled', 'stat-rose', IC.ban, 'Canceled', g('canceled'), 'Withdrawn before payment');
    }
  }

  function pill(s) { const st = SPO.STATES[s.state]; return '<span class="status-dot-item"><span class="status-dot ' + st.dot + '"></span><span class="status-dot-label">' + st.label + '</span></span>'; }
  function allocChips(l, prop) {
    return '<div class="alloc-row">' + l.alloc.map(a => '<span class="alloc-chip"><span class="code">' + a.gl + '</span>' + SPO.glName(a.gl) + '<span class="sep"></span><a class="unit-link" href="unit-history.html#' + prop + '/' + a.unit + '" title="Unit history">' + SPO.unitLabel(a.unit) + '</a>' + (l.alloc.length > 1 ? '<span class="sep"></span><span class="amt">' + money(a.amt) + '</span>' : '') + '</span>').join('') + '</div>';
  }
  const sortIc = k => '<svg class="sort-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (sortK === k ? (sortDir === 1 ? '<path d="m7 14.5 5-5 5 5"/>' : '<path d="m7 9.5 5 5 5-5"/>') : '<path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>') + '</svg>';
  const th = (k, label, extra) => '<th class="sortable' + (sortK === k ? ' sorted' : '') + (extra || '') + '" onclick="setSort(\'' + k + '\')">' + label + sortIc(k) + '</th>';

  /* Only the buyer's own move gets a primary button; everything else is the overflow menu. */
  const ACTION = {
    draft: ['Continue', s => 'spo-new.html#' + s.id],
    approval: ['Review', s => 'approval.html#SPO-' + s.id],
    rejected: ['Change vendor', s => 'spo.html#' + s.id + '/vendor'],
    mapping: ['Map invoice', s => 'spo.html#' + s.id + '/invoice'],
    ready: ['Send', s => 'spo.html#' + s.id + '/accounting']
  };

  function renderPage() {
    const t = tab();
    document.getElementById('tab-bar').innerHTML = TABS.map(tb =>
      '<button class="tab-item' + (tb.id === t ? ' active' : '') + '" onclick="location.hash=\'#' + tb.id + '\'">' + tb.icon.replace('stat-card-icon', '') + tb.label + '<span class="tab-count">' + scoped(tb.states).length + '</span></button>').join('');
    const rows = scoped(TABS.find(x => x.id === t).states);
    statCards(t, rows);

    let list = rows.filter(s => cardFilter === 'all' || SPO.STATES[s.state].group === cardFilter);
    const sortVal = s => sortK === 'num' ? s.id : sortK === 'total' ? SPO.total(s) : sortK === 'prop' ? propName(s.prop)
      : sortK === 'vendor' ? SPO.VEN[s.v].name : sortK === 'status' ? SPO.STATES[s.state].rank : s.ev.created;
    list = list.slice().sort((a, b) => { const va = sortVal(a), vb = sortVal(b); const d = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb)); return d * sortDir || b.id - a.id; });
    const pages = Math.max(1, Math.ceil(list.length / PER));
    if (page > pages) page = pages;
    const slice = list.slice((page - 1) * PER, page * PER);

    const cols = th('num', 'SPO #') + th('prop', 'Property', ' col-hide') + th('vendor', 'Vendor') + th('total', 'Total') + th('status', 'Status') + th('date', 'Created');
    const body = slice.map(s => {
      const isOpen = openRows.has(s.id);
      const act = ACTION[s.state];
      const action = act ? '<a class="btn btn-primary btn-sm" style="text-decoration:none;white-space:nowrap" href="' + act[1](s) + '">' + act[0] + '</a>' : rowMenu(s);
      const main = '<tr class="data-row">' +
        '<td><button class="expander' + (isOpen ? ' open' : '') + '" onclick="toggleRow(' + s.id + ')" title="Line items"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></td>' +
        '<td class="mono" style="font-weight:700;white-space:nowrap"><a class="table-link" style="font-family:inherit;font-weight:700" href="spo.html#' + s.id + '">SPO-' + s.id + '</a>' + recMark(s) + '</td>' +
        '<td class="col-hide cell-clip" title="' + propName(s.prop) + '">' + propName(s.prop) + '</td>' +
        '<td><span class="cell-entity"><span class="v-avatar" style="width:28px;height:28px;border-radius:7px;font-size:10px">' + vInit(s.v) + '</span><span class="nm cell-clip" style="display:block;max-width:200px" title="' + SPO.VEN[s.v].name + '">' + SPO.VEN[s.v].name + '</span></span></td>' +
        '<td class="num" style="font-weight:600">' + money(SPO.total(s)) + '</td>' +
        '<td>' + pill(s) + '</td>' +
        '<td style="white-space:nowrap;color:var(--muted-foreground)">' + fmtD(s.ev.created) + '</td>' +
        '<td>' + action + '</td></tr>';
      const items = isOpen ? '<tr class="items-block"><td colspan="8"><div class="items-label">Scope</div><p class="spo-scope spo-exp-scope">' + s.scope + '</p><div class="items-label">Line Items</div>' +
        s.lines.map(l => '<div class="spo-line"><span class="sl-desc">' + l.desc + '</span><span class="sl-qty">' + l.qty + ' × ' + money(l.price) + '</span><span class="sl-total">' + money(l.qty * l.price) + '</span>' + allocChips(l, s.prop) + '</div>').join('') + '</td></tr>' : '';
      return main + items;
    }).join('');

    document.getElementById('tbl-zone').innerHTML = '<div class="tbl-wrap" style="margin-top:4px"><div style="overflow-x:auto"><table class="tbl">' +
      '<thead><tr><th style="width:36px"></th>' + cols + '<th style="width:1%"></th></tr></thead>' +
      '<tbody>' + (body || '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--muted-foreground)">No Service POs match the current filters.</td></tr>') + '</tbody></table></div>' +
      (list.length > PER ? '<div class="pager"><span>Showing ' + ((page - 1) * PER + 1) + '–' + Math.min(page * PER, list.length) + ' of ' + list.length + ' SPOs</span><span class="pg-btns"><button class="btn btn-sm"' + (page <= 1 ? ' disabled' : '') + ' onclick="page--; renderPage()">Previous</button><button class="btn btn-sm"' + (page >= pages ? ' disabled' : '') + ' onclick="page++; renderPage()">Next</button></span></div>' : '') + '</div>';

    /* In-progress invoice intakes (one autosaved draft per vendor + invoice number) */
    let drafts = {}; try { drafts = JSON.parse(localStorage.getItem('scout-intake-v1')) || {}; } catch (e) { /* noop */ }
    const dl = Object.values(drafts).filter(d => d.num && (currentProp === 'all' || d.prop === currentProp));
    document.getElementById('intake-drafts').innerHTML = t === 'invoices' && dl.length ? '<div class="task-strip" style="margin:16px 0 20px"><span class="ts-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg></span><div class="ts-body"><div class="ts-title">' + dl.length + ' invoice' + (dl.length === 1 ? '' : 's') + ' in progress</div><div class="ts-desc">' + dl.map(d => d.num + ' · ' + SPO.VEN[d.v].name + ' · ' + d.spoIds.length + ' SPO' + (d.spoIds.length === 1 ? '' : 's')).join(' &nbsp;·&nbsp; ') + '</div></div>' + dl.slice(0, 2).map(d => '<a class="btn' + (dl.length === 1 ? ' btn-primary' : '') + '" style="text-decoration:none;white-space:nowrap" href="spo-invoice.html#resume-' + encodeURIComponent(d.key) + '">Resume ' + d.num + '</a>').join('') + '</div>' : '';
    document.getElementById('filter-clear').style.display = (vendorF || propF || dateDays) ? '' : 'none';
    if (currentProp !== 'all' && propF) setPropF(null);
  }

  /* Recurring marker: this SPO was created by a schedule (the schedule is not a status — SPO-49). */
  function recMark(s) {
    if (!s.series) return '';
    const x = SCH.get(s.series);
    return '<a class="rec-mark" href="schedule.html#' + s.series + '" data-tip="' + (x ? x.name + ' · ' + SCH.cadenceText(x.cadence, false) : s.series) + '" aria-label="From schedule ' + s.series + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></a>';
  }
  function rowMenu(s) {
    return '<div class="row-menu-wrap"><button class="icon-btn" style="width:32px;height:32px" onclick="toggleMenuRow(event, ' + s.id + ')" title="More actions"><svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>' +
      '<div class="row-menu" id="rm-' + s.id + '" style="display:none">' +
      '<button onclick="location.href=\'spo.html#' + s.id + '\'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>View SPO</button>' +
      '<button onclick="rowAct(\'Download PO\', ' + s.id + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>Download PO (PDF)</button>' +
      '<button onclick="location.href=\'spo-new.html#clone-' + s.id + '\'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>Clone SPO</button></div></div>';
  }
  function toggleMenuRow(e, id) {
    e.stopPropagation();
    const el = document.getElementById('rm-' + id), was = el.style.display !== 'none';
    document.querySelectorAll('.row-menu').forEach(m => m.style.display = 'none');
    el.style.display = was ? 'none' : '';
  }
  document.addEventListener('click', e => { if (e.target.isConnected && !e.target.closest('.row-menu-wrap')) document.querySelectorAll('.row-menu').forEach(m => m.style.display = 'none'); });

  function setCard(k) { cardFilter = cardFilter === k ? 'all' : k; page = 1; renderPage(); }
  function setSort(k) { if (sortK === k) sortDir *= -1; else { sortK = k; sortDir = (k === 'date' || k === 'total' || k === 'num') ? -1 : 1; } renderPage(); }
  function toggleRow(id) { openRows.has(id) ? openRows.delete(id) : openRows.add(id); renderPage(); }
  function setVendor(v) {
    vendorF = v; closeFMenus();
    document.getElementById('chip-vendor').style.display = v ? '' : 'none';
    if (v) document.getElementById('chip-vendor-value').textContent = SPO.VEN[v].name;
    page = 1; renderPage();
  }
  function setDateFilter(days, label) {
    dateDays = days; closeFMenus();
    document.getElementById('chip-date').style.display = days ? '' : 'none';
    if (days) document.getElementById('chip-date-value').textContent = label;
    page = 1; renderPage();
  }
  function setPropF(p) {
    propF = p; closeFMenus();
    document.getElementById('chip-prop').style.display = p ? '' : 'none';
    if (p) document.getElementById('chip-prop-value').textContent = propName(p);
    page = 1; renderPage();
  }
  function clearFilters() {
    vendorF = null; propF = null; dateDays = null; document.getElementById('spo-search').value = '';
    ['chip-vendor', 'chip-prop', 'chip-date'].forEach(id => document.getElementById(id).style.display = 'none');
    page = 1; renderPage();
  }
  function closeFMenus() { document.getElementById('filter-menu').style.display = 'none'; document.getElementById('date-menu').style.display = 'none'; }
  function toggleFilterMenu() { const m = document.getElementById('filter-menu'); const was = m.style.display !== 'none'; closeFMenus(); if (!was) { renderFilterMenu('root'); m.style.display = ''; } }
  function renderFilterMenu(view) {
    const m = document.getElementById('filter-menu');
    const rows = SPO.list();
    if (view === 'root') {
      m.innerHTML = '<div class="dropdown-item" onclick="renderFilterMenu(\'vendor\')">Vendor <span style="color:var(--muted-foreground)">&rsaquo;</span></div>' +
        (currentProp === 'all' ? '<div class="dropdown-item" onclick="renderFilterMenu(\'prop\')">Property <span style="color:var(--muted-foreground)">&rsaquo;</span></div>' : '');
      return;
    }
    const back = '<div class="dropdown-item" onclick="renderFilterMenu(\'root\')" style="color:var(--muted-foreground)">&lsaquo; Filters</div>';
    if (view === 'vendor') {
      const vs = [...new Set(rows.map(s => s.v))].sort((a, b) => SPO.VEN[a].name.localeCompare(SPO.VEN[b].name));
      m.innerHTML = back + vs.map(v => '<div class="dropdown-item' + (vendorF === v ? ' selected' : '') + '" onclick="setVendor(\'' + v + '\')">' + SPO.VEN[v].name + '</div>').join('');
    } else {
      const ps = [...new Set(rows.map(s => s.prop))].sort((a, b) => propName(a).localeCompare(propName(b)));
      m.innerHTML = back + ps.map(p => '<div class="dropdown-item' + (propF === p ? ' selected' : '') + '" onclick="setPropF(\'' + p + '\')">' + propName(p) + '</div>').join('');
    }
  }
  function toggleDateMenu() { const m = document.getElementById('date-menu'); const was = m.style.display !== 'none'; closeFMenus(); if (!was) m.style.display = ''; }
  document.addEventListener('click', e => { if (e.target.isConnected && !e.target.closest('.filter-menu-wrap')) closeFMenus(); });

  let toastTimer;
  function showToast(title, desc) { let el = document.getElementById('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.style.cssText = 'position:fixed;bottom:24px;left:24px;z-index:300;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:14px 18px;max-width:360px;font-size:13px;transition:opacity .2s'; document.body.appendChild(el); } el.innerHTML = '<b style="display:block;font-size:14px">' + title + '</b><span style="color:var(--muted-foreground)">' + desc + '</span>'; el.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.opacity = 0, 3000); }
  function rowAct(what, id) { document.querySelectorAll('.row-menu').forEach(m => m.style.display = 'none'); showToast(what + ' — SPO-' + id, 'Demo action'); }

  renderPage();
</script>
</body>
</html>
