<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Invoice — Scout Buyer</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="buyer.css">
<script src="cart.js"></script>
<script src="spo-data.js"></script>
<script src="spo-map.js"></script>
</head>
<body class="buyer">

<!-- ===== App Bar ===== -->
<div class="app-bar-wrap">
  <nav class="app-bar" id="app-bar"></nav>
  <script src="appbar.js"></script>
</div>






<section class="hero page-hero">
  <div class="hero-bg"></div>
  <div class="hero-inner" style="flex-direction:column;gap:0">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:20px;width:100%">
      <div class="hero-title-block">
        <div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg></div>
        <div><h1 id="w-title">Add invoice</h1><p id="w-sub">Map one vendor invoice to every SPO it covers</p></div>
      </div>
      <a class="back-link" href="spos.html" style="margin:8px 0 0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>Back to Service POs</a>
    </div>
    <div class="chk-steps" id="chk-steps"></div>
  </div>
</section>

<main class="page">
  <div class="det-grid" id="w-grid">
    <div class="det-main" id="w-main"></div>
    <div class="det-side sticky" id="w-side"></div>
  </div>
</main>

<script>
  /* ---------- Theme ---------- */
  function applyTheme() {
    const dark = localStorage.getItem('scout-theme') === 'dark';
    document.body.classList.toggle('dark', dark);
    const b = document.getElementById('theme-btn');
    b.querySelector('.icon-sun').style.display = dark ? 'none' : '';
    b.querySelector('.icon-moon').style.display = dark ? '' : 'none';
  }
  function toggleTheme() { localStorage.setItem('scout-theme', document.body.classList.contains('dark') ? 'light' : 'dark'); applyTheme(); }
  applyTheme();

  /* ---------- Menus ---------- */
  function closeMenus() {
    document.querySelectorAll('.menu-panel').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.nav-chip').forEach(c => c.classList.remove('open'));
  }
  function toggleMenu(id) {
    const panel = document.getElementById('menu-' + id), chip = document.getElementById('nav-' + id);
    const wasOpen = panel.classList.contains('open');
    closeMenus(); document.getElementById('ctx-switch').classList.remove('open');
    if (!wasOpen) { panel.classList.add('open'); chip.classList.add('open'); }
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-anchor')) closeMenus();
    if (!e.target.closest('.ctx-switch')) document.getElementById('ctx-switch').classList.remove('open');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); document.getElementById('ctx-switch').classList.remove('open'); } });

  /* ---------- Context switcher ---------- */
  const PROPERTIES = [
    { id: 'all', name: 'All properties', desc: 'Combined dashboard for every accessible property', units: null },
    { id: 'magnolia', name: 'Magnolia Place Apartments', addr: '4201 Veterans Memorial Blvd', city: 'Metairie, LA 70006', units: 51 },
    { id: 'bayou', name: 'Bayou Crossing Apartments', addr: '3850 Airline Dr', city: 'Baton Rouge, LA 70805', units: 120 },
    { id: 'lonestar', name: 'Lone Star Flats', addr: '7200 Westheimer Rd', city: 'Houston, TX 77057', units: 78 },
    { id: 'central', name: 'Central Park View', addr: '1501 Canal St', city: 'New Orleans, LA 70112', units: 96 },
    { id: 'cypress', name: 'Cypress Lake Apartments', addr: '9100 Cypress Lake Dr', city: 'Lafayette, LA 70508', units: 64 },
    { id: 'beauchene', name: 'Beau Chene Villas', addr: '225 Beau Chene Blvd', city: 'Mandeville, LA 70471', units: 40 },
    { id: 'sherwood', name: 'Sherwood Acres', addr: '1250 Sherwood Forest Blvd', city: 'Baton Rouge, LA 70815', units: 88 },
    { id: 'cyprus', name: 'Cyprus Glenn', addr: '4800 Cyprus Glenn Way', city: 'Shreveport, LA 71105', units: 32 },
    { id: 'heights', name: 'Magnolia Heights Apartments', addr: '6301 Magnolia Heights Rd', city: 'Houston, TX 77004', units: 110 }
  ];
  let currentProp = 'all';
  const bIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>';
  const pinIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
  function renderCtxList() {
    document.getElementById('ctx-list').innerHTML = PROPERTIES.map(p => {
      const active = p.id === currentProp;
      const body = p.id === 'all'
        ? '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.desc + '</span>'
        : '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.addr + '</span><span class="opt-city">' + pinIcon + p.city + '</span>';
      const units = p.units ? '<span class="units-badge"><b>' + p.units + '</b><span>units</span></span>' : '';
      return '<button class="ctx-option' + (active ? ' active' : '') + '" onclick="selectProp(\'' + p.id + '\')"><span class="opt-tile">' + bIcon + '</span><span class="opt-body">' + body + '</span>' + units + '</button>';
    }).join('');
  }
  function selectProp(id) {
    currentProp = id;
    const p = PROPERTIES.find(x => x.id === id);
    document.getElementById('echo-name').textContent = p.name;
    document.getElementById('echo-name').title = p.id === 'all' ? '9 accessible properties' : p.units + ' units · ' + p.city;
    renderCtxList();
    document.getElementById('ctx-switch').classList.remove('open');
    renderPage();
  }
  function toggleCtx() {
    const el = document.getElementById('ctx-switch');
    const wasOpen = el.classList.contains('open');
    closeMenus();
    if (!wasOpen) el.classList.add('open');
  }
  renderCtxList();

  const money = SPO.money, r2 = SPO.r2, fmtD = SPO.fmtDate;
  const SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  const IC = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    upload: SVG + '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>',
    doc: SVG + '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>',
    map: SVG + '<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>',
    ai: SVG + '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>',
    warn: SVG + '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
    info: SVG + '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>',
    send: SVG + '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>',
    shield: SVG + '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>',
    card: SVG + '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>',
    wrench: SVG + '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>'
  };
  const STEP_LIST = [['vendor', 'Vendor & invoice', 'Upload and choose SPOs'], ['match', 'Match line items', 'Connect invoice to SPO lines'], ['review', 'Review & validate', 'Each SPO’s share']];
  const DKEY = 'scout-intake-v1';
  const propOf = id => PROPERTIES.find(p => p.id === id);

  /* Demo statement Scout AI "reads": Crescent Cleaning bills its weekly runs monthly (SCH-01). */
  const DEMO = { file: 'INV-CC-2608.pdf', size: 248320, v: 'CC', prop: 'magnolia', num: 'INV-CC-2608', date: '2026-08-24', tax: 55.76, ship: 0,
    lines: [
      { desc: 'Common-area cleaning — week of 08/03', amt: 180, maps: [{ spo: 842, line: 0, amt: 180, sug: true }] },
      { desc: 'Common-area cleaning — week of 08/10', amt: 180, maps: [{ spo: 845, line: 0, amt: 180, sug: true }] },
      { desc: 'Common-area cleaning — week of 08/17 (incl. pressure rinse)', amt: 195, maps: [{ spo: 847, line: 0, amt: 195, sug: true }] },
      { desc: 'Cleaning supplies restock', amt: 35, maps: [] }
    ],
    why: { 842: 'Run 08/05 ↔ “week of 08/03”', 845: 'Run 08/12 ↔ “week of 08/10”', 847: 'Run 08/19 ↔ “week of 08/17”' } };

  /* ---------- drafts: one per vendor + invoice number, autosaved (audit SPO-47) ---------- */
  const loadD = () => { try { return JSON.parse(localStorage.getItem(DKEY)) || {}; } catch (e) { return {}; } };
  const saveD = m => { try { localStorage.setItem(DKEY, JSON.stringify(m)); } catch (e) { /* session only */ } };
  const blank = () => ({ key: null, file: null, v: null, prop: currentProp !== 'all' ? currentProp : 'magnolia', num: '', date: SPO.TODAY, spoIds: [], why: {}, showAll: false, inv: null, attest: false, manual: false, edit: false });
  let W = blank(), view = 'lines', page = 1;
  function persist() {
    if (!W.v || !W.num) return;
    W.key = W.v + ':' + W.num;
    const d = loadD(); d[W.key] = Object.assign({}, W, { saved: SPO.now() }); saveD(d);
  }
  function dropDraft() { if (!W.key) return; const d = loadD(); delete d[W.key]; saveD(d); }

  const candidates = () => SPO.list().filter(s => s.v === W.v && s.prop === W.prop && (W.showAll ? ['invoice', 'sent', 'mapping'].indexOf(s.state) >= 0 : s.state === 'invoice')).sort((a, b) => (a.run || a.ev.created).localeCompare(b.run || b.ev.created));
  const selected = () => W.spoIds.map(id => SPO.get(id)).filter(Boolean);
  const dup = () => W.v && W.num && SPO.list().some(s => s.v === W.v && s.invoice && s.invoice.num.toLowerCase() === W.num.trim().toLowerCase());

  function route() {
    const h = (location.hash || '').replace('#', '');
    if (h === 'new' || !h) { W = blank(); location.replace('#vendor'); return null; }
    if (h.indexOf('resume-') === 0) { const d = loadD()[decodeURIComponent(h.slice(7))]; if (d) W = d; location.replace(d && d.inv && d.spoIds.length ? '#match' : '#vendor'); return null; }
    if (h.indexOf('with-') === 0) { const s = SPO.get(h.slice(5)); W = blank(); if (s) { W.v = s.v; W.prop = s.prop; W.spoIds = [s.id]; } location.replace('#vendor'); return null; }
    if (h.indexOf('done-') === 0) return 'done';
    const idx = STEP_LIST.findIndex(s => s[0] === h);
    const maxOk = !step1Ok() ? 0 : !step2Ok() ? 1 : 2;
    if (idx < 0) { location.replace('#vendor'); return null; }
    if (idx > maxOk) { location.replace('#' + STEP_LIST[maxOk][0]); return null; }
    return h;
  }
  function step1Blockers() {
    const b = [];
    if (!W.inv) b.push('Upload the invoice PDF, or enter its details yourself');
    if (!W.v) b.push('Choose the vendor');
    if (!(W.num || '').trim()) b.push('Add the invoice number');
    if (!W.spoIds.length) b.push('Choose at least one SPO this invoice covers');
    return b;
  }
  const step1Ok = () => step1Blockers().length === 0;
  /* Selection changed? Suggestions for SPOs that are selected again come back (only on lines nobody touched). */
  function restoreSuggestions() {
    if (!W.inv || !W.aiMaps) return;
    W.inv.lines.forEach((l, i) => {
      if (l.res || (l.maps && l.maps.length) || !W.aiMaps[i]) return;
      const back = W.aiMaps[i].filter(m => W.spoIds.indexOf(m.spo) >= 0);
      if (back.length) l.maps = back.map(m => Object.assign({}, m, { sug: true }));
    });
  }
  function ctx() { restoreSuggestions(); return CX.use({ spos: selected(), inv: W.inv, ro: false, edit: W.edit, onChange: () => { W.edit = CTX.edit; persist(); renderPage(); } }); }
  let CTX = null;
  function step2Blockers() {
    if (!step1Ok()) return ['Finish step 1'];
    CTX = ctx(); const b = [];
    W.inv.lines.forEach((l, i) => { if (!CX.resolved(l)) b.push('Invoice line ' + (i + 1) + ': ' + (CX.status(l) === 'sug' ? 'accept or change the suggested match' : CX.status(l) === 'bad' ? 'split amounts must add up to ' + money(l.amt) : l.res ? 'finish the details' : 'connect it to an SPO line, or choose how to handle it')); });
    if (!W.inv.lines.length) b.push('Add the invoice lines');
    if (!CX.taxOk()) b.push('Tax shares must add up to ' + money(W.inv.tax));
    return b;
  }
  const step2Ok = () => step2Blockers().length === 0;

  function stepBand(cur) {
    const idx = STEP_LIST.findIndex(s => s[0] === cur);
    document.getElementById('chk-steps').innerHTML = STEP_LIST.map(([id, t, d], i) => {
      const cls = i < idx ? 'done' : i === idx ? 'active' : '';
      return '<div class="chk-step ' + cls + '"' + (i < idx ? ' onclick="location.hash=\'#' + id + '\'"' : '') + '><span class="n">' + (i < idx ? IC.check : (i + 1)) + '</span><span><span class="t">' + t + '</span><br><span class="d">' + d + '</span></span></div>' + (i < STEP_LIST.length - 1 ? '<div class="chk-conn' + (i < idx ? ' done' : '') + '"></div>' : '');
    }).join('');
  }

  /* ---------- step 1: upload first, Scout AI fills the rest ---------- */
  function upload() {
    const d = JSON.parse(JSON.stringify(DEMO));
    W.file = d.file; W.v = d.v; W.prop = d.prop; W.num = d.num; W.date = d.date; W.manual = false;
    W.inv = { num: d.num, date: d.date, file: d.file, size: d.size, tax: d.tax, ship: d.ship, lines: d.lines };
    W.why = d.why;
    /* Keep Scout AI's original suggestions so re-ticking an SPO in step 1 brings its suggestion back. */
    W.aiMaps = d.lines.map(l => l.maps.map(m => Object.assign({}, m)));
    W.spoIds = Object.keys(d.why).map(Number).filter(id => { const s = SPO.get(id); return s && s.state === 'invoice'; });
    persist(); renderPage();
  }
  function manual() { W.manual = true; W.file = null; W.inv = { num: W.num, date: W.date, file: null, tax: 0, ship: 0, lines: [{ desc: '', amt: 0, maps: [], manual: true }] }; W.edit = true; persist(); renderPage(); }
  function setF(k, v) { W[k] = v; if (k === 'v') { W.spoIds = []; W.why = {}; } if (W.inv && (k === 'num' || k === 'date')) W.inv[k] = v; persist(); renderPage(); }
  function toggleSpo(id) { const i = W.spoIds.indexOf(id); if (i >= 0) W.spoIds.splice(i, 1); else W.spoIds.push(id); persist(); renderPage(); }
  function viewVendor() {
    const vs = Object.keys(SPO.VEN).sort((a, b) => SPO.VEN[a].name.localeCompare(SPO.VEN[b].name));
    const cands = W.v ? candidates() : [];
    const left = '<div class="card"><div class="det-card-head hd"><div><h2>Vendor &amp; service orders</h2><div class="sub">Choose the SPOs this invoice covers</div></div></div>' +
      '<div class="rec-grid"><div class="w-field"><label>Property</label><select onchange="setF(\'prop\', this.value)">' + PROPERTIES.filter(p => p.id !== 'all').map(p => '<option value="' + p.id + '"' + (W.prop === p.id ? ' selected' : '') + '>' + p.name + '</option>').join('') + '</select></div>' +
      '<div class="w-field"><label>Vendor</label><select onchange="setF(\'v\', this.value)"><option value="">Choose vendor…</option>' + vs.map(k => '<option value="' + k + '"' + (W.v === k ? ' selected' : '') + '>' + SPO.VEN[k].name + '</option>').join('') + '</select></div>' +
      '<div class="w-field"><label>Invoice number</label><input class="text-in" value="' + (W.num || '').replace(/"/g, '&quot;') + '" placeholder="e.g. INV-1001" onchange="setF(\'num\', this.value)"></div>' +
      '<div class="w-field"><label>Invoice date</label><input type="date" value="' + W.date + '" onchange="setF(\'date\', this.value)"></div></div>' +
      (dup() ? '<div class="callout amber" style="margin-top:12px"><b>' + W.num + ' was already mapped</b>' + SPO.VEN[W.v].name + ' has an SPO with this invoice number. Check it isn’t a duplicate before you continue.</div>' : '') +
      '<div class="cx-row" style="margin:18px 0 8px"><b style="font-size:14px">' + (W.showAll ? 'Open SPOs' : 'SPOs waiting on an invoice') + (W.v ? ' · ' + SPO.VEN[W.v].name : '') + '</b><span style="display:flex;gap:12px;align-items:center"><span class="cx-k">' + W.spoIds.length + ' selected</span>' + (W.v ? '<button class="w-linkbtn" onclick="setF(\'showAll\', ' + !W.showAll + ')">' + (W.showAll ? 'Only waiting on invoice' : 'Show other states') + '</button>' : '') + '</span></div>' +
      (!W.v ? '<div class="run-more" style="border:none;padding:6px 0 0">Choose a vendor — or upload the PDF and Scout AI fills it in.</div>'
        : cands.length ? '<div style="display:flex;flex-direction:column;gap:8px">' + cands.map(s => {
          const on = W.spoIds.indexOf(s.id) >= 0, st = SPO.STATES[s.state];
          return '<button class="opt-row' + (on ? ' selected' : '') + '" onclick="toggleSpo(' + s.id + ')"><span class="opt-ic" style="font-size:10.5px;font-weight:700">' + (s.series ? 'REC' : 'SPO') + '</span><span class="opt-body"><span class="opt-name">SPO-' + s.id + ' · ' + s.lines[0].desc + (s.lines.length > 1 ? ' +' + (s.lines.length - 1) : '') + '</span><span class="opt-desc">' + (s.run ? 'Run ' + fmtD(s.run) : 'Created ' + fmtD(s.ev.created)) + ' · estimate ' + money(SPO.total(s)) + ' · ' + st.label + (W.why[s.id] ? ' · <span style="color:var(--sky);font-weight:600">Scout AI: ' + W.why[s.id] + '</span>' : '') + '</span></span><span class="opt-radio">' + IC.check + '</span></button>';
        }).join('') + '</div>'
        : '<div class="run-more" style="border:none;padding:6px 0 0">No ' + SPO.VEN[W.v].name + ' SPOs ' + (W.showAll ? 'open' : 'waiting on an invoice') + ' at ' + propOf(W.prop).name + '.</div>') + '</div>';
    const right = '<div class="card"><div class="det-card-head hd"><div><h2>Invoice PDF</h2><div class="sub">Upload first — Scout AI reads the vendor, number, date and lines, and suggests the SPOs</div></div></div>' +
      (W.inv && W.file
        ? '<div class="file-drop selected" style="margin-top:12px;cursor:default"><div class="file-drop-icon">' + IC.check + '</div><div class="file-drop-title">' + W.file + '</div><div class="file-drop-sub">' + SPO.fileSize(W.inv.size) + ' · ' + SPO.VEN[W.v].name + ' · ' + W.inv.lines.length + ' lines · ' + money(r2(W.inv.lines.reduce((a, l) => a + l.amt, 0) + (W.inv.tax || 0))) + ' total</div></div>' +
          '<div class="ai-block" style="margin-top:14px"><div class="ai-head"><span class="ai-icon">' + IC.ai + '</span>Scout AI read ' + W.file + '</div><ul><li>Vendor, invoice number and date filled in</li><li>' + W.inv.lines.length + ' lines and ' + money(W.inv.tax) + ' sales tax extracted</li><li>' + Object.keys(W.why).length + ' SPOs suggested from the run dates</li></ul><div class="ai-foot">Suggestions only — you confirm every match on the next step.</div></div>' +
          '<button class="w-linkbtn" style="margin-top:12px" onclick="W.inv = null; W.file = null; persist(); renderPage()">Replace PDF</button>'
        : W.inv && W.manual
          ? '<div class="callout neutral" style="margin-top:12px"><b>Entering the invoice yourself</b>You’ll type the lines on the next step, or <button class="w-linkbtn" onclick="upload()">upload the PDF</button> instead.</div>'
          : '<button class="file-drop" style="margin-top:12px" onclick="upload()"><div class="file-drop-icon">' + IC.upload + '</div><div class="file-drop-title">Drop the vendor’s invoice PDF</div><div class="file-drop-sub">Demo: reads Crescent Cleaning’s August statement</div></button>' +
            '<button class="w-linkbtn" style="margin-top:12px" onclick="manual()">No PDF? Enter the invoice details yourself</button>') + '</div>';
    const bl = step1Blockers();
    return '<div class="intake-grid">' + left + right + '</div><div class="card" style="margin-top:20px"><button class="btn btn-primary btn-block"' + (bl.length ? ' disabled' : '') + ' onclick="location.hash=\'#match\'">Continue to matching</button>' + (bl.length ? '<ul class="w-blockers">' + bl.map(b => '<li>' + b + '</li>').join('') + '</ul>' : '') + '</div>';
  }

  /* ---------- step 2: the connector board across every selected SPO ---------- */
  function pdfText() {
    const v = SPO.VEN[W.v], p = propOf(W.prop), inv = W.inv, PW = 62, pad = (a, b) => a + ' '.repeat(Math.max(2, PW - a.length - b.length)) + b;
    const out = [v.name.toUpperCase(), v.email, '', pad('INVOICE', inv.num || '—'), pad('Date', fmtD(inv.date)), pad('PO references', W.spoIds.map(id => 'SPO-' + id).join(', ')), '', 'BILL TO', p.name, p.addr + ', ' + p.city, '', '-'.repeat(PW)];
    inv.lines.forEach(l => out.push(pad((l.desc || '').slice(0, 46), money(l.amt || 0))));
    const sub = r2(inv.lines.reduce((a, l) => a + (l.amt || 0), 0));
    out.push('-'.repeat(PW), pad('Subtotal', money(sub)), pad('Sales tax', money(inv.tax || 0)), pad('TOTAL DUE', money(r2(sub + (inv.tax || 0) + (inv.ship || 0)))), '', 'Terms: Net 30 · Remit to ' + v.name);
    return out.join('\n');
  }
  function viewMatch() {
    CTX = ctx();
    const bl = step2Blockers();
    const seg = '<div class="cx-viewbar"><div class="mode-seg"><button class="' + (view === 'lines' ? 'active' : '') + '" onclick="view = \'lines\'; renderPage()">' + IC.map + '<span>Line items</span></button><button class="' + (view === 'pdf' ? 'active' : '') + '" onclick="view = \'pdf\'; renderPage()">' + IC.doc + '<span>PDF</span></button></div><span class="ivt-sub" style="margin:0">' + (W.file ? W.file + ' · ' + SPO.fileSize(W.inv.size) : 'Entered manually') + ' · ' + SPO.VEN[W.v].name + ' · ' + W.spoIds.length + ' SPO' + (W.spoIds.length === 1 ? '' : 's') + '</span></div>';
    return '<div class="card">' + seg + (view === 'pdf' ? '<div class="cx-pdfview"><pre>' + pdfText() + '</pre></div>' : CX.board() +
      '<h3 style="margin:26px 0 4px;font-size:15px">Totals</h3><p class="ivt-sub">Each SPO compares to its own estimate; tax is split across SPOs by what each is billed.</p>' + CX.totals()) +
      '<div style="display:flex;gap:10px;margin-top:20px;align-items:center;flex-wrap:wrap"><span class="ivt-sub" style="margin:0">' + CX.doneCount() + ' of ' + W.inv.lines.length + ' invoice items connected · progress saves automatically</span>' +
      '<button class="btn btn-primary" style="margin-left:auto"' + (bl.length ? ' disabled' : '') + ' onclick="location.hash=\'#review\'">Continue to review</button></div>' +
      (bl.length ? '<ul class="w-blockers">' + bl.map(b => '<li>' + b + '</li>').join('') + '</ul>' : '') + '</div>';
  }

  /* ---------- step 3: each SPO's share, one attestation, validate all ---------- */
  function slices() {
    CTX = ctx();
    const ps = CX.perSpo(), tax = CX.taxShares(), ship = CX.shipShares();
    return selected().map((s, idx) => {
      const lines = [];
      W.inv.lines.forEach(l => {
        if (l.res === 'extra' && l.resSpo === s.id) lines.push({ desc: l.desc, amt: l.amt, maps: [], extra: { gl: l.resGl, unit: l.resUnit }, how: 'One-time extra · ' + l.resGl + ' ' + SPO.glName(l.resGl) + ' · ' + SPO.unitLabel(l.resUnit) });
        else if (l.res === 'add' && l.resSpo === s.id) lines.push({ desc: l.desc, amt: l.amt, maps: [], add: { gl: l.resGl, unit: l.resUnit }, how: 'Added to the SPO · ' + l.resGl + ' ' + SPO.glName(l.resGl) });
        else if (!l.res) { const mine = l.maps.filter(m => m.spo === s.id); if (mine.length) { const amt = r2(mine.reduce((a, m) => a + m.amt, 0)); lines.push({ desc: l.desc, amt, maps: mine.map(m => ({ line: m.line, amt: m.amt })), conf: 'manual', how: mine.map(m => '→ Line ' + (m.line + 1) + ' · ' + s.lines[m.line].desc).join(' · ') + (amt < l.amt - 0.005 ? ' · share of ' + money(l.amt) : '') }); } }
      });
      return { s, idx, lines, tax: tax[s.id] || 0, ship: ship[s.id] || 0, o: ps[s.id] };
    });
  }
  function viewReview() {
    const sl = slices(), removed = W.inv.lines.filter(l => l.res === 'remove'), total = r2(W.inv.lines.filter(l => l.res !== 'remove').reduce((a, l) => a + l.amt, 0) + (W.inv.tax || 0) + (W.inv.ship || 0));
    const vchip = d => Math.abs(d) < 0.005 ? '<span class="lm-var on">On estimate</span>' : '<span class="lm-var ' + (d > 0 ? 'over' : 'under') + '">' + (d > 0 ? '+' : '−') + money(Math.abs(d)) + (d > 0 ? ' over' : ' under') + '</span>';
    const cards = sl.map(x => '<div class="card"><div class="det-card-head hd"><div><h2 style="display:inline-flex;align-items:center;gap:10px"><a class="table-link" href="spo.html#' + x.s.id + '" target="_blank" rel="noopener">SPO-' + x.s.id + '</a>' + (x.s.run ? '<span class="cx-k">Run ' + fmtD(x.s.run) + '</span>' : '') + '</h2><div class="sub">' + x.s.lines.map(l => l.desc).join(' · ') + ' · estimate ' + money(x.o.est) + '</div></div>' + vchip(x.o.variance) + '</div>' +
      x.lines.map(l => '<div class="spo-line"><span class="sl-desc">' + l.desc + '</span><span class="sl-qty"></span><span class="sl-total">' + money(l.amt) + '</span><div class="cx-k" style="grid-column:1 / -1">' + l.how + '</div></div>').join('') +
      '<div class="det-totals">' + (x.tax ? '<div class="tot-row"><span>Sales tax share</span><span>' + money(x.tax) + '</span></div>' : '') + '<div class="tot-row grand"><span>SPO-' + x.s.id + ' share of ' + W.num + '</span><span>' + money(r2(x.lines.reduce((a, l) => a + l.amt, 0) + x.tax + x.ship)) + '</span></div></div></div>').join('');
    const rm = removed.length ? '<div class="card"><div class="det-card-head hd"><h2>Removed — not payable</h2></div>' + removed.map(l => '<div class="spo-line"><span class="sl-desc">' + l.desc + '</span><span class="sl-qty"></span><span class="sl-total" style="text-decoration:line-through;color:var(--muted-foreground)">' + money(l.amt) + '</span><div class="cx-k" style="grid-column:1 / -1">“' + l.resReason + '” · the vendor sees this reason</div></div>').join('') + '</div>' : '';
    const side = '<div class="card"><div class="det-card-head"><h2>' + W.num + '</h2></div>' +
      '<div class="sum-row"><span class="muted">Vendor</span><span>' + SPO.VEN[W.v].name + '</span></div><div class="sum-row"><span class="muted">Property</span><span style="text-align:right">' + propOf(W.prop).name + '</span></div>' +
      sl.map(x => '<div class="sum-row"><span class="muted">SPO-' + x.s.id + '</span><span>' + money(r2(x.lines.reduce((a, l) => a + l.amt, 0) + x.tax + x.ship)) + '</span></div>').join('') +
      '<div class="sum-grand"><span>Invoice total</span><span class="amt">' + money(total) + '</span></div>' +
      '<div class="cx-attest" style="margin-top:14px"><label><input type="checkbox"' + (W.attest ? ' checked' : '') + ' onchange="W.attest = this.checked; persist(); renderPage()"> I checked the work and matched every invoice item.</label><span>Validating makes ' + (sl.length > 1 ? 'all ' + sl.length + ' SPOs' : 'the SPO') + ' ready for Accounting — nothing is paid yet.</span></div>' +
      '<button class="btn btn-primary btn-block" style="margin-top:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px"' + (W.attest ? '' : ' disabled') + ' onclick="validateAll()"><span style="display:inline-flex;width:16px;height:16px">' + IC.shield + '</span>Validate ' + (sl.length > 1 ? sl.length + ' SPOs' : 'SPO-' + sl[0].s.id) + '</button></div>';
    return [cards + rm, side];
  }
  function validateAll() {
    if (!W.attest) return;
    const sl = slices(), total = r2(W.inv.lines.filter(l => l.res !== 'remove').reduce((a, l) => a + l.amt, 0) + (W.inv.tax || 0) + (W.inv.ship || 0));
    const removed = W.inv.lines.filter(l => l.res === 'remove');
    sl.forEach((x, i) => {
      const s = x.s, lines = x.lines.map(l => {
        if (l.add) { s.lines.push({ desc: l.desc, qty: 1, price: l.amt, alloc: [{ gl: l.add.gl, unit: l.add.unit, amt: l.amt }] }); SPO.log(s, 'Line added to SPO', l.desc + ' · ' + money(l.amt)); return { desc: l.desc, amt: l.amt, maps: [{ line: s.lines.length - 1, amt: l.amt }], conf: 'manual' }; }
        if (l.extra) { SPO.log(s, 'Extra charge accepted', l.desc + ' · ' + money(l.amt) + ' · ' + l.extra.gl + ' ' + SPO.glName(l.extra.gl)); return { desc: l.desc, amt: l.amt, maps: [], extra: l.extra, conf: 'manual' }; }
        return { desc: l.desc, amt: l.amt, maps: l.maps, conf: 'manual' };
      });
      if (i === 0) removed.forEach(l => { lines.push({ desc: l.desc, amt: l.amt, maps: [], status: 'removed', resReason: l.resReason }); SPO.log(s, 'Invoice line removed', '“' + l.desc + '” · ' + money(l.amt) + ' · ' + l.resReason, false, true); });
      s.invoice = { num: W.num, date: W.date, file: W.file || W.num + '.pdf', size: W.inv.size, tax: x.tax, ship: x.ship, validated: true, lines,
        shared: sl.length > 1 ? { total, spos: sl.map(y => y.s.id), idx: i + 1 } : null };
      s.state = 'ready'; s.ev.invoiced = s.ev.invoiced || SPO.now(); s.ev.mapped = SPO.now(); delete s.mapDraft;
      const d = r2(SPO.invSubtotal(s) - SPO.total(s));
      SPO.log(s, 'Invoice received', W.num + (sl.length > 1 ? ' · shared invoice, ' + (i + 1) + ' of ' + sl.length + ' SPOs' : '') + ' · uploaded by Alicia Grant');
      SPO.log(s, 'Invoice mapped & validated', money(SPO.invTotal(s)) + ' share' + (Math.abs(d) >= 0.005 ? ' · ' + (d > 0 ? '+' : '−') + money(Math.abs(d)) + ' variance accepted' : ' · on estimate'), true);
      SPO.save(s);
    });
    const key = W.key; dropDraft();
    try { sessionStorage.setItem('scout-intake-done', JSON.stringify({ num: W.num, v: W.v, prop: W.prop, total, spos: sl.map(x => x.s.id) })); } catch (e) { /* noop */ }
    location.hash = '#done-' + encodeURIComponent(key);
  }
  function viewDone() {
    let r = null; try { r = JSON.parse(sessionStorage.getItem('scout-intake-done')); } catch (e) { /* noop */ }
    if (!r) return '<div class="card">Nothing to show. <a class="text-link" href="spos.html#invoices">Back to Service POs</a></div>';
    const spos = r.spos.map(id => SPO.get(id)), allReady = spos.every(s => s.state === 'ready');
    return '<div class="confirm-wrap" style="padding-top:0"><div class="confirm-ic" style="width:72px;height:72px"><span style="display:inline-flex;width:34px;height:34px">' + IC.check + '</span></div>' +
      '<h1 style="margin-bottom:0">' + r.num + ' mapped to ' + spos.length + ' SPO' + (spos.length === 1 ? '' : 's') + '</h1><div class="confirm-sub">' + SPO.VEN[r.v].name + ' · ' + propOf(r.prop).name + ' · ' + money(r.total) + '</div>' +
      '<div class="card next-card"><div class="det-card-head"><h2 style="font-size:16px">SPOs updated</h2></div>' + spos.map(s => { const st = SPO.STATES[s.state]; return '<div class="run-row"><span class="rd"><b>' + (s.run || s.ev.created).slice(8, 10) + '</b><span>' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+(s.run || s.ev.created).slice(5, 7) - 1] + '</span></span><div class="rb"><div><a class="table-link" href="spo.html#' + s.id + '">SPO-' + s.id + '</a> · ' + money(SPO.invTotal(s)) + '</div><div class="m">' + s.lines[0].desc + '</div></div><span class="status-dot-item"><span class="status-dot ' + st.dot + '"></span><span class="status-dot-label">' + st.label + '</span></span></div>'; }).join('') +
      '<div class="sum-grand" style="margin-top:6px"><span>Invoice total</span><span class="amt">' + money(r.total) + '</span></div></div>' +
      '<div class="confirm-actions">' + (allReady ? '<button class="btn btn-primary" style="display:inline-flex;align-items:center;gap:8px" onclick="sendAll()"><span style="display:inline-flex;width:16px;height:16px">' + IC.send + '</span>Send all to Accounting</button>' : '') +
      '<a class="btn" href="spos.html#invoices">View Service POs</a></div></div>';
  }
  function sendAll() {
    let r = null; try { r = JSON.parse(sessionStorage.getItem('scout-intake-done')); } catch (e) { return; }
    r.spos.forEach(id => { const s = SPO.get(id); if (s.state !== 'ready') return; s.state = 'accounting'; s.ev.accounting = SPO.now(); SPO.log(s, 'Sent to Accounting', 'Packet: PO, invoice ' + s.invoice.num + ' (shared), GL allocation · ' + money(SPO.invTotal(s))); SPO.save(s); });
    renderPage(); showToast('Sent to Accounting', r.spos.length + ' SPOs · ' + money(r.total));
  }

  function renderPage() {
    const cur = route(); if (!cur) return;
    const main = document.getElementById('w-main'), side = document.getElementById('w-side'), grid = document.getElementById('w-grid');
    document.getElementById('w-title').textContent = W.num ? 'Invoice ' + W.num : 'Add invoice';
    document.getElementById('w-sub').textContent = W.v ? SPO.VEN[W.v].name + ' · ' + propOf(W.prop).name : 'Map one vendor invoice to every SPO it covers';
    const full = cur === 'vendor' || cur === 'match' || cur === 'done';
    grid.style.gridTemplateColumns = full ? '1fr' : ''; side.style.display = full ? 'none' : '';
    if (cur === 'done') {
      document.getElementById('chk-steps').style.display = 'none'; document.querySelector('.hero-title-block').style.visibility = 'hidden'; grid.style.marginTop = '-36px';
      main.innerHTML = viewDone(); return;
    }
    document.getElementById('chk-steps').style.display = ''; document.querySelector('.hero-title-block').style.visibility = ''; grid.style.marginTop = '';
    stepBand(cur);
    if (cur === 'vendor') main.innerHTML = viewVendor();
    else if (cur === 'match') { main.innerHTML = viewMatch(); if (view === 'lines') { CX.mount(); requestAnimationFrame(() => CX.draw()); } }
    else { const [m, sd] = viewReview(); main.innerHTML = m; side.innerHTML = sd; }
  }
  let toastTimer;
  function showToast(title, desc) { let el = document.getElementById('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.style.cssText = 'position:fixed;bottom:24px;left:24px;z-index:600;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:14px 18px;max-width:360px;font-size:13px;transition:opacity .2s'; document.body.appendChild(el); } el.innerHTML = '<b style="display:block;font-size:14px">' + title + '</b><span style="color:var(--muted-foreground)">' + desc + '</span>'; el.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.opacity = 0, 3000); }
  window.addEventListener('hashchange', () => { renderPage(); window.scrollTo(0, 0); });
  renderPage();
</script>
</body>
</html>
