<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare — Scout Buyer</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="buyer.css">
<script src="cart.js"></script>
</head>
<body class="buyer">

<!-- ===== App Bar ===== -->
<div class="app-bar-wrap">
  <nav class="app-bar" id="app-bar"></nav>
  <script src="appbar.js"></script>
</div>




<main class="page" style="padding-top:32px">
  <a class="back-link" id="cmp-back" href="products.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span id="cmp-back-lbl">Back to Dishwashers</span></a>
  <script>
    (() => {
      if (document.referrer && /\/product(\.html)?([?#]|$)/.test(document.referrer) && history.length > 1) {
        document.getElementById('cmp-back-lbl').textContent = 'Back to product';
        document.getElementById('cmp-back').addEventListener('click', e => { e.preventDefault(); history.back(); });
      }
    })();
  </script>
  <div class="cmp-head">
    <div><h1>Compare products</h1><div class="sub" id="cmp-sub">Live price, availability, delivery and normalized specifications for your active property.</div></div>
    <button class="btn" onclick="clearAllCmp()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>Clear comparison</button>
  </div>
  <div class="cmp-tools">
    <label><span>Show differences only</span><button class="switch" id="diff-switch" role="switch" aria-checked="false" onclick="toggleDiff()"></button></label>
  </div>
  <div class="cmp-wrap" id="cmp-wrap"></div>
</main>

<script>
  /* ---------- Theme ---------- */
  function applyTheme() {
    const dark = localStorage.getItem('scout-theme') === 'dark';
    document.body.classList.toggle('dark', dark);
    const b = document.getElementById('theme-btn');
    b.querySelector('.icon-sun').style.display = dark ? 'none' : '';
    b.querySelector('.icon-moon').style.display = dark ? '' : 'none';
  }
  function toggleTheme() { localStorage.setItem('scout-theme', document.body.classList.contains('dark') ? 'light' : 'dark'); applyTheme(); }
  applyTheme();

  /* ---------- Menus ---------- */
  function closeMenus() {
    document.querySelectorAll('.menu-panel').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.nav-chip').forEach(c => c.classList.remove('open'));
  }
  function toggleMenu(id) {
    const panel = document.getElementById('menu-' + id), chip = document.getElementById('nav-' + id);
    const wasOpen = panel.classList.contains('open');
    closeMenus(); document.getElementById('ctx-switch').classList.remove('open');
    if (!wasOpen) { panel.classList.add('open'); chip.classList.add('open'); }
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-anchor')) closeMenus();
    if (!e.target.closest('.ctx-switch')) document.getElementById('ctx-switch').classList.remove('open');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); document.getElementById('ctx-switch').classList.remove('open'); } });

  /* ---------- Context switcher ---------- */
  const PROPERTIES = [
    { id: 'all', name: 'All properties', desc: 'Combined dashboard for every accessible property', units: null },
    { id: 'magnolia', name: 'Magnolia Place Apartments', addr: '4201 Veterans Memorial Blvd', city: 'Metairie, LA 70006', units: 51 },
    { id: 'bayou', name: 'Bayou Crossing Apartments', addr: '3850 Airline Dr', city: 'Baton Rouge, LA 70805', units: 120 },
    { id: 'lonestar', name: 'Lone Star Flats', addr: '7200 Westheimer Rd', city: 'Houston, TX 77057', units: 78 },
    { id: 'central', name: 'Central Park View', addr: '1501 Canal St', city: 'New Orleans, LA 70112', units: 96 },
    { id: 'cypress', name: 'Cypress Lake Apartments', addr: '9100 Cypress Lake Dr', city: 'Lafayette, LA 70508', units: 64 },
    { id: 'beauchene', name: 'Beau Chene Villas', addr: '225 Beau Chene Blvd', city: 'Mandeville, LA 70471', units: 40 },
    { id: 'sherwood', name: 'Sherwood Acres', addr: '1250 Sherwood Forest Blvd', city: 'Baton Rouge, LA 70815', units: 88 },
    { id: 'cyprus', name: 'Cyprus Glenn', addr: '4800 Cyprus Glenn Way', city: 'Shreveport, LA 71105', units: 32 },
    { id: 'heights', name: 'Magnolia Heights Apartments', addr: '6301 Magnolia Heights Rd', city: 'Houston, TX 77004', units: 110 }
  ];
  let currentProp = 'all';
  const bIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>';
  const pinIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
  function renderCtxList() {
    document.getElementById('ctx-list').innerHTML = PROPERTIES.filter(p => p.id !== 'all').map(p => {
      const active = p.id === currentProp;
      const body = p.id === 'all'
        ? '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.desc + '</span>'
        : '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.addr + '</span><span class="opt-city">' + pinIcon + p.city + '</span>';
      const units = p.units ? '<span class="units-badge"><b>' + p.units + '</b><span>units</span></span>' : '';
      return '<button class="ctx-option' + (active ? ' active' : '') + '" onclick="selectProp(\'' + p.id + '\')"><span class="opt-tile">' + bIcon + '</span><span class="opt-body">' + body + '</span>' + units + '</button>';
    }).join('');
  }
  function selectProp(id) {
    currentProp = id;
    localStorage.setItem('scout-shop-prop', id);
    const gate = document.getElementById('prop-gate');
    if (gate) gate.classList.remove('open');
    const p = PROPERTIES.find(x => x.id === id);
    document.getElementById('echo-name').textContent = p.name;
    document.getElementById('echo-name').title = p.id === 'all' ? '9 accessible properties' : p.units + ' units · ' + p.city;
    renderCtxList();
    document.getElementById('ctx-switch').classList.remove('open');
  }
  function toggleCtx() {
    const el = document.getElementById('ctx-switch');
    const wasOpen = el.classList.contains('open');
    closeMenus();
    if (!wasOpen) el.classList.add('open');
  }
  function openPropGate() {
    let ov = document.getElementById('prop-gate');
    if (!ov) { ov = document.createElement('div'); ov.id = 'prop-gate'; ov.className = 'overlay center'; document.body.appendChild(ov); }
    ov.innerHTML = '<div class="val-modal" style="width:560px;max-width:calc(100vw - 40px)"><div class="val-head"><h2>Choose a property to shop for</h2><p>Products, pricing, and availability are tailored to each property \u2014 pick one to browse its marketplace. You can switch anytime from the bar above.</p></div><div class="val-body" style="padding:10px 14px;max-height:60vh;overflow:auto">' +
      PROPERTIES.filter(p => p.id !== 'all').map(p => '<button class="ctx-option" style="width:100%" onclick="selectProp(\'' + p.id + '\')"><span class="opt-tile">' + bIcon + '</span><span class="opt-body"><span class="opt-name">' + p.name + '</span><span class="opt-addr">' + p.addr + '</span><span class="opt-city">' + pinIcon + p.city + '</span></span><span class="units-badge"><b>' + p.units + '</b><span>units</span></span></button>').join('') + '</div></div>';
    ov.classList.add('open');
  }
  const savedProp = localStorage.getItem('scout-shop-prop');
  if (savedProp && savedProp !== 'all' && PROPERTIES.some(p => p.id === savedProp)) currentProp = savedProp;
  renderCtxList();
  window.addEventListener('DOMContentLoaded', () => {
    if (currentProp === 'all') openPropGate(); else selectProp(currentProp);
  });



  /* ---------- Products in comparison (from the listing's tray, or a demo pair) ---------- */
  const money = v => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const DEMO = [
    { id: 1, vendor: 'API Test - Chadwell', vini: 'CH', brand: 'Whirlpool', name: 'WHIRLPOOL® ENERGY STAR® 24" Dishwasher in Black (WDF341PAPB)', price: 376.38, was: 489.00, stock: 'in', speed: null, pickup: false, miles: 0 },
    { id: 2, vendor: 'Scout Demo Vendor', vini: 'SD', brand: 'Frigidaire', name: '24 in. 14 Place Settings Dishwasher in Stainless Steel', price: 374.44, was: 483.15, stock: 'in', speed: '1-2', pickup: true, miles: 8 }
  ];
  let items = [];
  try { items = JSON.parse(localStorage.getItem('scout-compare') || 'null') || DEMO; } catch (e) { items = DEMO; }
  if (!items.length) items = DEMO;

  // deterministic specs per product
  const pick = (id, arr, salt) => arr[(id * 7 + salt) % arr.length];
  function specs(p) {
    const finish = /Stainless/i.test(p.name) ? 'Stainless Steel' : /White/i.test(p.name) ? 'White' : /Slate/i.test(p.name) ? 'Slate' : 'Black';
    return {
      sku: String(300000 + p.id * 1187).slice(0, 6),
      ada: pick(p.id, ['Yes', 'No', 'No'], 1), amps: pick(p.id, ['10 Amp', '12 Amp', '15 Amp'], 2), asse: pick(p.id, ['ASSE 1006', '—', 'ASSE 1006'], 3),
      capacity: pick(p.id, ['12 Place Settings', '14 Place Settings', '15 Place Settings', '16 Place Settings'], 4),
      cec: pick(p.id, ['For Sale in CA', 'For Sale in CA', '—'], 5), finish, control: pick(p.id, ['Front', 'Top', 'Digital'], 6),
      db: [44, 47, 50, 52, 55, 60][(p.id * 3) % 6], depth: pick(p.id, ['24-1/2 in', '25 in', '24 in', '23-7/8 in'], 7),
      energy: pick(p.id, ['ENERGY STAR®', 'ENERGY STAR®', '—'], 8), cycles: [2, 3, 4, 5, 6][(p.id * 5) % 5], warranty: pick(p.id, ['1 year', '1 year', '2 years'], 9)
    };
  }
  const glyph = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M4 8h16"/><circle cx="8" cy="5" r="0.6"/><circle cx="11" cy="5" r="0.6"/><path d="M8 12h8"/><path d="M8 16h8"/></svg>';
  const delivery = p => p.speed === '1-2' ? 'Up to 2 days' : p.speed === '3-5' ? '3–5 business days' : '5–7 business days';
  const deliveryRank = p => p.speed === '1-2' ? 1 : p.speed === '3-5' ? 2 : 3;

  // rows: [group, label, getter, best?] — best: 'min' | 'max' | fn(values)->index | null
  const ROWS = [
    ['Purchase', 'Price', p => money(p.price), vals => idxMin(items.map(p => p.price))],
    ['Purchase', 'Unit', () => 'Each', null],
    ['Purchase', 'Vendor', p => p.vendor, null],
    ['Purchase', 'Availability', p => p.stock === 'in' ? 'In stock' : p.stock === 'low' ? 'Low stock' : 'Out of stock', null],
    ['Purchase', 'Delivery', p => delivery(p), vals => idxMin(items.map(deliveryRank))],
    ['Purchase', 'Pickup', p => p.pickup ? 'Available · ' + p.miles + ' mi' : 'Not available', vals => { const i = items.findIndex(p => p.pickup); return items.filter(p => p.pickup).length === 1 ? i : -1; }],
    ['Product', 'Brand', p => p.brand, null],
    ['Product', 'Color finish', p => specs(p).finish, null],
    ['Product', 'Energy rating', p => specs(p).energy, null],
    ['Specification', 'Capacity', p => specs(p).capacity, vals => idxMax(items.map(p => parseInt(specs(p).capacity)))],
    ['Specification', 'Decibel rating', p => specs(p).db + ' dB', vals => idxMin(items.map(p => specs(p).db))],
    ['Specification', 'Wash cycles', p => specs(p).cycles + ' cycles', vals => idxMax(items.map(p => specs(p).cycles))],
    ['Specification', 'Control type', p => specs(p).control, null],
    ['Specification', 'Depth', p => specs(p).depth, null],
    ['Specification', 'Amps', p => specs(p).amps, null],
    ['Specification', 'ADA compliant', p => specs(p).ada, null],
    ['Specification', 'ASSE standards', p => specs(p).asse, null],
    ['Specification', 'CEC compliant', p => specs(p).cec, null],
    ['Specification', 'Warranty', p => specs(p).warranty, vals => idxMax(items.map(p => parseInt(specs(p).warranty)))],
  ];
  function idxMin(arr) { let i = -1, m = Infinity; arr.forEach((v, k) => { if (v < m) { m = v; i = k; } }); return arr.filter(v => v === m).length === 1 ? i : -1; }
  function idxMax(arr) { let i = -1, m = -Infinity; arr.forEach((v, k) => { if (v > m) { m = v; i = k; } }); return arr.filter(v => v === m).length === 1 ? i : -1; }

  let diffOnly = false;
  function render() {
    const wrap = document.getElementById('cmp-wrap');
    items = items.slice(0, 2);
    if (!items.length) { wrap.innerHTML = '<div class="cmp-empty"><b>Nothing to compare yet</b>Pick two products from a category to compare them side by side.<br><br><a class="btn btn-primary" href="products.html" style="display:inline-flex">Browse Dishwashers</a></div>'; return; }
    const showAdd = items.length < 2;
    const bestIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    let thead = '<thead><tr><th></th>' + items.map(p => '<th><div class="cmp-prod"><div class="cmp-media">' + glyph + '</div><div class="cmp-name">' + p.name + '</div><div class="cmp-sku">SKU ' + specs(p).sku + '</div><div class="cmp-actions"><button class="btn btn-primary" onclick="addToCart(' + p.id + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>Add to cart</button><button class="icon-btn" data-tip="Remove" onclick="removeItem(' + p.id + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button></div></div></th>').join('') +
      (showAdd ? '<th><a class="cmp-add" href="products.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add another product</a></th>' : '') + '</tr></thead>';
    let tbody = '<tbody>'; let lastGroup = null; let shownRows = 0;
    ROWS.forEach(([group, label, get, best]) => {
      const vals = items.map(get);
      const allNa = vals.every(v => v === '—'); if (allNa) return;
      const isDiff = new Set(vals).size > 1;
      if (diffOnly && !isDiff) return;
      if (group !== lastGroup) { tbody += '<tr class="group"><th>' + group + '</th>' + items.map(() => '<td></td>').join('') + (showAdd ? '<td></td>' : '') + '</tr>'; lastGroup = group; }
      const bi = best && items.length > 1 ? best(vals) : -1;
      tbody += '<tr' + (isDiff ? ' class="diff"' : '') + '><td class="lbl">' + label + '</td>' + vals.map((v, i) => '<td class="val' + (v === '—' ? ' na' : '') + '">' + v + (i === bi ? '<span class="best">' + bestIcon + 'Best</span>' : '') + '</td>').join('') + (showAdd ? '<td></td>' : '') + '</tr>';
      shownRows++;
    });
    if (!shownRows) tbody += '<tr><td colspan="' + (items.length + 2) + '" style="text-align:center;color:var(--muted-foreground);padding:32px">These products have no differences in the compared attributes.</td></tr>';
    tbody += '</tbody>';
    const cols = items.length + (showAdd ? 1 : 0);
    wrap.innerHTML = '<table class="cmp" id="cmp">' + thead + tbody + '</table>';
  }
  function toggleDiff() { diffOnly = !diffOnly; document.getElementById('diff-switch').setAttribute('aria-checked', diffOnly ? 'true' : 'false'); render(); }
  function removeItem(id) { items = items.filter(p => p.id !== id); localStorage.setItem('scout-compare', JSON.stringify(items)); render(); }
  function clearAllCmp() { items = []; localStorage.setItem('scout-compare', '[]'); render(); }
  function addToCart(id) { const p = items.find(x => x.id === id); CART.add(currentProp, { id: p.id, name: p.name, sku: (specs(p) || {}).sku || '', price: p.price, vendor: p.vini || 'SD' }, 1); showToast('Added to cart', p.brand + ' · ' + money(p.price)); }
  let toastTimer;
  function showToast(title, desc) { let t = document.getElementById('toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;bottom:24px;left:24px;z-index:300;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:14px 18px;max-width:360px;font-size:13px;transition:opacity .2s'; document.body.appendChild(t); } t.innerHTML = '<b style="display:block;font-size:14px">' + title + '</b><span style="color:var(--muted-foreground)">' + desc + '</span>'; t.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.opacity = 0, 3000); }
  render();
</script>
</body>
</html>
