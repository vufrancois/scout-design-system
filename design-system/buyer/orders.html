<link rel="stylesheet" href="buyer.css">

</head>
<body class="buyer">

<!-- ===== App Bar ===== -->
<div class="app-bar-wrap">
  <nav class="app-bar" id="app-bar"></nav>
  <script src="appbar.js"></script>
</div>






<section class="hero page-hero">
  <div class="hero-bg"></div>
  <div class="hero-inner" style="flex-direction:column;gap:0">
    <div class="hero-title-block">

<main class="page">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div class="tab-bar" id="tab-bar"></div>

  <div class="toolbar" id="tbar" style="margin-top:16px">
    <div class="toolbar-group">

          Add filter

        </button>
        <div class="filter-menu" id="filter-menu" style="display:none"></div>
      </div>
      <div class="filter-menu-wrap">
        <button class="toolbar-btn" onclick="toggleDateMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>

</main>

<script>
  /* ---------- Theme ---------- */
  function applyTheme() {
    const dark = localStorage.getItem('scout-theme') === 'dark';
    document.body.classList.toggle('dark', dark);
    const b = document.getElementById('theme-btn');
    b.querySelector('.icon-sun').style.display = dark ? 'none' : '';
    b.querySelector('.icon-moon').style.display = dark ? '' : 'none';
  }
  function toggleTheme() { localStorage.setItem('scout-theme', document.body.classList.contains('dark') ? 'light' : 'dark'); applyTheme(); }
  applyTheme();

  /* ---------- Menus ---------- */
  function closeMenus() {
    document.querySelectorAll('.menu-panel').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.nav-chip').forEach(c => c.classList.remove('open'));
  }
  function toggleMenu(id) {
    const panel = document.getElementById('menu-' + id), chip = document.getElementById('nav-' + id);
    const wasOpen = panel.classList.contains('open');
    closeMenus(); document.getElementById('ctx-switch').classList.remove('open');
    if (!wasOpen) { panel.classList.add('open'); chip.classList.add('open'); }
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-anchor')) closeMenus();
    if (!e.target.closest('.ctx-switch')) document.getElementById('ctx-switch').classList.remove('open');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); document.getElementById('ctx-switch').classList.remove('open'); } });

  /* ---------- Context switcher ---------- */

    { id: 'lonestar', name: 'Lone Star Flats', addr: '7200 Westheimer Rd', city: 'Houston, TX 77057', units: 78 },
    { id: 'central', name: 'Central Park View', addr: '1501 Canal St', city: 'New Orleans, LA 70112', units: 96 },
    { id: 'cypress', name: 'Cypress Lake Apartments', addr: '9100 Cypress Lake Dr', city: 'Lafayette, LA 70508', units: 64 },
    { id: 'beauchene', name: 'Beau Chene Villas', addr: '225 Beau Chene Blvd', city: 'Mandeville, LA 70471', units: 40 },
    { id: 'sherwood', name: 'Sherwood Acres', addr: '1250 Sherwood Forest Blvd', city: 'Baton Rouge, LA 70815', units: 88 },
    { id: 'cyprus', name: 'Cyprus Glenn', addr: '4800 Cyprus Glenn Way', city: 'Shreveport, LA 71105', units: 32 },
    { id: 'heights', name: 'Magnolia Heights Apartments', addr: '6301 Magnolia Heights Rd', city: 'Houston, TX 77004', units: 110 }

  let currentProp = 'all';
  const bIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>';
  const pinIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
  function renderCtxList() {
    document.getElementById('ctx-list').innerHTML = PROPERTIES.map(p => {
      const active = p.id === currentProp;
      const body = p.id === 'all'

      const units = p.units ? '<span class="units-badge"><b>' + p.units + '</b><span>units</span></span>' : '';
      return '<button class="ctx-option' + (active ? ' active' : '') + '" onclick="selectProp(\'' + p.id + '\')"><span class="opt-tile">' + bIcon + '</span><span class="opt-body">' + body + '</span>' + units + '</button>';

  }
  function selectProp(id) {
    currentProp = id;

    document.getElementById('ctx-switch').classList.remove('open');
    page = 1; renderPage();
  }
  function toggleCtx() {

    const wasOpen = el.classList.contains('open');
    closeMenus();
    if (!wasOpen) el.classList.add('open');
  }
  renderCtxList();




  const money = v => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const VEN = { SD: 'Scout Demo Vendor', ID: 'Ideal DEV', CH: 'API Test - Chadwell', GB: 'Gorman Bros', AC: 'ACME Refrigeration' };
  const glyph = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M4 8h16"/><circle cx="8" cy="5" r="0.6"/><circle cx="11" cy="5" r="0.6"/><path d="M8 12h8"/><path d="M8 16h8"/></svg>';
  const IC = {
    box: '<svg class="stat-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>',
    clock: '<svg class="stat-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    truck: '<svg class="stat-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35a1 1 0 0 0-.78-.38H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>',
    check: '<svg class="stat-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>',
    ship: '<svg class="stat-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4 7.55 4.24"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg>',
    doc: '<svg class="stat-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>',
    warn: '<svg class="stat-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
    card: '<svg class="stat-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>',
    dollar: '<svg class="stat-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
    archive: '<svg class="stat-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>',
    x: '<svg class="stat-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>'
  };
  const NAMES = ['27 in. 7.4 cu. ft. Electric Dryer in White', 'GE® ENERGY STAR® Dishwasher with Front Controls', '24 in. 2-Cycle Built-in Dishwasher in White', 'Gold® 23-7/8 in. Dishwasher with Pocket Handle', '700 W Compact Microwave in Black', '50 gal. Tall Electric Water Heater', 'LED High Bay Fixture, 150W', '1.6 cu. ft. Refrigerator in Black', 'Commercial 6.7 cu. ft. Non Coin Electric Dryer', 'Packaged Terminal Air Conditioner 12k BTU'];
  const PROPS_POOL = ['magnolia', 'magnolia', 'magnolia', 'bayou', 'lonestar', 'central', 'magnolia', 'cypress'];
  let seedv = 11;
  const rnd = () => { seedv = (seedv * 1103515245 + 12345) % 2147483648; return seedv / 2147483648; };

  function mkItems(total, n) {
    const items = []; let rem = total;
    for (let k = 0; k < n; k++) {
      const qty = k === n - 1 ? 1 : (rnd() < 0.3 ? 2 : 1);
      const share = k === n - 1 ? rem : Math.round(rem / (n - k) * 100) / 100;
      items.push([NAMES[Math.floor(rnd() * NAMES.length)], qty, Math.round(share / qty * 100) / 100]);
      rem = Math.round((rem - share) * 100) / 100;
    }
    return items;
  }
  function gen(count, numStart, dStart, mk) {
    const out = []; let num = numStart; let day = dStart;
    for (let i = 0; i < count; i++) {
      const total = Math.round((30 + rnd() * 4000) * 100) / 100;
      const n = 1 + Math.floor(rnd() * 3);
      const d = new Date(2026, 6, 14); d.setDate(d.getDate() - Math.floor(day));
      day += rnd() * 3;
      out.push(Object.assign({ num: num--, v: ['SD','SD','SD','ID','CH','GB','AC'][Math.floor(rnd() * 7)], prop: PROPS_POOL[Math.floor(rnd() * PROPS_POOL.length)], total, count: n, items: mkItems(total, n), date: d.toISOString().slice(0, 10) }, mk(i)));
    }
    return out;
  }

  // Open: 62 = To Fulfill 36 · To Ship 11 · Shipped 7 · Delivered 8 (reconciled to Home)
  const OPEN = [
    { num: 674, v: 'SD', prop: 'bayou', total: 42.39, count: 1, stage: 'delivered', validated: true, invReady: true, attn: true, date: '2026-08-28', items: [['47 x 64 in. Vinyl Cordless Plus Mini Blind', 1, 30.40]] },
    { num: 669, v: 'SD', prop: 'magnolia', total: 979.11, count: 1, stage: 'ship', date: '2026-08-26', items: [['Whirlpool 24 in. Front Control Dishwasher in White', 1, 971.12]] },
    { num: 668, v: 'ID', prop: 'magnolia', total: 322.58, count: 2, stage: 'transit', date: '2026-08-26', items: [['T6 PRO Z-Wave Z-Wave Pro Thermostat', 2, 161.29]] },
    { num: 662, v: 'SD', prop: 'bayou', total: 81.97, count: 2, stage: 'delivered', part: { done: 1, of: 2 }, date: '2026-08-27', items: [['CORDLESS MINI BLIND 69X60 - ALABASTER', 2, 34.99]] },
    { num: 657, v: 'SD', prop: 'magnolia', total: 3795.47, count: 3, stage: 'delivered', attn: true, date: '2026-08-24', items: [['27 in. 7.4 cu. ft. Electric Dryer in White', 1, 1210.00], ['Commercial 6.7 cu. ft. Non Coin Electric Dryer in White', 1, 1455.09], ['23-7/16 in. 4.3 cu. ft. Electric Dryer in White', 1, 1118.39]] },
    { num: 512, v: 'GB', prop: 'magnolia', total: 563.00, count: 1, stage: 'fulfill', date: '2026-07-22', items: [['GE® ENERGY STAR® Dishwasher with Front Controls', 1, 563.00]] },
    { num: 486, v: 'SD', prop: 'magnolia', total: 66.18, count: 1, stage: 'fulfill', cancel: true, date: '2026-07-20', items: [['Dryer Vent Kit, 4 in. x 8 ft.', 1, 66.18]] },
    { num: 421, v: 'ID', prop: 'magnolia', total: 23.12, count: 1, stage: 'fulfill', date: '2026-07-16', items: [['HVAC Filter 16x25x1 (4-pack)', 1, 23.12]] },
    { num: 420, v: 'ID', prop: 'magnolia', total: 37.02, count: 1, stage: 'fulfill', date: '2026-07-16', items: [['Thermostat Batteries AA (12-pack)', 1, 37.02]] },
    { num: 411, v: 'SD', prop: 'magnolia', total: 415.39, count: 1, stage: 'delivered', attn: true, date: '2026-07-16', items: [['24 in. 2-Cycle Built-in Dishwasher in White', 1, 390.39]] },
    { num: 408, v: 'ID', prop: 'bayou', total: 6900.00, count: 10, stage: 'fulfill', part: { done: 4, of: 10 }, date: '2026-07-15', items: [['Packaged Terminal Air Conditioner 12k BTU', 10, 690.00]] },
    { num: 404, v: 'SD', prop: 'magnolia', total: 1070.58, count: 1, stage: 'fulfill', claimOpen: true, date: '2026-07-15', items: [['27 in. 7.4 cu. ft. Electric Dryer in White', 1, 1070.58]] }
  ].concat(
    gen(30, 399, 2, i => ({ stage: 'fulfill' })),
    gen(10, 369, 2, i => ({ stage: 'ship' })),
    gen(6, 358, 3, i => ({ stage: 'transit' })),
    gen(4, 351, 4, i => ({ stage: 'delivered', attn: i < 3 }))
  );
  // Partial validation is the normal case: mark two more in-flight orders mid-validation
  (() => { let marked = 0; for (const r of OPEN) { if (!r.part && r.stage === 'fulfill' && r.count >= 2 && r.num < 400) { r.part = { done: 1, of: r.count }; if (++marked === 2) break; } }
    const pf = OPEN.find(r => !r.part && r.stage === 'fulfill' && r.count >= 3 && r.num < 395); if (pf) pf.sub = ['Partially Fulfilled', 1, pf.count];
    const ps = OPEN.find(r => r.stage === 'ship' && r.count >= 2); if (ps) ps.sub = ['Partially Shipped', 1, ps.count]; })();

  // Invoiced: 16 = Awaiting Validation 11 · Validated 4 · Buyer Paid 1
  const INVOICED = [
    { num: 641, v: 'SD', prop: 'magnolia', total: 856.82, count: 1, inv: 'await', claimOpen: true, date: '2026-08-18', items: [['GE Profile 30 in. Slide-In Electric Range in Stainless', 1, 764.55]] },
    { num: 645, v: 'SD', prop: 'magnolia', total: 1060.00, count: 4, inv: 'await', attn: true, date: '2026-08-19', items: [['Gold® 23-7/8 in. Dishwasher with Pocket Handle', 3, 505.13], ['Gold® 23-7/8 in. Dishwasher with Pocket Handle', 1, 505.13]] },
    { num: 516, v: 'SD', prop: 'magnolia', total: 698.85, count: 1, inv: 'await', attn: true, date: '2026-07-23', items: [['GE® ENERGY STAR® Dishwasher with Front Controls', 1, 698.85]] },

    { num: 507, v: 'AC', prop: 'bayou', total: 83.12, count: 1, inv: 'await', attn: true, date: '2026-07-21', items: [['Refrigerator Door Gasket', 1, 83.12]] },
    { num: 653, v: 'SD', prop: 'magnolia', total: 566.16, count: 1, inv: 'validated', date: '2026-08-27', items: [['Gold\u00AE 23-7/8 in. Dishwasher with Pocket Handle', 1, 505.13]] }
  ].concat(
    gen(5, 505, 2, i => ({ inv: 'await', attn: true })),

  // Closed: 28 = Completed 27 · Canceled 1
  const CLOSED = [
    { num: 515, v: 'SD', prop: 'magnolia', total: 253.03, count: 2, cl: 'completed', date: '2026-07-23', items: [['700 W Compact Microwave in Black', 2, 105.57]] },

    { num: 269, v: 'SD', prop: 'magnolia', total: 647.13, count: 1, cl: 'completed', date: '2026-07-01', items: mkItems(647.13, 1) },
    { num: 259, v: 'SD', prop: 'magnolia', total: 536.56, count: 1, cl: 'completed', date: '2026-06-26', items: mkItems(536.56, 1) },
    { num: 256, v: 'SD', prop: 'magnolia', total: 2449.95, count: 3, cl: 'completed', date: '2026-06-25', items: mkItems(2449.95, 3) },
    { num: 234, v: 'GB', prop: 'magnolia', total: 742.00, count: 1, cl: 'completed', date: '2026-06-18', items: mkItems(742, 1) }
  ].concat(
    gen(21, 230, 3, i => ({ cl: 'completed' })),
    [{ num: 153, v: 'SD', prop: 'magnolia', total: 1730.61, count: 2, cl: 'canceled', date: '2026-05-26', items: [['29-3/4 in. 18.25 cu. ft. Top Mount Freezer and Full Refrigerator in White', 1, 972.79], ['23-43/100 in. 10 cu. ft. Top Mount Freezer Refrigerator in White', 1, 745.83]] }]
  );

  const TABS = [
    { id: 'open', label: 'Open Orders', icon: IC.box, data: OPEN },
    { id: 'backordered', label: 'Backordered Orders', icon: IC.back.replace('<svg', '<svg class="tab-ic"'), data: [] },
    { id: 'invoiced', label: 'Invoiced Orders', icon: IC.doc, data: INVOICED },
    { id: 'closed', label: 'Closed Orders', icon: IC.archive, data: CLOSED }
  ];
  const STAGE = { fulfill: ['Not Fulfilled', 'p-neutral-dot'], ship: ['Fulfilled', 'dot-revision'], transit: ['Shipped', 'dot-revision'], delivered: ['Delivered', 'dot-approved'] };

  let cardFilter = 'all', vendorF = null, propF = null, dateDays = null, page = 1, sortK = 'date', sortDir = -1;
  const PER = 10;
  const openRows = new Set();
  const TODAY = '2026-08-24';
  const tab = () => (location.hash || '#open').replace('#', '');
  window.addEventListener('hashchange', () => { cardFilter = 'all'; page = 1; openRows.clear(); renderPage(); window.scrollTo(0, 0); });
  const fmtD = d => { const [y, m, dd] = d.split('-'); return m + '/' + dd + '/' + y; };

  function scoped(data) {
    const q = (document.getElementById('ord-search').value || '').trim().toLowerCase();
    let min = null;
    if (dateDays) { const d = new Date(TODAY); d.setDate(d.getDate() - dateDays); min = d.toISOString().slice(0, 10); }
    return data.filter(r =>
      (currentProp === 'all' || r.prop === currentProp) &&
      (!propF || r.prop === propF) &&
      (!vendorF || r.v === vendorF) &&
      (!min || r.date >= min) &&
      (!q || (VEN[r.v] + ' #' + r.num + ' order #' + r.num + ' ' + (PROPERTIES.find(x => x.id === r.prop) || {}).name + ' ' + r.items.map(i => i[0]).join(' ')).toLowerCase().includes(q)));
  }

  function statCards(t, rows) {
    const el = document.getElementById('stat-cards');
    const card = (key, cls, icon, title, n, desc) => '<div class="stat-card-colored ' + cls + (cardFilter === key ? ' active' : '') + '" onclick="setCard(\'' + key + '\')"><span class="stat-card-title">' + icon + title + '</span><div class="stat-card-count">' + n + '</div><div class="stat-card-desc">' + desc + '</div></div>';
    const c = f => rows.filter(f).length;
    if (t === 'open') {
      el.className = 'kpi-grid cols-5';
      el.innerHTML = card('all', 'stat-gray', IC.box, 'Total Open', rows.length, 'Orders in flight') +
        card('fulfill', 'stat-amber', IC.clock, 'To Fulfill', c(r => r.stage === 'fulfill'), 'Awaiting the vendor') +
        card('ship', 'stat-sky', IC.ship, 'To Ship', c(r => r.stage === 'ship'), 'Fulfilled, not shipped') +
        card('transit', 'stat-violet', IC.truck, 'Shipped', c(r => r.stage === 'transit'), 'On the way') +
        card('delivered', 'stat-emerald', IC.check, 'Delivered', c(r => r.stage === 'delivered'), 'Awaiting your validation');
    } else if (t === 'invoiced') {
      el.className = 'kpi-grid';
      el.innerHTML = card('all', 'stat-gray', IC.doc, 'Total Invoices', rows.length, 'Invoice-eligible orders') +
        card('await', 'stat-amber', IC.warn, 'Awaiting Validation', c(r => r.inv === 'await'), 'Buyer review required') +
        card('validated', 'stat-sky', IC.check, 'Validated', c(r => r.inv === 'validated'), 'Awaiting buyer payment') +
        card('paid', 'stat-violet', IC.card, 'Buyer Paid', c(r => r.inv === 'paid'), 'Payment submitted');
    } else if (t === 'closed') {
      el.className = 'kpi-grid';
      el.style.gridTemplateColumns = 'repeat(3, 1fr)';
      el.innerHTML = card('all', 'stat-gray', IC.archive, 'Total Closed', rows.length, 'All closed orders') +
        card('completed', 'stat-emerald', IC.check, 'Completed', c(r => r.cl === 'completed'), 'Successfully finished') +
        card('canceled', 'stat-rose', IC.x, 'Canceled', c(r => r.cl === 'canceled'), 'Orders canceled');
    } else { el.className = 'kpi-grid'; el.innerHTML = ''; el.style.display = 'none'; return; }
    el.style.display = ''; el.style.gridTemplateColumns = t === 'closed' ? 'repeat(3, 1fr)' : '';
  }

  function pill(label, dotCls) {
    if (dotCls === 'p-neutral-dot') return '<span class="status-dot-item"><span class="status-dot" style="background:var(--muted-foreground)"></span><span class="status-dot-label">' + label + '</span></span>';
    return '<span class="status-dot-item"><span class="status-dot ' + dotCls + '"></span><span class="status-dot-label">' + label + '</span></span>';
  }
  const sortIc = k => '<svg class="sort-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (sortK === k ? (sortDir === 1 ? '<path d="m7 14.5 5-5 5 5"/>' : '<path d="m7 9.5 5 5 5-5"/>') : '<path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>') + '</svg>';
  const th = (k, label, extra) => '<th class="sortable' + (sortK === k ? ' sorted' : '') + (extra || '') + '" onclick="setSort(\'' + k + '\')">' + label + sortIc(k) + '</th>';

  function renderPage() {
    const t = tab();
    document.querySelectorAll('.stat-card-colored').forEach(() => {});
    document.getElementById('tab-bar').innerHTML = TABS.map(tb =>
      '<button class="tab-item' + (tb.id === t ? ' active' : '') + '" onclick="location.hash=\'#' + tb.id + '\'">' + tb.icon.replace('stat-card-icon', '') + tb.label + '<span class="tab-count">' + scoped(tb.data).length + '</span></button>').join('');
    const data = TABS.find(x => x.id === t).data;
    const rows = scoped(data);
    statCards(t, rows);
    document.getElementById('tbar').style.display = t === 'backordered' ? 'none' : '';

    if (t === 'backordered') {
      document.getElementById('tbl-zone').innerHTML = '<div class="empty-state" style="margin-top:16px">' +
        '<div class="empty-state-icon">' + IC.back + '</div>' +
        '<div class="empty-state-title">No backordered orders</div>' +
        '<div class="empty-state-desc">Items a vendor can\'t fulfill right away will land here so you can track them separately.</div></div>';
      return;
    }

    let list = rows.filter(r => cardFilter === 'all' || r.stage === cardFilter || r.inv === cardFilter || r.cl === cardFilter);
    const FRANK = { fulfill: 0, ship: 1, transit: 2, delivered: 3 };
    const IRANK = { await: 0, validated: 1, paid: 2 };
    const sortVal = r =>
      sortK === 'num' ? r.num
      : sortK === 'total' ? r.total
      : sortK === 'prop' ? ((PROPERTIES.find(x => x.id === r.prop) || {}).name || '')
      : sortK === 'vendor' ? VEN[r.v]
      : sortK === 'status' ? (r.cl ? (r.cl === 'completed' ? 0 : 1) : 0)
      : sortK === 'ful' ? (r.inv !== undefined ? IRANK[r.inv] : (r.validated ? 3.9 : FRANK[r.stage] !== undefined ? FRANK[r.stage] + (r.part ? 0.5 : r.sub ? 0.25 : 0) : 0))
      : sortK === 'pay' ? ((r.inv === 'paid' || r.cl === 'completed') ? 1 : 0)
      : r.date;
    list = list.slice().sort((a, b) => {
      const va = sortVal(a), vb = sortVal(b);
      const d = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb));
      return d * sortDir || b.num - a.num;
    });
    const pages = Math.max(1, Math.ceil(list.length / PER));
    if (page > pages) page = pages;
    const slice = list.slice((page - 1) * PER, page * PER);

    const cols = t === 'open'
      ? th('num', 'Order #') + th('prop', 'Property', ' col-hide') + th('vendor', 'Vendor') + th('total', 'Total') + th('status', 'Order Status') + th('ful', 'Fulfillment') + th('date', 'Date')
      : t === 'invoiced'
        ? th('num', 'Order #') + th('prop', 'Property', ' col-hide') + th('vendor', 'Vendor') + th('total', 'Total') + th('ful', 'Fulfillment') + th('pay', 'Payment') + th('date', 'Date')
        : th('num', 'Order #') + th('prop', 'Property', ' col-hide') + th('vendor', 'Vendor') + th('total', 'Total') + th('status', 'Order Status') + th('pay', 'Payment') + th('date', 'Date');

    const body = slice.map(r => {
      const prop = PROPERTIES.find(x => x.id === r.prop);
      const isOpen = openRows.has(r.num);
      let statusCells, action;
      if (t === 'open') {
        const st = r.claimOpen ? pill('Claim Open', 'dot-rejected')
          : r.cancel ? pill('Cancellation Pending', 'dot-revision')
          : r.validated ? pill('Delivery Validated', 'dot-approved')
          : r.part ? pill('Partially Delivered · ' + r.part.done + '/' + r.part.of, 'dot-revision')
          : r.sub ? pill(r.sub[0] + ' · ' + r.sub[1] + '/' + r.sub[2], 'dot-revision')
          : pill(STAGE[r.stage][0], STAGE[r.stage][1]);
        statusCells = '<td>' + pill('Pending', 'dot-pending') + '</td><td>' + st + '</td>';
        action = r.invReady ? '<button class="btn btn-primary btn-sm" onclick="validateInvoice(' + r.num + ')">Validate</button>'
          : r.validated ? rowMenu(r.num, true) : '<button class="btn btn-primary btn-sm" onclick="validateOrder(' + r.num + ')">Validate</button>';
      } else if (t === 'invoiced') {
        const f = r.claimOpen ? pill('Claim Open', 'dot-rejected')
          : r.inv === 'await' ? pill('Awaiting Validation', 'dot-pending') : pill('Validated', 'dot-revision');
        const p = r.inv === 'paid' ? pill('Paid', 'dot-approved') : pill('Not Paid', 'dot-rejected');
        statusCells = '<td>' + f + '</td><td>' + p + '</td>';
        action = (r.inv === 'await' && !r.claimOpen) ? '<button class="btn btn-primary btn-sm" onclick="validateInvoice(' + r.num + ')">Validate</button>' : rowMenu(r.num, !!r.claimOpen);
      } else {
        const s = r.cl === 'completed' ? pill('Completed', 'dot-approved') : pill('Canceled', 'dot-rejected');
        const p = r.cl === 'completed' ? pill('Paid', 'dot-approved') : pill('—', 'p-neutral-dot');
        statusCells = '<td>' + s + '</td><td>' + p + '</td>';
        action = rowMenu(r.num);
      }
      const main = '<tr class="data-row' + (r.claimOpen ? ' row-claim' : '') + '">' +
        '<td><button class="expander' + (isOpen ? ' open' : '') + '" onclick="toggleRow(' + r.num + ')" title="Order items"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></td>' +
        '<td class="mono" style="font-weight:700"><a class="table-link" style="font-family:inherit;font-weight:700" href="order-detail.html#' + r.num + '">#' + r.num + '</a>' + (r.claimOpen ? '<span class="row-warn" data-tip="Claim open — the invoice is on hold until it\u2019s resolved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>' : '') + '</td>' +
        '<td class="col-hide cell-clip" title="' + (prop ? prop.name : '') + '">' + (prop ? prop.name : '—') + '</td>' +
        '<td><span class="cell-entity"><span class="v-avatar" style="width:28px;height:28px;border-radius:7px;font-size:10px">' + r.v + '</span><span class="nm">' + VEN[r.v] + '</span></span></td>' +
        '<td class="num" style="font-weight:600">' + money(r.total) + '</td>' + statusCells +
        '<td style="white-space:nowrap;color:var(--muted-foreground)">' + fmtD(r.date) + '</td>' +
        '<td>' + action + '</td></tr>';
      const items = isOpen ? '<tr class="items-block"><td colspan="9"><div class="items-label">Order Items</div>' +
        r.items.map(i => '<div class="item-line"><span class="thumb">' + glyph + '</span><span class="item-nm">' + i[0] + '</span><span class="qty">' + i[1] + ' × ' + money(i[2]) + '</span><span class="line-total">' + money(Math.round(i[1] * i[2] * 100) / 100) + '</span></div>').join('') + '</td></tr>' : '';
      return main + items;
    }).join('');

    document.getElementById('tbl-zone').innerHTML = '<div class="tbl-wrap" style="margin-top:4px"><div style="overflow-x:auto"><table class="tbl">' +
      '<thead><tr><th style="width:36px"></th>' + cols + '<th style="width:1%"></th></tr></thead>' +
      '<tbody>' + (body || '<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--muted-foreground)">No orders match the current filters.</td></tr>') + '</tbody></table></div>' +
      (list.length > PER ? '<div class="pager"><span>Showing ' + ((page - 1) * PER + 1) + '–' + Math.min(page * PER, list.length) + ' of ' + list.length + ' orders</span><span class="pg-btns"><button class="btn btn-sm"' + (page <= 1 ? ' disabled' : '') + ' onclick="page--; renderPage()">Previous</button><button class="btn btn-sm"' + (page >= pages ? ' disabled' : '') + ' onclick="page++; renderPage()">Next</button></span></div>' : '') + '</div>';

    document.getElementById('filter-clear').style.display = (vendorF || propF || dateDays) ? '' : 'none';
    if (currentProp !== 'all' && propF) setPropF(null);
  }

  function rowMenu(num, claimable) {
    return '<div class="row-menu-wrap"><button class="icon-btn" style="width:32px;height:32px" onclick="toggleMenuRow(event, ' + num + ')" title="More actions"><svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>' +
      '<div class="row-menu" id="rm-' + num + '" style="display:none">' +
      '<button onclick="rowAct(\'View order\', ' + num + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>View order</button>' +
      '<button onclick="rowAct(\'Download invoice\', ' + num + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>Download invoice (PDF)</button>' +
      (claimable ? '<button onclick="rowAct(\'Report an issue\', ' + num + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>Report an issue</button>' : '') + '</div></div>';
  }
  function toggleMenuRow(e, num) {
    e.stopPropagation();
    const el = document.getElementById('rm-' + num);
    const was = el.style.display !== 'none';
    document.querySelectorAll('.row-menu').forEach(m => m.style.display = 'none');
    el.style.display = was ? 'none' : '';
  }
  document.addEventListener('click', e => { if (e.target.isConnected && !e.target.closest('.row-menu-wrap')) document.querySelectorAll('.row-menu').forEach(m => m.style.display = 'none'); });

  function setCard(k) { cardFilter = cardFilter === k ? 'all' : k; page = 1; renderPage(); }
  function setSort(k) { if (sortK === k) sortDir *= -1; else { sortK = k; sortDir = (k === 'date' || k === 'total' || k === 'num') ? -1 : 1; } renderPage(); }
  function toggleRow(num) { openRows.has(num) ? openRows.delete(num) : openRows.add(num); renderPage(); }
  function setVendor(v, label) {
    vendorF = v; closeFMenus();
    document.getElementById('chip-vendor').style.display = v ? '' : 'none';
    if (v) document.getElementById('chip-vendor-value').textContent = label || VEN[v];
    page = 1; renderPage();
  }
  function setDateFilter(days, label) {
    dateDays = days; closeFMenus();
    document.getElementById('chip-date').style.display = days ? '' : 'none';
    if (days) document.getElementById('chip-date-value').textContent = label;
    page = 1; renderPage();
  }
  function clearFilters() { vendorF = null; propF = null; dateDays = null; document.getElementById('chip-prop').style.display = 'none'; document.getElementById('ord-search').value = ''; document.getElementById('chip-vendor').style.display = 'none'; document.getElementById('chip-date').style.display = 'none'; page = 1; renderPage(); }
  function closeFMenus() { document.getElementById('filter-menu').style.display = 'none'; document.getElementById('date-menu').style.display = 'none'; }
  function setPropF(p) {
    propF = p; closeFMenus();
    document.getElementById('chip-prop').style.display = p ? '' : 'none';
    if (p) document.getElementById('chip-prop-value').textContent = (PROPERTIES.find(x => x.id === p) || {}).name || p;
    page = 1; renderPage();
  }
  function toggleFilterMenu() {
    const m = document.getElementById('filter-menu'); const was = m.style.display !== 'none'; closeFMenus();
    if (!was) { renderFilterMenu('root'); m.style.display = ''; }
  }
  function renderFilterMenu(view) {
    const m = document.getElementById('filter-menu');
    const t = tab(); const rows = TABS.find(x => x.id === t).data;
    if (view === 'root') {
      m.innerHTML = '<div class="dropdown-item" onclick="renderFilterMenu(\'vendor\')">Vendor <span style="color:var(--muted-foreground)">&rsaquo;</span></div>' +
        (currentProp === 'all' ? '<div class="dropdown-item" onclick="renderFilterMenu(\'prop\')">Property <span style="color:var(--muted-foreground)">&rsaquo;</span></div>' : '');
      return;
    }
    const back = '<div class="dropdown-item" onclick="renderFilterMenu(\'root\')" style="color:var(--muted-foreground)">&lsaquo; Filters</div>';
    if (view === 'vendor') {
      const vs = [...new Set(rows.map(r => r.v))].sort((a, b) => VEN[a].localeCompare(VEN[b]));
      m.innerHTML = back + vs.map(v => '<div class="dropdown-item' + (vendorF === v ? ' selected' : '') + '" onclick="setVendor(\'' + v + '\')">' + VEN[v] + '</div>').join('');
    } else {
      const ps = [...new Set(rows.map(r => r.prop))].map(id => PROPERTIES.find(x => x.id === id)).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
      m.innerHTML = back + ps.map(p => '<div class="dropdown-item' + (propF === p.id ? ' selected' : '') + '" onclick="setPropF(\'' + p.id + '\')">' + p.name + '</div>').join('');
    }
  }
    function toggleDateMenu() { const m = document.getElementById('date-menu'); const was = m.style.display !== 'none'; closeFMenus(); if (!was) m.style.display = ''; }
  document.addEventListener('click', e => { if (e.target.isConnected && !e.target.closest('.filter-menu-wrap')) closeFMenus(); });

  let toastTimer;
  function showToast(title, desc) { let el = document.getElementById('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.style.cssText = 'position:fixed;bottom:24px;left:24px;z-index:300;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:14px 18px;max-width:360px;font-size:13px;transition:opacity .2s'; document.body.appendChild(el); } el.innerHTML = '<b style="display:block;font-size:14px">' + title + '</b><span style="color:var(--muted-foreground)">' + desc + '</span>'; el.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.opacity = 0, 3000); }
  function validateOrder(num) { location.href = 'order-detail.html#' + num + '/validate'; }
  function validateInvoice(num) { location.href = 'order-detail.html#' + num + '/invoice'; }
  function rowAct(what, num) { document.querySelectorAll('.row-menu').forEach(m => m.style.display = 'none'); showToast(what + ' — Order #' + num, 'Demo action'); }

  renderPage();
</script>
</body>
</html>
