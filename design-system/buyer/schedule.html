<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule — Scout Buyer</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="buyer.css">
<script src="cart.js"></script>
<script src="spo-data.js"></script>
</head>
<body class="buyer">

<!-- ===== App Bar ===== -->
<div class="app-bar-wrap">
  <nav class="app-bar" id="app-bar"></nav>
  <script src="appbar.js"></script>
</div>






<section class="hero page-hero">
  <div class="hero-bg"></div>
  <div class="hero-inner" style="flex-direction:column;gap:0">
    <a class="back-link" href="schedules.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>Back to Schedules</a>
    <div class="hero-title-block">
      <div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></div>
      <div><h1 id="hero-title">Schedule</h1><p id="hero-sub"></p></div>
    </div>
  </div>
</section>

<main class="page">
  <div class="det-grid">
    <div class="det-main" id="det-main"></div>
    <div class="det-side" id="det-side"></div>
  </div>
</main>

<script>
  /* ---------- Theme ---------- */
  function applyTheme() {
    const dark = localStorage.getItem('scout-theme') === 'dark';
    document.body.classList.toggle('dark', dark);
    const b = document.getElementById('theme-btn');
    b.querySelector('.icon-sun').style.display = dark ? 'none' : '';
    b.querySelector('.icon-moon').style.display = dark ? '' : 'none';
  }
  function toggleTheme() { localStorage.setItem('scout-theme', document.body.classList.contains('dark') ? 'light' : 'dark'); applyTheme(); }
  applyTheme();

  /* ---------- Menus ---------- */
  function closeMenus() {
    document.querySelectorAll('.menu-panel').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.nav-chip').forEach(c => c.classList.remove('open'));
  }
  function toggleMenu(id) {
    const panel = document.getElementById('menu-' + id), chip = document.getElementById('nav-' + id);
    const wasOpen = panel.classList.contains('open');
    closeMenus(); document.getElementById('ctx-switch').classList.remove('open');
    if (!wasOpen) { panel.classList.add('open'); chip.classList.add('open'); }
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-anchor')) closeMenus();
    if (!e.target.closest('.ctx-switch')) document.getElementById('ctx-switch').classList.remove('open');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); document.getElementById('ctx-switch').classList.remove('open'); } });

  /* ---------- Context switcher ---------- */
  const PROPERTIES = [
    { id: 'all', name: 'All properties', desc: 'Combined dashboard for every accessible property', units: null },
    { id: 'magnolia', name: 'Magnolia Place Apartments', addr: '4201 Veterans Memorial Blvd', city: 'Metairie, LA 70006', units: 51 },
    { id: 'bayou', name: 'Bayou Crossing Apartments', addr: '3850 Airline Dr', city: 'Baton Rouge, LA 70805', units: 120 },
    { id: 'lonestar', name: 'Lone Star Flats', addr: '7200 Westheimer Rd', city: 'Houston, TX 77057', units: 78 },
    { id: 'central', name: 'Central Park View', addr: '1501 Canal St', city: 'New Orleans, LA 70112', units: 96 },
    { id: 'cypress', name: 'Cypress Lake Apartments', addr: '9100 Cypress Lake Dr', city: 'Lafayette, LA 70508', units: 64 },
    { id: 'beauchene', name: 'Beau Chene Villas', addr: '225 Beau Chene Blvd', city: 'Mandeville, LA 70471', units: 40 },
    { id: 'sherwood', name: 'Sherwood Acres', addr: '1250 Sherwood Forest Blvd', city: 'Baton Rouge, LA 70815', units: 88 },
    { id: 'cyprus', name: 'Cyprus Glenn', addr: '4800 Cyprus Glenn Way', city: 'Shreveport, LA 71105', units: 32 },
    { id: 'heights', name: 'Magnolia Heights Apartments', addr: '6301 Magnolia Heights Rd', city: 'Houston, TX 77004', units: 110 }
  ];
  let currentProp = 'all';
  const bIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>';
  const pinIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
  function renderCtxList() {
    document.getElementById('ctx-list').innerHTML = PROPERTIES.map(p => {
      const active = p.id === currentProp;
      const body = p.id === 'all'
        ? '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.desc + '</span>'
        : '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.addr + '</span><span class="opt-city">' + pinIcon + p.city + '</span>';
      const units = p.units ? '<span class="units-badge"><b>' + p.units + '</b><span>units</span></span>' : '';
      return '<button class="ctx-option' + (active ? ' active' : '') + '" onclick="selectProp(\'' + p.id + '\')"><span class="opt-tile">' + bIcon + '</span><span class="opt-body">' + body + '</span>' + units + '</button>';
    }).join('');
  }
  function selectProp(id) {
    currentProp = id;
    const p = PROPERTIES.find(x => x.id === id);
    document.getElementById('echo-name').textContent = p.name;
    document.getElementById('echo-name').title = p.id === 'all' ? '9 accessible properties' : p.units + ' units · ' + p.city;
    renderCtxList();
    document.getElementById('ctx-switch').classList.remove('open');
    renderPage();
  }
  function toggleCtx() {
    const el = document.getElementById('ctx-switch');
    const wasOpen = el.classList.contains('open');
    closeMenus();
    if (!wasOpen) el.classList.add('open');
  }
  renderCtxList();

  const money = SPO.money, fmtD = SPO.fmtDate;
  const SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  const IC = {
    rep: SVG + '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
    pen: SVG + '<path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg>',
    shield: SVG + '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>',
    clock: SVG + '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    pause: SVG + '<circle cx="12" cy="12" r="10"/><line x1="10" x2="10" y1="15" y2="9"/><line x1="14" x2="14" y1="15" y2="9"/></svg>',
    play: SVG + '<polygon points="6 3 20 12 6 21 6 3"/></svg>',
    stop: SVG + '<rect width="14" height="14" x="5" y="5" rx="2"/></svg>',
    flag: SVG + '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>',
    send: SVG + '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>',
    skip: SVG + '<polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg>',
    undo: SVG + '<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>',
    copy: SVG + '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>'
  };
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  let X, actExpanded = false, page = 1;
  function pick() {
    const [id, sub] = (location.hash || '').replace('#', '').split('/');
    X = SCH.get(id) || SCH.get('SCH-01');
    return sub || '';
  }
  const propOf = x => PROPERTIES.find(p => p.id === x.prop) || PROPERTIES[1];
  const ven = x => SPO.VEN[x.v];
  const endDot = t => /[.!?]$/.test(t) ? t : t + '.';
  const pillHtml = x => { const st = SCH.STATES[x.status]; return '<span class="status-dot-item"><span class="status-dot ' + st.dot + '"></span><span class="status-dot-label">' + st.label + '</span></span>'; };
  const allocChips = l => '<div class="alloc-row">' + l.alloc.map(a => '<span class="alloc-chip"><span class="code">' + a.gl + '</span>' + SPO.glName(a.gl) + '<span class="sep"></span><a class="unit-link" href="unit-history.html#' + X.prop + '/' + a.unit + '" title="Unit history">' + SPO.unitLabel(a.unit) + '</a>' + (l.alloc.length > 1 ? '<span class="sep"></span><span class="amt">' + money(a.amt) + '</span>' : '') + '</span>').join('') + '</div>';
  const dateTile = d => '<span class="rd"><b>' + d.slice(8) + '</b><span>' + MON[+d.slice(5, 7) - 1] + '</span></span>';
  const btn = (label, onclick, kind, ico) => '<button class="btn' + (kind ? ' ' + kind : '') + '" style="display:inline-flex;align-items:center;gap:8px;white-space:nowrap" onclick="' + onclick + '">' + (ico ? '<span style="display:inline-flex;width:15px;height:15px">' + ico + '</span>' : '') + label + '</button>';

  /* The strip narrates the SERIES — whose move it is and what the next run will do. */
  function taskStrip(x) {
    const st = (tone, ico, title, desc, actions) => {
      const s = tone === 'wait' ? ' style="background:var(--muted);color:var(--muted-foreground)"' : tone === 'done' ? ' style="background:var(--emerald-soft);color:var(--emerald)"' : tone === 'sky' ? ' style="background:var(--sky-soft);color:var(--sky)"' : '';
      return '<div class="task-strip"><span class="ts-icon"' + s + '>' + ico + '</span><div class="ts-body"><div class="ts-title">' + title + '</div><div class="ts-desc">' + desc + '</div></div>' + (actions || '') + '</div>';
    };
    const v = ven(x), nx = SCH.nextRun(x);
    switch (x.status) {
      case 'approval': return st('action', IC.shield, 'Series approval', SCH.reason(x) + '. Nothing runs until a Supervisor approves the series — after that, its runs go out without further approval.', btn('Review in Approvals', "location.href='approval.html#" + x.id + "'", 'btn-primary', IC.shield));
      case 'revision': return st('action', IC.pen, 'Revise the schedule', 'The Supervisor asked for changes: “' + ((x.revision && x.revision.comment) || '') + '”', btn('Edit schedule', "location.href='spo-new.html#edit-" + x.id + "'", 'btn-primary', IC.pen));
      case 'active': return st('wait', IC.clock, 'Next run · ' + fmtD(nx) + ' at ' + SCH.fmtTime(x.cadence.time),
        x.mode === 'auto' ? 'A new SPO is created and its PO emailed to ' + v.email + ' automatically.' : 'A new SPO is drafted for you to review and send to ' + endDot(v.name),
        btn('Skip this run', "skipRun('" + nx + "')", '', IC.skip));
      case 'paused': return st('sky', IC.pause, 'Paused', 'by ' + x.pause.by + ': “' + x.pause.reason + '”. No SPOs are created while paused' + (nx ? '; the next run would be ' + fmtD(nx) + '.' : '.'), btn('Resume schedule', 'resumeSch()', 'btn-primary', IC.play));
      case 'ended': return st('wait', IC.flag, 'Schedule ended', (x.endInfo.by === 'Scout' ? '' : 'by ' + x.endInfo.by + ' on ' + fmtD(x.ev.ended) + ': ') + x.endInfo.reason + ' The SPOs it created keep their own history.');
    }
    return '';
  }

  function renderPage() {
    const sub = pick(), x = X, v = ven(x), prop = propOf(x);
    document.title = x.name + ' — Scout Buyer';
    document.getElementById('hero-title').textContent = x.name;
    document.getElementById('hero-sub').textContent = x.id + ' · ' + prop.name + ' · ' + v.name;
    const nx = SCH.nextRun(x), yr = SCH.yearRuns(x);
    const ended = x.status === 'ended';

    let main = '<div class="card"><div class="det-card-head"><h2>Schedule</h2>' + pillHtml(x) + '</div>' +
      '<div class="series-cad"><span class="ic">' + IC.rep + '</span><div><div class="t">' + SCH.cadenceText(x.cadence) + '</div><div class="s">' +
      (x.mode === 'auto' ? 'Auto-send · each run creates an SPO and emails the PO to ' + v.email : 'Draft only · each run drafts an SPO for you to review and send') + '</div></div></div>' +
      '<div class="stat-strip"><div><div class="k">' + (ended ? 'Ended' : 'Next run') + '</div><div class="v">' + (ended ? fmtD(x.ev.ended) : x.status === 'paused' ? 'Paused' : nx ? fmtD(nx) : '—') + '</div></div>' +
      '<div><div class="k">Per run</div><div class="v">' + money(SCH.perRun(x)) + '</div></div>' +
      '<div><div class="k">Next 12 months</div><div class="v">' + (ended ? '—' : money(SCH.annual(x))) + '</div><div class="k">' + (ended ? '' : yr + ' run' + (yr === 1 ? '' : 's')) + '</div></div>' +
      '<div><div class="k">Ends</div><div class="v" style="font-size:13.5px">' + SCH.endText(x).replace('Ends ', '').replace('No end date', 'Never') + '</div></div></div>' +
      (ended ? '' : '<div class="spo-manage"><span class="lbl">Manage this schedule</span>' +
        btn('Edit schedule', "location.href='spo-new.html#edit-" + x.id + "'", '', IC.pen) +
        (x.status === 'active' ? btn(x.mode === 'auto' ? 'Switch to Draft only' : 'Switch to Auto-send', 'toggleMode()', '', x.mode === 'auto' ? IC.pen : IC.send) + btn('Pause', 'openPause()', '', IC.pause) : '') +
        '<button class="btn btn-outline-rose" onclick="openEnd()">End schedule</button></div>') + '</div>';
    main += taskStrip(x);

    if (!ended) {
      const up = SCH.upcoming(x, 6, true);
      main += '<div class="card"><div class="det-card-head hd"><div><h2>Upcoming runs</h2><div class="sub">' + (x.status === 'paused' ? 'None of these run until you resume' : x.status === 'active' ? 'Skip a date without changing the schedule' : 'Runs start once the series is approved') + '</div></div></div>' +
        (up.length ? up.map((r, i) => {
          const isNext = !r.skipped && r.date === nx && x.status === 'active';
          return '<div class="run-row' + (r.skipped ? ' skipped' : '') + (isNext ? ' next' : '') + '">' + dateTile(r.date) + '<div class="rb"><div>' + fmtD(r.date) + ' · ' + SCH.fmtTime(x.cadence.time) + '</div><div class="m">' + (r.skipped ? 'Skipped — no SPO this date' : x.mode === 'auto' ? 'SPO created and PO sent automatically' : 'SPO drafted for you to send') + '</div></div>' +
            (x.status === 'active' ? (r.skipped ? btn('Undo skip', "unskipRun('" + r.date + "')", 'btn-sm', IC.undo) : btn('Skip', "skipRun('" + r.date + "')", 'btn-sm', IC.skip)) : '') + '</div>';
        }).join('') : '<div class="run-more" style="border:none">No further runs — the end rule is reached.</div>') +
        (SCH.lastRun(x) ? '<div class="run-more">Last run ' + fmtD(SCH.lastRun(x)) + ' · ' + SCH.endText(x).replace(/ · last.*/, '') + '</div>' : '') + '</div>';
    }

    const inst = SCH.instances(x.id);
    main += '<div class="card"><div class="det-card-head hd"><div><h2>SPOs from this schedule</h2><div class="sub">Each run is an ordinary SPO with its own lifecycle</div></div></div>' +
      (inst.length ? inst.map(s => { const st = SPO.STATES[s.state]; return '<div class="run-row">' + dateTile(s.run) + '<div class="rb"><div><a class="table-link" href="spo.html#' + s.id + '">SPO-' + s.id + '</a> · ' + money(SPO.total(s)) + '</div><div class="m">Run ' + fmtD(s.run) + '</div></div><span class="status-dot-item"><span class="status-dot ' + st.dot + '"></span><span class="status-dot-label">' + st.label + '</span></span></div>'; }).join('')
        : '<div class="run-more" style="border:none;padding-top:12px">None yet — the first run creates the first SPO.</div>') +
      (x.prior ? '<div class="run-more">Plus ' + x.prior + ' earlier SPO' + (x.prior === 1 ? '' : 's') + ' from before this demo window</div>' : '') + '</div>';

    main += '<div class="card"><div class="det-card-head hd"><div><h2>Every run orders</h2><div class="sub">The template each SPO is created from · GL code and unit for every dollar</div></div></div>' +
      '<p class="spo-scope" style="margin-top:10px;color:var(--muted-foreground)">' + x.scope + '</p>' +
      x.lines.map(l => '<div class="spo-line"><span class="sl-desc">' + l.desc + '</span><span class="sl-qty">' + l.qty + ' × ' + money(l.price) + '</span><span class="sl-total">' + money(l.qty * l.price) + '</span>' + allocChips(l) + '</div>').join('') +
      '<div class="det-totals"><div class="tot-row grand"><span>Per run</span><span>' + money(SCH.perRun(x)) + '</span></div></div></div>';

    let side = '<div class="card"><div class="ven-card"><span class="ven-logo">' + x.v + '</span><div style="min-width:0"><div class="ven-eyebrow">Vendor · ' + v.trade + '</div><div class="ven-name" style="margin-bottom:2px">' + v.name + '</div>' +
      '<div style="font-size:13px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="PO recipient">' + v.email + '</div></div></div></div>';
    const apprVal = x.status === 'approval' ? 'Pending · Supervisor' : x.ev.approved ? 'Approved by ' + ((x.approval && x.approval.by) || 'Priya Nair') : 'Not required';
    side += '<div class="card"><dl class="fact-rows wide"><dt>Property</dt><dd>' + prop.name + '</dd><dt>Created by</dt><dd>' + x.by + '</dd><dt>Starts</dt><dd>' + fmtD(x.start) + '</dd>' +
      '<dt>Ends</dt><dd>' + SCH.endText(x).replace('Ends ', '').replace(/ · last.*/, '').replace('No end date', 'Never').replace('after ', 'After ') + '</dd><dt>Sending</dt><dd>' + (x.mode === 'auto' ? 'Auto-send' : 'Draft only') + '</dd>' +
      '<dt>Series approval</dt><dd>' + apprVal + '</dd></dl>' +
      (x.ev.approved ? '<div class="w-note" style="margin-top:12px"><span style="display:inline-flex;width:14px;height:14px">' + IC.shield + '</span><span>Approved once for the series — runs that match this template need no further approval.</span></div>' : '') + '</div>';
    const evs = x.log.slice().sort((a, b) => b.at.localeCompare(a.at)), shown = actExpanded ? evs : evs.slice(0, 5);
    side += '<div class="card"><div class="det-card-head"><h2 style="font-size:16px">Activity</h2></div><div class="act-tl">' +
      shown.map(e => '<div class="act-ev' + (e.hi ? ' hi' : '') + (e.bad ? ' bad' : '') + '"><span class="adot"></span><div class="abody"><div class="at">' + e.t + '</div>' + (e.sub ? '<div class="asub">' + e.sub + '</div>' : '') + '</div><span class="awhen">' + fmtD(e.at) + '</span></div>').join('') +
      (evs.length > shown.length ? '<button class="act-more" onclick="actExpanded = true; renderPage()">Show ' + (evs.length - shown.length) + ' more activities</button>' : '') + '</div></div>';

    document.getElementById('det-main').innerHTML = main;
    document.getElementById('det-side').innerHTML = side;
    if (sub === 'pause' && x.status === 'active') setTimeout(openPause, 120);
    if (sub === 'end' && !ended) setTimeout(openEnd, 120);
  }

  /* ---------- series actions (each logged on the series) ---------- */
  function persist(msg, sub) { SCH.save(X); renderPage(); if (msg) showToast(msg, sub || ''); }
  function skipRun(d) { X.skipped = (X.skipped || []).concat(d); SCH.log(X, 'Run skipped', fmtD(d) + ' · no SPO that date'); persist('Run skipped', fmtD(d) + ' won’t create an SPO.'); }
  function unskipRun(d) { X.skipped = X.skipped.filter(s => s !== d); SCH.log(X, 'Skip undone', fmtD(d) + ' will run'); persist('Skip undone', fmtD(d) + ' is back on the schedule.'); }
  function toggleMode() {
    X.mode = X.mode === 'auto' ? 'draft' : 'auto';
    SCH.log(X, X.mode === 'auto' ? 'Switched to Auto-send' : 'Switched to Draft only', 'by Alicia Grant · from the next run');
    persist(X.mode === 'auto' ? 'Auto-send on' : 'Draft only', X.mode === 'auto' ? 'Runs email the PO automatically from ' + fmtD(SCH.nextRun(X)) + '.' : 'Runs are drafted for you to send.');
  }
  function resumeSch() {
    X.status = 'active'; delete X.ev.paused; X.ev.resumed = SPO.now();
    SCH.log(X, 'Resumed', 'by Alicia Grant · next run ' + fmtD(SCH.nextRun(X)), true);
    persist('Schedule resumed', 'Next run ' + fmtD(SCH.nextRun(X)) + '.');
  }
  function modal(id, html) {
    let ov = document.getElementById(id);
    if (!ov) { ov = document.createElement('div'); ov.className = 'overlay center'; ov.id = id; ov.addEventListener('click', e => { if (e.target === ov) closeModal(id); }); document.body.appendChild(ov); }
    ov.innerHTML = html; ov.classList.add('open'); document.body.style.overflow = 'hidden';
  }
  function closeModal(id) {
    const ov = document.getElementById(id); if (ov) ov.classList.remove('open');
    document.body.style.overflow = '';
    const h = location.hash.split('/'); if (h.length > 1) history.replaceState(null, '', h[0]);
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.overlay.open').forEach(o => closeModal(o.id)); });
  function reasonModal(id, title, desc, label, req, placeholder, go, goCls) {
    modal(id, '<div class="val-modal" style="width:500px"><div class="val-head"><h2>' + title + '</h2><p>' + desc + '</p></div>' +
      '<div class="val-body" style="padding:16px 24px"><label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px">' + label + (req ? ' <span class="req-chip">Required</span>' : '') + '</label>' +
      '<textarea class="claim-note" id="' + id + '-reason" maxlength="500" placeholder="' + placeholder + '"' + (req ? ' oninput="document.getElementById(\'' + id + '-go\').disabled = !this.value.trim()"' : '') + '></textarea>' +
      '<div style="font-size:12px;color:var(--muted-foreground);margin-top:6px">Kept in the schedule’s activity.</div></div>' +
      '<div class="val-foot"><button class="btn" onclick="closeModal(\'' + id + '\')">Keep it running</button><button class="btn ' + goCls + '" id="' + id + '-go"' + (req ? ' disabled' : '') + ' onclick="' + go + '()">' + title + '</button></div></div>');
    setTimeout(() => document.getElementById(id + '-reason').focus(), 50);
  }
  function openPause() { reasonModal('pause-ov', 'Pause schedule', 'No SPOs are created while it’s paused. Skipped and upcoming dates are kept; resume any time.', 'Why pause?', false, 'e.g. Property under renovation until October', 'confirmPause', 'btn-primary'); }
  function confirmPause() {
    const r = document.getElementById('pause-ov-reason').value.trim() || 'No reason given.';
    X.status = 'paused'; X.pause = { by: 'Alicia Grant', reason: r }; X.ev.paused = SPO.now();
    SCH.log(X, 'Paused', 'by Alicia Grant · “' + r + '”'); closeModal('pause-ov'); persist('Schedule paused', 'No SPOs are created until you resume it.');
  }
  function openEnd() { reasonModal('end-ov', 'End schedule', 'No further runs. SPOs already created keep their own lifecycle — cancel any you no longer need from their pages.', 'Reason', true, 'Why is this schedule ending?', 'confirmEnd', 'btn-danger'); }
  function confirmEnd() {
    const r = document.getElementById('end-ov-reason').value.trim(); if (!r) return;
    X.status = 'ended'; X.endInfo = { by: 'Alicia Grant', reason: endDot(r) }; X.ev.ended = SPO.now();
    SCH.log(X, 'Ended', 'by Alicia Grant · “' + r + '”', false, true); closeModal('end-ov'); persist('Schedule ended', 'No further runs.');
  }

  let toastTimer;
  function showToast(title, desc) { let el = document.getElementById('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.style.cssText = 'position:fixed;bottom:24px;left:24px;z-index:600;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:14px 18px;max-width:360px;font-size:13px;transition:opacity .2s'; document.body.appendChild(el); } el.innerHTML = '<b style="display:block;font-size:14px">' + title + '</b><span style="color:var(--muted-foreground)">' + desc + '</span>'; el.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.opacity = 0, 3000); }
  window.addEventListener('hashchange', () => { actExpanded = false; renderPage(); });
  renderPage();
</script>
</body>
</html>
