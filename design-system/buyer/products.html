<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dishwashers — Scout Buyer</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="buyer.css">
<style>
  /* Listing page: the App Bar scrolls away (less chrome while browsing); in-page sticky elements re-anchor to the top */
  .buyer .app-bar-wrap { position: static; }
  .buyer .results-search { top: 12px; }
  .buyer .plp-side { top: 12px; }
</style>
<script src="cart.js"></script>
</head>
<body class="buyer">

<!-- ===== App Bar ===== -->
<div class="app-bar-wrap">
  <nav class="app-bar" id="app-bar"></nav>
  <script src="appbar.js"></script>
</div>



<main class="page" style="padding-top:32px">
  <div class="plp">
    <div class="plp-side">
  <div class="crumbs"><a href="marketplace.html">Marketplace</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg><a href="marketplace.html#appliances">Appliances</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg><span class="cur">Dishwashers</span></div>
  <div class="results-head">
    <div class="title-row"><h1>Dishwashers</h1><span class="results-count" id="results-count">74 results</span></div>
    <button class="btn rail-toggle" onclick="toggleRail(true)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg> Filters <span class="count-badge" id="rail-count-m"></span></button>
  </div>
  <div class="chip-row" id="chip-row"></div>
    <aside class="filter-rail" id="rail">
      <div class="rail-head">
        <span class="rail-title">Filters <span class="count-badge" id="rail-count"></span></span>
        <div style="display:flex;gap:10px;align-items:center">
          <button class="chip-clear" onclick="clearAll()">Clear all</button>
          <button class="icon-btn rail-toggle" style="width:32px;height:32px" onclick="toggleRail(false)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
      </div>
      <div id="facets"></div>
      <div class="facet">
        <button class="facet-head" onclick="this.parentElement.classList.toggle('collapsed')">Price range <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="facet-body">
          <div class="range">
            <div class="range-vals"><span id="r-lo">$319</span><span id="r-hi">$1,089</span></div>
            <div class="range-track">
              <div class="rail"></div><div class="fill" id="r-fill"></div>
              <input type="range" id="r-min" min="319" max="1089" value="319" step="1" oninput="rangeInput()" onchange="applyFilters()">
              <input type="range" id="r-max" min="319" max="1089" value="1089" step="1" oninput="rangeInput()" onchange="applyFilters()">
            </div>
            <div class="range-bounds"><span>$319</span><span>$1,089</span></div>
          </div>
        </div>
      </div>
    </aside>
    </div>
    <div class="rail-scrim" id="rail-scrim" onclick="toggleRail(false)"></div>

    <section>
      <div class="results-search">
        <div class="mp-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="q" placeholder="Search within Dishwashers…" oninput="state.shown=state.per;applyFilters()">
          <div class="mode-seg" id="mode-seg"><button class="active" data-mode="keyword" onclick="setMode('keyword')"><span>Keyword</span></button><button data-mode="ai" onclick="setMode('ai')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg><span>AI Search</span></button></div>
        </div>
        <div class="sort">
          <select class="select select-sort" id="sort" aria-label="Sort results" onchange="state.shown=state.per;applyFilters()">
            <option value="rec">Recommended</option>
            <option value="rel">Most Relevant</option>
            <option value="asc">Price Low to High</option>
            <option value="desc">Price High to Low</option>
            <option value="name">Name A to Z</option>
          </select>
        </div>
      </div>
      <div class="product-grid" id="grid"></div>
      <div class="load-zone" id="load-zone">
        <div class="load-progress"><span id="load-count">Showing 12 of 74</span><span class="load-bar"><span id="load-fill"></span></span></div>
        <div class="skeleton-row" id="skeleton" style="display:none"><div></div><div></div><div></div></div>
        <button class="btn load-more" id="load-more" style="display:none" onclick="loadMore(true)">Show more</button>
        <div id="sentinel"></div>
      </div>
    </section>
  </div>
</main>

<button class="back-top" id="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></button>

<div class="compare-tray" id="compare-tray">
  <span class="ct-label" id="ct-label">Compare 0</span>
  <span class="ct-thumbs" id="ct-thumbs"></span>
  <button class="btn btn-primary" style="height:36px" onclick="goCompare()">Compare</button>
  <button class="icon-btn" style="width:36px;height:36px" onclick="clearCompare()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
</div>

<script>
  /* ---------- Theme ---------- */
  function applyTheme() {
    const dark = localStorage.getItem('scout-theme') === 'dark';
    document.body.classList.toggle('dark', dark);
    const b = document.getElementById('theme-btn');
    b.querySelector('.icon-sun').style.display = dark ? 'none' : '';
    b.querySelector('.icon-moon').style.display = dark ? '' : 'none';
  }
  function toggleTheme() { localStorage.setItem('scout-theme', document.body.classList.contains('dark') ? 'light' : 'dark'); applyTheme(); }
  applyTheme();

  /* ---------- Menus ---------- */
  function closeMenus() {
    document.querySelectorAll('.menu-panel').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.nav-chip').forEach(c => c.classList.remove('open'));
  }
  function toggleMenu(id) {
    const panel = document.getElementById('menu-' + id), chip = document.getElementById('nav-' + id);
    const wasOpen = panel.classList.contains('open');
    closeMenus(); document.getElementById('ctx-switch').classList.remove('open');
    if (!wasOpen) { panel.classList.add('open'); chip.classList.add('open'); }
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-anchor')) closeMenus();
    if (!e.target.closest('.ctx-switch')) document.getElementById('ctx-switch').classList.remove('open');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); document.getElementById('ctx-switch').classList.remove('open'); } });

  /* ---------- Context switcher ---------- */
  const PROPERTIES = [
    { id: 'all', name: 'All properties', desc: 'Combined dashboard for every accessible property', units: null },
    { id: 'magnolia', name: 'Magnolia Place Apartments', addr: '4201 Veterans Memorial Blvd', city: 'Metairie, LA 70006', units: 51 },
    { id: 'bayou', name: 'Bayou Crossing Apartments', addr: '3850 Airline Dr', city: 'Baton Rouge, LA 70805', units: 120 },
    { id: 'lonestar', name: 'Lone Star Flats', addr: '7200 Westheimer Rd', city: 'Houston, TX 77057', units: 78 },
    { id: 'central', name: 'Central Park View', addr: '1501 Canal St', city: 'New Orleans, LA 70112', units: 96 },
    { id: 'cypress', name: 'Cypress Lake Apartments', addr: '9100 Cypress Lake Dr', city: 'Lafayette, LA 70508', units: 64 },
    { id: 'beauchene', name: 'Beau Chene Villas', addr: '225 Beau Chene Blvd', city: 'Mandeville, LA 70471', units: 40 },
    { id: 'sherwood', name: 'Sherwood Acres', addr: '1250 Sherwood Forest Blvd', city: 'Baton Rouge, LA 70815', units: 88 },
    { id: 'cyprus', name: 'Cyprus Glenn', addr: '4800 Cyprus Glenn Way', city: 'Shreveport, LA 71105', units: 32 },
    { id: 'heights', name: 'Magnolia Heights Apartments', addr: '6301 Magnolia Heights Rd', city: 'Houston, TX 77004', units: 110 }
  ];
  let currentProp = 'all';
  const bIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>';
  const pinIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
  function renderCtxList() {
    document.getElementById('ctx-list').innerHTML = PROPERTIES.filter(p => p.id !== 'all').map(p => {
      const active = p.id === currentProp;
      const body = p.id === 'all'
        ? '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.desc + '</span>'
        : '<span class="opt-name">' + p.name + (active ? ' <span class="badge-active">Active</span>' : '') + '</span><span class="opt-addr">' + p.addr + '</span><span class="opt-city">' + pinIcon + p.city + '</span>';
      const units = p.units ? '<span class="units-badge"><b>' + p.units + '</b><span>units</span></span>' : '';
      return '<button class="ctx-option' + (active ? ' active' : '') + '" onclick="selectProp(\'' + p.id + '\')"><span class="opt-tile">' + bIcon + '</span><span class="opt-body">' + body + '</span>' + units + '</button>';
    }).join('');
  }
  function selectProp(id) {
    currentProp = id;
    localStorage.setItem('scout-shop-prop', id);
    const gate = document.getElementById('prop-gate');
    if (gate) gate.classList.remove('open');
    const p = PROPERTIES.find(x => x.id === id);
    document.getElementById('echo-name').textContent = p.name;
    document.getElementById('echo-name').title = p.id === 'all' ? '9 accessible properties' : p.units + ' units · ' + p.city;
    renderCtxList();
    document.getElementById('ctx-switch').classList.remove('open');
    applyFilters();
  }
  function toggleCtx() {
    const el = document.getElementById('ctx-switch');
    const wasOpen = el.classList.contains('open');
    closeMenus();
    if (!wasOpen) el.classList.add('open');
  }
  function openPropGate() {
    let ov = document.getElementById('prop-gate');
    if (!ov) { ov = document.createElement('div'); ov.id = 'prop-gate'; ov.className = 'overlay center'; document.body.appendChild(ov); }
    ov.innerHTML = '<div class="val-modal" style="width:560px;max-width:calc(100vw - 40px)"><div class="val-head"><h2>Choose a property to shop for</h2><p>Products, pricing, and availability are tailored to each property \u2014 pick one to browse its marketplace. You can switch anytime from the bar above.</p></div><div class="val-body" style="padding:10px 14px;max-height:60vh;overflow:auto">' +
      PROPERTIES.filter(p => p.id !== 'all').map(p => '<button class="ctx-option" style="width:100%" onclick="selectProp(\'' + p.id + '\')"><span class="opt-tile">' + bIcon + '</span><span class="opt-body"><span class="opt-name">' + p.name + '</span><span class="opt-addr">' + p.addr + '</span><span class="opt-city">' + pinIcon + p.city + '</span></span><span class="units-badge"><b>' + p.units + '</b><span>units</span></span></button>').join('') + '</div></div>';
    ov.classList.add('open');
  }
  const savedProp = localStorage.getItem('scout-shop-prop');
  if (savedProp && savedProp !== 'all' && PROPERTIES.some(p => p.id === savedProp)) currentProp = savedProp;
  renderCtxList();
  window.addEventListener('DOMContentLoaded', () => {
    if (currentProp === 'all') openPropGate(); else selectProp(currentProp);
  });


  /* ---------- Catalog (deterministic demo data) ---------- */
  const VENDORS = [['Scout Demo Vendor',28,'SD'],['API Test - Chadwell',21,'CH'],['Gorman Bros',9,'GB'],['Ideal DEV',8,'ID'],['The Appliance Warehouse - LCR',7,'AW'],["Stanton's Appliance",1,'SA']];
  const BRANDS = ['Whirlpool','GE','Frigidaire','Maytag','Bosch','Amana','KitchenAid','Hotpoint'];
  const STYLES = ['24 in. Front Control Built-In Dishwasher','24 in. 14 Place Settings Dishwasher','24 in. 2-Cycle Built-in Dishwasher','ENERGY STAR® 24" Dishwasher','PowerScrub™ 24 in. Built-In Dishwasher','23-7/8 in. Dishwasher','24 in. Top Control Dishwasher with 3rd Rack','18 in. Compact Built-In Dishwasher'];
  const FINISH = ['in Black','in Stainless Steel','in White','in Fingerprint Resistant Stainless','in Slate'];
  let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const PRODUCTS = [];
  let id = 0;
  VENDORS.forEach(([v, n, ini]) => {
    for (let i = 0; i < n; i++) {
      const price = Math.round((319 + rnd() * 770) * 100) / 100;
      const hasWas = rnd() < 0.45; const was = hasWas ? Math.round(price * (1.12 + rnd() * 0.25) * 100) / 100 : null;
      const stockR = rnd(); const stock = stockR < 0.04 ? 'out' : stockR < 0.14 ? 'low' : 'in';
      const speed = rnd() < 0.76 ? (rnd() < 0.6 ? '1-2' : '3-5') : null; // 28 + 8 ≈ 36 with delivery promise
      PRODUCTS.push({ id: ++id, vendor: v, vini: ini, brand: BRANDS[id % BRANDS.length], name: BRANDS[id % BRANDS.length] + ' ' + STYLES[(id * 3) % STYLES.length] + ' ' + FINISH[(id * 5) % FINISH.length], price, was, stock, speed, pickup: rnd() < 0.49, miles: 4 + Math.round(rnd() * 14), rel: rnd() });
    }
  });
  // calibrate facet counts to the reference
  const forceN = (key, target, val, alt) => { let have = PRODUCTS.filter(p => p[key] === val).length; for (const p of PRODUCTS) { if (have === target) break; if (have < target && p[key] !== val) { p[key] = val; have++; } else if (have > target && p[key] === val) { p[key] = alt; have--; } } };
  PRODUCTS.forEach((p, i) => p.stock = i % 25 === 0 ? 'out' : i % 9 === 0 ? 'low' : 'in'); forceN('pickup', 36, true, false); forceN('speed', 28, '1-2', null); forceN('speed', 8, '3-5', null);

  /* ---------- State ---------- */
  const state = { vendor: new Set(), instock: false, speed: new Set(), pickup: false, pmin: 319, pmax: 1089, q: '', shown: 12, per: 12, autoPages: 3 };
  const compare = new Set(), wish = new Set();
  const money = v => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const FACETS = [
    { key: 'vendor', label: 'Vendor', opts: VENDORS.map(v => [v[0], v[0]]), test: (p, v) => p.vendor === v, multi: true },
    { key: 'instock', label: 'Availability', opts: [['In Stock', true]], test: p => p.stock !== 'out', bool: true },
    { key: 'speed', label: 'Delivery speed', opts: [['1–2 days', '1-2'], ['3–5 days', '3-5']], test: (p, v) => p.speed === v, multi: true },
    { key: 'pickup', label: 'Pickup', opts: [['Pickup available', true]], test: p => p.pickup, bool: true },
  ];
  const passes = (p, skip) => FACETS.every(f => {
    if (f.key === skip) return true;
    if (f.bool) return !state[f.key] || f.test(p);
    return state[f.key].size === 0 || [...state[f.key]].some(v => f.test(p, v));
  }) && p.price >= state.pmin && p.price <= state.pmax && (!state.q || p.name.toLowerCase().includes(state.q) || p.vendor.toLowerCase().includes(state.q));

  function activeCount() { return state.vendor.size + state.speed.size + (state.instock ? 1 : 0) + (state.pickup ? 1 : 0) + ((state.pmin > 319 || state.pmax < 1089) ? 1 : 0); }

  function renderFacets() {
    document.getElementById('facets').innerHTML = FACETS.map(f => {
      const collapsed = document.querySelector('[data-facet="' + f.key + '"]')?.classList.contains('collapsed');
      return '<div class="facet' + (collapsed ? ' collapsed' : '') + '" data-facet="' + f.key + '"><button class="facet-head" onclick="this.parentElement.classList.toggle(\'collapsed\')">' + f.label + ' <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button><div class="facet-body">' +
        f.opts.map(([label, val]) => {
          const on = f.bool ? state[f.key] : state[f.key].has(val);
          const cnt = PRODUCTS.filter(p => passes(p, f.key) && (f.bool ? f.test(p) : f.test(p, val))).length;
          return '<div class="facet-opt' + (on ? ' on' : '') + (cnt === 0 ? ' zero' : '') + '" onclick="toggleFacet(\'' + f.key + '\',' + JSON.stringify(val).replace(/"/g, '&quot;') + ')"><span class="cb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><span class="lbl">' + label + '</span><span class="cnt">' + cnt + '</span></div>';
        }).join('') + '</div></div>';
    }).join('');
    const n = activeCount();
    document.getElementById('rail-count').textContent = n || '';
    document.getElementById('rail-count-m').textContent = n || '';
  }
  function toggleFacet(key, val) {
    const f = FACETS.find(x => x.key === key);
    if (f.bool) state[key] = !state[key]; else state[key].has(val) ? state[key].delete(val) : state[key].add(val);
    state.shown = state.per; applyFilters(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function clearAll() { state.vendor.clear(); state.speed.clear(); state.instock = false; state.pickup = false; state.pmin = 319; state.pmax = 1089; document.getElementById('r-min').value = 319; document.getElementById('r-max').value = 1089; state.shown = state.per; applyFilters(); }

  function rangeInput() {
    let lo = +document.getElementById('r-min').value, hi = +document.getElementById('r-max').value;
    if (lo > hi - 20) { if (event && event.target.id === 'r-min') { lo = hi - 20; document.getElementById('r-min').value = lo; } else { hi = lo + 20; document.getElementById('r-max').value = hi; } }
    state.pmin = lo; state.pmax = hi;
    document.getElementById('r-lo').textContent = '$' + lo.toLocaleString('en-US'); document.getElementById('r-hi').textContent = '$' + hi.toLocaleString('en-US');
    const pct = v => (v - 319) / (1089 - 319) * 100;
    document.getElementById('r-fill').style.left = pct(lo) + '%'; document.getElementById('r-fill').style.right = (100 - pct(hi)) + '%';
  }

  function renderChips() {
    const chips = [];
    const chip = (label, fn) => '<span class="chip">' + label + '<button onclick="' + fn + '" title="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span>';
    state.vendor.forEach(v => chips.push(chip(v, "toggleFacet('vendor'," + JSON.stringify(v).replace(/"/g, '&quot;') + ")")));
    if (state.instock) chips.push(chip('In Stock', "toggleFacet('instock',true)"));
    state.speed.forEach(v => chips.push(chip((v === '1-2' ? '1–2' : '3–5') + ' days', "toggleFacet('speed','" + v + "')")));
    if (state.pickup) chips.push(chip('Pickup available', "toggleFacet('pickup',true)"));
    if (state.pmin > 319 || state.pmax < 1089) chips.push(chip('$' + state.pmin + ' – $' + state.pmax, "state.pmin=319;state.pmax=1089;document.getElementById('r-min').value=319;document.getElementById('r-max').value=1089;rangeInput();applyFilters()"));
    document.getElementById('chip-row').innerHTML = chips.length ? chips.join('') + '<button class="chip-clear" onclick="clearAll()">Clear all</button>' : '';
  }

  const glyph = '<svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M4 8h16"/><circle cx="8" cy="5" r="0.6"/><circle cx="11" cy="5" r="0.6"/><path d="M8 12h8"/><path d="M8 16h8"/></svg>';
  function deliveryLine(p) {
    if (p.speed === '1-2') return 'Overnight · order by 2pm CST';
    if (p.speed === '3-5') return '3–5 business days';
    return '5–7 business days · from vendor';
  }
  function card(p) {
    const save = p.was ? Math.round((1 - p.price / p.was) * 100) : 0;
    const stock = p.stock === 'in' ? '<span class="stock">In Stock</span>' : p.stock === 'low' ? '<span class="stock low">Low stock</span>' : '<span class="stock out">Out of stock</span>';
    return '<div class="product-card' + (compare.has(p.id) ? ' compared' : '') + '" data-id="' + p.id + '">' +
      '<div class="pc-media">' + glyph + (p.pickup ? '<span class="pc-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>Pickup · ' + p.miles + ' mi</span>' : '') +
      '<button class="pc-compare' + (compare.has(p.id) ? ' on' : '') + '" data-tip="' + (compare.has(p.id) ? 'Remove from compare' : 'Compare') + '" onclick="toggleCompare(' + p.id + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg></button>' + '<span class="pc-vendor-badge" data-tip="' + p.vendor.replace(/"/g, '&quot;') + '">' + p.vini + '</span>' + '</div>' +
      '<a class="pc-title" href="product.html" style="color:inherit;text-decoration:none" title="' + p.name.replace(/"/g, '&quot;') + '">' + p.name + '</a>' +
      '<div class="pc-price"><div class="pc-price-now"><span class="now">' + money(p.price) + '</span><span class="unit">/ each</span></div>' +
      '<div class="pc-price-was">' + (p.was ? '<span class="was">' + money(p.was) + '</span><span class="save">Save ' + save + '%</span>' : '') + '</div></div>' +
      '<div class="pc-meta"><div title="' + deliveryLine(p) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35a1 1 0 0 0-.78-.38H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg><span>' + deliveryLine(p) + '</span></div>' +
      '<div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' + stock + '</div></div>' +
      '<div class="pc-actions"><button class="btn btn-primary" ' + (p.stock === 'out' ? 'disabled style="opacity:.5"' : '') + ' onclick="addToCart(' + p.id + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add to Cart</button><button class="icon-btn' + (typeof WL !== 'undefined' && currentProp !== 'all' && WL.inAnyList(currentProp, p.id) ? ' on' : '') + '" data-tip="Save to wishlist" onclick="toggleWish(' + p.id + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></button></div></div>';
  }

  let current = [];
  function applyFilters() {
    state.q = document.getElementById('q').value.trim().toLowerCase();
    current = PRODUCTS.filter(p => passes(p));
    const s = document.getElementById('sort').value;
    current.sort((a, b) => s === 'asc' ? a.price - b.price : s === 'desc' ? b.price - a.price : s === 'name' ? a.name.localeCompare(b.name) : s === 'rel' ? b.rel - a.rel : (b.stock === 'in') - (a.stock === 'in') || b.rel - a.rel);
    if (state.shown > current.length) state.shown = Math.max(state.per, Math.min(state.shown, current.length));
    const slice = current.slice(0, state.shown);
    document.getElementById('grid').innerHTML = slice.length ? slice.map(card).join('') : '<div class="empty" style="grid-column:1/-1"><b>No dishwashers match these filters</b>Try removing a filter or widening the price range.<br><br><button class="btn" onclick="clearAll()">Clear filters</button></div>';
    document.getElementById('results-count').textContent = current.length + ' result' + (current.length === 1 ? '' : 's') + (activeCount() ? ' · ' + activeCount() + ' filter' + (activeCount() === 1 ? '' : 's') + ' applied' : '');
    renderLoadZone();
    renderFacets(); renderChips();
  }
  /* ---------- Progressive loading ---------- */
  let loading = false;
  function renderLoadZone() {
    const zone = document.getElementById('load-zone'), shown = Math.min(state.shown, current.length), total = current.length;
    zone.style.display = total ? '' : 'none';
    document.getElementById('load-count').textContent = 'Showing ' + shown + ' of ' + total;
    document.getElementById('load-fill').style.width = (total ? shown / total * 100 : 0) + '%';
    const more = shown < total, autoDone = state.shown >= state.per * state.autoPages;
    document.getElementById('load-more').style.display = more && autoDone ? '' : 'none';
    document.getElementById('load-more').textContent = more ? 'Show ' + Math.min(state.per, total - shown) + ' more' : '';
    document.getElementById('sentinel').style.display = more && !autoDone ? '' : 'none';
  }
  function loadMore(manual) {
    if (loading || state.shown >= current.length) return;
    loading = true;
    const sk = document.getElementById('skeleton'); sk.style.display = 'grid';
    setTimeout(() => {
      state.shown = Math.min(state.shown + state.per, current.length);
      sk.style.display = 'none'; loading = false;
      applyFilters();
      if (!manual) document.getElementById('back-top').classList.add('show');
    }, 380);
  }
  let userScrolled = false;
  window.addEventListener('scroll', () => { userScrolled = true; }, { passive: true, once: true });
  new IntersectionObserver(entries => { if (entries[0].isIntersecting && userScrolled && window.scrollY > 200) loadMore(false); }, { rootMargin: '240px 0px' }).observe(document.getElementById('sentinel'));
  window.addEventListener('scroll', () => document.getElementById('back-top').classList.toggle('show', window.scrollY > 900), { passive: true });

  /* ---------- Card actions ---------- */
  function toggleCompare(id) {
    if (compare.has(id)) compare.delete(id); else { if (compare.size >= 2) { showToast('Compare two at a time', 'Remove one to add another'); return; } compare.add(id); }
    applyFilters(); renderTray();
  }
  function clearCompare() { compare.clear(); applyFilters(); renderTray(); }
  function goCompare() { localStorage.setItem('scout-compare', JSON.stringify(PRODUCTS.filter(x => compare.has(x.id)))); location.href = 'compare.html'; }
  function renderTray() {
    const t = document.getElementById('compare-tray');
    t.classList.toggle('show', compare.size > 0);
    document.getElementById('ct-label').textContent = compare.size === 1 ? 'Compare · pick one more' : 'Compare 2 items';
    document.getElementById('ct-thumbs').innerHTML = [...compare].map(() => '<span>' + glyph.replace('class="glyph"', '') + '</span>').join('');
    t.querySelector('.btn-primary').disabled = compare.size < 2; t.querySelector('.btn-primary').style.opacity = compare.size < 2 ? .5 : 1;
  }
  function toggleWish(id) { openWishModal(PRODUCTS.find(x => x.id === id)); }
  function addToCart(id) { const p = PRODUCTS.find(x => x.id === id); CART.add(currentProp, { id: p.id, name: p.name, sku: p.sku || '', price: p.price, vendor: p.vini || 'SD' }, 1); showToast('Added to cart', p.brand + ' · ' + money(p.price)); }
  let mode = 'keyword';
  function setMode(m) { mode = m; document.querySelectorAll('#mode-seg button').forEach(b => b.classList.toggle('active', b.dataset.mode === m)); document.getElementById('q').placeholder = m === 'ai' ? 'Describe what you need, e.g. "quiet dishwasher under $500 with third rack"' : 'Search within Dishwashers…'; }
  let toastTimer;
  function showToast(title, desc) { let t = document.getElementById('toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;bottom:24px;left:24px;z-index:300;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:14px 18px;max-width:360px;font-size:13px;transition:opacity .2s'; document.body.appendChild(t); } t.innerHTML = '<b style="display:block;font-size:14px">' + title + '</b><span style="color:var(--muted-foreground)">' + desc + '</span>'; t.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.opacity = 0, 3000); }
  function toggleRail(open) { document.getElementById('rail').classList.toggle('open', open); document.getElementById('rail-scrim').classList.toggle('show', open); }

  rangeInput(); applyFilters();
  document.addEventListener('wishlists-changed', applyFilters);
</script>
<script src="wishlist.js"></script>
</body>
</html>
